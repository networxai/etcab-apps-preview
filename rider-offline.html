<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Rider offline and errors</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="rider.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="mapgl.local.js"></script>
<script src="kit.js"></script>
<script src="routes.js"></script>
<script src="audit.js"></script>
<script src="rider.js"></script>
<style>
  /* Home sheet: copied from rider-home.html (read-only here) so the banner is judged on the real screen. */
  .where { display: flex; align-items: center; gap: var(--s3); height: var(--h-button); border-radius: var(--r-control);
    background: var(--surface-2); padding: 0 6px 0 var(--s4); width: 100%; text-align: left; }
  .where > svg { width: 20px; height: 20px; color: var(--ink); }
  .where .lbl { flex: 1; font: var(--t-headline); color: var(--ink); white-space: nowrap; }
  .later { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border-radius: 10px;
    background: var(--raised); box-shadow: var(--e1); font: var(--t-secondary-strong); color: var(--ink); white-space: nowrap; }
  .later svg { width: 16px; height: 16px; }
  .places { margin-top: var(--s2); }
  .row .end { font-variant-numeric: tabular-nums; }
  .partners { margin: var(--s3) calc(-1 * var(--margin)) 0; overflow: hidden; }
  .track { display: flex; gap: var(--s2); padding: 0 var(--margin); }
  .ad { position: relative; flex: none; width: 318px; height: 156px; border-radius: var(--r-card); overflow: hidden; background: var(--surface-3); }
  .ad img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .ad::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgb(0 0 0 / 0) 0%, rgb(0 0 0 / 0) 20%, rgb(0 0 0 / .6) 55%, rgb(0 0 0 / .82) 100%); }
  .ad .copy { position: absolute; left: var(--s4); right: var(--s4); bottom: 14px; z-index: 1; color: #fff; }
  .ad .who { font: var(--t-secondary-strong); color: rgb(255 255 255 / .86); white-space: nowrap; }
  .ad .offer { font: var(--t-title); color: #fff; white-space: nowrap; letter-spacing: -.1px; }
  .ad .tag { position: absolute; top: 10px; left: 10px; z-index: 1; height: 22px; padding: 0 8px; border-radius: var(--r-pill);
    background: rgb(0 0 0 / .62); color: #fff; font: var(--t-caption); line-height: 22px; }
  .dots { display: flex; justify-content: center; gap: 6px; margin-top: var(--s3); }
  .dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--surface-3); }
  .dots i.on { width: 18px; background: var(--ink); }
  .logo { position: absolute; z-index: 20; top: 74px; left: 50%; transform: translateX(-50%); width: 112px; height: 20px; }
  .stale { filter: grayscale(1); opacity: .55; }
  .ago { font: var(--t-caption); color: var(--ink-2); }

  /* Map unavailable: the sheet still books; the map area says so once, in place. */
  .nomap { position: absolute; inset: 0; background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s3); padding-bottom: 300px; }
  .nomap .o { width: 64px; height: 64px; border-radius: 50%; background: var(--surface); box-shadow: var(--e1); display: grid; place-items: center; color: var(--ink-2); }
  .nomap .o svg { width: 28px; height: 28px; }
  .nomap .t { font: var(--t-body-strong); color: var(--ink); }
  .nomap .s { font: var(--t-secondary); color: var(--ink-2); }

  /* Full-screen error */
  .err { position: absolute; inset: 0; background: var(--ground); display: flex; flex-direction: column; padding: 54px var(--margin) 42px; }
  .err .mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: var(--s2); }
  .err .glyph { width: 96px; height: 96px; border-radius: 50%; background: var(--surface); box-shadow: var(--e2); display: grid; place-items: center; color: var(--ink); margin-bottom: var(--s4); }
  .err .glyph svg { width: 40px; height: 40px; stroke-width: 1.5; }
  .err h1 { font: var(--t-title); color: var(--ink); }
  .err p { font: var(--t-body); color: var(--ink-2); }
  .err .btn-quiet { background: var(--surface); box-shadow: var(--e1); }
  .err .code { font: var(--t-caption); color: var(--ink-3); margin-top: var(--s2); font-variant-numeric: tabular-nums; }

  /* Location off: a card in the sheet, not a modal */
  .locoff { display: flex; align-items: center; gap: var(--s3); padding: var(--s3); border-radius: var(--r-card); background: var(--surface-2); margin-bottom: var(--s3); }
  .locoff .ic { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--warn); flex: none; }
  .locoff .ic svg { width: 20px; height: 20px; }
  .locoff .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .locoff .t1 { font: var(--t-body-strong); color: var(--ink); }
  .locoff .t2 { font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; }
  .locoff .go { height: 36px; padding: 0 14px; border-radius: var(--r-pill); background: var(--ink); color: var(--surface); font: var(--t-secondary-strong); flex: none; }
</style>
</head>
<body>
<script>
  const me = [40.1846, 44.5148]
  const homeSheet = (top = '', places = true) => `<section class="sheet r" id="sheet">
    <div class="grabber"></div>${top}
    <button class="where" aria-label="Ո՞ւր եք գնում">${R.i('search')}<span class="lbl">Ո՞ւր եք գնում</span>
      <span class="later" role="button" aria-label="Նախապես">${R.i('calendar-clock')}Նախապես</span></button>
    ${places ? `<div class="places">
      <div class="row" role="button" tabindex="0"><span class="ic">${R.i('house')}</span><span class="txt"><span class="t1">Տուն</span><span class="t2">Կոմիտասի պող. 22</span></span><span class="end">≈ 9 րոպե</span></div>
      <div class="divider"></div>
      <div class="row" role="button" tabindex="0"><span class="ic">${R.i('history')}</span><span class="txt"><span class="t1">Կասկադ</span><span class="t2">Թամանյան փողոց</span></span><span class="end">≈ 6 րոպե</span></div></div>` : ''}
    <div class="partners" aria-label="Գործընկերներ"><div class="track">
      <article class="ad" data-photo data-scrim="0:0,0.2:0,0.55:0.6,1:0.82"><img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=700&h=340&q=80&auto=format&fit=crop" alt="">
        <span class="tag">Գործընկեր</span><div class="copy"><div class="who">Լյումեն սրճարան</div><div class="offer">−15% ուղևորներին</div></div></article>
      <article class="ad" data-photo data-peek data-scrim="0:0,0.2:0,0.55:0.6,1:0.82"><img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=700&h=340&q=80&auto=format&fit=crop" alt="">
        <span class="tag">Գործընկեր</span><div class="copy"><div class="who">Տարոն ռեստորան</div><div class="offer">Աղանդեր՝ նվեր</div></div></article>
    </div><div class="dots" aria-hidden="true"><i class="on"></i><i></i><i></i></div></div></section>`
  const fabs = (top = 62, logo = true) => `<button class="fab" style="top:${top}px;left:16px" aria-label="Հաշիվ">${R.i('menu')}</button>
    ${logo ? '<img class="logo" src="assets/eco/logo-wide.png" alt="Eco Taxi" width="112" height="20">' : ''}<button class="fab" id="recentre" style="right:16px" aria-label="Կենտրոնացնել">${R.i('locate-fixed')}</button>`
  /* Home map; stale = the car positions are the last ones we had, drawn grey and older-looking. */
  const homeMap = (opts = {}) => (s) => {
    const sheetH = s.querySelector('#sheet').offsetHeight
    s.querySelector('#recentre').style.bottom = (sheetH + 12) + 'px'
    const m = makeMap(s.querySelector('#map'), { sheetH, badge: { bottom: (sheetH + 22) + 'px', left: '16px' }, fit: [[me[0] - .003, me[1] - .0042], [me[0] + .003, me[1] + .0042]], padTL: [0, 40], padBR: [0, sheetH - 20] })
    if (!opts.noPuck) htmlMarker(m, me, '<div class="puck"></div>', [22, 22])
    ;[[[.0021, -.0026], 62], [[-.0016, .0031], 222], [[.0024, .0024], 132], [[-.0019, -.0029], 318]]
      .forEach(([o, d]) => htmlMarker(m, [me[0] + o[0], me[1] + o[1]], opts.stale ? `<div class="stale">${carTop(d)}</div>` : carTop(d), [18, 34]))
  }
  const MAP = '<div class="map" id="map" aria-label="Քարտեզ"></div>'

  Rider.page({
    title: 'Rider · Offline and errors',
    sub: 'One banner pattern under the status bar (icon + words, never colour alone), and one full-screen error for when nothing can be shown. A network error never wipes a screen that still has truth on it',
    states: [
      { id: 'offline', group: 'Banner', label: 'Offline', note: 'Inverted ink banner; cars drawn grey because their positions are stale; the sheet still works (saved places, Later)',
        html: () => `${MAP}${fabs(118, false)}${R.banner({ t1: 'Կապ չկա', t2: 'Մեքենաները՝ 9:39-ի դրությամբ', action: 'Կրկնել' })}${homeSheet()}`, map: homeMap({ stale: true }) },
      { id: 'reconnecting', group: 'Banner', label: 'Reconnecting', note: 'Same slot, amber, a spinner: the app is trying, the rider need not',
        html: () => `${MAP}${fabs(118, false)}<div class="banner warn" role="status"><span class="spin" style="width:18px;height:18px;border-width:2px"></span><span class="bt"><span class="b1">Վերականգնում ենք կապը</span></span></div>${homeSheet()}`, map: homeMap({ stale: true }) },
      { id: 'online', group: 'Banner', label: 'Back online', note: 'The banner collapses into a 2 s toast; nothing else moves',
        html: () => `${MAP}${fabs()}<div class="toast" role="status" style="top:116px">${R.i('wifi')}Կապը վերականգնվեց</div>${homeSheet()}`, map: homeMap() },
      { id: 'no-map', group: 'Degraded', label: 'Map unavailable', note: 'home.noMap: the map tile service is down. Booking by address still works; the map area says so once',
        html: () => `<div class="nomap"><span class="o">${R.i('map')}</span><span class="t">Քարտեզը հասանելի չէ</span><span class="s">Պատվիրել կարող եք հասցեով</span></div>
          <button class="fab" style="top:62px;left:16px" aria-label="Հաշիվ">${R.i('menu')}</button>${homeSheet()}` },
      { id: 'location-off', group: 'Degraded', label: 'Location off', note: 'Permission denied: no puck, the map rests on the centre, and one card in the sheet offers Settings. Typing a pickup still works',
        html: () => `${MAP}${fabs()}${homeSheet(`<div class="locoff"><span class="ic">${R.i('map-pin-off')}</span><span class="tx"><span class="t1">Տեղորոշումն անջատված է</span><span class="t2">Նշեք հասցեն ձեռքով</span></span><button class="go">Միացնել</button></div>`, false)}`,
        map: homeMap({ noPuck: true }) },
      { id: 'error', group: 'Full screen', label: 'Something went wrong', note: 'Only when there is nothing true to show (boot failed). Retry is primary; the dispatcher, a person, is the way out',
        html: () => `<div class="err"><div class="mid"><span class="glyph">${R.i('cloud-off')}</span><h1>Ինչ-որ բան սխալ գնաց</h1><p>Փորձեք մի փոքր ուշ</p><span class="code">E-503 · 09:41</span></div>
          <div class="btns"><button class="btn btn-brand">${R.i('rotate-cw')}Կրկնել</button><button class="btn btn-quiet">${R.i('phone')}Զանգել օպերատորին</button></div></div>` },
      { id: 'error-offline', group: 'Full screen', label: 'No connection at start', note: 'Cold start with no network and nothing cached: app.offline, and the dispatcher number works without data',
        html: () => `<div class="err"><div class="mid"><span class="glyph">${R.i('wifi-off')}</span><h1>Կապ չկա</h1><p>Ստուգեք ինտերնետը</p></div>
          <div class="btns"><button class="btn btn-brand">${R.i('rotate-cw')}Կրկնել</button><button class="btn btn-quiet">${R.i('phone')}Զանգել օպերատորին</button></div></div>` },
    ],
  })
</script>
</body>
</html>
