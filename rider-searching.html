<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Rider searching</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="rider.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="mapgl.local.js"></script>
<script src="kit.js"></script>
<script src="routes.js"></script>
<script src="audit.js"></script>
<script src="rider.js"></script>
<style>
  /* Matching: the map stays, our real cars stay on it, a calm pulse from the pickup. No full-screen spinner. */
  .pulse { position: absolute; inset: 0; display: grid; place-items: center; }
  /* Two rings in --brand at 24% with a 1px brand edge: visible on the light basemap (review: the faint green disc vanished). */
  .pulse i { position: absolute; width: 200px; height: 200px; border-radius: 50%; background: color-mix(in srgb, var(--brand) 24%, transparent);
    box-shadow: inset 0 0 0 1px var(--brand); transform: scale(.12); opacity: 0;
    animation: ring 2.8s cubic-bezier(.2, .6, .3, 1) infinite; }
  .pulse i:nth-child(2) { animation-delay: 1.4s; }
  @keyframes ring { 0% { transform: scale(.12); opacity: 0; } 12% { opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
  /* Reduce Motion: one still ring at mid size, edge kept. */
  @media (prefers-reduced-motion: reduce) { .pulse i { animation: none; opacity: 1; transform: scale(.55); } .pulse i:nth-child(n+2) { display: none; } }
  .pulse .pin-a { position: relative; z-index: 1; }

  .bar { height: 3px; border-radius: 2px; background: var(--surface-3); overflow: hidden; margin: var(--s3) 0 var(--s4); position: relative; }
  .bar::after { content: ''; position: absolute; top: 0; bottom: 0; width: 34%; border-radius: 2px; background: var(--brand); animation: slide 1.6s ease-in-out infinite; }
  @keyframes slide { from { left: -34%; } to { left: 100%; } }
  @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; left: 33%; } }
  .bar.done::after { animation: none; left: 0; width: 100%; background: var(--surface-3); }

  .nearby { display: inline-flex; align-items: center; gap: 6px; font: var(--t-secondary-strong); color: var(--ink-2); white-space: nowrap; margin-top: var(--s1); }
  .nearby svg { width: 16px; height: 16px; color: var(--brand-ink); }
  .order { border-radius: var(--r-card); background: var(--surface-2); padding: var(--s3) var(--s4) var(--s2); }
  .order .top { display: flex; align-items: center; gap: var(--s3); }
  .order .tn { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .order .t1 { font: var(--t-headline); color: var(--ink); white-space: nowrap; }
  .order .t2 { font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
  .order .t2 svg { width: 14px; height: 14px; color: var(--ok); }
  .order .price { font: var(--t-headline); color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .legs { margin-top: var(--s2); position: relative; }
  .leg { display: flex; align-items: center; gap: var(--s3); min-height: 32px; font: var(--t-body); color: var(--ink); white-space: nowrap; }
  .leg .m { width: 16px; display: grid; place-items: center; flex: none; }
  .leg .dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 3px var(--ink); }
  .leg .sq { width: 10px; height: 10px; border-radius: 2px; background: var(--ink); }
  .legs::before { content: ''; position: absolute; left: 7.25px; top: 22px; height: 12px; width: 1.5px; background: var(--ink-3); }
  .sheet .btn { margin-top: var(--s4); }

  .nocar .h-sub { margin-top: var(--s1); }
  .opts { margin-top: var(--s3); }
  .opts .row .ic { background: var(--surface-2); }
  .opts .divider { margin-left: 52px; }
  .modal .h-sub { margin: -4px 0 var(--s2); }
  .modal .btns { margin-top: var(--s4); }
</style>
</head>
<body>
<script>
  const T = ROUTES.pickupToDrop.pts, P = ROUTES.driverToPickup.pts
  const PICK = T[0]
  const brg = (a, b) => Math.atan2((b[1] - a[1]) * Math.cos(a[0] * Math.PI / 180), b[0] - a[0]) * 180 / Math.PI
  /* Our real nearby cars (the fleet is small: showing them is the trust signal). */
  const CARS = [[[.0024, -.0031], 58], [[-.0019, .0027], 214], [[.0029, .0022], 140], [[-.0026, -.0024], 322]]

  const RD = ECO.RIDE
  const order = () => `<div class="order"><div class="top">${R.car('city', 64, 32, '')}<span class="tn"><span class="t1">${RD.tier}</span>
      <span class="t2">${R.i('banknote')}${ECO.PAY.cash.label}</span></span><span class="price">${R.amd(RD.fare)}</span></div>
    <div class="legs"><div class="leg"><span class="m"><span class="dot"></span></span>${RD.pickup}</div><div class="leg"><span class="m"><span class="sq"></span></span>${RD.drop}</div></div></div>`

  const sheet = (title, sub, extra = '') => `<div class="map" id="map" aria-label="Քարտեզ"></div>
    <section class="sheet r" id="sheet"><div class="grabber"></div>
      <h2 class="h-title">${title}</h2><div class="h-sub">${sub}</div>${extra}
      <div class="bar" role="progressbar" aria-label="${title}"></div>${order()}
      <button class="btn btn-quiet">Չեղարկել</button></section>`

  const searchMap = ({ cars = CARS, pulse = true, offer = false } = {}) => (s) => {
    const m = R.map(s, { fit: R.bbox(PICK, .0034, .0044), padTL: [24, 96], padBR: [24, s.querySelector('#sheet').offsetHeight + 16] })
    if (pulse) htmlMarker(m, PICK, '<div class="pulse"><i></i><i></i><div class="pin-a"></div></div>', [200, 200])
    else htmlMarker(m, PICK, '<div class="pin-a"></div>', [18, 18])
    if (offer) {
      const rest = P.slice(Math.floor(P.length * .45))
      drawRoute(m, rest, { dash: true, color: cssVar('--approach'), weight: 4 })
      htmlMarker(m, rest[0], carTop(brg(rest[0], rest[1])), [18, 34])
    }
    cars.forEach(([o, d]) => htmlMarker(m, [PICK[0] + o[0], PICK[1] + o[1]], carTop(d), [18, 34]))
  }

  Rider.page({
    title: 'Rider · Searching for a driver',
    sub: 'A calm pulse from the pickup over our real nearby cars; the order summary stays visible; cancel is always one tap',
    states: [
      { id: 'searching', label: 'Searching', note: 'Real cars on the map, not a decorative spinner. Reduce Motion: a still ring',
        html: () => sheet('Որոնում ենք մեքենա', 'Ընտրում ենք մեքենա ձեզ համար', `<div class="nearby">${R.i('car-front')}4 մեքենա մոտակայքում</div>`),
        map: searchMap() },
      { id: 'answering', label: 'Driver answering', note: 'An offer is out: that one car shows its line to the pickup',
        html: () => sheet('Վարորդը պատասխանում է…', 'Սովորաբար տևում է մի քանի վայրկյան'),
        map: searchMap({ cars: CARS.slice(1), pulse: false, offer: true }) },
      { id: 'no-cars', label: 'No free car', note: 'Said plainly. Retry, book for later, or call the dispatcher, a person',
        html: () => `<div class="map" id="map" aria-label="Քարտեզ"></div>
          <section class="sheet r nocar" id="sheet"><div class="grabber"></div>
            <h2 class="h-title">Ազատ մեքենա չկա</h2><div class="h-sub">Բոլոր մեքենաները զբաղված են</div>
            <div class="opts">
              <div class="row" role="button" tabindex="0"><span class="ic">${R.i('calendar-clock')}</span><span class="txt"><span class="t1">Նախապես</span><span class="t2">Պատվիրել ավելի ուշ ժամի</span></span>${R.i('chevron-right', 'class="chev"')}</div>
              <div class="divider"></div>
              <div class="row" role="button" tabindex="0"><span class="ic">${R.i('headset')}</span><span class="txt"><span class="t1">Զանգել օպերատորին</span><span class="t2">Կօգնենք հեռախոսով</span></span>${R.i('chevron-right', 'class="chev"')}</div>
            </div>
            <button class="btn btn-brand">${R.i('rotate-cw')}Կրկին որոնել</button></section>`,
        map: searchMap({ cars: [], pulse: false }) },
      { id: 'cancel-confirm', label: 'Cancel?', note: 'Keeping the search is the easy target; cancel is red, not hidden',
        html: () => `<div class="map" id="map" aria-label="Քարտեզ"></div><div class="scrim"></div>
          <section class="sheet r modal" id="sheet" role="dialog" aria-label="Չեղարկե՞լ որոնումը"><div class="grabber"></div>
            <div class="mhead"><h2 class="h-title">Չեղարկե՞լ որոնումը</h2></div>
            <div class="h-sub">Մեքենան դեռ չի նշանակվել</div>
            <div class="btns"><button class="btn btn-quiet">Շարունակել որոնումը</button><button class="btn btn-danger">Չեղարկել</button></div></section>`,
        map: searchMap() },
    ],
  })
</script>
</body>
</html>
