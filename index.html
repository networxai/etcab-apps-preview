<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eco Taxi mockups</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Noto+Sans+Armenian:wght@400;500;600&display=swap">
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<style>
  /* The mockup viewer: one place to find every screen and state of the rider app, the driver app and the console.
     Left: surfaces, search, topics, the screen tree. Right: the screen in its frame, its states, theme, notes.
     State lives in the hash (#p=…&s=…&t=…) so any view is a link. Screen list: nav-data.js (tools/build-nav.mjs). */
  :root { --font: 'Google Sans', 'Noto Sans Armenian', system-ui, sans-serif;
    --ground: #f4f4f2; --surface: #ffffff; --alt: #ececea; --line: #e2e2df; --ink: #141416; --ink-2: #55555c; --ink-3: #85858c;
    --brand: #2f7d0c; --brand-tint: #e6f2dc; --sel: #141416; --sel-ink: #ffffff; --stage: #e8e8e5; }
  :root[data-theme="dark"] { --ground: #0d0d0e; --surface: #161618; --alt: #202023; --line: #2a2a2e; --ink: #f2f2f3; --ink-2: #a8a8ae;
    --ink-3: #7a7a82; --brand: #7bd34a; --brand-tint: #1d2a15; --sel: #f2f2f3; --sel-ink: #141416; --stage: #08080a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--ground); color: var(--ink); font: 400 14px/20px var(--font); }
  button, input, a { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  a { text-decoration: none; }
  svg.lucide { width: 16px; height: 16px; stroke-width: 1.75; flex: none; }
  .app { display: grid; grid-template-columns: 320px minmax(0, 1fr); height: 100%; }

  /* Sidebar */
  .side { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-right: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 8px; padding: 16px 16px 12px; }
  .brand b { font: 600 15px/20px var(--font); } .brand span { color: var(--ink-3); font-size: 12px; margin-left: auto; white-space: nowrap; }
  .search { margin: 0 12px; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 9px; background: var(--alt); }
  .search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; }
  .search kbd { font: 500 11px/16px var(--font); color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .surf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin: 10px 12px 0; padding: 3px; border-radius: 9px; background: var(--alt); }
  .surf button { height: 30px; border-radius: 7px; font-weight: 500; color: var(--ink-2); display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
  .surf button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
  .surf small { font-size: 11px; color: var(--ink-3); }
  .topics { display: flex; gap: 4px; padding: 10px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; mask-image: linear-gradient(90deg, #000 85%, transparent); }
  .topics::-webkit-scrollbar { display: none; }
  .topics button { flex: none; }
  .topics button { height: 26px; padding: 0 9px; border-radius: 99px; border: 1px solid var(--line); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .topics button.on { background: var(--sel); color: var(--sel-ink); border-color: var(--sel); }
  .tree { flex: 1; overflow-y: auto; padding: 6px 8px 24px; }
  .grp { font: 500 11px/16px var(--font); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); padding: 14px 8px 4px; }
  .scr { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 32px; padding: 6px 8px; border-radius: 7px; text-align: left; }
  .scr:hover { background: var(--alt); }
  .scr .t { flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scr .n { font-size: 12px; color: var(--ink-3); }
  .scr.on { background: var(--alt); }
  .scr .chev { color: var(--ink-3); transition: transform .15s; } .scr.on .chev { transform: rotate(90deg); }
  .sts { margin: 2px 0 6px 14px; border-left: 1px solid var(--line); padding-left: 6px; }
  .sts .sg { font-size: 11px; color: var(--ink-3); padding: 6px 8px 2px; }
  .st { display: block; width: 100%; text-align: left; padding: 5px 8px; border-radius: 6px; color: var(--ink-2); font-size: 13px; line-height: 18px; }
  .st:hover { background: var(--alt); color: var(--ink); }
  .st.on { background: var(--sel); color: var(--sel-ink); }
  .hit { display: block; width: 100%; text-align: left; padding: 7px 8px; border-radius: 7px; }
  .hit:hover, .hit.on { background: var(--alt); }
  .hit b { display: block; font-weight: 500; font-size: 13px; } .hit span { font-size: 12px; color: var(--ink-3); }
  .empty { padding: 24px 8px; color: var(--ink-3); }
  .foot { padding: 10px 12px; border-top: 1px solid var(--line); display: flex; gap: 4px 10px; font-size: 12px; color: var(--ink-3); flex-wrap: wrap; align-items: center; }
  .foot span { color: var(--ink-3); }
  .foot a:hover { color: var(--ink); text-decoration: underline; }

  /* Main */
  .main { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
  .top { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); min-width: 0; }
  .menu { display: none; }
  .crumb { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
  .crumb span { color: var(--ink-3); } .crumb b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .crumb .pos { font-size: 12px; color: var(--ink-3); margin-left: 4px; }
  .ib { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-2); }
  .ib:hover { background: var(--alt); color: var(--ink); }
  .seg { display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--alt); }
  .seg button { height: 26px; padding: 0 10px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
  .stage { position: relative; overflow: hidden; background: var(--stage); display: grid; place-items: center; }
  .dev { position: absolute; transform-origin: top left; }
  .dev.phone { width: 406px; height: 860px; padding: 8px; border-radius: 56px; background: #0b0b0c; box-shadow: 0 1px 2px rgb(0 0 0 / .1), 0 24px 60px rgb(0 0 0 / .22); }
  .dev.phone iframe { width: 390px; height: 844px; border-radius: 48px; }
  .dev.desk { width: 1440px; height: 900px; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 2px rgb(0 0 0 / .1), 0 24px 60px rgb(0 0 0 / .22); }
  .dev.desk iframe { width: 1440px; height: 900px; }
  .dev iframe { border: 0; display: block; background: #000; }
  .note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--surface); font-size: 13px; color: var(--ink-2); max-height: 120px; overflow-y: auto; }
  .note b { color: var(--ink); font-weight: 600; }
  .note:empty { display: none; }
  .keys { margin-left: auto; white-space: nowrap; font-size: 12px; color: var(--ink-3); }
  .keys kbd { font: 500 11px/16px var(--font); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }

  @media (max-width: 900px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .side { position: fixed; z-index: 10; inset: 0 auto 0 0; width: min(320px, 88vw); transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 40px rgb(0 0 0 / .3); }
    .app.open .side { transform: none; }
    .menu { display: grid; }
    .hide-s, .keys { display: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" aria-label="Էկրաններ">
    <div class="brand"><b>Eco Taxi · մակետներ</b><span id="count"></span></div>
    <label class="search"><i data-lucide="search"></i><input id="q" type="search" placeholder="Որոնել էկրան կամ վիճակ" aria-label="Որոնել էկրան կամ վիճակ" autocomplete="off"><kbd>/</kbd></label>
    <div class="surf" role="tablist" aria-label="Հավելված" id="surf"></div>
    <div class="topics" role="group" aria-label="Թեմաներ" id="topics"></div>
    <nav class="tree" id="tree" aria-label="Էկրանների ցանկ"></nav>
    <div class="foot"><span>Պատկերասրահներ՝</span><a href="rider-index.html">Ուղևոր</a><a href="driver-index.html">Վարորդ</a><a href="console/index.html">Վահանակ</a><a href="overview.html">Ամփոփում</a></div>
  </aside>
  <main class="main">
    <div class="top">
      <button class="ib menu" id="menu" aria-label="Էկրանների ցանկ"><i data-lucide="panel-left"></i></button>
      <div class="crumb" id="crumb"></div>
      <button class="ib" id="prev" aria-label="Նախորդ վիճակ (←)" title="Նախորդ վիճակ (←)"><i data-lucide="chevron-left"></i></button>
      <button class="ib" id="next" aria-label="Հաջորդ վիճակ (→)" title="Հաջորդ վիճակ (→)"><i data-lucide="chevron-right"></i></button>
      <div class="seg" role="radiogroup" aria-label="Թեմա" id="theme"></div>
      <button class="ib hide-s" id="copy" aria-label="Պատճենել հղումը" title="Պատճենել հղումը"><i data-lucide="link"></i></button>
      <a class="ib" id="open" target="_blank" rel="noopener" aria-label="Բացել նոր ներդիրում" title="Բացել նոր ներդիրում"><i data-lucide="external-link"></i></a>
    </div>
    <div class="stage" id="stage"><div class="dev" id="dev"><iframe id="frame" title="Մակետ"></iframe></div></div>
    <div class="note" id="note"></div>
  </main>
</div>
<script src="nav-data.js"></script>
<script src="viewer.js"></script>
</body>
</html>
