<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Rider login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="rider.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="mapgl.local.js"></script>
<script src="kit.js"></script>
<script src="routes.js"></script>
<script src="audit.js"></script>
<script src="rider.js"></script>
<style>
  /* Phone → code → name. The keypad is drawn: every layout here is judged with the keyboard up. */
  /* Same brand moment as the driver login: logo top-left (aligned with every page title), the car centred, title + lead. */
  .hero { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-top: 52px; }
  .logo-tl { position: absolute; top: 70px; left: var(--margin); width: 122px; height: 22px; z-index: 5; }
  .hero .carart { width: 236px; height: 112px; }
  .form { flex: none; padding: 0 var(--margin) var(--s4); margin-bottom: 255px; }
  .form .large, .form .lead { padding-left: 0; padding-right: 0; }
  .field { margin-top: var(--s5); display: flex; align-items: center; height: 60px; border-radius: var(--r-control); background: var(--surface-2); padding: 0 var(--s4) 0 var(--s2); }
  .field.err { box-shadow: inset 0 0 0 2px var(--danger); }
  .field.focus { box-shadow: inset 0 0 0 2px var(--ink); }
  .cc { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 var(--s2); border-radius: 10px; font: var(--t-body-strong); color: var(--ink); flex: none; }
  .cc svg { width: 16px; height: 16px; color: var(--ink-3); }
  .flag { width: 22px; height: 15px; border-radius: 3px; background: linear-gradient(#D90012 33.3%, #0033A0 33.3% 66.6%, #F2A800 66.6%); box-shadow: inset 0 0 0 .5px rgb(0 0 0 / .15); flex: none; }
  .sep { width: 1px; height: 28px; background: var(--hairline); margin: 0 var(--s3) 0 var(--s1); flex: none; }
  .num { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .num .lbl { font: var(--t-caption); color: var(--ink-2); }
  .num .v { font: 500 18px/24px var(--font); color: var(--ink); letter-spacing: .4px; font-variant-numeric: tabular-nums; white-space: nowrap; display: flex; align-items: center; }
  .num .v.ph { color: var(--ink-3); font-weight: 400; }
  .caret { display: inline-block; width: 2px; height: 22px; background: var(--brand-ink); margin-left: 1px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .clear { width: 44px; height: 44px; margin-right: -8px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); flex: none; }
  .clear svg { width: 18px; height: 18px; }
  .form .btn { margin-top: var(--s4); }
  .form .inline-note { margin-top: var(--s2); }

  .who { font: var(--t-body); color: var(--ink-2); margin-top: var(--s1); display: flex; flex-wrap: wrap; align-items: center; column-gap: var(--s2); }
  .who b { font: var(--t-body-strong); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .link { font: var(--t-body-strong); color: var(--brand-ink); height: 44px; display: inline-flex; align-items: center; white-space: nowrap; }
  .otp { display: flex; gap: var(--s2); margin-top: var(--s5); }
  .otp .gap { width: var(--s2); }
  .otp .d { width: 48px; height: 58px; border-radius: var(--r-card); background: var(--surface-2); display: grid; place-items: center;
    font: 600 24px/30px var(--font); color: var(--ink); font-variant-numeric: tabular-nums; }
  .otp .d.focus { box-shadow: inset 0 0 0 2px var(--ink); }
  .otp.err .d { box-shadow: inset 0 0 0 2px var(--danger); color: var(--danger); }
  .otp.busy .d { color: var(--ink-3); }
  .resend { margin-top: var(--s3); display: flex; align-items: center; gap: var(--s4); min-height: 44px; }
  .resend .wait { font: var(--t-secondary); color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .busyline { margin-top: var(--s3); display: flex; align-items: center; gap: var(--s2); min-height: 44px; font: var(--t-secondary-strong); color: var(--ink-2); }
  .busyline .spin { width: 16px; height: 16px; border-width: 2px; }
  .btn .spin { width: 18px; height: 18px; }
  .page .toast { top: 110px; }
  /* p1p2: session ended (R07), lock-out (R08), first-sign-in consent (R06). A notice is a card on the page, never a modal. */
  .notice { display: grid; grid-template-columns: 24px 1fr; gap: var(--s3); align-items: start; margin-top: var(--s4); padding: var(--s3) var(--s4);
    border-radius: var(--r-card); background: var(--surface-2); }
  .notice > svg { width: 22px; height: 22px; color: var(--ink); margin-top: 1px; }
  .notice.amber > svg { color: var(--warn); }
  .notice b { display: block; font: var(--t-body-strong); color: var(--ink); }
  .notice span { display: block; font: var(--t-secondary); color: var(--ink-2); margin-top: 2px; }
  .notice .mono { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
  .otp.off .d { color: var(--ink-3); background: var(--surface-2); opacity: .7; }
  /* Change list 2026-10-14: an explicit consent checkbox on its own row, both documents linked. The whole row is the
     checkbox's hit area (≥ 48 px); the two links are separate targets inside it, underlined, never cramped. */
  .agree { display: grid; grid-template-columns: 24px 1fr; gap: var(--s3); align-items: start; min-height: 56px; padding: var(--s3) 0; margin: var(--s1) 0 var(--s2);
    font: var(--t-secondary); color: var(--ink-2); text-align: left; width: 100%; }
  .agree .box { width: 24px; height: 24px; border-radius: 7px; box-shadow: inset 0 0 0 2px var(--ink-3); display: grid; place-items: center; color: #fff; margin-top: -1px; }
  .agree[aria-checked="true"] .box { background: var(--brand); box-shadow: none; }
  .agree .box svg { width: 16px; height: 16px; stroke-width: 2.5; }
  .agree a { color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--ink-3); display: inline-block; }
  .consent { margin-top: var(--s4); font: var(--t-secondary); color: var(--ink-2); }
  .consent .lk { display: flex; gap: var(--s2); margin-top: var(--s1); }
  .consent .lk button { height: 44px; padding: 0 var(--s3); border-radius: var(--r-pill); background: var(--surface-2); font: var(--t-secondary-strong); color: var(--ink); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .consent .lk svg { width: 16px; height: 16px; color: var(--ink-2); }
</style>
</head>
<body>
<script>
  const PH = '77 123 456'
  const hero = () => `<img class="logo-tl" src="assets/eco/logo-wide.png" alt="Eco Taxi" width="122" height="22"><div class="hero">${R.car('city', 236, 112, '')}</div>`
  const field = ({ v, ph, cls = '', clear }) => `<div class="field ${cls}">
      <button class="cc" aria-label="Երկրի կոդ +374"><span class="flag" aria-hidden="true"></span>+374${R.i('chevron-down')}</button><span class="sep"></span>
      <span class="num"><span class="lbl">Հեռախոսահամար</span><span class="v ${ph ? 'ph' : ''}">${v}${cls.includes('focus') ? '<span class="caret"></span>' : ''}</span></span>
      ${clear ? `<button class="clear" aria-label="Մաքրել">${R.i('circle-x')}</button>` : ''}</div>`
  /* agree: true = ticked, false = not yet (Send stays off), null = not shown. */
  const agreeRow = (on) => `<div class="agree" role="checkbox" aria-checked="${on}" tabindex="0"><span class="box" aria-hidden="true">${on ? R.i('check') : ''}</span>
      <span>Ընդունում եմ <a href="#">Պայմանները</a> և<br><a href="#">Գաղտնիության քաղաքականությունը</a></span></div>`
  const phonePage = ({ v = PH, ph, fcls = 'focus', clear = true, btn = '<button class="btn btn-brand">Ուղարկել կոդը</button>', note = '', extra = '', agree = true }) =>
    `<div class="page on-surface">${hero()}<div class="form">
      <h1 class="large">Մուտք</h1><p class="lead">Կոդը կուղարկենք SMS-ով</p>
      ${field({ v, ph, cls: fcls, clear })}${note}${agree === null ? '' : agreeRow(agree)}${btn}</div>${R.keypad()}</div>${extra}`

  const boxes = (ds, cls = '', focusAt = -1) => `<div class="otp ${cls}" role="group" aria-label="Վեցանիշ կոդ"${cls === 'off' ? ' aria-disabled="true"' : ''}>${[0, 1, 2, 3, 4, 5].map((i) =>
    `${i === 3 ? '<span class="gap"></span>' : ''}<span class="d ${i === focusAt ? 'focus' : ''}">${ds[i] || (i === focusAt ? '<span class="caret"></span>' : '')}</span>`).join('')}</div>`
  const codePage = (body, extra = '') => `<div class="page on-surface">
      <nav class="nav"><button class="navbtn" aria-label="Հետ">${R.i('arrow-left')}</button><span class="navttl"></span><span class="navend"></span></nav>
      <div class="form" style="margin-top:var(--s2)"><h1 class="large">Կոդը</h1>
        <div class="who">Կոդն ուղարկվել է <b>+374 ${PH}</b></div>
        ${body}</div>${R.keypad()}</div>${extra}`

  Rider.page({
    title: 'Rider · Login',
    sub: 'Phone, then a six-digit code, then a name on the first sign-in. +374 by default, a picker for tourists. The keyboard is drawn up',
    states: [
      { id: 'phone-empty', group: 'Phone', label: 'Empty', note: 'Order disabled until the number is complete',
        html: () => phonePage({ v: 'XX XXX XXX', ph: true, clear: false, agree: false, btn: '<button class="btn" disabled>Ուղարկել կոդը</button>' }) },
      { id: 'phone', group: 'Phone', label: 'Filled', note: 'Grouped as it is spoken: 77 123 456; terms ticked (change list 2026-10-14)',
        html: () => phonePage({}) },
      { id: 'sending', group: 'Phone', label: 'Sending', note: 'Spinner in the button; the field stays readable',
        html: () => phonePage({ fcls: '', clear: false, btn: '<button class="btn btn-brand" aria-busy="true"><span class="spin"></span>Ուղարկում ենք</button>' }) },
      { id: 'phone-error', group: 'Phone', label: 'Bad number', note: 'Refusal focuses the field; message under it, not a toast',
        html: () => phonePage({ v: '77 123 45', fcls: 'err', note: `<div class="inline-note err">${R.i('circle-alert')}<span>Համարը թերի է</span></div>` }) },
      { id: 'offline', group: 'Phone', label: 'Offline', note: 'Banner, not a dead button: the number is kept',
        html: () => phonePage({ fcls: '', clear: false, btn: '<button class="btn" disabled>Ուղարկել կոդը</button>',
          extra: R.banner({ t1: 'Կապ չկա', t2: 'Ստուգեք ինտերնետը', action: 'Կրկնել' }) }) },

      { id: 'code', group: 'Code', label: 'Typing', note: 'Auto-read on Android, oneTimeCode on iOS; submits on the sixth digit',
        html: () => codePage(`${boxes('482', '', 3)}<div class="resend"><span class="wait">Կրկին ուղարկել՝ 0:42</span></div>`) },
      { id: 'verifying', group: 'Code', label: 'Checking',
        html: () => codePage(`${boxes('482917', 'busy')}<div class="busyline"><span class="spin"></span>Ստուգում ենք</div>`) },
      { id: 'code-error', group: 'Code', label: 'Wrong code', note: 'Red ring and a word; attempts left so the rider is not surprised by a lock',
        html: () => codePage(`${boxes('482971', 'err')}<div class="inline-note err" style="margin-top:var(--s3)">${R.i('circle-alert')}<span>Կոդը սխալ է · մնաց 2 փորձ</span></div>
          <div class="resend"><button class="link">Փոխել համարը</button></div>`) },
      { id: 'resend', group: 'Code', label: 'Resend', note: 'Timer done: resend, or have the code read out by a call (SMS fails for some foreign numbers)',
        html: () => codePage(`${boxes('', '', 0)}<div class="resend"><button class="link">Կրկին ուղարկել</button><button class="link" style="color:var(--ink)">${''}Ստանալ զանգով</button></div>`,
          '<div class="toast" role="status" style="top:62px">' + R.i('check') + 'Կոդն ուղարկվեց</div>') },

      { id: 'locked', group: 'Code', label: 'Locked out', note: 'R08 (drawn ahead: the API answers 429 and the app shows only «Կոդը սխալ է»). After the last wrong attempt the boxes go quiet, the wait is a number, and the ways out are a new number or a person. Amber icon: a rule, not a failure',
        html: () => codePage(`${boxes('482971', 'off')}<div class="notice amber" role="status">${R.i('lock')}<div><b>Փորձերը սպառվեցին</b><span>Նոր կոդ՝ <span class="mono">4:59</span> հետո</span></div></div>
          <div class="resend"><button class="link">Փոխել համարը</button><button class="link" style="color:var(--ink)">${R.i('phone', 'style="width:18px;height:18px;margin-right:6px"')}Զանգել դիսպետչերին</button></div>`) },
      { id: 'expired', group: 'Phone', label: 'Session ended', note: 'R07 (drawn ahead: _layout.tsx replaces to /login silently). Said once, in place, with the number kept: nothing the rider saved is lost, so the line says so',
        html: () => phonePage({ fcls: '', clear: false, note: `<div class="notice" role="status">${R.i('log-out')}<div><b>Մուտք գործեք կրկին</b><span>Ուղևորություններն ու հասցեները պահված են</span></div></div>` }) },
      { id: 'name', group: 'First sign-in', label: 'Name', note: 'Only on the first sign-in; the driver greets the rider by it. Team review 2026-10-16 (R1): an OPTIONAL e-mail field follows the name, with one line saying receipts (our receipt + the link to the Tax Service receipt) are sent there; nothing is required, «Շարունակել» works with it empty. It is editable later in Account (Էլ. հասցե). There are no invoices; company reports are separate',
        html: () => `<div class="page on-surface">
          <nav class="nav"><span class="navend"></span><span class="navttl"></span><button class="navbtn" aria-label="Բաց թողնել" style="width:auto;padding:0 8px;font:var(--t-body-strong);color:var(--ink-2)">Հետո</button></nav>
          <div class="form" style="margin-top:var(--s2);margin-bottom:0"><h1 class="large">Ինչպե՞ս դիմենք ձեզ</h1>
          <div class="field focus" style="padding-left:var(--s4)"><span class="num"><span class="lbl">Անուն</span><span class="v">Աննա<span class="caret"></span></span></span></div>
          <div class="field" style="padding-left:var(--s4);margin-top:var(--s3)"><span class="num"><span class="lbl">Էլ. հասցե · ըստ ցանկության</span><span class="v ph">name@example.com</span></span></div>
          <div class="inline-note">${R.i('mail')}<span>Ստացականները կուղարկենք այստեղ</span></div>
          <button class="btn btn-brand">Շարունակել</button></div>${R.keyboard()}</div>` },
      { id: 'terms', group: 'Phone', label: 'Terms not ticked', note: 'Change list 2026-10-14 (store requirement; drawn ahead: no consent step today): a checkbox row above «Ուղարկել կոդը», both documents linked. Unticked, the button stays off. The accepted version is stored with the customer; a returning rider sees it ticked',
        html: () => phonePage({ agree: false, btn: '<button class="btn" disabled>Ուղարկել կոդը</button>' }) },
    ],
  })
</script>
</body>
</html>
