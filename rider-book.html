<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Rider booking details</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="rider.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="mapgl.local.js"></script>
<script src="kit.js"></script>
<script src="routes.js"></script>
<script src="audit.js"></script>
<script src="rider.js"></script>
<style>
  /* Tier row: verbatim from the approved rider-tiers.html (owner rule: horizontal snap row with a peek). */
  .tiers { display: flex; gap: var(--s2); overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 var(--margin);
    margin: 0 calc(-1 * var(--margin)); padding: 2px var(--margin) 2px; scrollbar-width: none; }
  .tiers::-webkit-scrollbar { display: none; }
  .tier { position: relative; flex: none; width: 132px; scroll-snap-align: start; display: flex; flex-direction: column; align-items: flex-start;
    padding: var(--s3); border-radius: var(--r-card); background: var(--surface-2); text-align: left; }
  .tier.on { background: var(--surface); box-shadow: inset 0 0 0 2px var(--ink); }
  .tier .art { position: relative; width: 108px; height: 56px; margin: 0 0 var(--s2); display: flex; align-items: flex-end; justify-content: center; }
  .tier .art::before { content: ''; position: absolute; left: 10%; right: 10%; bottom: -2px; height: 8px; border-radius: 50%;
    background: radial-gradient(closest-side, var(--car-ground), transparent); }
  .tier .art img { position: relative; max-width: 108px; max-height: 54px; width: auto; height: auto; object-fit: contain; }
  .tier .name { font: var(--t-headline); color: var(--ink); white-space: nowrap; }
  .tier .meta { display: flex; align-items: center; gap: var(--s2); font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; margin-top: 2px; }
  .tier .meta span { display: inline-flex; align-items: center; gap: 4px; }
  .tier .meta svg { width: 14px; height: 14px; }
  .tier .price { font: var(--t-headline); color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; margin-top: var(--s2); }
  .tier .tick { position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; z-index: 1; }
  .tier .tick svg { width: 13px; height: 13px; stroke-width: 2.25; }
  .grabber { margin-bottom: var(--s4); }
  .cash { width: 28px; height: 28px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; color: var(--ok); flex: none; }
  .cash svg { width: 18px; height: 18px; }

  /* Booking details: when · note · payment as one compact line under the tiers. */
  .opts { display: flex; gap: var(--s2); margin: var(--s3) 0; }
  .opt { position: relative; height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 var(--s3); border-radius: var(--r-card);
    background: var(--surface-2); font: var(--t-secondary-strong); color: var(--ink); white-space: nowrap; flex: none; }
  .opt.grow { flex: 1; justify-content: flex-start; }
  .opt svg { width: 18px; height: 18px; }
  .opt .chev { width: 16px; height: 16px; color: var(--ink-3); margin-left: auto; }
  .opt.set { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .opt.set > svg:first-child { color: var(--brand-ink); }
  .opt .dot { position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--brand-vivid); box-shadow: 0 0 0 2px var(--surface-2); }

  /* Modal sheets */
  .modal .mtext { min-height: 104px; border-radius: var(--r-control); background: var(--surface-2); padding: var(--s3) var(--s4); display: flex; flex-direction: column; box-shadow: inset 0 0 0 2px var(--ink); }
  .modal .mtext .v { flex: 1; font: var(--t-body); color: var(--ink); display: flex; align-items: flex-start; }
  .modal .mtext .n { align-self: flex-end; font: var(--t-caption); color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .caret { display: inline-block; width: 2px; height: 20px; background: var(--brand-ink); margin-left: 1px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .modal .chips { margin: var(--s3) 0 var(--s4); }
  .screen .keyboard { z-index: 17; } /* the system keyboard is never under the app scrim */
  .modal.kb { bottom: 251px; border-radius: var(--r-sheet); padding-bottom: var(--s4); }

  .seg { display: flex; gap: 4px; padding: 4px; border-radius: var(--r-control); background: var(--surface-2); }
  .seg button { flex: 1; height: 40px; border-radius: 10px; font: var(--t-secondary-strong); color: var(--ink-2); white-space: nowrap; }
  .seg button[aria-checked="true"] { background: var(--raised); color: var(--ink); box-shadow: var(--e1); }
  .wheel { position: relative; display: flex; justify-content: center; align-items: center; gap: var(--s2); height: 200px; margin: var(--s4) 0; }
  .wheel .band { position: absolute; left: 0; right: 0; top: 80px; height: 40px; border-radius: 10px; background: var(--surface-2); }
  .wheel .col { position: relative; width: 72px; display: flex; flex-direction: column; align-items: center; }
  .wheel .col span { height: 40px; display: grid; place-items: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .wheel .c2 { font: 400 17px/22px var(--font); color: var(--ink-3); }
  .wheel .c1 { font: 400 20px/24px var(--font); color: var(--ink-2); }
  .wheel .c0 { font: 600 24px/28px var(--font); color: var(--ink); }
  .wheel .colon { position: relative; font: 600 24px/28px var(--font); color: var(--ink); }
  .when-sub { font: var(--t-secondary); color: var(--ink-2); margin-top: var(--s3); text-align: center; }

  .paylist .choice { min-height: 60px; }
  .paylist .choice .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; flex: none; }
  .paylist .choice .ico svg { width: 20px; height: 20px; }
  .paylist .choice .ico.cashc { color: var(--ok); }
  .paylist .choice[aria-disabled="true"] .t { color: var(--ink-2); }
  .paylist .choice[aria-disabled="true"] .ico { color: var(--ink-3); }
  .soon { height: 24px; padding: 0 10px; border-radius: var(--r-pill); background: var(--surface-2); font: var(--t-caption); line-height: 24px; color: var(--ink-2); flex: none; white-space: nowrap; }

  /* Scheduled confirmation */
  .ok .badge { width: 48px; height: 48px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-ink); display: grid; place-items: center; }
  .ok .badge svg { width: 24px; height: 24px; }
  .ok .top { display: flex; align-items: center; gap: var(--s3); }
  .ok .hero { font: var(--t-hero); color: var(--ink); font-variant-numeric: tabular-nums; margin-top: var(--s4); }
  .ok .hsub { font: var(--t-body); color: var(--ink-2); }
  .ok .trip { margin: var(--s4) 0; border-radius: var(--r-card); background: var(--surface-2); padding: var(--s2) var(--s4); }
  .ok .stop { display: flex; align-items: center; gap: var(--s3); min-height: 40px; font: var(--t-body); color: var(--ink); white-space: nowrap; }
  .ok .stop .g { width: 10px; display: grid; place-items: center; flex: none; }
  .ok .stop .g i { display: block; width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 3px var(--ink); }
  .ok .stop .g i.b { border-radius: 2px; box-shadow: none; background: var(--ink); }
  .ok .meta { display: flex; align-items: center; gap: var(--s2); font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; border-top: 1px solid var(--hairline); padding-top: var(--s2); margin-top: var(--s1); min-height: 36px; }
  .ok .meta b { font: var(--t-secondary-strong); color: var(--ink); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<script>
  /* Tenant "eco" tariffs, fixed_upfront, Republic Sq → Cascade = 2.1 km, 4 min (NOTES.md). */
  const TIERS = [['city', 'Eco City', 3, 4, 800], ['partner', 'Eco Partner', 4, 4, 1000], ['kids', 'Eco Kids', 7, 4, 1200],
    ['business', 'Eco Business', 6, 4, 1400], ['van', 'Eco Van', 9, 7, 1600], ['vip', 'Eco Vip', 11, 4, 2100]]
  const tiers = () => `<div class="tiers" role="radiogroup" aria-label="Դաս">${TIERS.map(([k, n, eta, seats, p], i) =>
    `<button class="tier ${i ? '' : 'on'}" role="radio" aria-checked="${!i}" ${i >= 2 ? 'data-peek' : ''}>
      ${i ? '' : `<span class="tick" aria-hidden="true">${R.i('leaf')}</span>`}
      <span class="art">${carImg(k)}</span><span class="name">${n}</span>
      <span class="meta"><span>${R.i('clock-3')}${eta} րոպե</span><span>${R.i('user-round')}${seats}</span></span>
      <span class="price">${R.amd(p)}</span></button>`).join('')}</div>`
  const opts = (sched) => `<div class="opts">
      <button class="opt grow ${sched ? 'set' : ''}" aria-label="Ե՞րբ՝ ${sched ? 'Վաղը, 08:30' : 'Հիմա'}">${R.i(sched ? 'calendar-clock' : 'clock-3')}${sched ? 'Վաղը, 08:30' : 'Հիմա'}${R.i('chevron-down', 'class="chev"')}</button>
      <button class="opt" aria-label="Նշում վարորդին${sched ? '՝ ավելացված' : ''}">${R.i('message-square-text')}Նշում${sched ? '<span class="dot" aria-hidden="true"></span>' : ''}</button>
      <button class="opt" aria-label="Վճարում՝ Կանխիկ"><span class="cash">${R.i('banknote')}</span>Կանխիկ</button></div>`
  const base = (sheet, fab = true) => `<div class="map" id="map" aria-label="Քարտեզ"></div>
      ${fab ? `<button class="fab" style="top:62px;left:16px" aria-label="Հետ">${R.i('arrow-left')}</button>` : ''}${sheet}`
  const details = (sched) => base(`<section class="sheet r" id="sheet"><div class="grabber"></div>${tiers()}${opts(sched)}
      <button class="btn btn-brand">Պատվիրել</button></section>`)
  const modal = (title, body, cls = '') => base(`<div class="scrim" aria-hidden="true"></div>
      <section class="sheet r modal ${cls}" id="sheet" role="dialog" aria-label="${title}"><div class="grabber"></div>
      <div class="mhead"><h2 class="h-title">${title}</h2><button class="xbtn" aria-label="Փակել">${R.i('x')}</button></div>${body}</section>`, false)

  const RT = () => ROUTES.republicToCascade.pts
  const drawRide = (s, tags = true) => {
    /* A sheet raised by the keyboard: the map (and 2GIS's logo, which must stay visible) stops above sheet + keyboard. */
    let sheetH = s.querySelector('#sheet').offsetHeight, sel = '#sheet'
    if (s.querySelector('.modal.kb')) {
      sheetH += 251
      s.insertAdjacentHTML('beforeend', `<div id="kbh" aria-hidden="true" style="position:absolute;visibility:hidden;width:1px;height:${sheetH}px"></div>`)
      sel = '#kbh'
    }
    const m = R.map(s, { sheet: sel, fit: RT(), padTL: [48, 132], padBR: [48, sheetH + 44] })
    drawRoute(m, RT(), { weight: 5 })
    const a = RT()[0], b = RT()[RT().length - 1]
    htmlMarker(m, a, '<div class="pin-a"></div>', [18, 18])
    htmlMarker(m, b, '<div class="pin-b"></div>', [18, 18])
    if (tags) {
      htmlMarker(m, a, `<div class="maptag plain" style="position:absolute;right:20px;top:-18px">Հանրապետության հր.</div>`, [0, 0], [0, 0])
      htmlMarker(m, b, `<div class="maptag" style="position:absolute;left:0;top:-22px;transform:translate(-50%,-100%)"><b>4 րոպե</b>Կասկադ</div>`, [0, 0], [0, 0])
    }
  }
  /* Today is Friday 9 October 2026: tomorrow is Saturday the 10th, then Sunday the 11th (i18n weekday./month. names). */
  const wheel = () => {
    const col = (vals) => `<div class="col">${vals.map((v, i) => `<span class="c${Math.abs(i - 2)}">${v}</span>`).join('')}</div>`
    return `<div class="wheel" role="group" aria-label="Ժամ՝ 08:30"><span class="band" aria-hidden="true"></span>${col(['06', '07', '08', '09', '10'])}<span class="colon">:</span>${col(['20', '25', '30', '35', '40'])}</div>`
  }

  Rider.page({
    title: 'Rider · Booking details',
    sub: 'Extends the approved tier sheet: when, a note for the driver, and payment (cash; card shown as coming, not hidden)',
    states: [
      { id: 'details', group: 'Sheet', label: 'Details', note: 'One compact line under the tiers: when · note · payment. Order stays the one accent',
        html: () => details(false), map: (s) => drawRide(s) },
      { id: 'scheduled', group: 'Sheet', label: 'Scheduled + note', note: 'A set option is ringed; the note shows a dot, not its text',
        html: () => details(true), map: (s) => drawRide(s) },

      { id: 'note', group: 'Sheets', label: 'Note', note: 'Free text plus one-tap chips; keyboard up, sheet rides above it',
        html: () => modal('Նշում վարորդին', `<div class="mtext"><span class="v">Մուտքը բակից է<span class="caret"></span></span><span class="n">14/200</span></div>
          <div class="chips" role="group" aria-label="Արագ նշումներ"><button class="chip tog" aria-pressed="false">Զանգել ժամանելիս</button><button class="chip tog" aria-pressed="true">${R.i('check')}Ուղեբեռ</button><button class="chip tog" aria-pressed="false">Կենդանի</button></div>
          <button class="btn btn-brand">Պահպանել</button>`, 'kb') + R.keyboard(), map: (s) => drawRide(s, false) },
      { id: 'when', group: 'Sheets', label: 'When', note: 'Day as a segment, time as a wheel in 5-minute steps; the chosen row sits in a band',
        html: () => modal('Ե՞րբ', `<div class="seg" role="radiogroup" aria-label="Օր"><button role="radio" aria-checked="false">Այսօր</button><button role="radio" aria-checked="true">Վաղը</button><button role="radio" aria-checked="false">Կիրակի, 11</button></div>
          <div class="when-sub">շաբաթ, 10 հոկտեմբերի</div>${wheel()}<button class="btn btn-brand">Հաստատել</button>`), map: (s) => drawRide(s, false) },
      { id: 'pay', group: 'Sheets', label: 'Payment', note: 'Cash is first-class; card is listed and honestly marked “soon”, never hidden',
        html: () => modal('Վճարում', `<div class="paylist" role="radiogroup" aria-label="Վճարման եղանակ">
          <button class="choice" role="radio" aria-checked="true"><span class="ico cashc">${R.i('banknote')}</span><span class="t">Կանխիկ</span><span class="radio"></span></button>
          <div class="divider" style="margin-left:48px"></div>
          <button class="choice" role="radio" aria-checked="false" aria-disabled="true"><span class="ico">${R.i('credit-card')}</span><span class="t">Բանկային քարտ</span><span class="soon">Շուտով</span></button></div>`), map: (s) => drawRide(s, false) },

      { id: 'scheduled-ok', group: 'Done', label: 'Scheduled', note: 'The time is the one hero; the ride lives in Account → scheduled bookings',
        html: () => base(`<section class="sheet r ok" id="sheet"><div class="grabber"></div>
          <div class="top"><span class="badge">${R.i('calendar-check')}</span><h2 class="h-title">Պատվերն ընդունված է</h2></div>
          <div class="hero">08:30</div><div class="hsub">Վաղը, շաբաթ, 10 հոկտեմբերի</div>
          <div class="trip"><div class="stop"><span class="g"><i></i></span>Հանրապետության հրապարակ</div><div class="stop"><span class="g"><i class="b"></i></span>Կասկադ</div>
            <div class="meta"><span>Eco City</span>·<b>${R.amd(800)}</b>·<span>Կանխիկ</span></div></div>
          <button class="btn btn-brand">Լավ</button></section>`), map: (s) => drawRide(s) },
    ],
  })
</script>
</body>
</html>
