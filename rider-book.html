<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Rider booking details</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="rider.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="mapgl.local.js"></script>
<script src="kit.js"></script>
<script src="routes.js"></script>
<script src="audit.js"></script>
<script src="rider.js"></script>
<style>
  /* Tier row: verbatim from the approved rider-tiers.html (owner rule: horizontal snap row with a peek). */
  .tiers { display: flex; gap: var(--s2); overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 var(--margin);
    margin: 0 calc(-1 * var(--margin)); padding: 2px var(--margin) 2px; scrollbar-width: none; }
  .tiers::-webkit-scrollbar { display: none; }
  .tier { position: relative; flex: none; width: 108px; /* owner 2026-10-14: compact, 3 full + the 4th peeking at 390 */ scroll-snap-align: start; display: flex; flex-direction: column; align-items: flex-start;
    padding: 10px 10px 10px; border-radius: var(--r-card); background: var(--surface-2); text-align: left; }
  .tier.on { background: var(--surface); box-shadow: inset 0 0 0 2px var(--ink); }
  .tier .art { position: relative; width: 88px; height: 46px; margin: 0 0 var(--s2); display: flex; align-items: flex-end; justify-content: center; }
  .tier .art::before { content: ''; position: absolute; left: 10%; right: 10%; bottom: -2px; height: 8px; border-radius: 50%;
    background: radial-gradient(closest-side, var(--car-ground), transparent); }
  .tier .art img { position: relative; max-width: 88px; max-height: 44px; width: auto; height: auto; object-fit: contain; }
  .tier .name { font: 600 14px/20px var(--font, inherit); letter-spacing: -.1px; color: var(--ink); white-space: nowrap; }
  .tier .meta { display: flex; align-items: center; gap: 6px; font: var(--t-caption); color: var(--ink-2); white-space: nowrap; margin-top: 2px; }
  .tier .meta span { display: inline-flex; align-items: center; gap: 4px; }
  .tier .meta svg { width: 14px; height: 14px; }
  .tier .price { font: 600 15px/20px var(--font, inherit); color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; margin-top: var(--s2); }
  .tier .tick { position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; z-index: 1; }
  .tier .tick svg { width: 13px; height: 13px; stroke-width: 2.25; }
  .tier .art .seat { position: absolute; right: 2px; top: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: var(--e1);
    display: grid; place-items: center; color: var(--ink); z-index: 1; }
  .tier .art .seat svg { width: 14px; height: 14px; }
  .grabber { margin-bottom: var(--s4); }

  /* Who pays (apps/rider components/payment-row.tsx): a segmented control, shown only to a rider whose company is on account.
     The billed-to line names the company; the reference field (reference-field.tsx) appears when the agreement asks for one. */
  .billto { display: flex; flex-direction: column; gap: var(--s2); margin-bottom: var(--s3); }
  /* «Ընկերություն · {name}» (pay.company) is set on two lines, so the company name is never cut. */
  .billto .seg button { height: 52px; padding: 0 var(--s2); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 18px; }
  .billto .seg button small { font: var(--t-caption); color: var(--ink-2); }
  .billed { display: flex; align-items: center; gap: var(--s2); font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; min-height: 20px; }
  .billed svg { width: 16px; height: 16px; flex: none; }
  /* Change list 2026-10-14: no cost-centre code. The company line carries the employee's monthly limit left (corporate #1);
     a trip outside the allowed places or over the limit is personal, with one line saying why (corporate #4). */
  .billed .left { margin-left: auto; color: var(--ink); font-variant-numeric: tabular-nums; }
  .whyp { display: flex; align-items: flex-start; gap: var(--s2); font: var(--t-secondary); color: var(--ink-2); }
  .whyp svg { width: 16px; height: 16px; flex: none; margin-top: 2px; color: var(--warn); }
  .places { display: flex; gap: 6px; flex-wrap: wrap; }
  .places span { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--surface-2); font: var(--t-caption); color: var(--ink); }
  .places svg { width: 14px; height: 14px; color: var(--ink-2); }
  .billto .seg button[aria-disabled="true"] { color: var(--ink-3); }
  .billto .seg button[aria-disabled="true"] small { color: var(--ink-3); }
  /* Promo (change list 2026-10-14): one row under the options; the discount shows on the tier and the button. */
  .promo { display: flex; align-items: center; gap: var(--s2); min-height: 48px; padding: 0 var(--s3) 0 var(--s4); margin-bottom: var(--s3); border-radius: var(--r-control);
    background: var(--surface-2); font: var(--t-secondary-strong); color: var(--ink); width: 100%; text-align: left; }
  .promo svg { width: 18px; height: 18px; flex: none; color: var(--brand); }
  .promo .off { margin-left: auto; color: var(--brand-ink); /* brand as text: --brand is a fill, 3.2:1 on dark */ font-variant-numeric: tabular-nums; }
  .promo .x { width: 32px; height: 32px; display: grid; place-items: center; color: var(--ink-2); }
  .promo .x svg { color: var(--ink-2); }
  /* Not yet entered: a quiet text row, not a filled field (UX audit 2026-10-15, Pareto / Von Restorff): most rides carry no code,
     so the add affordance must not be the second-biggest shape on the sheet, right above Order. Still a 44 pt target. */
  .promo.add { color: var(--ink-2); font: var(--t-secondary); background: none; min-height: 44px; padding: 0 var(--s1); margin: calc(-1 * var(--s1)) 0 var(--s2); width: auto; }
  .tier .was { font: var(--t-caption); color: var(--ink-3); text-decoration: line-through; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .tier .was + .price { margin-top: 0; color: var(--brand-ink); }
  .btn s { font-weight: 500; margin-right: 4px; } /* the strike says "was"; dimming it cost the label its 4.5:1 */
  .modal .mcode { height: 56px; border-radius: var(--r-control); background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--ink); display: flex; align-items: center; padding: 0 var(--s4);
    font: 600 17px/24px var(--font); letter-spacing: 1px; color: var(--ink); margin-bottom: var(--s2); }
  .modal .mhint { font: var(--t-secondary); color: var(--ok); display: flex; gap: 6px; align-items: center; margin-bottom: var(--s4); }
  .modal .mhint svg { width: 16px; height: 16px; }
  .refusal .body { font: var(--t-body); color: var(--ink-2); margin-bottom: var(--s4); }
  /* Company refusals: one icon disc + a short title + one line, so the sheet reads at a glance (2026-10-14 pass). */
  .refusal .rico { width: 48px; height: 48px; border-radius: 50%; background: var(--surface-2); color: var(--ink-2); display: grid; place-items: center; margin-bottom: var(--s3); }
  .refusal .rico svg { width: 24px; height: 24px; }
  .cash { width: 28px; height: 28px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; color: var(--ok); flex: none; }
  .cash svg { width: 18px; height: 18px; }

  /* Booking details: when · note · payment as one compact line under the tiers. */
  .opts { display: flex; gap: var(--s2); margin: var(--s3) 0; }
  .opt { position: relative; height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 var(--s3); border-radius: var(--r-card);
    background: var(--surface-2); font: var(--t-secondary-strong); color: var(--ink); white-space: nowrap; flex: none; }
  .opt.grow { flex: 1; justify-content: flex-start; }
  .opt svg { width: 18px; height: 18px; }
  .opt .chev { width: 16px; height: 16px; color: var(--ink-3); margin-left: auto; }
  .opt.set { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .opt.set > svg:first-child { color: var(--brand-ink); }
  .opt .dot { position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--brand-vivid); box-shadow: 0 0 0 2px var(--surface-2); }

  /* Modal sheets */
  .modal .mtext { min-height: 104px; border-radius: var(--r-control); background: var(--surface-2); padding: var(--s3) var(--s4); display: flex; flex-direction: column; box-shadow: inset 0 0 0 2px var(--ink); }
  .modal .mtext .v { flex: 1; font: var(--t-body); color: var(--ink); display: flex; align-items: flex-start; }
  .modal .mtext .n { align-self: flex-end; font: var(--t-caption); color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .caret { display: inline-block; width: 2px; height: 20px; background: var(--brand-ink); margin-left: 1px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .modal .chips { margin: var(--s3) 0 var(--s4); }
  .screen .keyboard { z-index: 17; } /* the system keyboard is never under the app scrim */
  .modal.kb { bottom: 251px; border-radius: var(--r-sheet); padding-bottom: var(--s4); }

  .seg { display: flex; gap: 4px; padding: 4px; border-radius: var(--r-control); background: var(--surface-2); }
  .seg button { flex: 1; height: 44px; border-radius: 10px; font: var(--t-secondary-strong); color: var(--ink-2); white-space: nowrap; }
  .seg button[aria-checked="true"] { background: var(--raised); color: var(--ink); box-shadow: var(--e1); }
  /* "When?" (apps/rider components/when-sheet.tsx + lib/schedule.ts): «Հիմա», then 7 day chips in one scrolling row;
     under them every quarter-hour of that day that is ≥ now + 30 min (LEAD_MINUTES), four to a row, chunked under part-of-day headers. No wheel. */
  .days { display: flex; gap: var(--s2); overflow: hidden; margin: 0 calc(-1 * var(--margin)) var(--s3); padding: 0 var(--margin); }
  .days .chip { height: 44px; padding: 0 14px; flex: none; }
  .days .chip svg { width: 18px; height: 18px; }
  .days .chip[aria-checked="true"] { background: var(--ink); color: var(--surface); box-shadow: none; }
  .slots { position: relative; height: 300px; overflow: hidden; margin-bottom: var(--s4); }
  .slots .part + .part { margin-top: var(--s2); }
  .slots .ph { display: flex; align-items: center; gap: 6px; height: 24px; margin-bottom: var(--s2); font: var(--t-caption); color: var(--ink-2); }
  .slots .ph svg { width: 14px; height: 14px; }
  .slots .in { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s2); }
  .slots button { height: 44px; border-radius: var(--r-card); background: var(--surface-2); font: var(--t-body-strong); color: var(--ink); font-variant-numeric: tabular-nums; }
  .slots button[aria-checked="true"] { background: var(--ink); color: var(--surface); }
  .slots::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 20px; pointer-events: none; background: linear-gradient(transparent, var(--surface)); }
  /* The note is off while a time is set (book.tsx noteOff): scheduled_ride has no notes column. */
  .opt[aria-disabled="true"] { color: var(--ink-3); background: var(--surface-2); }
  .opt.whenset { background: var(--brand-soft); color: var(--brand-ink); }
  .opt.whenset .chev { color: var(--brand-ink); }
  .opt.ico { width: 44px; padding: 0; justify-content: center; }
  .noteoff { font: var(--t-caption); color: var(--ink-2); margin: calc(-1 * var(--s1)) 0 var(--s3); }

  .paylist .choice { min-height: 60px; }
  .paylist .choice .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; flex: none; }
  .paylist .choice .ico svg { width: 20px; height: 20px; }
  .paylist .choice .ico.cashc { color: var(--ok); }
  .paylist .choice .t2 { display: block; font: var(--t-caption); color: var(--ink-2); }
  .paylist .choice[aria-disabled="true"] .t { color: var(--ink-2); }
  .paylist .choice[aria-disabled="true"] .ico { color: var(--ink-3); }
  .soon { height: 24px; padding: 0 10px; border-radius: var(--r-pill); background: var(--surface-2); font: var(--t-caption); line-height: 24px; color: var(--ink-2); flex: none; white-space: nowrap; }

  /* Scheduled confirmation */
  .ok .badge { width: 48px; height: 48px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-ink); display: grid; place-items: center; }
  .ok .badge svg { width: 24px; height: 24px; }
  .ok .top { display: flex; align-items: center; gap: var(--s3); }
  .ok .hero { font: var(--t-hero); color: var(--ink); font-variant-numeric: tabular-nums; margin-top: var(--s4); }
  .ok .hsub { font: var(--t-body); color: var(--ink-2); }
  .ok .trip { margin: var(--s4) 0; border-radius: var(--r-card); background: var(--surface-2); padding: var(--s2) var(--s4); }
  .ok .stop { display: flex; align-items: center; gap: var(--s3); min-height: 40px; font: var(--t-body); color: var(--ink); white-space: nowrap; }
  .ok .stop .g { width: 10px; display: grid; place-items: center; flex: none; }
  .ok .stop .g i { display: block; width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 3px var(--ink); }
  .ok .stop .g i.b { border-radius: 2px; box-shadow: none; background: var(--ink); }
  .ok .meta { display: flex; align-items: center; gap: var(--s2); font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; border-top: 1px solid var(--hairline); padding-top: var(--s2); margin-top: var(--s1); min-height: 36px; }
  .ok .meta b { font: var(--t-secondary-strong); color: var(--ink); font-variant-numeric: tabular-nums; }

  /* p1p2: order refusals (R23/R24), quote states (R25/R26), late-evening When (R29). */
  .onotice { display: grid; grid-template-columns: 22px 1fr; gap: var(--s3); align-items: start; padding: var(--s3) var(--s4); margin-bottom: var(--s3);
    border-radius: var(--r-card); background: var(--surface-2); font: var(--t-secondary); color: var(--ink); }
  .onotice svg { width: 20px; height: 20px; color: var(--ink-2); margin-top: 0; }
  .onotice b { display: block; font: var(--t-secondary-strong); }
  .tier .price.dash { color: var(--ink-3); }
  .btn .btnsk { display: inline-block; width: 44px; height: 16px; border-radius: 5px; vertical-align: -2px; margin-left: 2px; background: rgb(255 255 255 / .35); animation: none; }
  .tier .price .sk { display: block; width: 72px; height: 20px; border-radius: 6px; }
  .tier .est { font: var(--t-caption); color: var(--ink-2); white-space: nowrap; }
  .whennote { display: flex; align-items: center; gap: var(--s2); font: var(--t-secondary); color: var(--ink-2); margin: calc(-1 * var(--s1)) 0 var(--s3); }
  .whennote svg { width: 16px; height: 16px; flex: none; }
  /* Price breakdown (owner 2026-10-15): the driver's fare lines, then the service fee as its own line; the button is the total. */
  .pb { display: flex; flex-direction: column; margin: calc(-1 * var(--s1)) 0 var(--s3); }
  .pl { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); min-height: 22px; font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; }
  .pl b { font: var(--t-secondary-strong); color: var(--ink); font-variant-numeric: tabular-nums; }
  /* A tier the zone does not serve (Eco Kids from the airport): dimmed, «—», one word why. Not removed: the rider knows it exists. */
  .tier.off .art, .tier.off .name, .tier.off .meta { opacity: .4; }
  .paylist .choice[aria-disabled="true"] .radio { opacity: .4; }
  .days .chip[aria-disabled="true"] { color: var(--ink-3); background: var(--surface-2); box-shadow: none; text-decoration: line-through; text-decoration-color: var(--ink-3); }
  /* Fare details (owner 2026-10-16): tap the chosen tier (or its «i») → a bottom sheet with the tariff exactly as the console defines it. */
  .tier .info { position: absolute; right: 6px; bottom: 8px; width: 22px; height: 22px; display: grid; place-items: center; color: var(--ink-2); }
  .tier .info svg { width: 16px; height: 16px; }
  .fdh { align-items: center; }
  .fdh .carart { flex: none; margin-right: var(--s1); }
  .fdh .fd-t { flex: 1; min-width: 0; }
  .fd-price { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); border-radius: var(--r-card); background: var(--surface-2); }
  .fd-price > svg { width: 20px; height: 20px; flex: none; color: var(--ink); }
  .fd-price .l { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .fd-price .l b { font: var(--t-secondary-strong); color: var(--ink); white-space: nowrap; }
  .fd-price .l span { font: var(--t-caption); color: var(--ink-2); white-space: nowrap; }
  .fd-price .amt { font: var(--t-title); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fd-g { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: var(--s2) var(--s2); margin: var(--s3) 0 var(--s2); }
  .fd-g div { display: flex; flex-direction: column; min-width: 0; }
  .fd-g .k { font: var(--t-caption); color: var(--ink-2); white-space: nowrap; }
  .fd-g b { font: 600 15px/20px var(--font); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fd-h { font: var(--t-secondary-strong); color: var(--ink-2); margin: var(--s3) 0 var(--s1); }
  .fd-x { display: grid; grid-template-columns: 1fr 1fr; gap: 2px var(--s4); }
  .fd-x div, .fd-w { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); min-height: 28px; font: var(--t-secondary); color: var(--ink); white-space: nowrap; }
  .fd-x b, .fd-w b { font: var(--t-secondary-strong); font-variant-numeric: tabular-nums; }
  .fd-w { min-height: 34px; padding: 0 var(--s2); margin: 0 calc(-1 * var(--s2)); border-radius: 10px; }
  .fd-w svg { width: 16px; height: 16px; flex: none; color: var(--ink-2); }
  .fd-w .n { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: var(--s2); }
  .fd-w .n span { font: var(--t-caption); color: var(--ink-2); }
  .fd-w.now { background: var(--brand-soft); color: var(--brand-ink); }
  .fd-w.now svg, .fd-w.now .n span { color: var(--brand-ink); }
  .fd-w .tag-now { font: var(--t-caption); height: 20px; line-height: 20px; padding: 0 var(--s2); border-radius: var(--r-pill); background: var(--brand); color: #fff; }
  .fd-n { display: flex; align-items: flex-start; gap: var(--s2); margin-top: var(--s3); font: var(--t-secondary); color: var(--ink-2); }
  .fd-n svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }
  .fd-cm { display: flex; align-items: flex-start; gap: var(--s2); margin-top: var(--s3); padding: var(--s3); border-radius: var(--r-card); background: var(--surface-2); font: var(--t-secondary); color: var(--ink); }
  .fd-cm svg { width: 16px; height: 16px; flex: none; margin-top: 1px; color: var(--ink-2); }
  .fd-zone { display: flex; align-items: flex-start; gap: var(--s2); margin-top: var(--s2); font: var(--t-secondary); color: var(--ink); }
  .fd-zone svg { width: 16px; height: 16px; flex: none; margin-top: 1px; color: var(--ink-2); }
</style>
</head>
<body>
<script>
/* Real street geometry (OSRM over OpenStreetMap, ODbL), fetched 2026-10-12 for the pre-order bookings (ECO.BOOKINGS). [lat, lng]. */

<script>
  /* Tenant "eco" tariffs, fixed_upfront: fare = max(floor, base + per_km·km + per_min·min) rounded to 100 ֏ (NOTES.md; the console's
     TIERS in console.js carry the same numbers). ETA = the nearest car of that tier, in minutes. */
  const TARIFF = { city: [600, 90, 12, 700], partner: [700, 110, 14, 900], kids: [900, 130, 18, 1200], business: [1000, 150, 20, 1400], van: [1200, 170, 22, 1600], vip: [1500, 220, 30, 2000] }
  const price = (id, km, mn) => { const [b, k, m, f] = TARIFF[id]; return Math.max(f, Math.round((b + k * km + m * mn) / 100) * 100) }
  const TIERS = [['city', 'Eco City', 3, 4], ['partner', 'Eco Comfort', 4, 4], ['kids', 'Eco Kids', 7, 4], ['business', 'Eco Business', 6, 4], ['van', 'Eco Van', 9, 7], ['vip', 'Eco Vip', 11, 4]]
  /* Owner #1 (2026-10-14): pre-orders are per tariff (ECO.TIERS[].preorders, console Tariffs). A booking for later offers only the
     tariffs that allow it; the others are left out of the row, not greyed (a dead card in a radio row is a tap that does nothing). */
  const preOk = (name) => { const t = (ECO.TIERS || []).find((x) => x.name === name); return !t || t.preorders !== false }
  const B = ECO.BOOKINGS, C = ECO.COMPANY
  /* Trips drawn on this page. now = Republic Sq → Cascade (2,1 km, 4 min → Eco City 800 ֏).
     air = ECO.BOOKINGS.air being booked (Komitas 22 → Zvartnots, 12,6 km, 17 min → 1 900 ֏); co = ECO.BOOKINGS.co (4,1 km, 11 min → 1 100 ֏). */
  /* Owner 2026-10-15, zones (console zones.html): Զվարթնոց adds 500 ֏ «Օդանավակայանի վճար» on pickup and drop-off, has a 3 000 ֏
     minimum on pickup, takes no cash and no Eco Kids on pickup, and pre-orders from it are ≥ 2 h ahead. Zone-to-zone, City / Comfort:
     Կենտրոն → Զվարթնոց fixed 4 500 ֏, Երևան → Զվարթնոց fixed 5 000 ֏; a fixed fare replaces the metered one and includes the zone
     charges. Owner 2026-10-19: a zone sets, PER TARIFF, one rule: a fixed fare, a fixed amount added, or a % added on top of the tariff's own
     price; no tariff is implicitly cheaper or fixed. zone: { rule: { tierId: { fixed } | { add } | { pct } }, pair, air: 'pickup' | 'drop', min }.
     Without a rule a tier gets the zone's default (metered + the airport charge). */
  const AIR = 500
  const TRIPS = {
    now: { route: 'republicToCascade', km: 2.1, min: 4, a: 'Հանրապետության հր.', b: 'Կասկադ' },
    /* The walkthrough ride (ECO.RIDE): Mashtots 37 → Komitas 22, 4,3 km, 6 min → 1 100 ֏, the rider pays 1 200 ֏. */
    ride: { route: 'pickupToDrop', km: ECO.RIDE.km, min: ECO.RIDE.min, a: ECO.RIDE.pickup, b: ECO.RIDE.drop },
    /* Komitas 22 is Երևան, not Կենտրոն: «Երևան → Զվարթնոց» fixes City / Comfort at 5 000 ֏ (ECO.BOOKINGS.air.fare / .fixed). */
    air: { route: 'preAir', km: B.air.km, min: B.air.min, a: B.air.pickup, b: B.air.dropShort, bRight: true, zone: { rule: { city: { fixed: B.air.fare }, partner: { fixed: B.air.fare }, kids: { fixed: 5300 }, van: { fixed: 5600 }, business: { fixed: 6000 }, vip: { fixed: 7500 } }, pair: B.air.fixed, air: 'drop' } },
    co: { route: 'preCo', km: B.co.km, min: B.co.min, a: B.co.pickup, b: B.co.drop },
    /* Mashtots 37 (Կենտրոն) → Զվարթնոց now: OSRM 13,2 km, 18 min (ROUTES.cenAir). */
    cenAir: { route: 'cenAir', km: 13.2, min: 18, a: ECO.RIDE.pickup, b: 'Զվարթնոց', bRight: true, zone: { rule: { city: { fixed: 4500 }, partner: { fixed: 4500 }, kids: { fixed: 4800 }, van: { pct: 30 }, business: { pct: 60 }, vip: { add: AIR } }, pair: 'Կենտրոն → Զվարթնոց', air: 'drop' } },
    /* From the airport home: Զվարթնոց → Komitas 22 (ECO.BOOKINGS.air reversed), metered, the 3 000 ֏ minimum and the pickup charge. */
    airHome: { route: 'airHome', km: B.air.km, min: B.air.min, a: 'Զվարթնոց', b: B.air.pickup, aRight: true, bLeft: true, zone: { air: 'pickup', min: 3000 } },
  }
  if (price('city', B.co.km, B.co.min) !== B.co.fare) console.error('[rider-book] tariff and ECO.BOOKINGS fares disagree')

  /* Rider service fee (owner 2026-10-15, final): the fleet's own income, +2 % on top of the final fare when the rider pays by bank
     card (the saved card, Apple Pay, Google Pay, or NFC · POS on the driver's phone). Cash and company rides carry none. Whole dram: 1 100 → 22, 4 500 → 90.
     It is its own line, and never on the Tax Service receipt. */
  const CARDY = ['card', 'applepay', 'googlepay', 'nfc']
  const fee = (fare, pay = 'cash') => CARDY.includes(pay) ? Math.round(fare * 2 / 100) : 0
  /* The driver's fare after the zone layer: { fare, fixed, metered, base, air, min }. */
  const fareOf = (k, trip) => {
    const z = trip.zone || {}
    const r = z.rule && z.rule[k], metered = price(k, trip.km, trip.min)
    if (r && r.fixed) return { fare: r.fixed, fixed: r.fixed }
    if (r && r.pct) { const extra = Math.round(metered * r.pct / 10000) * 100; return { fare: metered + extra, metered, pct: r.pct, extra } }
    if (r && r.add) return { fare: metered + r.add, metered, air: r.add }
    const base = z.min ? Math.max(z.min, metered) : metered
    return { fare: base + (z.air ? AIR : 0), metered, base, air: z.air ? AIR : 0, min: z.min && z.min > metered ? z.min : 0 }
  }
  /* What the rider pays: the tier cards and the order button always carry this total. */
  const total = (k, trip, pay) => { const f = fareOf(k, trip).fare; return f + fee(f, pay) }
  /* Kids from the airport: not served there (zone rule). */
  const offTier = (k, trip) => k === 'kids' && trip.zone && trip.zone.air === 'pickup'

  /* mode: undefined = priced (fixed_upfront); 'pending' = quote in flight (TierCard Skeleton); 'dash' = no quote (§14.1, «—»);
     'metered' = a non-fixed tier (presentQuote labelAsEstimate: «≈» + «Մոտավոր»). A zone-fixed fare says «Ֆիքսված» under it. */
  const tierPrice = (k, trip, mode, pay) => mode === 'pending' ? '<span class="price" aria-label="Գինը հաշվարկվում է"><span class="sk" aria-hidden="true"></span></span>'
    : mode === 'dash' ? '<span class="price dash" aria-label="Գին չկա">—</span>'
    : offTier(k, trip) ? '<span class="price dash" aria-hidden="true">—</span><span class="est">Այստեղից՝ ոչ</span>'
    : mode === 'metered' ? `<span class="price">≈ ${R.amd(total(k, trip, pay))}</span><span class="est">Մոտավոր</span>`
    : `<span class="price">${R.amd(total(k, trip, pay))}</span>${fareOf(k, trip).fixed ? '<span class="est">Ֆիքսված</span>' : ''}`
  /* sel: the chosen tier (default the first). promo: { fare, off, pay } on the chosen tier (cash). pay: the method, for the card fee. */
  const tiers = (trip, mode, later, promo, sel, pay) => `<div class="tiers" role="radiogroup" aria-label="Սակագին">${TIERS.filter(([, n]) => !later || preOk(n)).map(([k, n, eta, seats], i) => {
    const on = sel ? k === sel : !i, off = offTier(k, trip)
    return `<button class="tier ${on ? 'on' : ''}${off ? ' off' : ''}" role="radio" aria-checked="${on}"${on ? ' aria-haspopup="dialog"' : ''}${off ? ` aria-disabled="true" aria-label="${n}, օդանավակայանից չի սպասարկվում"` : ''} ${i >= 3 ? 'data-peek' : ''}>
      ${on ? `<span class="tick" aria-hidden="true">${R.i('check')}</span><span class="info" aria-hidden="true">${R.i('info')}</span>` : ''}
      <span class="art">${k === 'kids' ? carImg('city') + `<span class="seat" role="img" aria-label="Մանկական նստոցով">${R.i('baby')}</span>` : carImg(k)}</span><span class="name">${n}</span>
      <span class="meta"><span aria-label="Մեքենան՝ ${eta} րոպեում">${R.i('car-front')}${eta} ր</span><span>${R.i('user-round')}${seats}</span></span>
      ${promo && on ? `<span class="was">${R.amd(promo.fare)}</span><span class="price">${R.amd(promo.pay)}</span>` : tierPrice(k, trip, mode, pay)}</button>` }).join('')}</div>`
  /* R31: for a later ride the order button carries the time instead of the tier (the tier is the ringed card above it):
     «Պատվիրել · Վաղը, 08:30 · 5 000 ֏» (book.scheduleOrder + the useWhenLabel string + the fixed fare; + the fee when paid by card). */
  const TN = Object.fromEntries(TIERS.map(([k, n]) => [k, n]))
  const cta = (trip, label = 'Պատվիրել', when = null, k = 'city', pay) => `${label} · ${when || TN[k]} · ${R.amd(total(k, trip, pay))}`
  /* The price, broken down under the options (owner 2026-10-15: the service fee is its own line, before the rider orders).
     The driver's fare lines first, then the fee; the total is the button. */
  const fareLines = (trip, k = 'city', pay) => {
    const f = fareOf(k, trip), z = trip.zone || {}
    const ln = (l, v) => `<div class="pl"><span>${l}</span><b>${R.amd(v)}</b></div>`
    return `<div class="pb" aria-label="Գինը">${f.fixed ? ln(`Ֆիքսված գին · ${z.pair}`, f.fixed)
      : f.pct ? ln('Ուղևորություն', f.metered) + ln(`Օդանավակայանի հավելավճար · +${f.pct} %`, f.extra)
      : (f.min ? ln('Նվազագույն գին՝ օդանավակայանից', f.min) : ln('Ուղևորություն', f.metered)) + (f.air ? ln('Օդանավակայանի վճար', f.air) : '')}
      ${fee(f.fare, pay) ? ln('Սպասարկման վճար · քարտով 2 %', fee(f.fare, pay)) : ''}</div>`
  }

  /* when: null = now; else the useWhenLabel string («Վաղը, 08:30»). A set time turns the chip brand-soft and switches the note off. */
  const opts = (when, pay = 'cash') => `<div class="opts">
      <button class="opt grow ${when ? 'whenset' : ''}" aria-label="Ե՞րբ՝ ${when || 'Հիմա'}">${R.i(when ? 'calendar-clock' : 'clock-3')}${when || 'Հիմա'}${R.i('chevron-down', 'class="chev"')}</button>
      ${when ? `<button class="opt ico" aria-disabled="true" aria-label="Նշում վարորդին՝ միայն հիմա պատվիրելիս">${R.i('message-square-text')}</button>`
        : `<button class="opt" aria-label="Նշում վարորդին">${R.i('message-square-text')}Նշում</button>`}
      ${pay === 'company'
        ? `<button class="opt${when ? ' ico' : ''}" aria-label="Վճարում՝ ${ECO.PAY.company.label}">${R.i('building-2')}${when ? '' : ECO.PAY.company.short}</button>` /* with a time set the line is long; the segment below names the company */
        : pay === 'card' ? `<button class="opt" aria-label="Վճարում՝ ${ECO.PAY.card.label} ·· ${ECO.PAY.card.last4}">${R.i('credit-card')}·· ${ECO.PAY.card.last4}</button>`
        : pay === 'applepay' ? `<button class="opt" aria-label="Վճարում՝ Apple Pay">${R.i('smartphone')}Apple Pay</button>`
        : `<button class="opt" aria-label="Վճարում՝ ${ECO.PAY.cash.label}"><span class="cash">${R.i('banknote')}</span>${ECO.PAY.cash.label}</button>`}</div>
      ${when ? '<div class="noteoff">Նշում՝ միայն հիմա պատվիրելիս</div>' : ''}`
  /* who: 'company' = billed to the company, monthly limit left shown · 'personal' = the rider chose personal ·
     'limit' = over the employee's monthly limit → personal, one line · 'places' = trip not between allowed places → personal. */
  const L = C.empLimit, PL = C.places
  const billTo = (who) => {
    const off = who === 'limit' || who === 'places'
    return `<div class="billto" role="group" aria-label="Ո՞վ է վճարում">
      <div class="seg" role="radiogroup"><button role="radio" aria-checked="${who === 'company'}"${off ? ' aria-disabled="true"' : ''} aria-label="Ընկերություն · ${C.name}">Ընկերություն<small>${C.short}</small></button><button role="radio" aria-checked="${who !== 'company'}">Անձնական</button></div>
      ${who === 'company' ? `<div class="billed">${R.i('building-2')}Վճարում է՝ ${C.short}<span class="left">Մնացել է՝ ${R.amd(L.rider.left)}</span></div>` : ''}
      ${who === 'limit' ? `<div class="whyp">${R.i('gauge')}<span>Ամսական սահմանաչափից մնացել է ${R.amd(L.low.left)} · վճարում եք դուք</span></div>` : ''}
      ${who === 'places' ? `<div class="whyp">${R.i('map-pin-off')}<span>Ընկերության հաշվին՝ միայն այս հասցեների միջև</span></div>
        <div class="places" aria-label="Թույլատրված հասցեներ">${PL.rider.map((x) => `<span>${R.i(x.kind === 'home' ? 'house' : x.kind === 'office' ? 'building-2' : 'plane')}${x.label}</span>`).join('')}</div>` : ''}</div>`
  }
  const promoRow = (on) => on ? `<div class="promo" role="group" aria-label="Պրոմոկոդ">${R.i('ticket-percent')}${ECO.PROMO.applied.code}<span class="off">−${R.amd(ECO.PROMO.applied.off)}</span><button class="x" aria-label="Հեռացնել պրոմոկոդը">${R.i('x')}</button></div>`
    : `<button class="promo add">${R.i('ticket-percent')}Պրոմոկոդ</button>`
  const base = (sheet, fab = true) => `<div class="map" id="map" aria-label="Քարտեզ"></div>
      ${fab ? `<button class="fab" style="top:62px;left:16px" aria-label="Հետ">${R.i('arrow-left')}</button>` : ''}${sheet}`
  const company = (who, when = null, trip = TRIPS.co) => base(`<section class="sheet r" id="sheet"><div class="grabber"></div>${tiers(trip, undefined, !!when)}${opts(when, who === 'company' ? 'company' : 'cash')}${billTo(who)}
      <button class="btn btn-brand">${cta(trip, 'Պատվիրել', when)}</button></section>`)
  const PA = ECO.PROMO.applied
  const promoSheet = (trip) => base(`<section class="sheet r" id="sheet"><div class="grabber"></div>${tiers(trip, undefined, false, PA)}${opts(null)}${promoRow(true)}
      <button class="btn btn-brand">Պատվիրել · Eco City · <s>${R.amd(PA.fare)}</s>${R.amd(PA.pay)}</button></section>`)
  /* o: { lines: show the price breakdown, sel: tier, pay, why: a neutral zone line under the options } */
  const details = (when, trip, o = {}) => base(`<section class="sheet r" id="sheet"><div class="grabber"></div>${tiers(trip, undefined, !!when, null, o.sel, o.pay)}${opts(when, o.pay)}
      ${o.why || ''}${o.lines ? fareLines(trip, o.sel, o.pay) : ''}${when || o.why ? '' : promoRow(false)}
      <button class="btn btn-brand">${cta(trip, 'Պատվիրել', when, o.sel, o.pay)}</button></section>`)
  /* The payment sheet with a quiet «+2 %» on the bank-card methods (owner 2026-10-15; page-local; NFC · POS carries it in rider.js). */
  const payL = (sel) => R.payList(sel) /* the «+2 %» is in rider.js payList itself */
  /* A zone rule said once, in a neutral line with its own icon: never red, never a modal (owner 2026-10-15). */
  const zoneWhy = (icon, text) => `<div class="whennote" role="note">${R.i(icon)}${text}</div>`
  /* The order sheet with a neutral Notice above Order (book.tsx: orderError → <Notice tone="neutral">, from orderRefusalKey). */
  const orderSheet = ({ trip = TRIPS.now, mode, notice = '', btn }) => base(`<section class="sheet r" id="sheet"><div class="grabber"></div>${tiers(trip, mode)}${opts(null)}
      ${notice}${btn || `<button class="btn btn-brand">${cta(trip)}</button>`}</section>`)
  const onotice = (icon, text, sub) => `<div class="onotice" role="status">${R.i(icon)}<span>${sub ? `<b>${text}</b>${sub}` : text}</span></div>`
  const modal = (title, body, cls = '') => base(`<div class="scrim" aria-hidden="true"></div>
      <section class="sheet r modal ${cls}" id="sheet" role="dialog" aria-label="${title}"><div class="grabber"></div>
      <div class="mhead"><h2 class="h-title">${title}</h2><button class="xbtn" aria-label="Փակել">${R.i('x')}</button></div>${body}</section>`, false)

  /* Fare details (owner 2026-10-16): the console tariff for the chosen tier, as the rider sees it before ordering. Numbers: TARIFF here
     = console.js TIERS (base, per km, per min, floor); the rest = console Tariffs › Գին / Ժամային գներ / Սպասարկման վճար. The price is
     the quote the rider will be held to (fixed_upfront), so the sheet says it once: «Ֆիքսված գին». */
  const WAIT = { free: 3, paid: 50 }, EXTRAS = [['Մեծ ուղեբեռ', 300], ['Կենդանի', 500], ['Լրացուցիչ կանգառ', 200], ['Մանկական նստոց', 500]]
  const WINDOWS = [['Գիշերային', '23:00–06:00 · ամեն օր', 'moon-star', '+15 %', 15], ['Սրընթաց ժամ', '08:00–10:00 · Երկ–Ուրբ', 'sunrise', '+10 %', 10], ['Սրընթաց ժամ', '17:30–19:30 · Երկ–Ուրբ', 'sunset', '+300 ֏', 0]]
  /* The company's note for riders, per tariff (console Tariffs › Գին › «Մեկնաբանություն ուղևորների համար»; ≤ 200 characters). */
  const COMMENT = { city: 'Հիբրիդ մեքենաներ՝ մինչև 4 ուղևոր։ Առաջին 3 րոպե սպասումն անվճար է։' }
  /* o: { k: tier, win: index of the window in force (-1 none), zone: the airport pickup rule } */
  const fareSheet = (trip, o = {}) => {
    const k = o.k || 'city', [bs, km, mn, fl] = TARIFF[k], f = fareOf(k, trip), tr = TIERS.find((t) => t[0] === k)
    const w = o.win == null ? -1 : o.win, amt = w >= 0 && WINDOWS[w][4] ? Math.round(f.fare * (100 + WINDOWS[w][4]) / 10000) * 100 : f.fare
    const cell = (l, v) => `<div><span class="k">${l}</span><b>${v}</b></div>`, a = R.amd
    const band = (n) => Math.round(km * n)
    return base(`<div class="scrim" aria-hidden="true"></div>
      <section class="sheet r modal" id="sheet" role="dialog" aria-label="${tr[1]}՝ գնի մանրամասներ"><div class="grabber"></div>
      <div class="mhead fdh">${k === 'kids' ? '' : R.car(k, 72, 40, '')}<div class="fd-t"><h2 class="h-title">${tr[1]}</h2><div class="h-sub">Մինչև ${tr[3]} ուղևոր</div></div><button class="xbtn" aria-label="Փակել">${R.i('x')}</button></div>
      <div class="fd-price" role="group" aria-label="Ֆիքսված գին">${R.i('lock')}<span class="l"><b>Ֆիքսված գին</b><span>ֆիքսվում է պատվիրելիս</span></span><span class="amt">${a(amt)}</span></div>
      ${trip.zone && trip.zone.air === 'drop' ? `<div class="fd-zone" role="note">${R.i('plane')}<span>${f.fixed ? `Զվարթնոց․ ֆիքսված գին ${trip.zone.pair}` : f.pct ? `Զվարթնոց․ +${f.pct} % ձեր սակագնի գնի վրա` : `Զվարթնոց․ ${a(f.air)} օդանավակայանի վճար`}</span></div>` : ''}
      ${o.zone ? `<div class="fd-zone" role="note">${R.i('plane')}<span>Զվարթնոցից․ ${a(AIR)} օդանավակայանի վճար, նվազագույնը ${a(o.zone)}</span></div>` : ''}
      <div class="fd-g">${cell('0–10 կմ', a(km) + '/կմ')}${cell('10–30 կմ', a(band(.86)) + '/կմ')}${cell('30 կմ-ից', a(band(.73)) + '/կմ')}
        ${cell('Նստելու գին', a(bs))}${cell('Րոպե ճանապարհին', a(mn) + '/ր')}${cell('Նվազագույն գին', a(o.zone || fl))}
        ${cell('Անվճար սպասում', WAIT.free + ' ր')}${cell('Վճարովի սպասում', a(WAIT.paid) + '/ր')}</div>
      <div class="fd-h">Լրացուցիչ վճարներ</div>
      <div class="fd-x">${EXTRAS.map(([n, v]) => `<div><span>${n}</span><b>${k === 'kids' && n === 'Մանկական նստոց' ? 'ներառված է' : '+' + a(v)}</b></div>`).join('')}</div>
      <div class="fd-h">Ժամային գներ</div>
      ${WINDOWS.map(([n, h, ic, v], i) => `<div class="fd-w${i === w ? ' now' : ''}">${R.i(ic)}<span class="n">${n}<span>${h}</span></span>${i === w ? '<span class="tag-now">Հիմա</span>' : ''}<b>${v}</b></div>`).join('')}
      <div class="fd-n">${R.i('credit-card')}<span>Քարտով, Apple Pay, Google Pay, NFC՝ +2 % սպասարկման վճար։ Կանխիկ և ընկերություն՝ առանց վճարի։</span></div>
      ${COMMENT[k] ? `<div class="fd-cm">${R.i('message-circle')}<span>${COMMENT[k]}</span></div>` : ''}</section>`, false)
  }

  const drawRide = (s, tags = true, trip = TRIPS.now, o = {}) => {
    const RT = ROUTES[trip.route].pts
    /* A sheet raised by the keyboard: the map (and 2GIS's logo, which must stay visible) stops above sheet + keyboard. */
    let sheetH = s.querySelector('#sheet').offsetHeight, sel = '#sheet'
    if (s.querySelector('.modal.kb')) {
      sheetH += 251
      s.insertAdjacentHTML('beforeend', `<div id="kbh" aria-hidden="true" style="position:absolute;visibility:hidden;width:1px;height:${sheetH}px"></div>`)
      sel = '#kbh'
    }
    const m = R.map(s, { sheet: sel, fit: RT, padTL: [48, 132], padBR: [48, sheetH + 44] })
    if (!o.noLine) drawRoute(m, RT, { weight: 5 })
    const a = RT[0], b = RT[RT.length - 1]
    htmlMarker(m, a, '<div class="pin-a"></div>', [18, 18])
    htmlMarker(m, b, '<div class="pin-b"></div>', [18, 18])
    if (tags) {
      htmlMarker(m, a, `<div class="maptag plain" style="position:absolute;${trip.aRight ? 'left:16px' : 'right:20px'};top:-18px">${trip.a}</div>`, [0, 0], [0, 0])
      /* The airport sits at the map's west edge, so its tag opens to the right of the pin instead of centring over it. */
      htmlMarker(m, b, `<div class="maptag" style="position:absolute;${trip.bRight ? 'left:16px;top:-18px' : trip.bLeft ? 'right:16px;top:-18px' : 'left:0;top:-22px;transform:translate(-50%,-100%)'}">${o.noLine ? '' : `<b>${ECO.km(trip.km)} · ${trip.min} ր</b>`}${trip.b}</div>`, [0, 0], [0, 0])
    }
  }

  /* "When?" — schedule.ts: dayOptions(now, 7) and timeOptions(day, now). Today is ECO.DAY (Friday 9 October, 9:41), so today's
     first slot is 9:41 + 30 = 10:11 → 10:15. Day chips read «{Այսօր|Վաղը|weekday} · {d} {month}» (when-sheet.tsx dayLabel). */
  const WD = ['Կիր', 'Երկ', 'Երք', 'Չրք', 'Հնգ', 'Ուրբ', 'Շբթ'] /* rule 6 short weekdays */
  const MON = ['հունվ.', 'փետր.', 'մարտի', 'ապր.', 'մայիսի', 'հունիսի', 'հուլիսի', 'օգոստ.', 'սեպտ.', 'հոկտ.', 'նոյ.', 'դեկտ.'] /* rule 6: «14 հոկտ.» */
  const [Y, Mo, D0] = ECO.DAY.iso.split('-').map(Number)
  const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(Y, Mo - 1, D0 + i); return `${i === 0 ? 'Այսօր' : i === 1 ? 'Վաղը' : WD[d.getDay()]} · ${d.getDate()} ${MON[d.getMonth()]}` })
  const [nh, nm] = ECO.DAY.now.split(':').map(Number)
  const clock = (m) => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`
  /* nowMin: minutes since midnight (default ECO.DAY.now). Tomorrow's slots also start at now + 30 when that crosses midnight. */
  const slotsFor = (day, nowMin = nh * 60 + nm, lead = 30) => { const out = []; for (let m = 0; m < 1440; m += 15) if (day * 1440 + m >= nowMin + lead) out.push(m); return out }
  /* late: { now, note, icon, lead } — lead = minutes ahead of now for the first slot (30, LEAD_MINUTES; a zone may ask more:
     Զվարթնոց, 120). With a lead, today keeps its chip; without one (late evening) today has no slot and is struck through. */
  /* Choice Overload (UX audit 2026-10-16): the quarter-hours are chunked under part-of-day headers (Գիշեր 00–05, Առավոտ 05–12,
     Ցերեկ 12–18, Երեկո 18–24), four to a row, still no wheel. The list scrolls inside a fixed 300 px window; only whole rows that fit are
     drawn (a half-drawn row would sit over «Հաստատել»), and the fade says there is more. from = 'morning': already scrolled to the morning. */
  const PARTS = [['night', 'Գիշեր', 'moon', 0, 300], ['morning', 'Առավոտ', 'sunrise', 300, 720], ['day', 'Ցերեկ', 'sun', 720, 1080], ['evening', 'Երեկո', 'sunset', 1080, 1440]]
  const SLOTS_H = 300, HEAD_H = 32, ROW_H = 52
  const whenSheet = (day, picked, from = null, late = null) => {
    const list = slotsFor(day, late ? late.now : undefined, late && late.lead)
    const parts = PARTS.map(([id, label, icon, lo, hi]) => ({ id, label, icon, ms: list.filter((m) => m >= lo && m < hi) })).filter((p) => p.ms.length)
    const start = from ? Math.max(0, parts.findIndex((p) => p.id === from)) : 0
    let used = 0
    const drawn = []
    for (const p of parts.slice(start)) {
      if (used + HEAD_H + 44 > SLOTS_H) break
      let n = 0
      used += HEAD_H
      while (n < p.ms.length && used + 44 <= SLOTS_H) { n += 4; used += ROW_H }
      drawn.push(`<div class="part" role="group" aria-labelledby="ph-${p.id}"><div class="ph" id="ph-${p.id}">${R.i(p.icon)}${p.label}</div><div class="in">${p.ms.slice(0, n).map((m) =>
        `<button role="radio" aria-checked="${clock(m) === picked}" aria-label="${clock(m)}">${clock(m)}</button>`).join('')}</div></div>`)
    }
    const chips = `<div class="days" role="radiogroup" aria-label="Օր"><button class="chip" aria-label="Հիմա">${R.i('clock')}Հիմա</button>${days.map((l, i) =>
      `<button class="chip" role="radio" aria-checked="${i === day}"${late && !late.lead && i === 0 ? ' aria-disabled="true"' : ''}>${l}</button>`).join('')}</div>${late ? `<div class="whennote" role="note">${R.i(late.icon || 'moon')}${late.note}</div>` : ''}`
    const grid = `<div class="slots" role="radiogroup" aria-label="Ժամ">${drawn.join('')}</div>`
    return modal('Ե՞րբ', `${chips}${grid}${picked ? '<button class="btn btn-brand">Հաստատել</button>' : '<button class="btn" disabled>Հաստատել</button>'}`)
  }

  const daysInView = (s) => {
    const row = s.querySelector('.days'), on = row.querySelector('[aria-checked="true"]')
    if (on.offsetLeft + on.offsetWidth > row.clientWidth) row.scrollLeft = on.offsetLeft - 16 - 52
