<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Rider ride</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="rider.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="mapgl.local.js"></script>
<script src="kit.js"></script>
<script src="routes.js"></script>
<script src="audit.js"></script>
<script src="rider.js"></script>
<style>
  /* Assigned → arriving → arrived → riding. The plate is the identity riders check first (research §3.2). */
  .eta { font: var(--t-hero); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.4px; }
  .status { font: var(--t-body); color: var(--ink-2); white-space: nowrap; margin-top: 2px; }
  .status b { font: var(--t-body-strong); color: var(--ink); font-variant-numeric: tabular-nums; }
  .head2 { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s3); }
  .live { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--r-pill); background: var(--surface-2);
    font: var(--t-caption); color: var(--ink); white-space: nowrap; margin-bottom: 10px; }
  .live i.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok-dot); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok-dot) 22%, transparent); }

  .ident { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-top: var(--s4); padding: var(--s3) var(--s4);
    border-radius: var(--r-card); background: var(--surface-2); }
  .ident .who { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
  .ident .model { font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; }
  .ident .carart { margin-right: -4px; }
  .drv { display: flex; align-items: center; gap: var(--s3); min-height: 64px; }
  .drv .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .drv .n1 { font: var(--t-headline); color: var(--ink); white-space: nowrap; }
  .drv .n2 { font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
  .drv .n2 svg { width: 14px; height: 14px; color: var(--ink); fill: currentColor; }
  .sheet .acts { margin-top: var(--s2); }
  .act { width: 84px; }
  .act.on .o { background: var(--ink); color: var(--surface); }

  /* arrived: the plate is the hero */
  .arr-title { font: var(--t-title); color: var(--ink); }
  .wait { display: inline-flex; align-items: center; gap: 6px; font: var(--t-secondary-strong); color: var(--ink-2); margin-top: var(--s1); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .wait svg { width: 16px; height: 16px; }
  .bigid { display: flex; align-items: center; justify-content: space-between; margin-top: var(--s4); padding: var(--s4); border-radius: var(--r-card); background: var(--surface-2); }
  .bigid .who { display: flex; flex-direction: column; gap: var(--s2); }

  /* riding */
  .trip { display: flex; align-items: center; gap: var(--s3); margin-top: var(--s4); padding: var(--s3) var(--s4); border-radius: var(--r-card); background: var(--surface-2); }
  .trip .to { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .trip .t1 { font: var(--t-body-strong); color: var(--ink); white-space: nowrap; }
  .trip .t2 { font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; }
  .sq { width: 12px; height: 12px; border-radius: 3px; background: var(--ink); flex: none; }
  .mini { display: flex; align-items: center; gap: var(--s3); min-height: 56px; }
  /* Change list 2026-10-15: the rider changes Cash ↔ Card during the ride, until the driver completes it. */
  .payrow { display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: 48px; padding: 0 var(--s1); border-top: 1px solid var(--line); text-align: left; }
  .payrow svg { width: 20px; height: 20px; color: var(--ink-2); flex: none; } .payrow .cashc { color: var(--ok); }
  .payrow .t { flex: 1; font: var(--t-body); color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .payrow .ch { font: var(--t-body-strong); color: var(--brand-text, var(--ink)); white-space: nowrap; }
  .paylist .choice { min-height: 60px; }
  .paylist .choice .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; flex: none; }
  .paylist .choice .ico svg { width: 20px; height: 20px; } .paylist .choice .ico.cashc { color: var(--ok); }
  .paylist .choice .t2 { display: block; font: var(--t-caption); color: var(--ink-2); }
  .mini .nm { flex: 1; font: var(--t-body-strong); color: var(--ink); white-space: nowrap; }

  /* modals */
  .reasons { margin: 0 0 var(--s4); }
  .reasons .divider { margin-left: 34px; }
  .msgfield { display: flex; align-items: center; gap: var(--s2); height: 52px; padding: 0 6px 0 var(--s4); border-radius: var(--r-control); background: var(--surface-2); margin-top: var(--s4); }
  .msgfield .ph { flex: 1; font: var(--t-body); color: var(--ink-3); white-space: nowrap; }
  .send { width: 44px; height: 44px; border-radius: 50%; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; flex: none; }
  .send svg { width: 18px; height: 18px; }
  .sharecard { display: flex; gap: var(--s3); align-items: center; padding: var(--s3); border-radius: var(--r-card); background: var(--surface-2); }
  .sharecard .trace { background: var(--surface); }
  .sharecard .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .sharecard .t1 { font: var(--t-body-strong); color: var(--ink); white-space: nowrap; }
  .sharecard .t2 { font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .sharecard .url { font: var(--t-secondary-strong); color: var(--brand-ink); white-space: nowrap; }
  .modal .btns { margin-top: var(--s4); }
  .modal .chips { margin-top: var(--s1); }
  .screen .toast { top: 62px; }
  /* The fee is said before the red button (review): this fleet charges no rider cancellation fee, so «Անվճար» in --ok. */
  .inline-note.fee { color: var(--ok); font: var(--t-secondary-strong); margin: calc(-1 * var(--s2)) 0 var(--s1); }
  /* ── P0 states (2026-10-12) ── */
  /* A Notice (ui-native Notice tone neutral): surface-2 card, info glyph, ink text. Never red: these are outcomes, not failures. */
  .notice { display: flex; gap: var(--s2); align-items: flex-start; padding: var(--s3); border-radius: var(--r-card); background: var(--surface-2);
    font: var(--t-secondary); color: var(--ink); margin-top: var(--s3); }
  .notice svg { width: 18px; height: 18px; flex: none; color: var(--ink-2); }
  .notice b { display: block; font: var(--t-body-strong); }
  /* DriverCard tags: «Վճարում է ընկերությունը» is tone ok (DriverCard.tsx). */
  .tags { display: flex; gap: var(--s2); margin-top: var(--s2); }
  .tagp { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--r-pill); font: var(--t-secondary-strong); white-space: nowrap; }
  .tagp svg { width: 15px; height: 15px; }
  .tagp.ok { background: var(--ok-soft); color: var(--ok); }
  /* The booking a live ride came from (drawn ahead): the promised pickup, which is not the ETA. */
  .tagp.pre { background: var(--brand-soft); color: var(--brand-ink); }
  .cap { font: var(--t-secondary); color: var(--ink-2); margin-top: var(--s2); }
  /* cancelled: what was ordered, faint, and the one way out */
  .gone { display: flex; flex-direction: column; gap: var(--s3); }
  .gone .stops2 { border-radius: var(--r-card); background: var(--surface-2); padding: var(--s2) var(--s4); }
  .stop2 { display: flex; align-items: center; gap: var(--s3); min-height: 36px; font: var(--t-body); color: var(--ink-2); white-space: nowrap; }
  .stop2 i { width: 10px; height: 10px; flex: none; border-radius: 50%; box-shadow: inset 0 0 0 3px var(--ink-3); }
  .stop2 i.b { border-radius: 2px; box-shadow: none; background: var(--ink-3); }
  /* reassigned: the searching sheet (Searching.tsx), its bar from rider-searching */
  .sbar { height: 3px; border-radius: 2px; background: var(--surface-3); overflow: hidden; margin: var(--s3) 0 var(--s2); position: relative; }
  .sbar::after { content: ''; position: absolute; top: 0; bottom: 0; width: 34%; border-radius: 2px; background: var(--brand); animation: sslide 1.6s ease-in-out infinite; }
  @keyframes sslide { from { left: -34%; } to { left: 100%; } }
  @media (prefers-reduced-motion: reduce) { .sbar::after { animation: none; left: 33%; } }
  /* chat (owner 2026-10-12: rider–driver messages, drawn ahead) */
  .chat { display: flex; flex-direction: column; gap: var(--s2); padding: var(--s2) 0 var(--s3); }
  .chat .day { align-self: center; font: var(--t-caption); color: var(--ink-2); padding: 2px 0 var(--s1); }
  .bub { max-width: 78%; padding: 10px 14px; border-radius: 18px; font: var(--t-body); }
  .bub small { display: block; font: var(--t-caption); margin-top: 2px; opacity: .8; font-variant-numeric: tabular-nums; }
  .bub.in { align-self: flex-start; background: var(--surface-2); color: var(--ink); border-bottom-left-radius: 6px; }
  .bub.out { align-self: flex-end; background: var(--ink); color: var(--surface); border-bottom-right-radius: 6px; }
  .bub.out small { text-align: right; }
  .quick { display: flex; gap: var(--s2); overflow-x: auto; margin: 0 calc(-1 * var(--margin)); padding: 0 var(--margin); scrollbar-width: none; }
  .quick::-webkit-scrollbar { display: none; }
  .quick .chip.tog { flex: none; }
  .chathead { display: flex; align-items: center; gap: var(--s3); }
  .chathead .avatar { width: 40px; height: 40px; font: var(--t-body-strong); }
  .chathead .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .chathead .n1 { font: var(--t-headline); color: var(--ink); white-space: nowrap; }
  .chathead .n2 { font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; }
  .share-what { margin-top: var(--s3); display: flex; flex-direction: column; }
  .share-what .row { min-height: 44px; }
  .share-what .row .ic { width: 32px; height: 32px; }
  .share-what .row .ic svg { width: 16px; height: 16px; }
  /* ── p1p2 states ── */
  /* carStale (DriverCard.tsx): a warn Tag, the car drawn faded at its last fix; the network itself is fine (no banner). */
  .tagp.warn { background: var(--warn-soft); color: #94430A; } /* 5.9:1, as rider-history's warn tag */
  :root[data-theme="dark"] .tagp.warn { color: var(--warn); }
  /* SOS sheet (drawn ahead): 112 is the one red action; the dispatcher alert and the share are quiet rows under it. */
  .sos-where { display: flex; gap: var(--s3); align-items: center; padding: var(--s3) var(--s4); border-radius: var(--r-card); background: var(--surface-2); }
  .sos-where svg { width: 20px; height: 20px; color: var(--ink-2); flex: none; }
  .sos-where .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .sos-where .t1 { font: var(--t-body-strong); color: var(--ink); white-space: nowrap; }
  .sos-where .t2 { font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .sos-rows { margin-top: var(--s2); display: flex; flex-direction: column; }
  .sos-rows .row { min-height: 56px; width: 100%; text-align: left; }
  .modal .btn-danger.sos112 { margin-top: var(--s4); }
  .sos-rows .ic.sos-d { color: var(--danger); }
  /* destination changed by the dispatcher: the old fare struck, the new one in ink */
  .requote { display: flex; align-items: baseline; gap: var(--s2); margin-top: var(--s1); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .requote s { font: var(--t-secondary); color: var(--ink-2); }
  .requote b { font: var(--t-body-strong); color: var(--ink); }
</style>
</head>
<body>
<script>
  const P = ROUTES.driverToPickup.pts, T = ROUTES.pickupToDrop.pts
  const PICK = T[0], DROP = T[T.length - 1]
  /* heading in degrees clockwise from north, between two [lat,lng] points */
  const brg = (a, b) => Math.atan2((b[1] - a[1]) * Math.cos(a[0] * Math.PI / 180), b[0] - a[0]) * 180 / Math.PI
  const at = (pts, f) => { const i = Math.min(pts.length - 2, Math.floor(f * (pts.length - 1))); return { i, ll: pts[i], deg: brg(pts[i], pts[i + 1]) } }
  const star = R.i('star')

  /* The one ride (kit.js ECO.RIDE): assigned 9:41, pickup 9:45, drop 9:51; Արամ Պետրոսյան, 01 ET 001. */
  const RD = ECO.RIDE, DV = RD.driver
  const SU = ECO.BOOKINGS.air.driver
  /* The SOS moment (owner #2): ECO.SOS, the same alert the console raises on Dispatch. Fallback if kit.js predates it. */
  const SOS = ECO.SOS || { at: '9:47', where: 'Մաշտոցի պող. 18', near: 'Մատենադարանից 300 մ' }
  const identity = (d = DV) => `<div class="ident"><div class="who">${R.plate(d.plate, true)}<span class="model">${d.carHy || d.car}</span></div>${R.car('city', 120, 60, d.car)}</div>`
  const face = (d) => d === DV ? R.avatar() : `<span class="avatar ini" role="img" aria-label="Վարորդ՝ ${d.name}">${d.ini}</span>`
  const driver = (d = DV) => `<div class="drv">${face(d)}<span class="nm"><span class="n1">${d.first}</span><span class="n2">${star}${d.rating}${d === DV ? ' · ' + ECO.num(1240) + ' ուղևորություն' : ''}</span></span></div>`
  const acts = (list) => `<div class="acts">${list.map(([ic, l, c]) => `<button class="act ${c || ''}" aria-label="${l}"><span class="o">${R.i(ic)}</span><span class="l">${l}</span></button>`).join('')}</div>`
  const A_WAIT = [['phone', 'Զանգել'], ['message-circle', 'Գրել'], ['share-2', 'Կիսվել'], ['x', 'Չեղարկել', 'danger']]

  /* o: { d: driver, pre: pill above the ETA, tags: under the status, after: under the actions } */
  const approachSheet = (eta, status, clock, o = {}) => `<div class="map" id="map" aria-label="Քարտեզ"></div>
    <button class="fab" style="top:62px;left:16px" aria-label="Հետ">${R.i('chevron-down')}</button>
    <section class="sheet r" id="sheet"><div class="grabber"></div>
      ${o.pre ? `<div class="tags" style="margin:0 0 var(--s2)">${o.pre}</div>` : ''}
      <div class="head2"><div><div class="eta">${eta}</div><div class="status">${status}${clock ? ` · <b>${clock}</b>` : ''}</div></div></div>
      ${o.tags ? `<div class="tags">${o.tags}</div>` : ''}${o.cap ? `<div class="cap">${o.cap}</div>` : ''}
      ${identity(o.d)}${driver(o.d)}${acts(A_WAIT)}${o.after || ''}</section>`
  const preTag = (t) => `<span class="tagp pre">${R.i('calendar-clock')}Նախնական պատվեր · ${t}-ին</span>`
  const payrow = (card) => `<button class="payrow" aria-label="Փոխել վճարման եղանակը">${card ? R.i('wallet') : `<span class="cashc" style="display:contents">${R.i('banknote')}</span>`}<span class="t">${card ? 'Քարտ ·· 4242' : 'Կանխիկ'} · ${ECO.amd(1100)}</span><span class="ch">Փոխել</span></button>`
  const notice = (body, icon = 'info') => `<div class="notice" role="status">${R.i(icon)}<span>${body}</span></div>`

  /* Approach map: the driver's dotted line to the pickup, our car on it, the pickup pin. frac = how far along the car is. */
  const approachMap = (frac) => (s) => {
    const k = at(P, frac), rest = P.slice(k.i)
    const m = R.map(s, { fit: rest.length > 6 ? rest : R.bbox(PICK, .0022, .003), padTL: [64, 132], padBR: [64, s.querySelector('#sheet').offsetHeight + 56] })
    drawRoute(m, rest, { dash: true, color: cssVar('--approach'), weight: 4 })
    htmlMarker(m, PICK, '<div class="pin-a"></div>', [18, 18])
    htmlMarker(m, PICK, `<div class="maptag plain" data-overlay style="position:absolute;right:16px;top:-18px">${RD.pickup}</div>`, [0, 0], [0, 0])
    htmlMarker(m, k.ll, carTop(k.deg), [18, 34])
    return m
  }
  /* A booking's pickup is Կոմիտասի պող. 22 (ECO.BOOKINGS.air/co): the car comes in along the last stretch of pickupToDrop. */
  const toBooking = (frac, label) => (s) => {
    const k = at(T, frac), rest = T.slice(k.i)
    const m = R.map(s, { fit: rest, padTL: [64, 132], padBR: [64, s.querySelector('#sheet').offsetHeight + 56] })
    drawRoute(m, rest, { dash: true, color: cssVar('--approach'), weight: 4 })
    htmlMarker(m, DROP, '<div class="pin-a"></div>', [18, 18])
    htmlMarker(m, DROP, `<div class="maptag plain" data-overlay style="position:absolute;right:16px;top:-18px">${label}</div>`, [0, 0], [0, 0])
    htmlMarker(m, k.ll, carTop(k.deg), [18, 34])
  }
  const modal = (title, body, base = 'assigned') => ({ html: () => `<div class="map" id="map" aria-label="Քարտեզ"></div><div class="scrim"></div>
      <section class="sheet r modal" id="sheet" role="dialog" aria-label="${title}"><div class="grabber"></div>
      <div class="mhead"><h2 class="h-title">${title}</h2><button class="xbtn" aria-label="Փակել">${R.i('x')}</button></div>${body}</section>`,
    map: approachMap(.35) })

  
  Rider.page({
    title: 'Rider · On the way and in the ride',
    sub: 'Live 2GIS map; ETA is the one hero number; the plate chip carries the identity. Same ride as the driver offer and the console (kit.js ECO.RIDE): Eco City, Մաշտոցի 37 → Կոմիտասի 22, 9:41 → 9:45 → 9:51, 1 100 ֏',
    states: [
      { id: 'assigned', group: 'Before pickup', label: 'Assigned', note: 'ETA hero, plate first, then car, then driver. Cancel is visible, not buried',
        time: RD.assigned, html: () => approachSheet(RD.approachMin + ' րոպե', 'Մեքենան ճանապարհին է', RD.pickupAt), map: approachMap(0) },
      { id: 'arriving', group: 'Before pickup', label: 'Arriving', note: 'One minute out: the same card, the car at the corner',
        time: '9:44', html: () => approachSheet('1 րոպե', 'Մեքենան մոտենում է', RD.pickupAt), map: approachMap(.8) },
      { id: 'arrived', group: 'Before pickup', label: 'Arrived', note: 'The plate grows; free waiting counts down. Haptic + push on entry',
        time: RD.pickupAt, html: () => `<div class="map" id="map" aria-label="Քարտեզ"></div>
          <button class="fab" style="top:62px;left:16px" aria-label="Հետ">${R.i('chevron-down')}</button>
          <section class="sheet r" id="sheet"><div class="grabber"></div>
            <h2 class="arr-title">Մեքենան սպասում է</h2>
            <div class="wait">${R.i('timer')}Անվճար սպասում · 2:41</div>
            <div class="bigid"><div class="who">${R.plate(DV.plate, true)}<span class="model" style="font:var(--t-secondary);color:var(--ink-2)">Սպիտակ ${DV.car}</span></div>${R.car('city', 132, 66, DV.car)}</div>
            ${driver()}${acts(A_WAIT)}</section>`,
        map: (s) => {
          const m = R.map(s, { fit: R.bbox(PICK, .0016, .0022), padTL: [48, 120], padBR: [48, s.querySelector('#sheet').offsetHeight + 40] })
          htmlMarker(m, PICK, '<div class="puck"></div>', [22, 22])
          const k = at(P, .97); htmlMarker(m, [PICK[0] - .00018, PICK[1] - .00028], carTop(k.deg), [18, 34])
        } },
      { id: 'riding', group: 'In the ride', label: 'Riding', note: 'Cancel is gone; share and help stay one tap away. 9:47, 4 min left, arriving 9:51 (the one ride)',
        time: RD.riding.clock, html: () => `<div class="map" id="map" aria-label="Քարտեզ"></div>
          <button class="fab" style="top:62px;left:16px" aria-label="Հետ">${R.i('chevron-down')}</button>
          <button class="fab" style="top:62px;right:16px" aria-label="Անվտանգություն">${R.i('shield')}</button>
          <section class="sheet r" id="sheet"><div class="grabber"></div>
            <div class="head2"><div><div class="eta">${RD.riding.left} րոպե</div><div class="status">Ճանապարհին · ժամանում <b>${RD.dropAt}</b></div></div></div>
            <div class="trip"><span class="sq"></span><span class="to"><span class="t1">${RD.drop}</span><span class="t2">${ECO.km(2.8)} մնաց</span></span></div>
            <div class="mini">${R.car('city', 64, 32, '')}${R.plate(DV.plate)}<span class="nm">${DV.first}</span></div>
            ${payrow(false)}
            ${acts([['share-2', 'Կիսվել', 'on'], ['phone', 'Զանգել'], ['message-circle', 'Գրել'], ['life-buoy', 'Օգնություն']])}</section>`,
        map: (s) => {
          const k = at(T, .35), rest = T.slice(k.i)
