<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Rider trip complete</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="rider.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="mapgl.local.js"></script>
<script src="kit.js"></script>
<script src="routes.js"></script>
<script src="audit.js"></script>
<script src="rider.js"></script>
<style>
  /* Fare first, then the stars. Dismissable at every step: rating never blocks the next booking. */
  .body { flex: 1; min-height: 0; padding: 0 var(--margin); display: flex; flex-direction: column; }
  .trip { display: flex; gap: var(--s4); align-items: center; margin-top: var(--s1); }
  .trip .trace { flex: none; }
  .stops { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--s3); position: relative; }
  .stops::before { content: ''; position: absolute; left: 7.25px; top: 17px; bottom: 30px; width: 1.5px; background: var(--ink-3); }
  .st { display: flex; gap: var(--s3); align-items: flex-start; }
  .st .m { width: 16px; height: 22px; display: grid; place-items: center; flex: none; }
  .st .dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 3px var(--ink); }
  .st .sq { width: 10px; height: 10px; border-radius: 2px; background: var(--ink); }
  .st .tx { display: flex; flex-direction: column; min-width: 0; }
  .st .t1 { font: var(--t-body-strong); color: var(--ink); white-space: nowrap; }
  .st .t2 { font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .fare { display: flex; align-items: center; justify-content: space-between; margin-top: var(--s5); }
  .fare .n { font: var(--t-hero); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.4px; }
  .paid { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r-pill); background: var(--surface-2);
    font: var(--t-secondary-strong); color: var(--ink); white-space: nowrap; }
  .paid svg { width: 16px; height: 16px; color: var(--ok); }
  .bd { margin-top: var(--s3); border-radius: var(--r-card); background: var(--surface-2); padding: var(--s1) var(--s4); }
  .bd .l { display: flex; justify-content: space-between; align-items: center; min-height: 34px; font: var(--t-body); color: var(--ink-2); white-space: nowrap; }
  .bd .l span:last-child { color: var(--ink); font-variant-numeric: tabular-nums; }
  .bd .l.tot { border-top: 1px solid var(--hairline); margin-top: var(--s1); min-height: 40px; }
  .bd .l.tot span { font: var(--t-body-strong); color: var(--ink); }
  .paid.co svg { color: var(--ink-2); }
  .billed { display: flex; align-items: center; gap: var(--s2); margin-top: var(--s2); font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; }
  .billed svg { width: 16px; height: 16px; flex: none; }
  .bdrow { display: flex; align-items: center; justify-content: space-between; min-height: 44px; margin-top: var(--s2); font: var(--t-body); color: var(--ink-2); width: 100%; white-space: nowrap; }
  .bdrow svg { width: 20px; height: 20px; color: var(--ink-3); }
  .who { display: flex; align-items: center; gap: var(--s3); margin-top: var(--s5); }
  .who .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .who .n1 { font: var(--t-headline); color: var(--ink); white-space: nowrap; }
  .who .n2 { font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ask { font: var(--t-body-strong); color: var(--ink); margin-top: var(--s4); text-align: center; }
  .stars { display: flex; justify-content: center; gap: var(--s1); margin-top: var(--s2); }
  .stars button { width: 52px; height: 52px; display: grid; place-items: center; color: var(--ink-3); }
  .stars button svg { width: 36px; height: 36px; stroke-width: 1.5; }
  .stars button.on { color: var(--ink); }
  .stars button.on svg { fill: currentColor; }
  .q { font: var(--t-secondary-strong); color: var(--ink-2); margin: var(--s4) 0 var(--s2); }
  .chips { justify-content: center; }
  .foot { flex: none; padding: var(--s3) var(--margin) 34px; display: flex; flex-direction: column; gap: var(--s2); }
  .btn-text { height: 44px; font: var(--t-body-strong); color: var(--ink-2); }

  .thanks { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: var(--s3); }
  .thanks .ok { width: 72px; height: 72px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-ink); display: grid; place-items: center; }
  .thanks .ok svg { width: 34px; height: 34px; stroke-width: 2; }
  .thanks .large { padding: 0; }
  .thanks .sum { font: var(--t-body); color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* Fiscal receipt (R58, drawn ahead): the tax receipt as the state issues it, set as a paper card on the ground —
     seller, TIN, device, number and time, the one service line, total and method, and the verification QR. */
  .fis { margin-top: var(--s2); background: var(--surface); border-radius: var(--r-card); box-shadow: var(--e1); padding: var(--s4); display: flex; flex-direction: column; }
  .page.on-surface .fis { background: var(--surface-2); box-shadow: none; }
  .fis .seller { font: var(--t-body-strong); color: var(--ink); text-align: center; }
  .fis .meta { display: flex; flex-direction: column; margin-top: var(--s2); }
  .fis .m { display: flex; justify-content: space-between; gap: var(--s3); min-height: 24px; font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; }
  .fis .m b { font: var(--t-secondary-strong); color: var(--ink); font-variant-numeric: tabular-nums; }
  .fis .cut { border-top: 1.5px dashed var(--ink-3); margin: var(--s3) 0; opacity: .7; }
  .fis .item { display: flex; justify-content: space-between; gap: var(--s3); font: var(--t-body); color: var(--ink); }
  .fis .item span:last-child, .fis .tot span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fis .item small { display: block; font: var(--t-secondary); color: var(--ink-2); }
  .fis .tot { display: flex; justify-content: space-between; font: var(--t-headline); color: var(--ink); margin-top: var(--s2); }
  .fis .qr { display: flex; gap: var(--s3); align-items: center; margin-top: var(--s2); }
  .fis .qr svg { flex: none; background: #fff; border-radius: 6px; padding: 6px; }
  .fis .qr span { font: var(--t-secondary); color: var(--ink-2); }
</style>
</head>
<body>
<script>
  const S = R.i('star')
  const nav = `<nav class="nav"><span class="navend"></span><span class="navttl">Ուղևորությունն ավարտված է</span><button class="navbtn" aria-label="Փակել">${R.i('x')}</button></nav>`
  /* The one ride (kit.js ECO.RIDE): picked up 9:45, dropped 9:51, 4,3 km, 6 min, 1 100 ֏. */
  const RD = ECO.RIDE, DV = RD.driver, C = ECO.COMPANY
  /* pay: 'cash' or 'company' — a company ride names the company where the method would be (receipt.tsx). */
  const paidChip = (pay) => pay === 'company'
    ? `<span class="paid co">${R.i('building-2')}${C.short}</span>`
    : `<span class="paid">${R.i('banknote')}${ECO.PAY.cash.label}</span>`
  const tripHead = (pay = 'cash') => `<div class="trip">${R.trace('pickupToDrop', 96, 96, { pad: 14, sw: 3.5, r: 4.5, grid: false })}
    <div class="stops"><div class="st"><span class="m"><span class="dot"></span></span><span class="tx"><span class="t1">${RD.pickup}</span><span class="t2">${RD.pickupAt}</span></span></div>
      <div class="st"><span class="m"><span class="sq"></span></span><span class="tx"><span class="t1">${RD.drop}</span><span class="t2">${RD.dropAt} · ${ECO.km(RD.km)} · ${RD.min} րոպե</span></span></div></div></div>
    <div class="fare"><span class="n">${R.amd(RD.fare)}</span>${paidChip(pay)}</div>`
  /* Eco City, fixed_upfront: 600 + 90·4,3 + 12·6 = 1 059 → rounded to 100 ֏. Line names are the app's fare.* strings. */
  const breakdown = (pay = 'cash') => `<div class="bd" aria-label="Վճարի մանրամասները">
    <div class="l"><span>Նստելու վճար</span><span>${R.amd(600)}</span></div>
    <div class="l"><span>Ըստ կիլոմետրի · ${ECO.km(RD.km)}</span><span>${R.amd(387)}</span></div>
    <div class="l"><span>Ըստ րոպեի · ${RD.min} րոպե</span><span>${R.amd(72)}</span></div>
    <div class="l"><span>Կլորացում</span><span>+${R.amd(41)}</span></div>
    <div class="l tot"><span>Ընդամենը</span><span>${R.amd(RD.fare)}</span></div></div>
    ${pay === 'company' ? `<div class="billed">${R.i('building-2')}<span>Վճարում է՝ ${C.name}</span></div>` : ''}`
  const collapsed = `<button class="bdrow"><span>Վճարի մանրամասները</span>${R.i('chevron-down')}</button>`
  const who = `<div class="who">${R.avatar()}<span class="nm"><span class="n1">${DV.first}</span><span class="n2">${DV.car} · ${DV.plate}</span></span></div>`
  const stars = (n) => `<div class="stars" role="radiogroup" aria-label="Գնահատեք վարորդին">${[1, 2, 3, 4, 5].map((i) =>
    `<button class="${i <= n ? 'on' : ''}" role="radio" aria-checked="${i === n}" aria-label="${i} աստղ">${S}</button>`).join('')}</div>`
  const chips = (list, on) => `<div class="chips">${list.map((c, i) => `<button class="chip tog" aria-pressed="${on.includes(i)}">${c}</button>`).join('')}</div>`
  /* A stand-in QR: a seeded 25×25 module grid with the three finder squares (not a real code). Always dark on white. */
  const qr = () => {
    let x = 2417, d = ''
    const rnd = () => ((x = (x * 1103515245 + 12345) % 2147483648) / 2147483648)
    const fin = (r, c) => [[0, 0], [0, 18], [18, 0]].some(([a, b]) => r >= a && r < a + 7 && c >= b && c < b + 7)
    for (let r = 0; r < 25; r++) for (let c = 0; c < 25; c++) if (!fin(r, c) && rnd() > .52) d += `M${c * 3} ${r * 3}h3v3h-3z`
    const f = (a, b) => `M${b * 3} ${a * 3}h21v21h-21zM${b * 3 + 3} ${a * 3 + 3}v15h15v-15zM${b * 3 + 6} ${a * 3 + 6}h9v9h-9z`
    return `<svg width="88" height="88" viewBox="0 0 75 75" aria-hidden="true"><path fill="#111113" fill-rule="evenodd" d="${d}${f(0, 0)}${f(0, 18)}${f(18, 0)}"/></svg>`
  }
  const page = (body, foot) => `<div class="page on-surface">${nav}<div class="body">${body}</div><div class="foot">${foot}</div></div>`

  Rider.page({
    title: 'Rider · Trip complete',
    sub: 'The fare is the hero, broken down from the real Eco City tariff. Stars, then compliments or a reason. Close is always there',
    states: [
      { id: 'rate', label: 'Fare + rate', time: '9:51', note: 'Base 600 + 4,3 km × 90 + 6 min × 12 = 1 059, rounded to 1 100 ֏ (fixed upfront). «Ուղարկել» is pinned, disabled until a star is chosen, so the layout does not jump',
        html: () => page(`${tripHead()}${breakdown()}${who}<div class="ask">Գնահատեք վարորդին</div>${stars(0)}`,
          '<button class="btn" disabled>Ուղարկել</button><button class="btn-text">Բաց թողնել</button>') },
      { id: 'company', label: 'Company ride', time: '9:51', note: 'Billed to the rider\'s company (receipt.tsx): «Վճարում է՝ …» stands where the method would; never a balance or a limit. Nothing is paid to the driver',
        html: () => page(`${tripHead('company')}${breakdown('company')}${who}<div class="ask">Գնահատեք վարորդին</div>${stars(0)}`,
          '<button class="btn" disabled>Ուղարկել</button><button class="btn-text">Բաց թողնել</button>') },
      { id: 'rated', label: 'Five stars', note: 'Compliments are optional; two picked',
        html: () => page(`${tripHead()}${collapsed}${who}${stars(5)}<div class="q" style="text-align:center">Ի՞նչը դուր եկավ</div>
          ${chips(['Մաքուր մեքենա', 'Զգույշ վարում', 'Հաճելի զրույց', 'Ճշտապահ', 'Լավ երաժշտություն'], [0, 1])}`,
          '<button class="btn btn-brand">Ուղարկել</button><button class="btn-text">Բաց թողնել</button>') },
      { id: 'low', label: 'Low rating', note: 'Under five: what went wrong, one tap each. Goes to the dispatcher, not only to a score',
        html: () => page(`${tripHead()}${collapsed}${who}${stars(3)}<div class="q" style="text-align:center">Ի՞նչը չստացվեց</div>
          ${chips(['Ուշացավ', 'Անզգույշ վարում', 'Մեքենան մաքուր չէր', 'Երկար երթուղի', 'Անհարմար զրույց'], [1])}`,
          '<button class="btn btn-brand">Ուղարկել</button><button class="btn-text">Բաց թողնել</button>') },
      { id: 'fiscal', label: 'Fiscal receipt', time: '9:52', note: 'R58, drawn ahead (no fiscal API yet; the console\'s «Ֆիսկալ հերթ» holds the ones that failed to issue). Reached from «Ստացական» on Thanks and from the History receipt. The receipt as issued (ECO.FISCAL): seller, ՀՎՀՀ, ՀԴՄ, number, time, the one service line, total, method and the tax office\'s QR. Share sends the PDF (system share sheet); nothing else on screen (new strings)',
        html: () => `<div class="page">${nav.replace('Ուղևորությունն ավարտված է', 'Ֆիսկալ կտրոն').replace('aria-label="Փակել">' + R.i('x'), 'aria-label="Փակել">' + R.i('x'))}<div class="body">
          <div class="fis" aria-label="Ֆիսկալ կտրոն">
            <div class="seller">${ECO.FISCAL.seller}</div>
            <div class="meta">
              <div class="m"><span>ՀՎՀՀ</span><b>${ECO.FISCAL.tin}</b></div>
              <div class="m"><span>Սարք</span><b>${ECO.FISCAL.device}</b></div>
              <div class="m"><span>Կտրոն №</span><b>${ECO.FISCAL.no}</b></div>
              <div class="m"><span>Ամսաթիվ</span><b>${ECO.FISCAL.at}</b></div>
            </div>
            <div class="cut"></div>
            <div class="item"><span>Տաքսու ծառայություն<small>${RD.tier} · R-${RD.no} · ${ECO.km(RD.km)}</small></span><span>${R.amd(RD.fare)}</span></div>
            <div class="cut"></div>
            <div class="tot"><span>Ընդամենը</span><span>${R.amd(RD.fare)}</span></div>
            <div class="m" style="margin-top:var(--s1)"><span>${ECO.PAY.cash.label}</span><b>${R.amd(RD.fare)}</b></div>
            <div class="qr">${qr()}<span>Ստուգեք կտրոնը ՊԵԿ կայքում</span></div>
          </div></div>
          <div class="foot"><button class="btn btn-brand">${R.i('share')}Կիսվել</button><button class="btn btn-quiet">${R.i('download')}Պահել PDF</button></div></div>` },
      { id: 'thanks', label: 'Thanks', note: 'Calm close; the next ride is one tap',
        html: () => page(`<div class="thanks"><span class="ok">${R.i('check')}</span><h1 class="large">Շնորհակալություն</h1>
          <span class="sum">${R.amd(RD.fare)} · ${ECO.PAY.cash.label} · ${DV.first}</span></div>`,
          `<button class="btn btn-brand">Պատվիրել մեքենա</button><button class="btn btn-quiet">${R.i('receipt')}Ստացական</button>`) },
    ],
  })
</script>
</body>
</html>
