<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Rider trip complete</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="rider.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="mapgl.local.js"></script>
<script src="kit.js"></script>
<script src="routes.js"></script>
<script src="audit.js"></script>
<script src="rider.js"></script>
<style>
  /* Fare first, then the stars. Dismissable at every step: rating never blocks the next booking. */
  .body { flex: 1; min-height: 0; padding: 0 var(--margin); display: flex; flex-direction: column; }
  .trip { display: flex; gap: var(--s4); align-items: center; margin-top: var(--s1); }
  .trip .trace { flex: none; }
  .stops { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--s3); position: relative; }
  .stops::before { content: ''; position: absolute; left: 7.25px; top: 17px; bottom: 30px; width: 1.5px; background: var(--ink-3); }
  .st { display: flex; gap: var(--s3); align-items: flex-start; }
  .st .m { width: 16px; height: 22px; display: grid; place-items: center; flex: none; }
  .st .dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 3px var(--ink); }
  .st .sq { width: 10px; height: 10px; border-radius: 2px; background: var(--ink); }
  .st .tx { display: flex; flex-direction: column; min-width: 0; }
  .st .t1 { font: var(--t-body-strong); color: var(--ink); white-space: nowrap; }
  .st .t2 { font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .fare { display: flex; align-items: center; justify-content: space-between; margin-top: var(--s5); }
  .fare .n { font: var(--t-hero); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.4px; }
  .paid { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r-pill); background: var(--surface-2);
    font: var(--t-secondary-strong); color: var(--ink); white-space: nowrap; }
  .paid svg { width: 16px; height: 16px; color: var(--ok); }
  .bd { margin-top: var(--s3); border-radius: var(--r-card); background: var(--surface-2); padding: var(--s1) var(--s4); }
  .bd .l { display: flex; justify-content: space-between; align-items: center; min-height: 32px; /* 34 → 32: the fee line (2026-10-15) must not push the stars under the foot */ font: var(--t-body); color: var(--ink-2); white-space: nowrap; }
  .bd .l span:last-child { color: var(--ink); font-variant-numeric: tabular-nums; }
  .bd .l.tot { border-top: 1px solid var(--hairline); margin-top: var(--s1); min-height: 40px; }
  .bd .l.tot span { font: var(--t-body-strong); color: var(--ink); }
  .paid.co svg { color: var(--ink-2); }
  .billed { display: flex; align-items: center; gap: var(--s2); margin-top: var(--s2); font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; }
  .billed svg { width: 16px; height: 16px; flex: none; }
  .billed + .billed { margin-top: var(--s1); }
  .bdrow { display: flex; align-items: center; justify-content: space-between; min-height: 44px; margin-top: var(--s2); font: var(--t-body); color: var(--ink-2); width: 100%; white-space: nowrap; }
  .bdrow svg { width: 20px; height: 20px; color: var(--ink-3); }
  .who { display: flex; align-items: center; gap: var(--s3); margin-top: var(--s5); }
  .who .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .who .n1 { font: var(--t-headline); color: var(--ink); white-space: nowrap; }
  .who .n2 { font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ask { font: var(--t-body-strong); color: var(--ink); margin-top: var(--s4); text-align: center; }
  .stars { display: flex; justify-content: center; gap: var(--s1); margin-top: var(--s2); }
  .stars button { width: 52px; height: 52px; display: grid; place-items: center; color: var(--ink-3); }
  .stars button svg { width: 36px; height: 36px; stroke-width: 1.5; }
  .stars button.on { color: var(--ink); }
  .stars button.on svg { fill: currentColor; }
  .q { font: var(--t-secondary-strong); color: var(--ink-2); margin: var(--s4) 0 var(--s2); }
  .chips { justify-content: center; }
  .foot { flex: none; padding: var(--s3) var(--margin) 34px; display: flex; flex-direction: column; gap: var(--s2); }
  .btn-text { height: 44px; font: var(--t-body-strong); color: var(--ink-2); }

  .thanks { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: var(--s3); }
  .thanks .ok { width: 72px; height: 72px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-ink); display: grid; place-items: center; }
  .thanks .ok svg { width: 34px; height: 34px; stroke-width: 2; }
  .thanks .large { padding: 0; }
  .thanks { padding-bottom: var(--s8); } /* UX audit 2026-10-16: the block sits at the optical centre, above the middle of the free space */
  .recap { align-self: stretch; margin-top: var(--s3); padding: var(--s4); border-radius: var(--r-card); background: var(--surface-2); text-align: left; display: flex; flex-direction: column; gap: var(--s3); }
  .recap .trip { margin: 0; }
  .recap .stops::before { top: 16px; bottom: 16px; }
  .recap .rsum { display: flex; justify-content: space-between; gap: var(--s3); border-top: 1px solid var(--hairline); padding-top: var(--s3); }
  .recap .rsum b { font: var(--t-body-strong); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .recap .rsum span { font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; }
  /* Peak-End (2026-10-16): a 5 ★ rating goes on the tap; this bar is the short undo window (the foot is the only thing that changes). */
  .undo { position: relative; display: flex; align-items: center; justify-content: space-between; gap: var(--s3); min-height: 52px; padding: 0 var(--s2) 0 var(--s4); border-radius: var(--r-control); background: var(--surface-2); overflow: hidden; }
  .undo .un { font: var(--t-body); color: var(--ink); white-space: nowrap; display: inline-flex; align-items: center; gap: var(--s2); }
  .undo .un svg { width: 18px; height: 18px; color: var(--ok); }
  .undo .btn-text { width: auto; padding: 0 var(--s3); color: var(--ink); }
  .undo .cd { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--ink); transform-origin: left; animation: cd 4s linear forwards; }
  @keyframes cd { to { transform: scaleX(0); } }
  @media (prefers-reduced-motion: reduce) { .undo .cd { animation: none; width: 40%; } }
  .thanks .sum { font: var(--t-body); color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* Fiscal receipt (R58, drawn ahead): the tax receipt as the state issues it, set as a paper card on the ground —
     seller, TIN, device, number and time, the one service line, total and method, and the verification QR. */
  .fis { margin-top: var(--s2); background: var(--surface); border-radius: var(--r-card); box-shadow: var(--e1); padding: var(--s4); display: flex; flex-direction: column; }
  .page.on-surface .fis { background: var(--surface-2); box-shadow: none; }
  .fis .seller { font: var(--t-body-strong); color: var(--ink); text-align: center; }
  .fis .meta { display: flex; flex-direction: column; margin-top: var(--s2); }
  .fis .m { display: flex; justify-content: space-between; gap: var(--s3); min-height: 24px; font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; }
  .fis .m b { font: var(--t-secondary-strong); color: var(--ink); font-variant-numeric: tabular-nums; }
  .fis .cut { border-top: 1.5px dashed var(--ink-3); margin: var(--s3) 0; opacity: .7; }
  .fis .item { display: flex; justify-content: space-between; gap: var(--s3); font: var(--t-body); color: var(--ink); }
  .fis .item span:last-child, .fis .tot span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fis .item small { display: block; font: var(--t-secondary); color: var(--ink-2); }
  .fis .tot { display: flex; justify-content: space-between; font: var(--t-headline); color: var(--ink); margin-top: var(--s2); }
  .fis .qr { display: flex; gap: var(--s3); align-items: center; margin-top: var(--s2); }
  .fis .qr svg { flex: none; background: #fff; border-radius: 6px; padding: 6px; }
  .fis .qr span { font: var(--t-secondary); color: var(--ink-2); }
  /* Cash, before ETAPI files it (24 h hold): the number is a promise with a time, never an error. */
  .fis .m .pend { display: inline-flex; align-items: center; gap: 6px; font: var(--t-secondary-strong); color: var(--ink-2); }
  .fis .m .pend svg { width: 16px; height: 16px; }
  .fis .wait { display: flex; gap: var(--s3); align-items: flex-start; margin-top: var(--s3); padding: var(--s3); border-radius: 12px; background: var(--surface-2); }
  .page.on-surface .fis .wait { background: var(--surface); }
  .fis .wait svg { width: 20px; height: 20px; flex: none; color: var(--ink-2); margin-top: 1px; }
  .fis .wait b { display: block; font: var(--t-body-strong); color: var(--ink); }
  .fis .wait span { font: var(--t-secondary); color: var(--ink-2); }
  /* Card declined (owner 2026-10-15: the iPay / ArCa gateway can refuse): amber, not red — the ride is fine, one step is left. */
  .decl { display: flex; gap: var(--s3); align-items: flex-start; margin-top: var(--s4); padding: var(--s3) var(--s4); border-radius: var(--r-card); background: var(--warn-soft); }
  .decl svg { width: 20px; height: 20px; flex: none; color: var(--warn); margin-top: 1px; }
  .decl b { display: block; font: var(--t-body-strong); color: var(--ink); }
  .decl span { font: var(--t-secondary); color: var(--ink); }
  .paid.due svg { color: var(--warn); }
  /* NFC waiting (owner 2026-10-16): not a failure, so the neutral ground, same block shape as .decl. */
  .decl.wait { background: var(--surface-2); } .decl.wait svg { color: var(--ink-2); }
  .page.on-surface .paylist .choice .ico { background: var(--surface); }
  .paylist { margin-top: var(--s2); }
  .paylist .choice { min-height: 56px; }
  .paylist .choice .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; flex: none; }
  .paylist .choice .ico svg { width: 20px; height: 20px; } .paylist .choice .ico.cashc { color: var(--ok); }
  .paylist .choice .t2 { display: block; font: var(--t-caption); color: var(--ink-2); }
  .paylist .choice[aria-disabled="true"] .t, .paylist .choice[aria-disabled="true"] .ico { color: var(--ink-3); }
  .paylist .choice[aria-disabled="true"] .radio { opacity: .4; }
  .paylist > .divider:last-of-type, .paylist > .choice:last-child { display: none; } /* no «Ավելացնել քարտ» mid-recovery */
  /* Below the Tax Service receipt: what it covers, said once (it is the driver's fare; the service fee is ours). */
  .fisnote { display: flex; gap: var(--s2); align-items: flex-start; margin-top: var(--s3); font: var(--t-secondary); color: var(--ink-2); }
  .fisnote svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
  .bd .l.promo span:first-child { display: inline-flex; align-items: center; gap: 6px; }
  .bd .l.promo svg { width: 16px; height: 16px; }
  .bd .l.promo span { color: var(--brand-ink, var(--brand)); }
</style>
</head>
<body>
<script>
  const S = R.i('star')
  const LOW = (ECO.DISPATCH && ECO.DISPATCH.lowRating && ECO.DISPATCH.lowRating.max) || 3 /* the top of the low band: 3 ★ */
  const nav = `<nav class="nav"><span class="navend"></span><span class="navttl">Ուղևորությունն ավարտված է</span><button class="navbtn" aria-label="Փակել">${R.i('x')}</button></nav>`
  /* The one ride (kit.js ECO.RIDE): picked up 9:45, dropped 9:51, 4,3 km, 6 min, 1 100 ֏. */
  const RD = ECO.RIDE, DV = RD.driver, C = ECO.COMPANY
  /* pay: 'cash' or 'company' — a company ride names the company where the method would be (receipt.tsx). */
  const paidChip = (pay) => pay === 'company'
    ? `<span class="paid co">${R.i('building-2')}${C.short}</span>`
    : pay === 'card' ? `<span class="paid">${R.i('credit-card')}·· ${ECO.PAY.card.last4}</span>`
    : pay === 'nfc' ? `<span class="paid">${R.i('smartphone-nfc')}${ECO.PAY.nfc.label}</span>`
    : `<span class="paid">${R.i('banknote')}${ECO.PAY.cash.label}</span>`
  const PA = ECO.PROMO.applied /* change list 2026-10-14: AUTUMN15 on this ride, 1 100 → 935 ֏ */
  /* Owner 2026-10-15 (final): the service fee is the fleet's, +2 % on the final fare when paid by bank card (card, Apple Pay,
     Google Pay, NFC); cash and company rides carry none. Card on the walkthrough: 1 100 + 22 = 1 122 ֏. Never on the Tax Service receipt. */
  const fee = (pay, f = RD.fare) => ['card', 'applepay', 'googlepay', 'nfc'].includes(pay) ? Math.round(f * 2 / 100) : 0
  const CARD = ECO.PAY.card
  const tripHead = (pay = 'cash', promo) => `<div class="trip">${R.trace('pickupToDrop', 96, 96, { pad: 14, sw: 3.5, r: 4.5, grid: false })}
    <div class="stops"><div class="st"><span class="m"><span class="dot"></span></span><span class="tx"><span class="t1">${RD.pickup}</span><span class="t2">${RD.pickupAt}</span></span></div>
      <div class="st"><span class="m"><span class="sq"></span></span><span class="tx"><span class="t1">${RD.drop}</span><span class="t2">${RD.dropAt} · ${ECO.km(RD.km)} · ${RD.min} րոպե</span></span></div></div></div>
    <div class="fare"><span class="n">${R.amd((promo ? PA.pay : RD.fare) + fee(pay))}</span>${paidChip(pay)}</div>`
  const billedTo = `<div class="billed">${R.i('building-2')}<span>Վճարում է՝ ${C.name}</span></div>
      <div class="billed">${R.i('file-text')}<span>Ընկերության ամսական հաշվետվությունում</span></div>`
  /* Eco City, fixed_upfront: 600 + 90·4,3 + 12·6 = 1 059 → rounded to 100 ֏. Line names are the app's fare.* strings. */
  const breakdown = (pay = 'cash', promo) => `<div class="bd" aria-label="Գնի մանրամասները">
    <div class="l"><span>Նստեցում</span><span>${R.amd(600)}</span></div>
    <div class="l"><span>Ըստ կիլոմետրի · ${ECO.km(RD.km)}</span><span>${R.amd(387)}</span></div>
    <div class="l"><span>Ըստ րոպեի · ${RD.min} րոպե</span><span>${R.amd(72)}</span></div>
    <div class="l"><span>Կլորացում</span><span>+${R.amd(41)}</span></div>
    ${fee(pay) ? `<div class="l"><span>Սպասարկման վճար · քարտով 2 %</span><span>${R.amd(fee(pay))}</span></div>` : ''}
    ${promo ? `<div class="l promo"><span>${R.i('ticket-percent')}Պրոմոկոդ · ${PA.code}</span><span>−${R.amd(PA.off)}</span></div>` : ''}
    <div class="l tot"><span>Ընդամենը</span><span>${R.amd((promo ? PA.pay : RD.fare) + fee(pay))}</span></div></div>
    ${pay === 'company' ? billedTo : ''}`
  const collapsed = `<button class="bdrow"><span>Գնի մանրամասները</span>${R.i('chevron-down')}</button>`
  const who = `<div class="who">${R.avatar()}<span class="nm"><span class="n1">${DV.first}</span><span class="n2">${DV.car} · ${DV.plate}</span></span></div>`
  const stars = (n) => `<div class="stars" role="radiogroup" aria-label="Գնահատեք վարորդին">${[1, 2, 3, 4, 5].map((i) =>
    `<button class="${i <= n ? 'on' : ''}" role="radio" aria-checked="${i === n}" aria-label="${i} աստղ">${S}</button>`).join('')}</div>`
  const chips = (list, on) => `<div class="chips">${list.map((c, i) => `<button class="chip tog" aria-pressed="${on.includes(i)}">${c}</button>`).join('')}</div>`
  /* A stand-in QR: a seeded 25×25 module grid with the three finder squares (not a real code). Always dark on white. */
  const qr = () => {
    let x = 2417, d = ''
    const rnd = () => ((x = (x * 1103515245 + 12345) % 2147483648) / 2147483648)
    const fin = (r, c) => [[0, 0], [0, 18], [18, 0]].some(([a, b]) => r >= a && r < a + 7 && c >= b && c < b + 7)
    for (let r = 0; r < 25; r++) for (let c = 0; c < 25; c++) if (!fin(r, c) && rnd() > .52) d += `M${c * 3} ${r * 3}h3v3h-3z`
    const f = (a, b) => `M${b * 3} ${a * 3}h21v21h-21zM${b * 3 + 3} ${a * 3 + 3}v15h15v-15zM${b * 3 + 6} ${a * 3 + 6}h9v9h-9z`
    return `<svg width="88" height="88" viewBox="0 0 75 75" aria-hidden="true"><path fill="#111113" fill-rule="evenodd" d="${d}${f(0, 0)}${f(0, 18)}${f(18, 0)}"/></svg>`
  }
  /* The Tax Service receipt is the driver's income (ETAPI register-income): the fare, 1 100 ֏. The fee is the fleet's and is not on it. */
  const fisNote = `<div class="fisnote">${R.i('info')}<span>ՊԵԿ կտրոնում՝ միայն ուղևորության գինը · քարտով վճարման 2 %-ը Էկո Տաքսիի սպասարկման վճարն է՝ մեր ստացականում</span></div>`
  /* Card declined at the end (iPay / ArCa refusal), or an Apple / Google Pay sheet the rider dismissed: the same recovery. */
  const DECL = (() => { const h = R.payList('none'), w = 'կգանձվի ավարտին · +2 %', i = h.indexOf(w), j = h.lastIndexOf('aria-checked="false"', i)
    return h.slice(0, j) + 'aria-checked="false" aria-disabled="true"' + h.slice(j + 20, i) + 'մերժվեց' + h.slice(i + w.length) })()
  const page = (body, foot) => `<div class="page on-surface">${nav}<div class="body">${body}</div><div class="foot">${foot}</div></div>`

  Rider.page({
    title: 'Rider · Trip complete',
    sub: 'The fare is the hero, broken down from the real Eco City tariff. Stars, then compliments or a reason. Close is always there',
    states: [
      { id: 'rate', label: 'Fare + rate', time: '9:51', note: 'Base 600 + 4,3 km × 90 + 6 min × 12 = 1 059, rounded to 1 100 ֏ (fixed fare) . Paid in cash, so no service fee (owner 2026-10-15/16: card, Apple Pay, Google Pay and NFC · POS carry the 2 %; cash and company do not). «Ուղարկել» is pinned, disabled until a star is chosen, so the layout does not jump. UX audit 2026-10-15 (Peak-End): the breakdown opens on «Գնի մանրամասները», as on the rated states — the fixed fare was agreed before the ride, and the end of the ride is the stars, not a «Կլորացում +41 ֏» line. Promo and card keep it open: there it explains why the number differs from the fare',
        html: () => page(`${tripHead()}${collapsed}${who}<div class="ask">Գնահատեք վարորդին</div>${stars(0)}`,
          '<button class="btn" disabled>Ուղարկել</button><button class="btn-text">Բաց թողնել</button>') },
      { id: 'company', label: 'Company ride', time: '9:51', note: 'Billed to the rider\'s company (receipt.tsx): «Վճարում է՝ …» stands where the method would; never a balance or a limit. Nothing is paid to the driver. Owner 2026-10-15: company rides are not sent to ETAPI, so there is no Tax Service receipt and no link to one; the second line says where the ride is accounted for: «Ընկերության ամսական հաշվետվությունում». No service fee on company rides',
        html: () => page(`${tripHead('company')}${billedTo}${collapsed}${who}<div class="ask">Գնահատեք վարորդին</div>${stars(0)}`,
          '<button class="btn" disabled>Ուղարկել</button><button class="btn-text">Բաց թողնել</button>') },
      { id: 'promo', label: 'Promo discount', time: '9:51', note: 'Change list 2026-10-14 (drawn ahead): ECO.PROMO.applied AUTUMN15 on the walkthrough ride. The breakdown keeps the tariff lines, adds one «Պրոմոկոդ · AUTUMN15 −165 ֏» line in brand, and the hero and total are what the rider pays: 935 ֏ (cash, no service fee)',
        html: () => page(`${tripHead('cash', true)}${breakdown('cash', true)}${who}<div class="ask">Գնահատեք վարորդին</div>${stars(0)}`,
          '<button class="btn" disabled>Ուղարկել</button><button class="btn-text">Բաց թողնել</button>') },
      { id: 'card', label: 'Paid by card', time: '9:51', note: 'Owner 2026-10-15 (final): the same ride charged to the saved card ·· 4242 (Apple Pay / Google Pay alike). The tariff lines still add to the fare, 1 100 ֏; «Սպասարկման վճար · քարտով 2 %» 22 ֏ is its own line, and the hero and total are 1 122 ֏. The Tax Service receipt for this ride still shows 1 100 ֏ only',
