<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Rider home</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="mapgl.local.js"></script>
<script src="kit.js"></script>
<style>
  .sheet { padding-bottom: 34px; }
  .where { display: flex; align-items: center; gap: var(--s3); height: var(--h-button); border-radius: var(--r-control);
    background: var(--surface-2); padding: 0 6px 0 var(--s4); width: 100%; text-align: left; }
  .where > svg { width: 20px; height: 20px; color: var(--ink); }
  .where .lbl { flex: 1; font: var(--t-headline); color: var(--ink); white-space: nowrap; }
  .later { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; border-radius: 10px;
    background: var(--raised); box-shadow: var(--e1); font: var(--t-secondary-strong); color: var(--ink); white-space: nowrap; }
  .later svg { width: 16px; height: 16px; }
  .places { margin-top: var(--s2); }
  .row .end { font-variant-numeric: tabular-nums; }
  .row.soon .ic { background: var(--brand-soft); color: var(--brand-ink); }
  .row.soon .t2 { color: var(--ink-2); }

  .partners { margin: var(--s3) calc(-1 * var(--margin)) 0; overflow: hidden; }
  /* Three cards, three dots: the strip snap-scrolls, the second card peeks (one dot per reachable card). */
  .track { display: flex; gap: var(--s2); padding: 0 var(--margin); overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 var(--margin); scrollbar-width: none; }
  .track::-webkit-scrollbar { display: none; }
  .ad { scroll-snap-align: start; }
  .ad { position: relative; flex: none; width: 318px; height: 156px; border-radius: var(--r-card); overflow: hidden; background: var(--surface-3); }
  .ad img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* The scrim is the text's own background (not a pseudo-element), so the copy always sits on it: white on ≥ .6 black. */
  .ad .copy { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; color: #fff; padding: 56px var(--s4) 14px;
    background: linear-gradient(180deg, rgb(0 0 0 / .02) 0%, rgb(0 0 0 / .6) 45%, rgb(0 0 0 / .82) 100%); }
  .ad .who { font: var(--t-secondary-strong); color: rgb(255 255 255 / .86); white-space: nowrap; }
  .ad .offer { font: var(--t-title); color: #fff; white-space: nowrap; letter-spacing: -.1px; }
  .ad .tag { position: absolute; top: 10px; left: 10px; z-index: 1; height: 22px; padding: 0 8px; border-radius: var(--r-pill);
    background: rgb(0 0 0 / .62); color: #fff; font: var(--t-caption); line-height: 22px; }
  .dots { display: flex; justify-content: center; gap: 6px; margin-top: var(--s3); }
  .dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--surface-3); }
  .dots i.on { width: 18px; background: var(--ink); }

  .logo { position: absolute; z-index: 20; top: 74px; left: 50%; transform: translateX(-50%); width: 112px; height: 20px; filter: drop-shadow(0 1px 1px rgb(0 0 0 / .08)); }
  .puck { width: 22px; height: 22px; border-radius: 50%; background: var(--brand); border: 3.5px solid #fff; box-shadow: 0 0 0 10px var(--brand-soft), 0 2px 6px rgb(0 0 0 / .3); }
</style>
</head>
<body>
<main class="screen" id="s">
  <div class="map" id="map" aria-label="Քարտեզ"></div>

  <button class="fab" style="top:62px;left:16px" aria-label="Հաշիվ"><i data-lucide="menu"></i></button>
  <img class="logo" src="assets/eco/logo-wide.png" alt="Eco Taxi" width="112" height="20">
  <button class="fab" id="recentre" style="right:16px" aria-label="Կենտրոնացնել"><i data-lucide="locate-fixed"></i></button>

  <section class="sheet" id="sheet">
    <div class="grabber"></div>
    <button class="where" aria-label="Ո՞ւր եք գնում">
      <i data-lucide="search"></i><span class="lbl">Ո՞ւր եք գնում</span>
      <span class="later" role="button" aria-label="Նախապես"><i data-lucide="calendar-clock"></i>Նախապես</span>
    </button>

    <div class="places" id="places"></div>

    <div class="partners" aria-label="Առաջարկներ">
      <div class="track">
        <article class="ad" data-photo data-scrim="0:0,0.2:0,0.55:0.6,1:0.82">
          <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=700&h=340&q=80&auto=format&fit=crop" alt="">
          <span class="tag">Գովազդ</span>
          <div class="copy"><div class="who">Լյումեն սրճարան</div><div class="offer">−15% ուղևորներին</div></div>
        </article>
        <article class="ad" data-photo data-peek data-scrim="0:0,0.2:0,0.55:0.6,1:0.82">
          <img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=700&h=340&q=80&auto=format&fit=crop" alt="">
          <span class="tag">Գովազդ</span>
          <div class="copy"><div class="who">Տարոն ռեստորան</div><div class="offer">Աղանդեր՝ նվեր</div></div>
        </article>
        <article class="ad" data-photo data-peek data-scrim="0:0,0.2:0,0.55:0.6,1:0.82">
          <img src="https://images.unsplash.com/photo-1540555700478-4be289fbecef?w=700&h=340&q=80&auto=format&fit=crop" alt="">
          <span class="tag">Գովազդ</span>
          <div class="copy"><div class="who">Արաքս սպա</div><div class="offer">Մերսում՝ −20%</div></div>
        </article>
      </div>
      <div class="dots" aria-hidden="true"><i class="on"></i><i></i><i></i></div>
    </div>
  </section>
</main>
<script src="audit.js"></script>
<script>
  const pre = new URLSearchParams(location.search).get('preorder') === '1'
  const rows = pre
    ? [['calendar-clock', 'Վաղը, 08:30', 'Զվարթնոց օդանավակայան', 'soon', '<i data-lucide="chevron-right" style="width:20px;height:20px;color:var(--ink-3)"></i>'],
       ['house', 'Տուն', 'Կոմիտասի պող. 22', '', '≈ 9 րոպե']]
    : [['house', 'Տուն', 'Կոմիտասի պող. 22', '', '≈ 9 րոպե'],
       ['history', 'Կասկադ', 'Թամանյան փողոց', '', '≈ 6 րոպե']]
  document.getElementById('places').innerHTML = rows.map((r, i) =>
    `${i ? '<div class="divider"></div>' : ''}<div class="row ${r[3]}" role="button" tabindex="0"><span class="ic"><i data-lucide="${r[0]}"></i></span>
      <span class="txt"><span class="t1">${r[1]}</span><span class="t2">${r[2]}</span></span><span class="end">${r[4]}</span></div>`).join('')

  statusBar(document.getElementById('s'))
  icons()
  const sheetH = document.getElementById('sheet').offsetHeight
  document.getElementById('recentre').style.bottom = (sheetH + 12) + 'px'
  const me = [40.1846, 44.5148]
  const map = makeMap(document.getElementById('map'), { sheetH, badge: { bottom: (sheetH + 22) + 'px', left: '16px' }, fit: [[me[0] - .003, me[1] - .0042], [me[0] + .003, me[1] + .0042]], padTL: [0, 40], padBR: [0, sheetH - 20] })
  htmlMarker(map, me, '<div class="puck"></div>', [22, 22])
  ;[[[.0021, -.0026], 62], [[-.0016, .0031], 222], [[.0024, .0024], 132], [[-.0019, -.0029], 318]]
    .forEach(([o, d]) => htmlMarker(map, [me[0] + o[0], me[1] + o[1]], carTop(d), [18, 34]))
</script>
</body>
</html>
