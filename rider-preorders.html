<style>
  /* Upcoming pre-order cards: the same geometry as rider-history#list (history/index.tsx), no inline cancel (owner 2026-10-12). */
  .bk { display: flex; flex-direction: column; gap: var(--s2); }
  .ubk { width: calc(100% - 2 * var(--margin)); margin: 0 var(--margin); text-align: left; background: var(--surface); border-radius: var(--r-card);
    padding: var(--s3); display: flex; flex-direction: column; gap: var(--s2); }
  .ubk .hd { display: flex; align-items: center; gap: var(--s2); min-height: 24px; }
  .ubk .hd > svg:first-child { width: 20px; height: 20px; color: var(--brand-ink); }
  .ubk .hd .w { flex: 1; font: var(--t-body-strong); color: var(--brand-ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ubk .hd .chev { width: 20px; height: 20px; color: var(--ink-3); }
  .ubk .rt { font: var(--t-body); color: var(--ink); }
  .ubk .ft { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
  .tg { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 6px; font: var(--t-caption); line-height: 24px; white-space: nowrap; }
  .tg svg { width: 14px; height: 14px; }
  .tg.warn { background: var(--warn-soft); color: #94430A; } /* --warn measured 4.25:1 on --warn-soft at 12px; this is 5.9:1 */
  :root[data-theme="dark"] .ubk .tg.warn, :root[data-theme="dark"] .tg.warn { color: var(--warn); }
  .tg.co { background: var(--surface-2); color: var(--ink-2); }
  /* Owner Q1: no driver on a booking is normal: the system searches that tariff automatically at the time. Neutral tag, not warn. */
  .tg.auto { background: var(--surface-2); color: var(--ink-2); }
  .help { margin: var(--s6) var(--margin) 0; display: flex; align-items: center; gap: var(--s3); min-height: 56px; padding: 0 var(--s4); width: calc(100% - 2 * var(--margin));
    border-radius: var(--r-card); background: var(--surface); text-align: left; }
  .help .ic { width: 36px; height: 36px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-ink); display: grid; place-items: center; flex: none; }
  .help .ic svg { width: 18px; height: 18px; }
  .help .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .help .t1 { font: var(--t-body-strong); color: var(--ink); }
  .help .t2 { font: var(--t-secondary); color: var(--ink-2); font-variant-numeric: tabular-nums; }

  /* Booking detail: the route on the map, the booking as a sheet. One hero: the time. */
  #sheet { padding: var(--s5) var(--margin) 34px; }
  .eyebrow { display: flex; align-items: center; gap: 6px; font: var(--t-secondary-strong); color: var(--brand-ink); white-space: nowrap; }
  .eyebrow svg { width: 16px; height: 16px; }
  .when { font: var(--t-hero); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.4px; margin-top: var(--s1); }
  .when.long { font: 700 32px/40px var(--font); } /* a weekday name: the hero steps down to 32 rather than run off the sheet */
  .wsub { font: var(--t-body); color: var(--ink-2); white-space: nowrap; }
  .stops { margin-top: var(--s3); position: relative; }
  .stop { display: flex; align-items: center; gap: var(--s3); min-height: 36px; }
  .stop .g { width: 18px; display: grid; place-items: center; flex: none; }
  .stop .g i { display: block; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 3px var(--surface-3); }
  .stop.b .g i { border-radius: 2px; }
  .stop .a { flex: 1; font: var(--t-body); color: var(--ink); white-space: nowrap; }
  .stop .tm { font: var(--t-secondary); color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stops::before { content: ''; position: absolute; left: 8.5px; top: 22px; bottom: 22px; width: 1px; background: var(--ink-3); opacity: .5; }
  .hr { height: 1px; background: var(--hairline); margin: var(--s3) 0; }
  .ln { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); min-height: 28px; font: var(--t-secondary); color: var(--ink-2); }
  .ln span { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .ln span svg { width: 16px; height: 16px; }
  .ln b { font: var(--t-secondary-strong); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .ln b svg { width: 16px; height: 16px; }
  .ln b .cashi { color: var(--ok); }
  .drv { display: flex; align-items: center; gap: var(--s3); }
  .drv .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .drv .t1 { font: var(--t-body-strong); color: var(--ink); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .drv .t1 span { font: var(--t-secondary); color: var(--ink-2); display: inline-flex; align-items: center; gap: 2px; }
  .drv .t1 svg { width: 13px; height: 13px; fill: currentColor; }
  .drv .t2 { font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; }
  .notice { display: flex; gap: var(--s2); align-items: flex-start; padding: var(--s3); border-radius: var(--r-card); background: var(--surface-2); font: var(--t-secondary); color: var(--ink); }
  .notice svg { width: 18px; height: 18px; flex: none; margin-top: 0; color: var(--ink-2); }
  .notice.warn { background: var(--warn-soft); }
  .notice.warn svg { color: var(--warn); }
  .notice b { display: block; font: var(--t-secondary-strong); }
  #sheet .btns { margin-top: var(--s4); }
  .cap { font: var(--t-caption); color: var(--ink-2); text-align: center; margin-top: var(--s2); }
  .confirm .body { font: var(--t-body); color: var(--ink-2); margin-bottom: var(--s4); }
  /* Start now: who is asked, in order, as a two-step strip, and the price as a fact (2026-10-14: three sentences → three rows). */
  .steps { display: flex; flex-direction: column; gap: var(--s2); margin-bottom: var(--s4); }
  .steps .sp { display: flex; align-items: center; gap: var(--s3); min-height: 32px; font: var(--t-body); color: var(--ink); white-space: nowrap; }
  .steps .n { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font: var(--t-secondary-strong); color: var(--ink); font-variant-numeric: tabular-nums; flex: none; }
  .steps .eq svg { width: 20px; height: 20px; margin: 0 4px; color: var(--ink-2); flex: none; }
  .steps .eq b { font: var(--t-body-strong); font-variant-numeric: tabular-nums; }
  /* start now: the search bar from rider-searching, the pre-assigned driver under it */
  .sbar { height: 3px; border-radius: 2px; background: var(--surface-3); overflow: hidden; margin: var(--s3) 0 var(--s3); position: relative; }
  .sbar::after { content: ''; position: absolute; top: 0; bottom: 0; width: 34%; border-radius: 2px; background: var(--brand); animation: sslide 1.6s ease-in-out infinite; }
  @keyframes sslide { from { left: -34%; } to { left: 100%; } }
  @media (prefers-reduced-motion: reduce) { .sbar::after { animation: none; left: 33%; } }

  /* iOS call action sheet (tel:): system chrome, not the app's — system blue, its own two cards. */
  .ios-as { position: absolute; z-index: 16; left: 8px; right: 8px; bottom: 34px; display: flex; flex-direction: column; gap: 8px; }
  .ios-as .grp { border-radius: 14px; background: rgb(250 250 252 / .97); overflow: hidden; }
  .ios-as .hd { padding: 14px 16px; font: 400 13px/18px var(--font); color: #5E5E63; text-align: center; border-bottom: 1px solid rgb(60 60 67 / .18); }
  .ios-as button { width: 100%; height: 58px; font: 400 20px/24px var(--font); color: #0060DF; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .ios-as button svg { width: 22px; height: 22px; }
  .ios-as .x { background: #fff; border-radius: 14px; font-weight: 600; }
  :root[data-theme="dark"] .ios-as .grp { background: rgb(44 44 46 / .98); }
  :root[data-theme="dark"] .ios-as .hd { color: #AEAEB2; border-color: rgb(84 84 88 / .5); }
  :root[data-theme="dark"] .ios-as button { color: #4DA3FF; }
  :root[data-theme="dark"] .ios-as .x { background: #2C2C2E; }

  /* Lock screen: system chrome on a wallpaper; white clock, notification cards in the system material (opaque enough to read). */
  .lock { position: absolute; inset: 0; background: radial-gradient(120% 70% at 20% 10%, #6E8C6A 0%, transparent 60%), radial-gradient(90% 60% at 90% 80%, #2F4F57 0%, transparent 70%), linear-gradient(170deg, #3E5B4C, #18252A 70%, #0D1417); }
  :root[data-theme="dark"] .lock { background: radial-gradient(120% 70% at 20% 10%, #33452F 0%, transparent 60%), radial-gradient(90% 60% at 90% 80%, #1B2E33 0%, transparent 70%), linear-gradient(170deg, #1E2C25, #0B1013 70%, #050708); }
  .screen:has(.lock) .statusbar { color: #fff; }
  .screen:has(.lock) .homebar { background: #fff; }
  .lock .lk { position: absolute; top: 58px; left: 0; right: 0; display: flex; justify-content: center; color: #fff; }
  .lock .lk svg { width: 18px; height: 18px; }
  .lock .date { position: absolute; top: 92px; left: 0; right: 0; text-align: center; font: 500 20px/26px var(--font); color: #fff; }
  .lock .big { position: absolute; top: 124px; left: 0; right: 0; text-align: center; font: 600 96px/104px var(--font); color: #fff; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
  .lock .stack { position: absolute; left: 8px; right: 8px; top: 304px; display: flex; flex-direction: column; gap: 8px; }
  .nt { border-radius: 22px; padding: 12px 14px; background: rgb(246 246 246 / .94); color: #111113; display: flex; gap: 10px; align-items: flex-start; box-shadow: 0 6px 24px rgb(0 0 0 / .18); }
  :root[data-theme="dark"] .nt { background: rgb(36 36 38 / .95); color: #F2F2F3; }
  .nt img.mk { width: 38px; height: 38px; border-radius: 9px; flex: none; background: #fff; padding: 4px; object-fit: contain; }
  .nt .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .nt .r1 { display: flex; justify-content: space-between; gap: 8px; font: 600 15px/20px var(--font); }
  .nt .r1 small { font: 400 13px/20px var(--font); color: #4A4A50; white-space: nowrap; }
  :root[data-theme="dark"] .nt .r1 small { color: #B5B5BB; }
  .nt .r2 { font: 600 15px/20px var(--font); }
  .nt .r3 { font: 400 15px/20px var(--font); }
  .nt.old { opacity: 1; transform: scale(.96); }
  .lock .cnt { position: absolute; left: 0; right: 0; bottom: 120px; text-align: center; font: 500 13px/18px var(--font); color: #fff; }
  .lock .ctl { position: absolute; bottom: 48px; width: 50px; height: 50px; border-radius: 50%; background: rgb(0 0 0 / .32); color: #fff; display: grid; place-items: center; }
  .lock .ctl svg { width: 22px; height: 22px; }

  /* In-app reminder banner (drawn ahead; the push itself too). */
  .banner.rem { background: var(--surface); color: var(--ink); top: 58px; }
  .banner.rem svg { color: var(--brand-ink); }
  .banner.rem .b1, .banner.rem .b2 { color: var(--ink); }
  .banner.rem .b2 { color: var(--ink-2); opacity: 1; }
  .banner.rem .ba { color: var(--ink); background: var(--surface-2); }
  :root[data-theme="dark"] .banner.rem { background: var(--surface-3); }
  :root[data-theme="dark"] .banner.rem svg { color: var(--brand-ink); }
</style>

  const BK = ECO.BOOKINGS, C = ECO.COMPANY, DP = ECO.DISPATCH
  const A = R.amd
  /* Each booking's map: its own OSRM route (page-local ROUTES.pre*), ECO numbers for km / min / fare. */

      <span class="rt">${b.pickup} → ${b.drop}</span>
      ${b.problem || b.pay === 'company' ? `<span class="ft">${b.problem ? `<span class="tg auto">${R.i('search')}Մեքենան՝ ավտոմատ որոնմամբ</span>` : ''}${b.pay === 'company' ? `<span class="tg co">${R.i('building-2')}${ECO.PAY.company.short}</span>` : ''}</span>` : ''}</button>`
  const helpRow = () => `<button class="help" aria-label="Զանգել դիսպետչերին ${DP.phone}"><span class="ic">${R.i('phone')}</span><span class="txt"><span class="t1">Փոփոխել կամ չեղարկել</span><span class="t2">Զանգել դիսպետչերին · ${DP.phone}</span></span>${R.i('chevron-right', 'class="chev" style="width:20px;height:20px;color:var(--ink-3)"')}</button>`
  const list = (extra = '') => `<div class="page"${extra ? ' style="padding-top:132px"' : ''}>${extra}<nav class="nav"><button class="navbtn" aria-label="Հետ">${R.i('arrow-left')}</button><span class="navttl"></span><span class="navend"></span></nav>
      <h1 class="large">Նախնական պատվերներ</h1><div class="scroll"><div class="sect">Շուտով</div><div class="bk">${[BK.air, BK.sun, BK.co].map(booking).join('')}</div>${helpRow()}</div></div>`

  const fab = () => `<button class="fab" style="top:62px;left:16px" aria-label="Հետ">${R.i('arrow-left')}</button>`
  const stops = (b) => `<div class="stops"><div class="stop"><span class="g"><i></i></span><span class="a">${b.pickup}</span><span class="tm">${b.time}</span></div>
      <div class="stop b"><span class="g"><i></i></span><span class="a">${b.drop}</span><span class="tm">${ECO.km(b.km)} · ${b.min} ր</span></div></div>`
  const payLine = (b) => b.pay === 'company'
    ? `<div class="ln"><span>Վճարում</span><b>${R.i('building-2')}${C.name}</b></div><div class="ln"><span>${C.refLabel}</span><b>${b.ref}</b></div>`
    : `<div class="ln"><span>Վճարում</span><b>${R.i('banknote', 'class="cashi"')}${ECO.PAY.cash.label}</b></div>`
  const driverRow = (d) => `<div class="drv"><span class="avatar ini" role="img" aria-label="Վարորդ՝ ${d.name}">${d.ini}</span>
      <span class="txt"><span class="t1">${d.first} <span>${R.i('star')}${d.rating}</span></span><span class="t2">${d.car}</span></span>${R.plate(d.plate)}</div>`
  /* The booking sheet. Owner 2026-10-12: «Սկսել հիմա» (start now) is the one primary; changes and cancellation go through the dispatcher. */
  const detailSheet = (b) => `<div class="map" id="map" aria-label="Երթուղի"></div>${fab()}
      <section class="sheet" id="sheet">
        <div class="eyebrow">${R.i('calendar-clock')}Նախնական պատվեր · ${b.day}</div>
        <div class="when${b.when.length > 12 ? ' long' : ''}">${b.when.replace(/^./, (c) => c.toUpperCase())}</div>
        ${stops(b)}
        <div class="hr"></div>
        <div class="ln"><span>${b.tier}</span><b>${A(b.fare)}</b></div>
        ${payLine(b)}
        <div class="hr"></div>
        ${b.driver ? driverRow(b.driver) : `<div class="notice">${R.i('search')}<span><b>Մեքենան կգտնենք ավտոմատ</b>Ժամին՝ մոտակա ${b.tier}</span></div>`}
        <div class="btns"><button class="btn btn-brand">${R.i('zap')}Սկսել հիմա</button><button class="btn btn-quiet">${R.i('phone')}Զանգել դիսպետչերին</button></div>
        <div class="cap">Փոխել կամ չեղարկել՝ միայն դիսպետչերի միջոցով</div>
      </section>`
  const mapFor = (b) => (s) => {
    const pts = ROUTES[ROUTE_OF[keyOf(b)]].pts
    const sheetH = s.querySelector('#sheet').offsetHeight
    const m = R.map(s, { fit: pts, padTL: [56, 96], padBR: [56, sheetH + 32] })
    drawRoute(m, pts, { weight: 5 })
    htmlMarker(m, pts[0], '<div class="pin-a"></div>', [18, 18])
    htmlMarker(m, pts[pts.length - 1], '<div class="pin-b"></div>', [18, 18])
  }
  /* A modal over the dimmed booking sheet. */
  const overDetail = (b, top) => detailSheet(b).replace('<section class="sheet" id="sheet">', '<div class="scrim" aria-hidden="true"></div><section class="sheet" id="sheet" aria-hidden="true" inert>') + top

  /* Lock screen. reminder: ECO.DISPATCH.reminderMin before the booking (console Settings → Dispatch). */
  const minus = (t, m) => { const [h, mm] = t.split(':').map(Number), x = h * 60 + mm - m; return `${String(Math.floor(x / 60)).padStart(2, '0')}:${String(x % 60).padStart(2, '0')}` }
  const B = BK.air, D = B.driver
  const remindAt = minus(B.time, DP.reminderMin)
  const nt = (t, r2, r3, cls = '') => `<div class="nt ${cls}"><img class="mk" src="assets/eco/mark.png" alt=""><span class="txt"><span class="r1"><span>Eco Taxi</span><small>${t}</small></span><span class="r2">${r2}</span><span class="r3">${r3}</span></span></div>`
  const lock = (clock, cards) => `<div class="lock" aria-label="Կողպված էկրան"><div class="lk" aria-hidden="true">${R.i('lock')}</div>
      <div class="date">${B.day.replace(' հոկտ.', ' հոկտեմբերի')}</div><div class="big">${clock.replace(/^0/, '')}</div>
      <div class="stack">${cards}</div>
      <div class="ctl" aria-hidden="true" style="left:46px">${R.i('flashlight')}</div><div class="ctl" aria-hidden="true" style="right:46px">${R.i('camera')}</div></div>`
  const reminderCard = (t) => nt(t, `Նախնական պատվեր՝ ${DP.reminderMin} րոպեից`, `${B.time} · ${B.pickup} → ${B.dropShort}`)

  /* Start now (owner ruling a): the booking becomes a ride; the pre-assigned driver is asked first, then normal dispatch. */
  const startSheet = (fallback) => `<div class="map" id="map" aria-label="Քարտեզ"></div>${fab()}
      <section class="sheet r" id="sheet"><div class="grabber"></div>
        <h2 class="h-title">${fallback ? 'Որոնում ենք մեքենա' : 'Հարցնում ենք ձեր վարորդին'}</h2>
        <div class="h-sub">${BK.air.pickup} → ${BK.air.dropShort} · ${A(BK.air.fare)}</div>
        <div class="sbar" role="progressbar" aria-label="${fallback ? 'Որոնում ենք մեքենա' : 'Սպասում ենք վարորդի պատասխանին'}"></div>
        ${fallback
          ? `<div class="notice">${R.i('info')}<span>${BK.air.driver.first}ը հիմա չի կարող · որոնում ենք մոտակա ${BK.air.tier}</span></div>`
          : driverRow(BK.air.driver)}
        <div class="btns"><button class="btn btn-quiet">${R.i('phone')}Զանգել դիսպետչերին</button></div>
      </section>`
  const startMap = (fallback) => (s) => {
    const PK = ROUTES.preAir.pts[0]
    const m = R.map(s, { fit: R.bbox(PK, .0034, .0044), padTL: [24, 96], padBR: [24, s.querySelector('#sheet').offsetHeight + 16] })
    htmlMarker(m, PK, '<div class="pin-a"></div>', [18, 18])
    const cars = fallback ? [[[.0024, -.0031], 58], [[-.0019, .0027], 214], [[.0029, .0022], 140]] : [[[.0021, -.0026], 150]]
    cars.forEach(([o, d]) => htmlMarker(m, [PK[0] + o[0], PK[1] + o[1]], carTop(d), [18, 34]))
  }

  Rider.page({
    title: 'Rider · Pre-orders',
    sub: 'A booking for later, from the list to the car: list, the booking, start it now, call the dispatcher to change it, the reminder, and the push when a driver is assigned. The rider cannot cancel or edit in the app (owner, 12 Oct). ECO.BOOKINGS: tomorrow 08:30 to Zvartnots with Սուրեն pre-assigned',
    states: [
      { id: 'list', group: 'Bookings', label: 'List', note: 'Reached from History («Նախնական պատվերներ» leads it) and the home card. Soonest first; a neutral tag «Մեքենան՝ ավտոմատ որոնմամբ» when no driver is pre-assigned (owner Q1: the system searches that tariff automatically, so it is not a problem); the company marker on an on-account booking. No inline cancel: a card opens the booking, and the one way to change or cancel is the dispatcher',
        html: () => list() },
      { id: 'detail', group: 'Bookings', label: 'Booking', note: 'Drawn ahead (R35): the time is the hero; route, tier and fixed price, payment, the pre-assigned driver and plate. «Սկսել հիմա» is the one primary; «Զանգել դիսպետչերին» for any change. Needs tier, fare, payment and driver on the customer booking wire',
        html: () => detailSheet(BK.air), map: mapFor(BK.air) },
      { id: 'detail-nodriver', group: 'Bookings', label: 'No car yet', note: 'problemReason set (the pre-assigned driver was blocked). Owner Q1: at the time the system searches automatically and any driver of the booking\'s tariff can take it, so the notice is neutral and says exactly that; no person has to assign a car',
        html: () => detailSheet(BK.sun), map: mapFor(BK.sun) },
      { id: 'detail-company', group: 'Bookings', label: 'Company', note: 'An on-account booking: «Ընկերության հաշվին» names the company and its cost code where the payment would be. No driver yet (Monday)',
        html: () => detailSheet(BK.co), map: mapFor(BK.co) },

      { id: 'start-confirm', group: 'Actions', label: 'Start now', note: 'Owner decision: a rider may bring a booking forward. One question, same price; the search starts at once and the screen becomes the live ride (rider-searching → rider-ride). Owner ruling 12 Oct: the pre-assigned driver (Սուրեն) gets the first offer; if he declines or lets it ring out, the automatic search offers it to any driver of that tariff (owner Q1) — the sheet draws it as a two-step strip (your driver, then the nearest car) and the price as a fact, so the fallback is no surprise (new strings)',
        html: () => overDetail(BK.air, `<section class="sheet r modal confirm" role="dialog" aria-label="Սկսե՞լ հիմա"><div class="grabber"></div>
          <div class="mhead"><h2 class="h-title">Սկսե՞լ հիմա</h2><button class="xbtn" aria-label="Փակել">${R.i('x')}</button></div>
          <div class="steps"><div class="sp"><span class="n">1</span><span>Նախ՝ ${BK.air.driver.first}ին</span></div><div class="sp"><span class="n">2</span><span>Չկարողանա՝ մոտակա ${BK.air.tier}</span></div>
            <div class="sp eq">${R.i('equal')}<span>Գինը նույնն է · <b>${A(BK.air.fare)}</b></span></div></div>
          <div class="btns"><button class="btn btn-brand">Սկսել հիմա</button><button class="btn btn-quiet">Ոչ, թողնել</button></div></section>`),
        map: mapFor(BK.air) },
      { id: 'start-sent', group: 'Actions', label: 'Start now · asking your driver', time: BK.air.startNow.at, note: `Owner ruling (a), drawn ahead: right after «Սկսել հիմա» the booking is a live ride and the offer rings on ${BK.air.startNow.first}'s phone first (the normal ${BK.air.startNow.offerSec} s offer, driver-offer-states#preorder-now). The sheet names him and his car; the bar is the same calm search bar. No in-app cancel here: changes stay with the dispatcher (see NOTES, needs owner decision)`,
        html: () => startSheet(false), map: startMap(false) },
      { id: 'start-fallback', group: 'Actions', label: 'Start now · another car', time: '9:53', note: `Owner ruling (a): ${BK.air.startNow.first} declined or let the offer expire, so the automatic search offers it to any free Eco City driver nearby (owner Q1: same tariff). One neutral line says why the face changed; same price. When a car accepts, the screen becomes rider-ride#assigned`,
        html: () => startSheet(true), map: startMap(true) },
      { id: 'call', group: 'Actions', label: 'Call to change', note: '«Զանգել դիսպետչերին» opens the phone (tel:, the fleet\'s dispatcherPhone): iOS asks once. Changing the time, the addresses or cancelling is the dispatcher\'s (§8: bookings are edited by the operator)',
        html: () => overDetail(BK.air, `<div class="ios-as" role="dialog" aria-label="Զանգ"><div class="grp"><div class="hd">Դիսպետչեր · Eco Taxi</div><button>${R.i('phone')}Զանգել ${DP.phone}</button></div><button class="x">Չեղարկել</button></div>`),
        map: mapFor(BK.air) },

      { id: 'reminder', group: 'Before pickup', label: 'Reminder', time: ' ', note: `Drawn ahead (owner: yes): a push ${DP.reminderMin} min before pickup; the lead is set in the console (Settings → Dispatch, ECO.DISPATCH.reminderMin). Tapping opens the booking`,
        html: () => lock(remindAt, reminderCard('հիմա')) },
      { id: 'reminder-inapp', group: 'Before pickup', label: 'Reminder, app open', time: remindAt.replace(/^0/, ''), note: 'The same reminder while the app is open: a banner over the screen with «Բացել», not a modal',
        html: () => list(R.banner({ icon: 'bell-ring', t1: `Նախնական պատվեր՝ ${DP.reminderMin} րոպեից`, t2: `${B.time} · ${B.pickup}`, action: 'Բացել' }).replace('class="banner ', 'data-overlay class="banner rem ')) },
      { id: 'activated', group: 'Before pickup', label: 'Driver assigned', time: ' ', note: `At the time the sweep activates the booking and the automatic search (owner Q1: pre-assigned driver first, else any driver of that tariff) assigns a car (${B.assignedAt}); the ride_assigned push says so, with the booked pickup time. Tap → rider-home.html?active=preorder (the resume card) → rider-ride.html#preorder. The earlier reminder sits under it`,
        html: () => lock(B.assignedAt, nt('հիմա', `Վարորդը նշանակված է · ${B.time}-ին`, `${D.first} · ${D.car.split(' · ')[0]} · ${D.plate}`) + reminderCard('12 ր առաջ').replace('class="nt ', 'class="nt old ')) },
    ],
  })
</script>
</body>
</html>
