<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Companies</title>
<link rel="stylesheet" href="console.css">
<link rel="stylesheet" href="corporate.css">
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="../kit.js"></script>
<script src="console.js"></script>
<script src="company-report.js"></script>
<script src="console-audit.js"></script>
</head>
<body>
<!-- Mirrors apps/operator components/admin/companies.tsx + company-row.tsx + company-create.tsx (corporate K1).
     The list edits nothing: the name is the link to the company's page, where every edit lives. -->
<div class="screen" id="screen">
  <div class="main">
    <header class="bar">
      <span class="crumb">Ֆինանսներ <i data-lucide="chevron-right"></i></span><h1>Ընկերություններ</h1>
      <span class="crumb num" id="count"></span>
      <div class="live"></div>
    </header>
    <div class="content one">
      <section class="card page" aria-label="Ընկերություններ" id="list"></section>
    </div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search)
  const adding = q.get('add') === '1'
  shell('companies')
  /* CO.LIST (company-report.js): one data set with monthly.html and the company page. October is the month in progress
     (today = ECO.DAY, Fri 9 Oct 2026); September is the last closed month, with its optional «Վճարված» mark. */
  const ROWS = [...CO.LIST].sort((a, b) => Number(a.closed) - Number(b.closed))
  document.getElementById('count').textContent = ROWS.length
  const n = (f) => ROWS.filter(f).length
  const over = (c) => c.limit && c.used / c.limit >= 0.9

  const head = `
    <div class="toolrow">
      <div class="input" style="width:280px"><i data-lucide="search"></i><span class="val ph">Անվանում, ՀՎՀՀ</span><span class="kbd">/</span></div>
      <div role="group" aria-label="Զտել ընկերությունները" class="row-flex" style="gap:6px">
        <span class="chip" role="button" aria-pressed="false">Սեպտեմբերը չվճարված <span class="c num">${n((c) => c.sep.amount && !c.sep.paidOn)}</span></span>
        <span class="chip" role="button" aria-pressed="false">Սահմանաչափին մոտ <span class="c num">${n(over)}</span></span>
        <span class="chip" role="button" aria-pressed="false">Փակված <span class="c num">${n((c) => c.closed)}</span></span>
      </div>
      <span class="sp"></span>
      <a class="btn ghost" href="monthly.html?theme=${THEME}" style="text-decoration:none"><i data-lucide="calendar-check"></i>Ըստ ամսի</a>
      <button class="btn secondary" aria-expanded="${adding}" aria-keyshortcuts="N"><i data-lucide="plus"></i>Նոր ընկերություն <span class="kbd">N</span></button>
    </div>`

  const add = adding ? `<tr class="addrow"><td colspan="7"><div class="inl">
      <div class="input focus" role="textbox" aria-label="Ընկերության անվանում"><span class="val">Ալֆա Ֆարմ ՍՊԸ</span></div>
      <button class="btn primary"><i data-lucide="check"></i>Ավելացնել <span class="kbd">↵</span></button>
      <button class="btn ghost">Չեղարկել</button>
      <span class="faint" style="font:var(--c-small)">Պայմանագիրը և աշխատակիցները՝ ընկերության էջում</span></div></td></tr>` : ''

  const rows = ROWS.map((c) => `
    <tr class="ro${c.closed ? ' off' : ''}">
      <td><span class="co-stack"><a class="nm" href="company.html?theme=${THEME}" title="${c.name}">${c.name}</a>${c.closed ? '<span class="pill">Փակված</span>' : ''}</span></td>
      <td>${CO.MODE[c.mode]}</td>
      <td class="c">${c.emp}</td>
      <td class="c">${c.oct.rides || '<span class="dash">0</span>'}</td>
      <td class="m">${c.oct.amount ? ECO.amd(c.oct.amount) : '<span class="dash">—</span>'}</td>
      <td>${CO.limitCell(c.used, c.limit)}</td>
      <td>${!c.sep.amount ? '<span class="dash">—</span>' : c.sep.paidOn ? '<span class="pill ok"><i data-lucide="check"></i>Վճարված</span>' : '<span class="pill"><i class="d"></i>Չվճարված</span>'}</td>
    </tr>`).join('')

  document.getElementById('list').innerHTML = head + `<div class="scroll-y grow" data-truncate>
    <table class="tbl" aria-label="Ընկերություններ"><colgroup><col><col style="width:120px"><col style="width:120px"><col style="width:150px"><col style="width:140px"><col style="width:150px"><col style="width:132px"></colgroup>
      <thead><tr><th>Ընկերություն</th><th>Վճարում</th><th class="c">Աշխատակիցներ</th><th class="c">Հոկտ.՝ ուղևորություն</th><th class="m">Հոկտ.՝ գումար</th><th>Սահմանաչափ</th><th>Սեպտեմբեր</th></tr></thead>
      <tbody>${add}${rows}</tbody></table></div>`
  icons()
  document.documentElement.dataset.mapReady = 'none'
</script>
</body>
</html>
