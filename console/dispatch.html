<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="console.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="../mapgl.local.js"></script>
<script src="../kit.js"></script>
<script src="../routes.js"></script>
<script src="console.js"></script>
<script src="dispatch-states.js"></script>
<script src="console-audit.js"></script>
<style>
  .content { grid-template-columns: 452px minmax(340px, 380px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 100px; }
  .q { grid-row: 1 / 3; }
  .strip { grid-column: 2 / 4; }

  /* Queue */
  .tabs { display: flex; gap: 2px; padding: 3px; border-radius: var(--r-ctl); background: var(--surface-alt); }
  .tabs button { height: 26px; padding: 0 10px; border-radius: 6px; font: var(--c-strong); color: var(--ink-muted); display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .tabs button.on { background: var(--surface); color: var(--ink); box-shadow: var(--e1); }
  .tabs .c { font: var(--c-small); color: var(--ink-faint); }
  .lane-h { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px 0 14px; background: var(--surface); border-bottom: 1px solid var(--line-soft); font: 600 12px/16px var(--font); color: var(--lane); white-space: nowrap; }
  .lane-h .c { color: var(--ink-faint); font-weight: 500; }
  .lane-h svg { width: 14px; height: 14px; }
  .lane-h .end { margin-left: auto; font: var(--c-small); color: var(--ink-faint); }
  .r { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; row-gap: 2px; padding: 8px 12px 8px 16px; border-bottom: 1px solid var(--line-soft); }
  .r::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--lane); }
  .r:hover, .r.sel { background: var(--surface-alt); }
  .r.sel { box-shadow: inset 0 0 0 1px var(--line-strong); }
  .r .a { font: var(--c-row); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .r .age { font: 500 14px/20px var(--mono); font-variant-numeric: tabular-nums; text-align: right; width: 56px; }
  .r .age.late { color: var(--lane-problems); font-weight: 600; }
  .r .m { display: flex; align-items: center; gap: 8px; min-width: 0; font: var(--c-small); color: var(--ink-muted); height: 24px; }
  .r .m .ph { font: 400 12px/16px var(--mono); width: 92px; flex: none; color: var(--ink-muted); }
  .r .m .why { color: var(--lane-problems); font-weight: 500; }
  .r .acts { display: flex; gap: 4px; justify-content: flex-end; align-items: center; height: 24px; }
  .btn.xs { height: 24px; padding: 0 8px; font: var(--c-label); gap: 6px; }
  .btn.xs .kbd { height: 16px; min-width: 16px; font-size: 11px; }
  .btn.xs.icon { width: 24px; padding: 0; }
  .r.p .btn.xs { height: 28px; } .r.p .btn.xs.icon { width: 28px; }
  .r.p { grid-template-areas: 'a age' 'm m' 'acts acts'; }
  .r.p .a { grid-area: a; } .r.p .age { grid-area: age; } .r.p .m { grid-area: m; } .r.p .acts { grid-area: acts; justify-content: flex-start; height: 28px; align-items: flex-end; }
  .sla { position: absolute; left: 3px; bottom: -1px; height: 2px; background: var(--lane); }
  .claimed { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-faint); white-space: nowrap; }
  /* The shortcut legend is the queue card's own 32px footer, outside the scroll box: it never sits on a row (review). */
  .legend { display: flex; align-items: center; gap: 12px; height: 32px; padding: 0 12px; border-top: 1px solid var(--line-soft); background: var(--surface-alt); border-radius: 0 0 var(--r-card) var(--r-card); font: var(--c-small); color: var(--ink-faint); flex: none; white-space: nowrap; }
  .legend span { display: inline-flex; gap: 4px; align-items: center; }

  /* Scheduled lane (scheduled-lane.tsx): ordered by the promised hour, which leads in its own mono column. No age, no SLA,
     no claim. A problem row takes a third line so Release / Reassign stay one click deep (§9.4). */
  .bk { position: relative; display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; column-gap: 10px; row-gap: 2px; padding: 8px 12px 8px 16px; border-bottom: 1px solid var(--line-soft); }
  .bk::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--lane); }
  .bk:hover, .bk.sel { background: var(--surface-alt); }
  .bk time { grid-row: 1 / 3; align-self: start; min-height: 46px; display: flex; flex-direction: column; justify-content: center; font: 500 14px/20px var(--mono); font-variant-numeric: tabular-nums; }
  .bk time .dd { font: 400 12px/16px var(--font); color: var(--ink-faint); }
  .bk .a { font: var(--c-row); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .bk .a .arr { color: var(--ink-faint); margin: 0 4px; font-weight: 400; }
  .bk .m { grid-column: 2 / 4; display: flex; align-items: center; gap: 8px; min-width: 0; font: var(--c-small); color: var(--ink-muted); height: 24px; }
  .bk .m .ph { font: 400 12px/16px var(--mono); width: 92px; flex: none; }
  .bk .m3 { grid-column: 2 / 4; display: flex; align-items: center; height: 18px; }
  .bk .st { display: inline-flex; align-items: center; gap: 4px; font: var(--c-small); color: var(--ink-muted); white-space: nowrap; flex: none; }
  .bk .st.ok { color: var(--ok-text); font-weight: 500; }
  .bk .st svg { width: 12px; height: 12px; }
  .bk .m .trunc { flex: 1; }
  .bk .m .drv { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; margin-left: auto; color: var(--ink); font-weight: 500; }
  .bk .m .drv svg { width: 14px; height: 14px; color: var(--ink-faint); }
  .bk .m .co-badge, .bk .m .none { margin-left: auto; }
  .bk .m .none { color: var(--ink-faint); white-space: nowrap; }
  .bk .m .why { color: var(--lane-problems); font-weight: 500; }
  .bk .x { align-self: start; }
  .bk .acts { grid-column: 2 / 4; display: flex; gap: 4px; align-items: flex-end; height: 28px; }
  .bk.p { --lane: var(--lane-problems); }
  .dtp { position: absolute; left: 16px; top: calc(100% - 4px); z-index: 12; width: 304px; background: var(--surface); border-radius: var(--r-ctl); box-shadow: var(--e2), 0 0 0 1px var(--line-soft); padding: 8px; }
  .dtp .mh { display: flex; align-items: center; justify-content: space-between; font: 600 13px/18px var(--font); margin-bottom: 6px; }
  .dtp .grid7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .dtp .grid7 .wd { font: 600 12px/16px var(--font); color: var(--ink-faint); padding: 2px 0; }
  .dtp .grid7 .d { height: 28px; display: grid; place-items: center; border-radius: 6px; font: 400 12px/16px var(--mono); color: var(--ink); }
  .dtp .grid7 .d.past { color: var(--ink-faint); }
  .dtp .grid7 .d.today { box-shadow: inset 0 0 0 1px var(--line-control); }
  .dtp .grid7 .d.on { background: var(--ink); color: var(--surface); font-weight: 500; }
  .dtp .quick { display: flex; gap: 4px; margin-top: 8px; }
  .dtp .quick .chip { height: 24px; font: var(--c-small); padding: 0 8px; }
  .dtp .ft { margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--line-soft); text-align: center; font: var(--c-small); color: var(--ink-faint); }
  /* Intake billing (intake-billing.tsx) and sub-tabs (intake-sub-tabs.tsx) */
  .billing { display: flex; flex-direction: column; gap: 6px; }
  .billing .seg { display: flex; } .billing .seg button { flex: 1; justify-content: center; }
  .req { font: 500 12px/16px var(--font); color: var(--warning); margin-left: 4px; }
  .hint-warn { font: var(--c-small); color: var(--warning); }
  .co-badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: var(--r-tag); background: var(--brand-tint); color: var(--brand-text); font: var(--c-label); white-space: nowrap; }
  .co-badge svg { width: 12px; height: 12px; }
  .in-tabs { display: flex; gap: 12px; border-bottom: 1px solid var(--line-soft); }
  .in-tabs button { height: 30px; font: var(--c-strong); color: var(--ink-muted); white-space: nowrap; box-shadow: inset 0 -2px 0 transparent; display: inline-flex; align-items: center; gap: 6px; }
  .in-tabs button[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
  .in-tabs .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand-vivid); }
  .textarea { min-height: 56px; align-items: flex-start; padding-top: 8px; height: auto; }
  /* ?intake=pay / ?intake=airport (owner 2026-10-15): the payment list in the form's flow (no popover to clip), the zone line */
  .payopts { margin-top: -8px; border-radius: var(--r-ctl); background: var(--surface); box-shadow: var(--e2), 0 0 0 1px var(--line-soft); padding: 4px; }
  .payopts div { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 6px; font: var(--c-body); white-space: nowrap; min-width: 0; }
  .payopts div.on { background: var(--surface-alt); }
  .payopts div.off { color: var(--ink-faint); }
  .payopts div svg { width: 14px; height: 14px; color: var(--ink-faint); }
  .payopts .end { margin-left: auto; font: var(--c-small); color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .payopts .k { font: 500 11px/16px var(--mono); color: var(--ink-faint); min-width: 16px; text-align: center; box-shadow: inset 0 0 0 1px var(--line-control); border-radius: 4px; }
  .payopts div:not(:has(.end)) .k { margin-left: auto; }
  .payopts p { display: flex; gap: 6px; align-items: flex-start; padding: 6px 8px 4px; margin-top: 4px; border-top: 1px solid var(--line-soft); font: var(--c-small); color: var(--ink-muted); }
  .payopts p svg { width: 14px; height: 14px; flex: none; margin-top: 1px; color: var(--ink-faint); }
  .zline { display: flex; align-items: center; gap: 6px; margin: 4px 0 0 28px; font: var(--c-small); color: var(--ink-muted); }
  .zline svg { width: 14px; height: 14px; color: var(--ink-faint); }
  .zline a { color: var(--brand-text); text-decoration: none; font-weight: 500; }
  .tierb.off { background: var(--surface-alt); color: var(--ink-faint); box-shadow: none; }
  .tierb.off .car { opacity: .45; }
  .tierb.off .p { color: var(--ink-faint); }

  /* Team review 2026-10-16: the calendar inside New order, the driver picker, the edit side panel, the strip's search, the car card */
  .input.ro { background: var(--surface-alt); box-shadow: inset 0 0 0 1px var(--line-soft); }
  .dtp.flow { position: static; width: auto; margin-top: -4px; }
  .dpick { border-radius: var(--r-ctl); background: var(--surface); box-shadow: var(--e2), 0 0 0 1px var(--line-soft); padding: 4px; display: flex; flex-direction: column; gap: 2px; }
  .dpick > div[role=option] { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 6px; font: var(--c-body); white-space: nowrap; min-width: 0; }
  .dpick > div[role=option].on { background: var(--surface-alt); }
  .dpick > div[role=option].off { color: var(--ink-faint); }
  .dpick .end { margin-left: auto; font: var(--c-small); color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .dpick > .input { margin-bottom: 2px; }
  .dpick p { display: flex; gap: 6px; align-items: flex-start; padding: 6px 8px 4px; margin-top: 2px; border-top: 1px solid var(--line-soft); font: var(--c-small); color: var(--ink-muted); }
  .dpick p svg { width: 14px; height: 14px; flex: none; margin-top: 1px; color: var(--ink-faint); }
  .input .btn.xs { margin-left: auto; flex: none; }
  .r .tag.sw { gap: 4px; margin-left: auto; font: 500 12px/16px var(--mono); }
  .r .tag.sw svg { width: 12px; height: 12px; }
  .card:has(> .epanel) { position: relative; }
  .epanel { position: absolute; z-index: 8; top: 0; right: 0; bottom: 0; width: min(380px, 100%); display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--line-soft); box-shadow: var(--e2); border-radius: 0 var(--r-card) var(--r-card) 0; }
  .epanel .eh { display: flex; align-items: center; gap: 8px; height: var(--h-bar); padding: 0 8px 0 var(--inset); border-bottom: 1px solid var(--line-soft); flex: none; }
  .epanel .eh h2 { font: var(--c-head); }
  .epanel .eh .end { margin-left: auto; }
  .epanel .eb { display: flex; flex-direction: column; gap: 12px; padding: 12px var(--inset); }
  .epanel .ef { display: flex; gap: 8px; padding: 10px 88px 10px var(--inset); /* clear of the 2GIS attribution under the panel */ border-top: 1px solid var(--line-soft); flex: none; }
  .epanel .ef .btn.primary { flex: 1; justify-content: center; }
  .payrec { display: flex; align-items: center; gap: 6px; margin-top: 6px; font: var(--c-strong); color: var(--ink); }
  .payrec svg { width: 14px; height: 14px; color: var(--ink-faint); }
  .strip .list.fs { align-items: center; }
  .fsearch { flex: none; width: 320px; display: flex; flex-direction: column; gap: 6px; }
  .fsearch p { font: var(--c-small); }
  .carcard { position: absolute; z-index: 7; width: 236px; padding: 10px 12px; border-radius: var(--r-ctl); background: var(--surface); box-shadow: var(--e2), 0 0 0 1px var(--line-soft); pointer-events: none; }
  .carcard[hidden] { display: none; }
  .carcard .ch { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .carcard .cn { font: var(--c-strong); margin: 6px 0; }
  .carcard dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font: var(--c-small); }
  .carcard dt { color: var(--ink-muted); } .carcard dd { text-align: right; white-space: nowrap; }
  .mk-car:focus-visible, .mk-car.hov { outline: 2px solid var(--focus-ring); outline-offset: -4px; border-radius: 50%; }

  /* Intake */
  .in .card-b { display: flex; flex-direction: column; gap: 12px; padding: 12px var(--inset); }
  .pinrow { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; align-items: center; }
  .pin { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 600 11px/1 var(--font); background: var(--ink); color: var(--surface); }
  .pin.b { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .cust { border-radius: var(--r-ctl); background: var(--surface-alt); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .cust .t { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; font: var(--c-strong); white-space: nowrap; }
  .cust .t .faint { font: var(--c-small); }
  .cust .rec { display: flex; gap: 4px; flex-wrap: wrap; }
  .cust .rec .chip { height: 24px; font: var(--c-small); padding: 0 8px; }
  .pop { position: absolute; left: 28px; right: 0; top: 40px; z-index: 10; background: var(--surface); border-radius: var(--r-ctl); box-shadow: var(--e2), 0 0 0 1px var(--line-soft); padding: 4px; }
  .pop div { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 6px; font: var(--c-body); white-space: nowrap; }
  .pop div.on { background: var(--surface-alt); }
  .pop .faint { font: var(--c-small); }
  .tiers { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .tierb { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 8px; height: 36px; padding: 0 8px 0 6px; border-radius: var(--r-ctl); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-soft); text-align: left; }
  .tierb .n { font: var(--c-strong); white-space: nowrap; }  /* a tier name in its button never truncates (review 16 Oct) */
  .tierb .p { font: 500 12px/16px var(--font); color: var(--ink-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tierb.on { box-shadow: inset 0 0 0 2px var(--ink); }
  .tierb.any { grid-template-columns: 20px minmax(0, 1fr) auto; }
  .tierb .tk { display: block; text-align: right; font: 400 11px/11px var(--mono); color: var(--ink-faint); font-style: normal; }
  .tierb.any .anyic { width: 20px; }
  .tierb .anyic { width: 40px; display: grid; place-items: center; color: var(--ink-faint); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actbar { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 10px var(--inset); border-top: 1px solid var(--line-soft); flex: none; }
  .actbar .sum { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .actbar .sum b { font: 600 15px/20px var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .actbar .sum span { font: var(--c-small); color: var(--ink-faint); white-space: nowrap; }

  /* Map overlays */
  .mk-drop { width: 14px; height: 14px; border-radius: 3px; background: var(--ink); box-shadow: 0 0 0 2px var(--surface), var(--e1); }
  .mk-pin { display: flex; align-items: center; gap: 4px; transform: translate(-12px, -12px); }
  .mk-pin i { width: 24px; height: 24px; border-radius: 50%; background: var(--lane); display: grid; place-items: center; box-shadow: 0 0 0 2px var(--surface), var(--e1); flex: none; }
  .mk-pin i::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--surface); }
  .mk-pin b { height: 20px; padding: 0 6px; border-radius: 6px; background: var(--surface); box-shadow: var(--e1); font: 600 12px/20px var(--mono); color: var(--ink); white-space: nowrap; }
  .mk-ab { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 700 12px/1 var(--font); background: var(--ink); color: var(--surface); box-shadow: 0 0 0 2px var(--surface), var(--e2); }
  .mk-ab.b { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 2px var(--ink), var(--e2); }
  .mk-car { display: grid; place-items: center; width: 40px; height: 40px; }
  .mk-car.free::before { content: ''; position: absolute; width: 40px; height: 40px; border-radius: 50%; background: var(--brand-soft); }
  .mapkey { top: 12px; left: 12px; padding: 4px; }
  .mapkey span { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; font: var(--c-label); white-space: nowrap; color: var(--ink); }
  .mapkey i { width: 8px; height: 8px; border-radius: 50%; }
  .maplayers { bottom: 12px; left: 12px; padding: 3px; }
  .maplayers button { height: 26px; padding: 0 10px; border-radius: var(--r-pill); font: var(--c-label); white-space: nowrap; color: var(--ink-muted); }
  .maplayers button.on { background: var(--ink); color: var(--surface); }

  /* Driver strip */
  .strip { flex-direction: row; align-items: stretch; }
  .strip .lead { width: 196px; flex: none; padding: 12px var(--inset); border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; justify-content: space-between; }
  .strip .lead b { font: var(--c-head); white-space: nowrap; }
  .strip .lead .cnt { display: grid; grid-template-columns: auto auto; gap: 2px 10px; font: var(--c-small); color: var(--ink-muted); white-space: nowrap; }
  .strip .lead .cnt span { display: inline-flex; align-items: center; gap: 6px; }
  .strip .lead .cnt i { width: 6px; height: 6px; border-radius: 50%; }
  .strip .list { flex: 1; min-width: 0; display: flex; gap: 8px; padding: 10px; overflow-x: auto; scrollbar-width: none; }
  .dc { flex: none; width: 196px; border-radius: var(--r-ctl); background: var(--surface-alt); padding: 8px 10px; display: grid; grid-template-columns: 56px minmax(0, 1fr); grid-template-rows: auto auto auto; column-gap: 10px; row-gap: 2px; align-items: center; }
  .dc .car { grid-row: 1 / 3; }
  .dc .nm { font: var(--c-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dc .pl { display: flex; gap: 6px; align-items: center; }
  .dc .st { grid-column: 1 / 3; display: flex; align-items: center; justify-content: space-between; gap: 6px; font: var(--c-small); color: var(--ink-muted); white-space: nowrap; margin-top: 4px; }
</style>
</head>
<body>
<div class="screen rail" id="screen">
  <div class="main">
    <header class="bar">
      <h1>Դիսպետչեր</h1>
      <span class="crumb"><i data-lucide="clock"></i><span class="num" id="clock">9:41</span> · <span id="today">Ուրբաթ</span> · Երևան</span>
      <div class="live"></div>
    </header>
    <div class="content">
      <!-- QUEUE: the centrepiece. No pagination: one scrolling list, lanes sticky. -->
      <section class="card q" aria-label="Հերթ">
        <div class="card-h" style="padding:0 12px">
          <div class="tabs" role="tablist" id="qtabs"></div>
          <div class="end"><span class="chip" style="height:26px">Իմերը <span class="c num">1</span></span><button class="btn ghost icon s" aria-label="Որոնել հերթում (/)"><i data-lucide="search"></i></button></div>
        </div>
        <div class="scroll-y grow" id="queue" data-truncate></div>

<script>

  const lanes = [
    { k: 'problems', ic: 'circle-alert', name: 'Խնդիրներ', end: 'պետք է միջամտել', rows: [
      { a: 'Տիգրան Մեծի 67', ph: '099 11-22-33', why: 'Ուղևորը չեկավ · վարորդը սպասում է', age: '07:34', late: 1, acts: 'assign-force', sel: 1 },
      { a: 'Ծովակալ Իսակովի պողոտա 24', ph: '011 00-08-02', why: 'Վարորդ չկա · 2 ալիք', age: '33:01', late: 1, acts: 'search-assign', pre: 'Նախնական · 15:45' },

    { k: 'unassigned', ic: 'circle-dashed', name: 'Չնշանակված', end: 'նորմ՝ 3 ր', rows: [

      { a: 'Մաշտոցի պող. 53, «Երևան Մոլ» մուտք 2', ph: '093 11-80-02', d: 'Դավթաշեն 3-րդ թաղ.', age: '01:06', sla: .37, acts: 'release' },
      { a: 'Աբովյան 4', ph: '077 50-12-12', d: 'Արաբկիր, Կոմիտաս 49', age: '00:42', sla: .23, claimed: 'Մարիամ Հ.' },
    ] },
    { k: 'searching', ic: 'loader', name: 'Որոնում', end: '', rows: [
      /* The walkthrough ride (ECO.RIDE): booked in the rider app at 9:40, offered to Արամ Պ. now, assigned 9:41. */
      { a: ECO.RIDE.pickup, ph: ECO.RIDE.rider.phone, d: ECO.RIDE.drop, age: '00:52', info: 'առաջարկ՝ Արամ Պ.', walk: 1 },
      { a: 'Սայաթ-Նովա 19', ph: '094 77-31-08', d: 'Կասկադ', age: '00:23', info: 'ալիք 1 · 3 հարցված' },
      { a: 'Բաղրամյան 24', ph: '077 41-22-08', d: 'Զվարթնոց օդանավակայան', age: '00:51', info: 'ալիք 2 · 5 հարցված' },
    ] },
    { k: 'active', ic: 'circle-check', name: 'Ընթացիկ', end: '', rows: [
      { a: 'Թումանյան 21', ph: '098 23-55-90', st: 'Ճանապարհին', drv: 'Սուրեն Մ.', pl: '22 OU 447', age: '04 ր' },
      { a: 'Հյուսիսային պող. 1', ph: '055 20-44-19', st: 'Տեղում', drv: 'Գագիկ Ա.', pl: '34 LS 108', age: '01:12' },
      { a: 'Վազգեն Սարգսյան 10', ph: '091 08-76-30', st: 'Ուղևորի հետ', drv: 'Տիգրան Ա.', pl: '12 TT 304', age: '12:31' },
      { a: 'Արշակունյաց 2', ph: '096 14-02-71', st: 'Ուղևորի հետ', drv: 'Արմեն Գ.', pl: '35 OS 512', age: '08:05' },
      { a: 'Հալաբյան 41', ph: '041 33-21-90', st: 'Ճանապարհին', drv: 'Դավիթ Կ.', pl: '09 DK 118', age: '06 ր' },
    ] },
  ]
  const acts = {
    take: '<button class="btn secondary xs">Վերցնել <span class="kbd">T</span></button>',

    'search-assign': '<button class="btn secondary xs">Նշանակել <span class="kbd">A</span></button><button class="btn secondary xs">Ուղարկել որոնման</button><button class="btn secondary xs">Փոխել վիճակը…</button><button class="btn ghost xs icon" aria-label="Զանգել ուղևորին"><i data-lucide="phone"></i></button>',

  if (window.DX) DX.lanes(lanes, acts) /* dispatch-states.js: ?state= / ?intake= variants */

  for (const L of lanes) {
    h += `<div class="l-${L.k}"><div class="lane-h"><i data-lucide="${L.ic}"></i>${L.name} <span class="c num">${L.rows.length}</span><span class="end">${L.end}</span></div>`

  const INTAKE = QS.get('intake')
  const TAB = QS.get('tab') === 'scheduled' || INTAKE === 'booking' ? 'scheduled' : 'now'
  const B = ECO.BOOKINGS
  /* The lane, ordered by the promised hour (scheduled-lane.tsx) — except a row that needs a human, which leads the lane
     as Problems leads the Now tab (UX audit 2026-10-15: a departure from code order). Five bookings from ECO plus one
     local row: Դավիթ Կ.'s 10:00 airport run, which he set off for at 09:35 — the same car the Active lane shows
     «Ճանապարհին» to Հալաբյան 41. problem: driver_blocked = problem.driver_blocked (real). There is no «Չեմ հասցնի»:
     a driver cannot refuse a pre-order, the dispatcher handles it (team review 2026-10-16, D1). */

    { t: '10:00', a: 'Հալաբյան 41', d: 'Զվարթնոց օդանավակայան', ph: '041 33-21-90', drv: 'Դավիթ Կ.', pl: '09 DK 118', started: '09:35' },
    { t: B.kom.time, a: B.kom.pickup, d: B.kom.drop, ph: B.kom.phone, drv: B.kom.driver.short, pl: B.kom.driver.plate, from: B.kom.held },
    /* Transfers (owner 2026-10-14) ride the same lane, badged with the flight. The phone column is the booker's
       (a foreign passenger number would not fit the mono column; the full passenger record is on Transfers). */
    ...[ECO.TRANSFERS[1], ECO.TRANSFERS[2]].map((x) => ({ t: x.time, a: x.pickup, d: x.drop, ph: x.phone.startsWith('+') ? '010 59-12-34' : x.phone, trf: x.flight, drv: x.driver && x.driver.short, pl: x.driver && x.driver.plate, from: x.driver ? x.held : null, tier: 'Transfer', auto: x.driver ? null : '23:25' })),
    { day: 'Շբթ', t: B.bag.time, a: B.bag.pickup, d: B.bag.drop, ph: B.bag.phone, drv: B.bag.driver.short, pl: B.bag.driver.plate },
    { day: 'Շբթ', t: B.air.time, a: B.air.pickup, d: B.air.drop, ph: B.air.phone, drv: B.air.driver.short, pl: B.air.driver.plate, from: B.air.held, sel: INTAKE !== 'booking' },
    { day: 'Շբթ', t: ECO.TRANSFERS[0].time, a: ECO.TRANSFERS[0].pickup, d: ECO.TRANSFERS[0].drop, ph: ECO.CUSTOMER.phone, trf: ECO.TRANSFERS[0].flight, drv: ECO.TRANSFERS[0].driver.short, pl: ECO.TRANSFERS[0].driver.plate, from: ECO.TRANSFERS[0].held },
    { day: 'Կիր', tier: B.sun.tier, auto: B.sun.activates, t: B.sun.time, a: B.sun.pickup, d: B.sun.drop, ph: B.sun.phone, blocked: 1 },

  ]
  /* Row geometry from scheduled-lane.tsx: the hour (with the weekday when not today) leads in its mono column; then the
     pickup, and the phone with the destination — or the reason in the destination's slot when the booking needs a
     human. «Կարող է մեկնել HH:MM-ից» (startableFrom) / «Վարորդը մեկնեց HH:MM» (startedByDriver) take a small third line
     here rather than squeezing the pickup (the real row puts them beside it; at 452px the pickup lost). The pre-assigned
     driver's name at the end of line 2 is drawn ahead (the wire row has no driver). */
  const bookingRow = (r) => {
    const named = `Չեղարկել նախնական պատվերը՝ ${r.a}, ${r.day ? r.day + ' ' : ''}${r.t}`
    const l1 = r.started ? `<span class="st ok"><i data-lucide="navigation"></i>Վարորդը մեկնեց <span class="mono">${r.started}</span></span>`
      : r.from ? `<span class="st">Կարող է մեկնել <span class="mono">${r.from}</span>-ից</span>`
      /* Owner Q1: a pre-order with no driver is searched AUTOMATICALLY among its tariff's drivers when it comes due. */
      : r.auto ? `<span class="st"><i data-lucide="${r.blocked ? 'user-x' : 'search'}"></i>${r.blocked ? 'Վարորդն արգելափակված է · ' : ''}ավտոմատ որոնում · ${r.tier} · <span class="mono">${r.auto}</span>-ին</span>` : ''
    const ctx = r.why ? `<span class="why trunc">${r.why}</span>` : `${r.trf ? `<span class="co-badge"><i data-lucide="plane"></i><span class="mono">${r.trf}</span></span>` : ''}<span class="trunc">${r.d}</span>`
    const who = r.why ? '' : r.drv ? `<span class="drv"><i data-lucide="user-check"></i>${r.drv}</span>`
      : r.co ? `<span class="co-badge"><i data-lucide="building-2"></i>${ECO.COMPANY.short}</span>` : '<span class="none">Ավտոմատ</span>'

  /* ── Intake (intake-panel.tsx). Phone and pickup are the only required fields (§9.1). Band 3 is the real sub-tabs

    ${CO ? `<div class="cust"><div class="t"><span>${ECO.COMPANY.rider}</span><span class="co-badge"><i data-lucide="building-2"></i>${ECO.COMPANY.short} · ընկերության հաշվին</span></div>

      : `<div class="cust"><div class="t"><span>Անի Պետրոսյան</span><span class="faint num">· 14 պատվեր · վերջինը՝ երեկ</span></div>
        <div class="rec"><span class="chip">Կոմիտաս 12</span><span class="chip">Վազգեն Սարգսյան 10</span><span class="chip">Զվարթնոց</span></div></div>`}

    ${CO ? `<div><label class="label">Ուր <span class="faint" style="font-weight:400">· ոչ պարտադիր</span></label><div class="pinrow"><span class="pin b">Բ</span><div class="input l"><span class="val">${B.co.drop}</span><i data-lucide="circle-check" style="color:var(--ok)"></i></div></div></div>

        ${INTAKE ? '' : `<div class="pop" data-overlay role="listbox" aria-label="Հասցեների առաջարկներ" style="top:62px">
          <div class="on"><i data-lucide="map-pin"></i><span>Հալաբյան 41</span><span class="faint">· Աջափնյակ</span></div>
          <div><i data-lucide="map-pin"></i><span>Հալաբյան 46</span><span class="faint">· Աջափնյակ</span></div></div>`}</div>`}
    <div><label class="label">Սակագին <span class="faint" style="font-weight:400">· 1–8</span></label><div class="tiers" id="tiers" data-truncate></div></div>
    <div class="two">
      <div><label class="label">Երբ</label><div class="input"><i data-lucide="clock"></i><span class="val">Հիմա</span><i data-lucide="chevron-down"></i></div></div>
      <div><label class="label">Վճարում</label>${CO ? '<div class="input" aria-readonly="true" style="background:var(--surface-alt);box-shadow:inset 0 0 0 1px var(--line-soft)"><i data-lucide="building-2"></i><span class="val">Ընկերություն</span><i data-lucide="lock"></i></div>' : '<div class="input"><i data-lucide="banknote"></i><span class="val">Կանխիկ</span><i data-lucide="chevron-down"></i></div>'}</div>
    </div>
    <div><label class="label">Վարորդ <span class="faint" style="font-weight:400">· ոչ պարտադիր</span></label><div class="input" id="drvf"><i data-lucide="search"></i><span class="val">Ավտոմատ ընտրություն</span><i data-lucide="chevron-down"></i></div></div>
    ${subTabs()}`

  /* Tier picker: prices for the typed phone order, Կոմիտաս 12 → Հալաբյան 41 (3,6 կմ, 9 ր). The walkthrough trip is in the queue. */
  const IK = CO ? B.co.km : 3.6, IM = CO ? B.co.min : 9
  document.getElementById('sumfare').textContent = INTAKE === 'price' ? amd(2400) : amd(fare(TIERS[0], IK, IM))
  document.getElementById('sumtxt').textContent = INTAKE === 'price' ? 'Ֆիքսված գին' : `${TIERS[0].name} · ${ECO.dec(IK)} կմ · ${IM} ր`
  let t = `<button class="tierb any"><span class="anyic"><i data-lucide="locate-fixed"></i></span><span class="n">Մոտակա ազատը</span><span class="p"><i class="tk">1</i></span></button>`
  TIERS.forEach((x, i) => { t += `<button class="tierb${i === 0 ? ' on' : ''}" aria-label="${x.name}, ${i + 2}"><span class="car xs">${carImg(x.id)}</span><span class="n">${x.name.replace('Eco ', '')}</span><span class="p"><i class="tk">${i + 2}</i>${amd(fare(x, IK, IM))}</span></button>` })
  /* Owner 2026-10-14: «Transfer» is a tariff (key 8). Choosing it turns the form into the transfer form (?intake=transfer). */
  t += `<a class="tierb" href="?theme=${THEME}&intake=transfer" style="text-decoration:none;color:inherit" aria-label="${ECO.TRANSFER_TIER.name}, 8"><span class="anyic"><i data-lucide="plane-landing"></i></span><span class="n">${ECO.TRANSFER_TIER.name}</span><span class="p"><i class="tk">8</i>${amd(ECO.TRANSFER_TIER.fare)}</span></a>`
  document.getElementById('tiers').innerHTML = t
  /* ── ?intake=transfer (owner 2026-10-14): the dispatcher picks «Transfer» (key 8) while a company's contact is on the
     line booking for a guest (ECO.TRANSFERS[0], T-0031). Phone and pickup stay the only required fields of the ride;
     the transfer adds flight, time, passenger, terminal/exit and the sign. It is saved as a pre-order with the
     Transfer badge and reaches drivers exactly like one. Drawn ahead (no transfer entity in the API). ── */
  if (INTAKE === 'transfer') {
    const TF = ECO.TRANSFERS[0]
    document.getElementById('intake').innerHTML = `
    <div><label class="label">Հեռախոս · զանգողը</label><div class="input l"><i data-lucide="phone"></i><span class="val mono">${ECO.CUSTOMER.phone}</span></div></div>
    <div class="cust"><div class="t"><span>${ECO.COMPANY.rider}</span><span class="co-badge"><i data-lucide="building-2"></i>${ECO.COMPANY.short}</span></div></div>
    <div><label class="label">Սակագին</label><div class="tiers"><span class="tierb any"><span class="anyic"><i data-lucide="arrow-left"></i></span><span class="n">Մյուսները</span></span><span class="tierb on" style="grid-template-columns:40px minmax(0,1fr) auto"><span class="anyic"><i data-lucide="plane-landing"></i></span><span class="n">${ECO.TRANSFER_TIER.name}</span><span class="p"><i class="tk">8</i>${amd(TF.fare)}</span></span></div></div>
    <div class="two">
      <div><label class="label">Ուղղություն</label><div class="seg" role="radiogroup" aria-label="Ուղղություն" style="display:flex"><button class="on" role="radio" aria-checked="true" style="flex:1;justify-content:center">Ժամանում</button><button role="radio" aria-checked="false" style="flex:1;justify-content:center">Մեկնում</button></div></div>
      <div><label class="label">Չվերթ</label><div class="input focus"><i data-lucide="plane"></i><span class="val mono">${TF.flight}</span><i data-lucide="circle-check" style="color:var(--ok)"></i></div></div>
    </div>
    <div class="two">
      <div><label class="label">Օր և ժամ</label><div class="input"><i data-lucide="calendar-clock"></i><span class="val">Վաղը, <span class="mono">${TF.time}</span></span></div></div>
      <div><label class="label">Տերմինալ · ելք</label><div class="input"><span class="val">Ժամանման սրահ · ելք 2</span></div></div>
    </div>
    <p class="faint" style="font:var(--c-small);margin-top:-4px">${TF.from} · վայրէջք <span class="mono">${TF.land}</span> · նստեցում՝ <span class="mono">30</span> րոպե հետո · սպասումը՝ մինչև <span class="mono">${ECO.TRANSFER_TIER.waitFreeMin}</span> րոպե անվճար</p>
    <div><label class="label">Որտեղից</label><div class="pinrow"><span class="pin">Ա</span><div class="input l"><span class="val">${TF.pickup}</span><i data-lucide="circle-check" style="color:var(--ok)"></i></div></div></div>
    <div><label class="label">Ուր</label><div class="pinrow"><span class="pin b">Բ</span><div class="input l"><span class="val">${TF.drop}</span><i data-lucide="circle-check" style="color:var(--ok)"></i></div></div></div>
    <div class="two">
      <div><label class="label">Ուղևոր</label><div class="input"><i data-lucide="user"></i><span class="val">${TF.passenger}</span></div></div>
      <div><label class="label">Ուղևորի հեռախոս</label><div class="input" style="min-width:0"><span class="val mono trunc">${TF.phone}</span></div></div>
    </div>
    <div class="two">
      <div><label class="label">Ցուցանակ</label><div class="input" style="min-width:0"><span class="val mono trunc">${TF.sign}</span></div></div>
      <div><label class="label">Ուղևորներ · ուղեբեռ</label><div class="input"><i data-lucide="users"></i><span class="val mono">${TF.pax}</span><i data-lucide="luggage"></i><span class="val mono">${TF.bags}</span></div></div>
    </div>
    <div class="billing" role="group" aria-label="Վճարող"><label class="label" style="margin:0">Վճարող</label>
      <div class="seg" role="radiogroup"><button class="on" role="radio" aria-checked="true">Ընկերություն · ${ECO.COMPANY.short}</button><button role="radio" aria-checked="false">Կանխիկ</button><button role="radio" aria-checked="false">NFC</button></div></div>`
    document.getElementById('sumfare').textContent = amd(TF.fare)
    document.getElementById('sumtxt').textContent = `${ECO.TRANSFER_TIER.name} · Վաղը ${TF.time}`
    document.querySelector('.actbar .btn.primary').innerHTML = 'Ստեղծել տրանսֆեր <span class="kbd">↵</span>'
  }
  /* ── ?intake=pay (owner 2026-10-15, revised by the team review 2026-10-16, C2): the «Վճարում» list open. By phone a
     dispatcher takes Cash · NFC · POS · Company — and NO card: a card is the rider's own choice in the app, charged by
     the app (iPay / ArCa), so the console's list has no card row and no saved card (the order the rider booked with a
     card shows it read-only in the edit panel, ?panel=card). NFC · POS (owner 2026-10-16): fleet cars only (they have
     the ACBA app), +2 % on the fare; the driver takes the tap in ACBA's app and confirms it in ours. Company is shown
     off with the reason when the caller is not an employee on account. Cash is chosen, so the read-back is the fare
     alone; the NFC row says what choosing it adds. ── */
  const FEE = (f) => Math.round(f * 0.02) /* owner 2026-10-15 (final): +2 % on top of NFC · POS (and card / wallets in the app); cash and company: none */
  if (INTAKE === 'pay') {
    const two = document.querySelector('#intake .two')
    const pay = two.children[1].querySelector('.input')
    pay.classList.add('focus'); pay.setAttribute('aria-expanded', 'true')
    pay.innerHTML = '<i data-lucide="banknote"></i><span class="val">Կանխիկ</span><i data-lucide="chevron-up"></i>'
    two.insertAdjacentHTML('afterend', `<div class="payopts" role="listbox" aria-label="Վճարում" data-overlay data-truncate>
      <div class="on" role="option" aria-selected="true"><i data-lucide="banknote"></i>Կանխիկ<span class="k">1</span></div>
      <div role="option"><i data-lucide="smartphone-nfc"></i>NFC · POS<span class="end">+2 % · ավտոպարկի մեքենա</span><span class="k">2</span></div>
      <div role="option" aria-disabled="true" class="off"><i data-lucide="building-2"></i>Ընկերություն<span class="end">զանգողը կցված չէ ընկերությանը</span></div>
      <p><i data-lucide="smartphone"></i>Քարտով վճարում՝ ուղևորն ընտրում է հավելվածում</p></div>`)
    document.querySelector('#intake .in-tabs').parentElement.remove()
    const f = fare(TIERS[0], IK, IM)
    document.getElementById('sumfare').textContent = amd(f)
    document.getElementById('sumtxt').textContent = `NFC-ով՝ ${amd(f + FEE(f))}`
  }
  /* ── ?intake=airport (zones.html rules, owner 2026-10-15; team review 2026-10-16, C3). Pickup inside «Զվարթնոց
     օդանավակայան»: the zone's rules arrive with the address, not at «Ստեղծել». The zone's «no cash on pickup» rule
     governs rider-app bookings ONLY: an airport dispatcher creates and escorts the guest's order from this console, so
     Cash · NFC · Company are all allowed here (NFC if the guest says yes, otherwise cash, company in some cases) and the
     single line under the choice says so, neutral (nothing is refused). Eco Kids keeps its key but is off («Eco Kids-ը չի սպասարկում»), so keys 1–8 never move under the fingers; the
     zone-to-zone price Զվարթնոց → Կենտրոն is fixed (zones?pair=1: 5 000 ֏, which includes the +500 ֏ zone charge) and
     fills the agreed-price band, locked, read as «Ֆիքսված · 5 000 ֏»; paid by NFC · POS (the guest said yes), so the read-back adds the 2 % fee. ── */
  if (INTAKE === 'airport') {
    const FX = 5000, AK = 14.2, AM = 22
    document.getElementById('intake').innerHTML = `
    <div><label class="label">Հեռախոս</label><div class="input l"><i data-lucide="phone"></i><span class="val mono">091 70-33-14</span></div></div>
    <div class="cust"><div class="t"><span>Լևոն Ավագյան</span><span class="faint num">· 6 պատվեր · վերջինը՝ անցյալ շաբաթ</span></div></div>
    <div><label class="label">Որտեղից</label><div class="pinrow"><span class="pin">Ա</span><div class="input l"><span class="val">Զվարթնոց, ժամանման սրահ</span><i data-lucide="circle-check" style="color:var(--ok)"></i></div></div>
      <p class="zline"><i data-lucide="map"></i>Գոտի՝ <b>Զվարթնոց</b> · <a href="zones.html?theme=${THEME}">5 կանոն</a></p></div>
    <div><label class="label">Ուր <span class="faint" style="font-weight:400">· ոչ պարտադիր</span></label><div class="pinrow"><span class="pin b">Բ</span><div class="input l"><span class="val">Աբովյան 10, Կենտրոն</span><i data-lucide="circle-check" style="color:var(--ok)"></i></div></div></div>
    <div><label class="label">Սակագին <span class="faint" style="font-weight:400">· 1–8</span></label><div class="tiers" id="tiers" data-truncate></div></div>
    <div class="two">
      <div><label class="label">Երբ</label><div class="input"><i data-lucide="clock"></i><span class="val">Հիմա</span><i data-lucide="chevron-down"></i></div></div>
      <div><label class="label">Վարորդ <span class="faint" style="font-weight:400">· ոչ պարտ.</span></label><div class="input"><i data-lucide="search"></i><span class="val">Ավտոմատ</span><i data-lucide="chevron-down"></i></div></div>
    </div>
    <div class="billing" role="group" aria-label="Վճարում"><label class="label" id="zpl" style="margin:0">Վճարում</label><div class="seg" role="radiogroup" aria-labelledby="zpl" aria-describedby="zcash"><button role="radio" aria-checked="false">Կանխիկ</button><button class="on" role="radio" aria-checked="true">NFC · +2 %</button><button role="radio" aria-checked="false">Ընկերություն</button></div></div>
    <p class="zline" id="zcash" role="status" style="margin:-4px 0 0"><i data-lucide="info"></i>Զվարթնոց · «կանխիկ՝ ոչ» կանոնը հավելվածի պատվերների համար է · դիսպետչերի պատվերում թույլատրված են երեքն էլ</p>
    <div><div class="in-tabs" role="tablist" aria-label="Նոր պատվեր"><button role="tab" aria-selected="false" tabindex="-1">Քարտեզ</button><button role="tab" aria-selected="false" tabindex="-1">Նշումներ</button><button role="tab" aria-selected="true">Ֆիքսված գին<span class="dot" aria-hidden="true"></span></button></div>
      <div role="tabpanel" style="padding-top:8px"><div class="row-flex"><div class="input l" style="width:160px;background:var(--surface-alt);box-shadow:inset 0 0 0 1px var(--line-soft)" aria-readonly="true"><i data-lucide="lock"></i><span class="val mono">${nf(FX)}</span><span class="faint">֏</span></div>
        <p style="font:var(--c-small);color:var(--ink-muted)"><b style="color:var(--ink)">Ֆիքսված · ${amd(FX)}</b><br>Զվարթնոց → Կենտրոն · գոտուց գոտի</p></div></div></div>`
    let t = `<button class="tierb any"><span class="anyic"><i data-lucide="locate-fixed"></i></span><span class="n">Մոտակա ազատը</span><span class="p"><i class="tk">1</i></span></button>`
    TIERS.forEach((x, i) => {
      /* The pair's fixed fare is per tier (zones?pair=1 lists City · Comfort · Business · Vip); Van has none and is metered
         plus the +500 ֏ zone charge. Business and Vip fixed too, so no dearer tier ever reads cheaper than City's 5 000 ֏. */
      const FXT = { city: FX, partner: FX, business: 7000, vip: 8500 }, fixed = FXT[x.id], off = x.id === 'kids'
      t += off ? `<button class="tierb off" aria-disabled="true" aria-label="${x.name}, ${i + 2}, Զվարթնոցում չի սպասարկվում" title="Զվարթնոց · Eco Kids-ը չի սպասարկում"><span class="car xs">${carImg(x.id)}</span><span class="n">${x.name.replace('Eco ', '')}</span><span class="p"><i class="tk">${i + 2}</i>ոչ այստեղ</span></button>`
        : `<button class="tierb${i === 0 ? ' on' : ''}" aria-label="${x.name}, ${i + 2}"><span class="car xs">${carImg(x.id)}</span><span class="n">${x.name.replace('Eco ', '')}</span><span class="p"><i class="tk">${i + 2}</i>${fixed ? amd(fixed) : amd(fare(x, AK, AM) + 500)}</span></button>`
    })
    t += `<span class="tierb" aria-label="${ECO.TRANSFER_TIER.name}, 8"><span class="anyic"><i data-lucide="plane-landing"></i></span><span class="n">${ECO.TRANSFER_TIER.name}</span><span class="p"><i class="tk">8</i>${amd(ECO.TRANSFER_TIER.fare)}</span></span>`
    document.getElementById('tiers').innerHTML = t
    document.getElementById('sumfare').textContent = amd(FX + FEE(FX))
    document.getElementById('sumtxt').textContent = `NFC · 2 % · +${nf(FEE(FX))}`
    document.getElementById('sumtxt').title = `Ֆիքսված ${amd(FX)} + սպասարկման վճար ${amd(FEE(FX))}`
  }
  /* Scrolled to the foot (the payment list / the fixed price), snapped to a field's top edge so no label sits half under the head. */
  if (['pay', 'airport', 'driver', 'driver-set', 'booking'].includes(INTAKE)) document.fonts.ready.then(() => {
    const ib = document.getElementById('intake'), max = ib.scrollHeight - ib.clientHeight
    const top0 = ib.getBoundingClientRect().top - ib.scrollTop
    const snap = [...ib.children].map((c) => c.getBoundingClientRect().top - top0 - 12).find((y) => y >= max)
    if (snap !== undefined && snap > max) ib.style.paddingBottom = (12 + snap - max) + 'px'
    if (max > 0) ib.scrollTop = snap !== undefined ? snap : max
  })
  /* The state's subject in view: the refusal (company) or the agreed-price band (price) sits at the foot of the
     scrolled form, as it does after the operator has tabbed down to it. */
  if (CO || INTAKE === 'price') document.fonts.ready.then(() => {
    const ib = document.getElementById('intake'), tg = CO ? ib.lastElementChild : ib.querySelector('[role=tabpanel]') /* CO: to the form's foot, so no label straddles the action bar; the limit line stays in view */
    const top0 = ib.getBoundingClientRect().top - ib.scrollTop
    const need = tg.getBoundingClientRect().bottom - ib.getBoundingClientRect().bottom + 12 + ib.scrollTop
    /* Snap to a field's top edge so no label is left half under the card head. */
    const snap = [...ib.children].map((c) => c.getBoundingClientRect().top - top0 - 12).find((y) => y >= need)
    if (need > 0 && snap !== undefined) {
      const max = ib.scrollHeight - ib.clientHeight
      if (snap > max) ib.style.paddingBottom = (12 + snap - max) + 'px'
      ib.scrollTop = snap
    } else if (need > 0) ib.scrollTop = need
  })

  /* Driver strip */
  const order = { free: 0, away: 2, lost: 3, ride: 1 }
  const idle = ['14 ր', '9 ր', '6 ր', '4 ր', '2 ր', '1 ր']
  let fi = 0
  document.getElementById('strip').innerHTML = DRIVERS.slice().sort((a, b) => order[a.state] - order[b.state]).map((d, i) => {
    const [tone, word] = DSTATE[d.state]
    const tail = d.state === 'free' ? `ազատ ${idle[fi++]}` : d.state === 'ride' ? '→ Կոմիտաս 12' : d.state === 'lost' ? 'դիրքը՝ 03:40 առաջ' : 'բացակա 7 ր'
    return `<div class="dc"${i > 3 ? ' data-peek' : ''}><span class="car s">${carImg(d.tier)}</span><span class="nm">${d.name.split(" ")[0]} ${d.name.split(" ")[1][0]}.</span><span class="pl"><span class="plate">${d.plate}</span></span>
      <span class="st"><span class="pill ${tone}" style="height:20px"><i class="d"></i>${word}</span><span class="trunc">${tail}</span></span></div>`
  }).join('')
  icons()

  /* Map: cars, queue pins with ages, and the walkthrough ride being offered (ECO.RIDE, real street geometry). */
  const map = makeMap(document.getElementById('map'), { fit: [[40.170, 44.493], [40.208, 44.528]], padTL: [40, 56], padBR: [40, 24], badge: { bottom: '12px', right: '12px' } })
  DRIVERS.forEach((d, i) => {
    const fill = d.state === 'free' ? 'var(--brand)' : d.state === 'ride' ? 'var(--car-top)' : 'var(--ink-faint)'
    htmlMarker(map, d.ll, `<div class="mk-car ${d.state}" data-overlay data-car="${i}" tabindex="0" role="button" aria-label="${d.plate} · ${d.name}">${carTop((i * 47) % 360, fill)}</div>`, [40, 40])
  })
  drawRoute(map, ROUTES.pickupToDrop.pts, { weight: 5 })
  const P = ROUTES.pickupToDrop.pts
  if (QS.get('state') !== 'sos') htmlMarker(map, P[0], '<div class="mk-pin l-searching" style="transform:none"><i></i><b>00:52</b></div>', [90, 24], [12, 12])
  htmlMarker(map, P[P.length - 1], '<div class="mk-drop" aria-label="' + ECO.RIDE.drop + '"></div>', [14, 14])
  htmlMarker(map, [40.1990, 44.5205], '<div class="mk-pin l-problems" style="transform:none"><i></i><b>07:34</b></div>', [90, 24], [12, 12])
  htmlMarker(map, [40.1735, 44.5005], '<div class="mk-pin l-unassigned" style="transform:none"><i></i><b>01:06</b></div>', [90, 24], [12, 12])
  htmlMarker(map, [40.1800, 44.5185], '<div class="mk-pin l-unassigned" style="transform:none"><i></i><b>00:42</b></div>', [90, 24], [12, 12])
  if (window.DX) DX.after()
</script>
</body>
</html>
