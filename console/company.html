<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company</title>
<link rel="stylesheet" href="console.css">
<link rel="stylesheet" href="corporate.css">
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="../kit.js"></script>
<script src="console.js"></script>
<script src="company-report.js"></script>
<script src="console-audit.js"></script>
</head>
<body>
<!-- Mirrors apps/operator components/admin/company-detail.tsx and its tabs: company-agreement (+ agreement-form),
     company-employees, company-statement, company-settings. Corporate K2–K6. Owner 2026-10-14: fixed routes and the
     cost-centre code are removed; employees get monthly limits and allowed places (drawn ahead).
     Owner decision 11 + Q11 (2026-10-14): no invoices. One «Հաշվետվություն» tab is the company report for a period (month
     or chosen days): rides with employee, route, tariff and price, totals, Excel / CSV / PDF, the optional
     «Վճարված» mark, and «Ուղարկել ընկերությանը» inline with the company's email. ?tab=report; the old ids statement,
     rides, invoices and months open it too. Every confirmation is an armed button or a panel under its
     row; nothing is a modal (§9.8).
     Company console (owner 2026-10-16, company-portal/): ?tab=settings carries «Ընկերության վահանակ»: the portal on/off
     for this company, its one login (the manager's name and phone), and the tariffs the company allows its employees
     (the same setting the company edits in its console; the latest change wins, audited). ?tab=settings&portal=off is a
     company without a portal: the login is closed, the allowed tariffs still govern the rider app and dispatch intake. -->
<div class="screen" id="screen">
  <div class="main">
    <header class="bar">
      <a class="btn ghost icon s" href="companies.html" aria-label="Հետ՝ Ընկերություններ" id="back"><i data-lucide="arrow-left"></i></a>
      <span class="crumb"><a href="companies.html" id="crumb" style="color:inherit;text-decoration:none">Ընկերություններ</a> <i data-lucide="chevron-right"></i></span><h1 id="title"></h1>
      <div class="live"></div>
    </header>
    <div class="content one">
      <section class="card page" id="page"></section>
    </div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search)
  const TABQ = q.get('tab') || 'agreement'
  /* routes: the agreement form open · rides → the report · invoices → months (old links) */
  const tab = { routes: 'agreement', rides: 'report', statement: 'report', invoices: 'report', months: 'report' }[TABQ] || TABQ
  shell('companies')
  const C = ECO.COMPANY, R = ECO.RIDE, amd = ECO.amd
  const T = (s) => `?theme=${THEME}&tab=${s}`
  document.getElementById('title').textContent = C.name
  document.getElementById('back').href = 'companies.html?theme=' + THEME
  document.getElementById('crumb').href = 'companies.html?theme=' + THEME

  /* ── Header: who + credit in use (unpaid months + the open month, against the agreement's limit) ── */
  const pctUsed = Math.round(C.used / C.limit * 100)
  const TABS = [['agreement', 'Պայմանագիր և գներ'], ['employees', 'Աշխատակիցներ'], ['report', 'Հաշվետվություն'], ['settings', 'Կարգավորումներ']]
  const head = `
    <div class="cohead">
      <span class="ic" aria-hidden="true"><i data-lucide="building-2"></i></span>
      <div style="min-width:0"><h2>${C.name}</h2>
        <div class="meta"><span>«Արարատ Սոֆթ» ՍՊԸ</span><span class="mono">${C.tin}</span><span class="pill">Հետվճար</span><span class="pill ok"><i class="d"></i>Բաց</span></div></div>
      <div class="credit" aria-label="Սահմանաչափ">
        <span>Սահմանաչափ՝ օգտագործված</span><span class="r"><b>${amd(C.used)}</b> <span class="faint">/ ${amd(C.limit)}</span></span>
        <span class="bar2" role="img" aria-label="${pctUsed} % օգտագործված"><i style="width:${pctUsed}%"></i></span>
      </div>
    </div>
    <div class="tabsl" role="tablist" aria-label="Ընկերության բաժիններ">${TABS.map(([k, l]) => `<a href="${T(k)}" role="tab" aria-selected="${k === tab}" class="${k === tab ? 'on' : ''}">${l}</a>`).join('')}</div>`

  /* ── Agreement & pricing (company-agreement.tsx). Append-only versions; a future one can be withdrawn.
     Owner 2026-10-14: fixed routes and the company/cost-centre code are REMOVED; the agreement carries the company
     DEFAULT monthly limit per employee instead (by amount or by ride count; an employee may have his own). ── */
  const EL = C.empLimit
  const VERS = [
    ['01.11.2026', 400000, '5', 'future', '2027-ի բյուջե'],
    ['01.09.2026', 300000, '5', 'in', 'Աշխատակցին՝ 50 000 ֏ ամսական'],
    ['01.03.2026', 200000, '0', 'past', 'Առաջին պայմանագիր'],
  ]
  const STATE = { future: ['info', 'Առաջիկա'], in: ['ok', 'Գործում է'], past: ['', 'Նախկին'] }
  const history = `<section class="sec"><h3>Բոլոր տարբերակները<span class="sub num">${VERS.length}</span></h3>
      <table class="tbl"><colgroup><col style="width:150px"><col><col style="width:110px"><col style="width:220px"></colgroup>
        <thead><tr><th>Սկսած</th><th>Սահմանաչափ</th><th class="c">Զեղչ</th><th>Վիճակ</th></tr></thead>
        <tbody>${VERS.map(([d, l, disc, st, note]) => `<tr><td class="mono">${d}</td><td class="wrap" style="padding-top:6px;padding-bottom:6px"><span class="mono">${amd(l)}</span><br><span class="faint" style="font:var(--c-small)">${note}</span></td><td class="c">${disc} %</td>
          <td><span class="row-flex" style="gap:6px"><span class="pill ${STATE[st][0]}"><i class="d"></i>${STATE[st][1]}</span>${st === 'future' ? '<button class="btn ghost s">Չեղարկել</button>' : ''}</span></td></tr>`).join('')}</tbody></table></section>`
  const current = `<section class="sec"><h3>Գործող պայմաններ<span class="sub">սկսած <span class="mono">01.09.2026</span></span><span class="end"><a class="btn secondary s" href="${T('routes')}"><i data-lucide="plus"></i>Նոր տարբերակ</a></span></h3>
      <div class="pad"><dl class="terms" style="grid-template-columns:repeat(4,minmax(0,1fr))">
        <div><dt>Վճարում</dt><dd>Հետվճար</dd></div>
        <div><dt>Սահմանաչափ</dt><dd class="mono">${amd(C.limit)}</dd></div>
        <div><dt>Զեղչ</dt><dd>5 %</dd></div>
        <div><dt>Աշխատակցի ամսական սահմանաչափ</dt><dd><span class="mono">${amd(EL.default.amount)}</span> <small>լռելյայն</small></dd></div>
      </dl></div>
      <div class="pad" style="border-top:1px solid var(--line-soft)"><div class="notice neutral"><i data-lucide="info"></i><span>Սահմանաչափից հետո և թույլատրված հասցեներից դուրս՝ ուղևորը վճարում է ինքը</span></div></div></section>`
  /* ?tab=routes (old id): «Նոր տարբերակ» open inline (agreement-form.tsx), prefilled from the version in force. */
  const form = `<section class="sec alt" aria-label="Նոր տարբերակ"><h3>Նոր տարբերակ<span class="sub">գործողից լրացված</span></h3>
      <div class="pad"><div class="fgrid" style="grid-template-columns:repeat(4,minmax(0,1fr))">
        <div><label class="label">Սկսած</label><div class="input"><i data-lucide="calendar"></i><span class="val mono">01.11.2026 00:00</span></div></div>
        <div><label class="label">Վճարում</label><div class="seg" role="radiogroup" aria-label="Վճարում"><button class="on" role="radio" aria-checked="true">Հետվճար</button><button role="radio" aria-checked="false">Կանխավճար</button></div></div>
        <div><label class="label">Զեղչ</label><div class="input"><span class="val mono">5</span><span class="faint">%</span></div></div>
        <div><label class="label">Սահմանաչափ</label><div class="input focus"><span class="val mono">400 000</span><span class="faint">֏</span></div><p class="hint">Դատարկ՝ առանց սահմանաչափի</p></div>
        <div><label class="label">Աշխատակցի ամսական սահմանաչափ</label><div class="seg" role="radiogroup" aria-label="Ըստ ինչի"><button class="on" role="radio" aria-checked="true">Գումար</button><button role="radio" aria-checked="false">Ուղևորություններ</button><button role="radio" aria-checked="false">Առանց</button></div></div>
        <div><label class="label">Գումարն ամսական</label><div class="input"><span class="val mono">50 000</span><span class="faint">֏</span></div><p class="hint">Աշխատակցի էջում կարելի է փոխել</p></div>
        <div class="full" style="grid-column:span 2"><label class="label">Նշում</label><div class="input"><span class="val">2027-ի բյուջե</span></div></div>
      </div>
      <div class="notice neutral" style="margin-top:12px"><i data-lucide="calendar-clock"></i><span>Գործում է միայն սկսած նշված օրից․ անցյալը չի փոխվում</span></div>
      <div class="formfoot"><a class="btn ghost" href="${T('agreement')}">Չեղարկել</a><button class="btn primary"><i data-lucide="check"></i>Պահել <span class="kbd">↵</span></button></div></div></section>`
  const agreement = TABQ === 'routes' ? `<div class="tb">${form}</div>` : `<div class="tb">${current}${history}</div>`

  /* ── Employees (company-employees.tsx): number (mono), name, this month's rides and amount, plus (owner 2026-10-14)
     the monthly limit — company default or his own, by amount or by rides — what is left, and his allowed places.
     ?emp=0 opens Աննա's panel under her row: limit + allowed places (corporate #1, #4). Drawn ahead of the API. ── */
  /* [name, phone, rides, amount, blacklisted, limit] limit: null = company default (amount), ['amd', n] or ['rides', n] */
  const EMP = [
    [C.rider, ECO.RIDE.rider.phone, 38, 52400, false, ['amd', EL.rider.amount], 3], ['Տիգրան Մանուկյան', '094 55-10-20', 29, 61200, false, ['rides', 40], 2], ['Լիանա Գրիգորյան', '077 31-44-90', 21, 25800, false, null, 2],
    ['Արսեն Սահակյան', '099 82-17-03', 17, 18300, false, null, 1], ['Նունե Պետրոսյան', '093 40-62-18', 14, 16900, false, ['rides', 15], 2], ['Գևորգ Հարությունյան', '098 11-27-65', 0, 0, true, null, 1],
    ['Մարիամ Ավագյան', '055 70-09-41', 6, 7200, false, null, 1], ['Վարդան Խաչատրյան', '091 66-38-12', 6, 2800, false, null, 2], ['Էլեն Սարգսյան', '096 24-51-77', 0, 0, false, null, 1],
    ['Կարեն Զաքարյան', '041 90-83-26', 0, 0, false, null, 1], ['Անի Մկրտչյան', '094 13-75-40', 0, 0, false, null, 1], ['Արամ Վարդանյան', '077 58-20-11', 0, 0, false, null, 1],
    ['Սոնա Հովսեփյան', '099 07-66-35', 0, 0, false, null, 1], ['Դավիթ Ղազարյան', '093 28-14-59', 0, 0, false, null, 1],
  ]
  const EMPQ = q.get('emp')
  const limCell = (lim, r, s) => {
    const [by, n] = lim || ['amd', EL.default.amount]
    const used = by === 'amd' ? s : r, left = Math.max(0, n - used), pct = Math.min(100, Math.round(used / n * 100))
    const val = by === 'amd' ? amd(n) : `${n} ուղևորություն`
    const lft = by === 'amd' ? amd(left) : `${left}`
    return `<td><span class="mono">${val}</span> <span class="faint" style="font:var(--c-small)">${lim ? 'անհատական' : 'լռելյայն'}</span></td>
      <td><span class="lim${pct >= 90 ? ' near' : ''}" style="display:flex;align-items:center;gap:8px;justify-content:flex-end"><span class="bar3" style="width:40px;flex:none" role="img" aria-label="${pct} % օգտագործված"><i style="width:${pct}%"></i></span><span class="mono${left === 0 ? ' warnn' : ''}">${lft}</span></span></td>`
  }
  const P = C.places
  const placeRow = (ic, label, addr, fixed) => `<div class="row-flex" style="gap:8px;height:36px;border-bottom:1px solid var(--line-soft)"><i data-lucide="${ic}"></i><b style="font:var(--c-strong);width:96px">${label}</b><span class="grow trunc">${addr}</span>${fixed ? '<span class="pill">ընկերության</span>' : '<button class="btn ghost s rev-act" style="opacity:1"><i data-lucide="x"></i>Հեռացնել</button>'}</div>`
  const empPanel = `<tr class="under"><td colspan="8"><div class="panel" style="margin-top:0">
      <div class="tb two" style="padding:0">
        <div><h4><i data-lucide="gauge"></i>Ամսական սահմանաչափ<span class="faint" style="font:var(--c-small);font-weight:400">${C.rider}</span></h4>
          <div class="seg" role="radiogroup" aria-label="Սահմանաչափ"><button role="radio" aria-checked="false">Լռելյայն · ${amd(EL.default.amount)}</button><button class="on" role="radio" aria-checked="true">Գումար</button><button role="radio" aria-checked="false">Ուղևորություններ</button></div>
          <div class="fgrid" style="margin-top:12px"><div><label class="label">Գումարն ամսական</label><div class="input focus"><span class="val mono">65 000</span><span class="faint">֏</span></div><p class="hint">Նոր ամսից՝ զրոյից</p></div>
            <div><span class="label">Այս ամիս</span><div class="facts" style="height:var(--h-m)"><span>Օգտագործված<b class="mono">${amd(EL.rider.used)}</b></span><span>Մնացել է<b class="mono">${amd(EL.rider.left)}</b></span></div></div></div>
          <p class="hint" style="margin-top:8px">Սահմանաչափից հետո ուղևորությունն անձնական է՝ ուղևորն ինքն է վճարում</p></div>
        <div><h4><i data-lucide="map-pin"></i>Թույլատրված հասցեներ<span class="faint" style="font:var(--c-small);font-weight:400">շառավիղ ${P.radius} մ</span></h4>
          ${P.rider.map((x) => placeRow(x.kind === 'home' ? 'house' : x.kind === 'office' ? 'building-2' : 'map-pin', x.label, x.addr, x.kind === 'office')).join('')}
          <div class="row-flex" style="gap:8px;margin-top:8px"><div class="input" style="width:150px"><span class="val ph">Անվանում</span></div><div class="input l grow"><i data-lucide="search"></i><span class="val ph">Հասցե՝ 2GIS-ից</span></div><button class="btn secondary"><i data-lucide="plus"></i>Ավելացնել</button></div>
          <p class="hint" style="margin-top:8px">Ընկերության հաշվին՝ միայն այս հասցեների միջև</p></div>
      </div>
      <div class="formfoot"><a class="btn ghost" href="${T('employees')}">Փակել</a><button class="btn primary"><i data-lucide="check"></i>Պահել</button></div></div></td></tr>`
  const employees = `<div class="tb">
      <div class="row-flex" style="gap:8px;align-items:flex-end">
        <div style="width:320px"><label class="label">Նոր աշխատակից</label><div class="input l"><i data-lucide="phone"></i><span class="val mono">+374</span><span class="ph">հեռախոսահամար</span></div></div>
        <button class="btn secondary l"><i data-lucide="link"></i>Կապել</button>
        <span class="faint" style="font:var(--c-small);padding-bottom:10px">Նոր համարը կգրանցվի որպես ուղևոր · սահմանաչափը՝ լռելյայն, հասցեն՝ գրասենյակը</span>
      </div>
      <section class="sec"><h3>Աշխատակիցներ<span class="sub num">${EMP.length}</span><span class="end faint" style="font:var(--c-small)">Լռելյայն՝ ${amd(EL.default.amount)} ամսական · Անջատելիս նախկին ուղևորությունները չեն փոխվում</span></h3>
        <table class="tbl"><colgroup><col style="width:140px"><col><col style="width:150px"><col style="width:110px"><col style="width:200px"><col style="width:140px"><col style="width:90px"><col style="width:84px"></colgroup>
          <thead><tr><th>Հեռախոս</th><th>Անուն</th><th class="c">Ուղևորություններ</th><th class="m">Գումար</th><th>Սահմանաչափ</th><th class="m">Մնացել է</th><th class="c">Հասցեներ</th><th aria-label="Գործողություններ"></th></tr></thead>
          <tbody>${EMP.map(([n, ph, r, s, bl, lim, pl], i) => `<tr class="${EMPQ === String(i) ? 'on' : ''}"><td class="mono">${ph}</td><td><span class="row-flex" style="gap:8px"><span class="trunc">${n}</span>${bl ? '<span class="pill warn" style="flex:none"><i data-lucide="octagon-alert"></i>Սև ցուցակում</span>' : ''}</span></td><td class="c">${r || '<span class="dash">0</span>'}</td><td class="m">${s ? amd(s) : '<span class="dash">0</span>'}</td>
            ${limCell(lim, r, s)}<td class="c">${pl}</td>
            <td style="text-align:right;white-space:nowrap"><button class="btn ghost s icon rev-act" aria-label="Անջատել — ${n}" title="Անջատել"><i data-lucide="unlink"></i></button><a class="btn ${EMPQ === String(i) ? 'secondary' : 'ghost'} s icon" href="${T('employees')}&emp=${i}" aria-expanded="${EMPQ === String(i)}" aria-label="Սահմանաչափ և հասցեներ — ${n}" title="Սահմանաչափ և հասցեներ"><i data-lucide="sliders-horizontal"></i></a></td></tr>${EMPQ === String(i) && i === 0 ? empPanel : ''}`).join('')}</tbody></table></section></div>`

  /* ── Report (Q11): one tab. Period = a month (September, closed, by default) or chosen days; the optional «Վճարված»
     mark is per period. ?state=send: «Ուղարկել ընկերությանը» open inline · ?state=sent: the neutral result. ── */
  const ST8 = q.get('state') || ''
  const M = CO.MONTHS[0]
  const report = `<div class="tb">
      <div class="row-flex" style="gap:12px;flex-wrap:wrap">
        <div class="seg" role="radiogroup" aria-label="Ժամանակահատված"><button role="radio" aria-checked="false">Օգոստոս</button><button class="on" role="radio" aria-checked="true">Սեպտեմբեր</button><button role="radio" aria-checked="false">Հոկտեմբեր</button><button role="radio" aria-checked="false"><i data-lucide="calendar-range"></i>Ընտրել օրերը</button></div>
        <span class="facts"><span>Ուղևորություններ<b class="mono">${M.rides}</b></span><span>Գումար<b class="mono">${amd(M.amount)}</b></span>
          <span>Վճարում<b style="font:var(--c-body);padding-top:2px">${CO.paidCell(M.paid ? M.paidOn : null)}</b></span></span>
        <span style="flex:1"></span>
