<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company</title>
<link rel="stylesheet" href="console.css">
<link rel="stylesheet" href="corporate.css">
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="../kit.js"></script>
<script src="console.js"></script>
<script src="company-report.js"></script>
<script src="console-audit.js"></script>
</head>
<body>
<!-- Mirrors apps/operator components/admin/company-detail.tsx and its tabs: company-agreement (+ agreement-form,
     company-fixed-routes), company-employees, company-statement, company-settings. Corporate K2–K6.
     Owner decision 11 + Q11 (2026-10-14): no invoices. One «Հաշվետվություն» tab is the company report for a period (month
     or chosen days): rides with employee, route, tariff, cost code and price, totals, Excel / CSV / PDF, the optional
     «Վճարված» mark, and «Ուղարկել ընկերությանը» inline with the company's email. ?tab=report; the old ids statement,
     rides, invoices and months open it too. Every confirmation is an armed button or a panel under its
     row; nothing is a modal (§9.8). -->
<div class="screen" id="screen">
  <div class="main">
    <header class="bar">
      <a class="btn ghost icon s" href="companies.html" aria-label="Հետ՝ Ընկերություններ" id="back"><i data-lucide="arrow-left"></i></a>
      <span class="crumb"><a href="companies.html" id="crumb" style="color:inherit;text-decoration:none">Ընկերություններ</a> <i data-lucide="chevron-right"></i></span><h1 id="title"></h1>
      <div class="live"></div>
    </header>
    <div class="content one">
      <section class="card page" id="page"></section>
    </div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search)
  const TABQ = q.get('tab') || 'agreement'
  /* routes: the agreement form open · rides → the report · invoices → months (old links) */
  const tab = { routes: 'agreement', rides: 'report', statement: 'report', invoices: 'report', months: 'report' }[TABQ] || TABQ
  shell('companies')
  const C = ECO.COMPANY, R = ECO.RIDE, amd = ECO.amd
  const T = (s) => `?theme=${THEME}&tab=${s}`
  document.getElementById('title').textContent = C.name
  document.getElementById('back').href = 'companies.html?theme=' + THEME
  document.getElementById('crumb').href = 'companies.html?theme=' + THEME

  /* ── Header: who + credit in use (unpaid months + the open month, against the agreement's limit) ── */
  const pctUsed = Math.round(C.used / C.limit * 100)
  const TABS = [['agreement', 'Պայմանագիր և գներ'], ['employees', 'Աշխատակիցներ'], ['report', 'Հաշվետվություն'], ['settings', 'Կարգավորումներ']]
  const head = `
    <div class="cohead">
      <span class="ic" aria-hidden="true"><i data-lucide="building-2"></i></span>
      <div style="min-width:0"><h2>${C.name}</h2>
        <div class="meta"><span>«Արարատ Սոֆթ» ՍՊԸ</span><span class="mono">${C.tin}</span><span class="pill">Հետվճար</span><span class="pill ok"><i class="d"></i>Բաց</span></div></div>
      <div class="credit" aria-label="Սահմանաչափ">
        <span>Սահմանաչափ՝ օգտագործված</span><span class="r"><b>${amd(C.used)}</b> <span class="faint">/ ${amd(C.limit)}</span></span>
        <span class="bar2" role="img" aria-label="${pctUsed} % օգտագործված"><i style="width:${pctUsed}%"></i></span>
      </div>
    </div>
    <div class="tabsl" role="tablist" aria-label="Ընկերության բաժիններ">${TABS.map(([k, l]) => `<a href="${T(k)}" role="tab" aria-selected="${k === tab}" class="${k === tab ? 'on' : ''}">${l}</a>`).join('')}</div>`

  /* ── Agreement & pricing (company-agreement.tsx). Append-only versions; a future one can be withdrawn. ── */
  const ROUTES_FIXED = [
    ['Վազգեն Սարգսյանի 26/1 · 300 մ', 'Զվարթնոց օդանավակայան · 500 մ', 'Ցանկացած սակագին', 4500, true],
    ['Վազգեն Սարգսյանի 26/1 · 300 մ', 'Գոտի՝ Կենտրոն', 'Eco City', 1200, false],
    ['Գոտի՝ Դավթաշեն', 'Վազգեն Սարգսյանի 26/1 · 300 մ', 'Eco City', 1600, false],
  ]
  const routesTable = (edit) => `<table class="tbl" aria-label="Ֆիքսված երթուղիներ"><colgroup><col><col><col style="width:${edit ? 172 : 150}px"><col style="width:${edit ? 130 : 110}px"><col style="width:${edit ? 150 : 130}px">${edit ? '<col style="width:64px">' : ''}</colgroup>
      <thead><tr><th>Որտեղից</th><th>Ուր</th><th>Սակագին</th><th class="m">Գին</th><th>Երկու կողմ</th>${edit ? '<th aria-label="Հեռացնել"></th>' : ''}</tr></thead>
      <tbody>${ROUTES_FIXED.map(([a, b, t, v, both]) => edit
        ? `<tr><td><div class="input" style="height:28px"><i data-lucide="${a.startsWith('Գոտի') ? 'map' : 'map-pin'}"></i><span class="val">${a}</span></div></td><td><div class="input" style="height:28px"><i data-lucide="${b.startsWith('Գոտի') ? 'map' : 'map-pin'}"></i><span class="val">${b}</span></div></td><td><div class="input" style="height:28px"><span class="val">${t}</span><i data-lucide="chevron-down"></i></div></td><td><div class="input" style="height:28px"><span class="val mono" style="text-align:right">${ECO.num(v)}</span><span class="faint">֏</span></div></td><td><span class="switch${both ? ' on' : ''}"><i class="t"></i>${both ? 'այո' : 'ոչ'}</span></td><td><button class="btn ghost icon s" aria-label="Հեռացնել երթուղին"><i data-lucide="trash-2"></i></button></td></tr>`
        : `<tr><td class="wrap">${a}</td><td class="wrap">${b}</td><td class="wrap">${t}</td><td class="m">${amd(v)}</td><td>${both ? '<span class="pill"><i data-lucide="arrow-left-right"></i>այո</span>' : '<span class="dash">ոչ</span>'}</td></tr>`).join('')}
      ${edit ? `<tr><td colspan="6"><button class="btn ghost s"><i data-lucide="plus"></i>Ավելացնել երթուղի</button></td></tr>` : ''}</tbody></table>`
  const VERS = [
    ['01.11.2026', 400000, '5', 'future', '2027-ի բյուջե'],
    ['01.09.2026', 300000, '5', 'in', 'Ծախսերի կոդը պարտադիր է'],
    ['01.03.2026', 200000, '0', 'past', 'Առաջին պայմանագիր'],
  ]
  const STATE = { future: ['info', 'Առաջիկա'], in: ['ok', 'Գործում է'], past: ['', 'Նախկին'] }
  const history = `<section class="sec"><h3>Բոլոր տարբերակները<span class="sub num">${VERS.length}</span></h3>
      <table class="tbl"><colgroup><col style="width:150px"><col><col style="width:110px"><col style="width:220px"></colgroup>
        <thead><tr><th>Սկսած</th><th>Սահմանաչափ</th><th class="c">Զեղչ</th><th>Վիճակ</th></tr></thead>
        <tbody>${VERS.map(([d, l, disc, st, note]) => `<tr><td class="mono">${d}</td><td class="wrap" style="padding-top:6px;padding-bottom:6px"><span class="mono">${amd(l)}</span><br><span class="faint" style="font:var(--c-small)">${note}</span></td><td class="c">${disc} %</td>
          <td><span class="row-flex" style="gap:6px"><span class="pill ${STATE[st][0]}"><i class="d"></i>${STATE[st][1]}</span>${st === 'future' ? '<button class="btn ghost s">Չեղարկել</button>' : ''}</span></td></tr>`).join('')}</tbody></table></section>`
  const current = `<section class="sec"><h3>Գործող պայմաններ<span class="sub">սկսած <span class="mono">01.09.2026</span></span><span class="end"><a class="btn secondary s" href="${T('routes')}"><i data-lucide="plus"></i>Նոր տարբերակ</a></span></h3>
      <div class="pad"><dl class="terms" style="grid-template-columns:repeat(5,minmax(0,1fr))">
        <div><dt>Վճարում</dt><dd>Հետվճար</dd></div>
        <div><dt>Սահմանաչափ</dt><dd class="mono">${amd(C.limit)}</dd></div>
        <div><dt>Զեղչ</dt><dd>5 %</dd></div>
        <div><dt>Կոդի անվանում</dt><dd style="white-space:normal">${C.refLabel} <span class="pill warn" style="vertical-align:1px">պարտադիր</span></dd></div>
        <div><dt>Նշում</dt><dd style="white-space:normal">Ծախսերի կոդը պարտադիր է</dd></div>
      </dl></div>
      <h3 style="border-top:1px solid var(--line-soft)">Ֆիքսված երթուղիներ<span class="sub num">${ROUTES_FIXED.length}</span><span class="end faint" style="font:var(--c-small)">Ֆիքսված գինը չի զեղչվում</span></h3>
      ${routesTable(false)}</section>`
  /* ?tab=routes: «Նոր տարբերակ» open inline (agreement-form.tsx), prefilled from the version in force; routes editable. */
  const form = `<section class="sec alt" aria-label="Նոր տարբերակ"><h3>Նոր տարբերակ<span class="sub">գործողից լրացված</span></h3>
      <div class="pad"><div class="fgrid" style="grid-template-columns:repeat(4,minmax(0,1fr))">
        <div><label class="label">Սկսած</label><div class="input"><i data-lucide="calendar"></i><span class="val mono">01.11.2026 00:00</span></div></div>
        <div><label class="label">Վճարում</label><div class="seg" role="radiogroup" aria-label="Վճարում"><button class="on" role="radio" aria-checked="true">Հետվճար</button><button role="radio" aria-checked="false">Կանխավճար</button></div></div>
        <div><label class="label">Զեղչ</label><div class="input"><span class="val mono">5</span><span class="faint">%</span></div></div>
        <div><label class="label">Սահմանաչափ</label><div class="input focus"><span class="val mono">400 000</span><span class="faint">֏</span></div><p class="hint">Դատարկ՝ առանց սահմանաչափի</p></div>
        <div><label class="label">Կոդի անվանում</label><div class="input"><span class="val">${C.refLabel}</span></div><p class="hint">Ինչպես է այն կոչում ընկերությունը</p></div>
        <div style="align-self:center"><span class="check on"><i class="b"></i>Կոդը պարտադիր է</span></div>
        <div class="full" style="grid-column:span 2"><label class="label">Նշում</label><div class="input"><span class="val">2027-ի բյուջե</span></div></div>
      </div></div>
      <h3 style="border-top:1px solid var(--line-soft);background:var(--surface)">Ֆիքսված երթուղիներ<span class="sub">Ֆիքսված գինը չի զեղչվում</span></h3>
      <div style="background:var(--surface)">${routesTable(true)}</div>
      <div class="pad"><div class="notice neutral"><i data-lucide="calendar-clock"></i><span>Գործում է միայն սկսած նշված օրից․ անցյալը չի փոխվում</span></div>
      <div class="formfoot"><a class="btn ghost" href="${T('agreement')}">Չեղարկել</a><button class="btn primary"><i data-lucide="check"></i>Պահել <span class="kbd">↵</span></button></div></div></section>`
  const agreement = TABQ === 'routes' ? `<div class="tb">${form}</div>` : `<div class="tb">${current}${history}</div>`

  /* ── Employees (company-employees.tsx): number (mono), name, this month's rides and amount ── */
  const EMP = [
    [C.rider, ECO.RIDE.rider.phone, 38, 52400], ['Տիգրան Մանուկյան', '094 55-10-20', 29, 61200], ['Լիանա Գրիգորյան', '077 31-44-90', 21, 25800],
    ['Արսեն Սահակյան', '099 82-17-03', 17, 18300], ['Նունե Պետրոսյան', '093 40-62-18', 14, 16900], ['Գևորգ Հարությունյան', '098 11-27-65', 0, 0, true],
    ['Մարիամ Ավագյան', '055 70-09-41', 6, 7200], ['Վարդան Խաչատրյան', '091 66-38-12', 6, 2800], ['Էլեն Սարգսյան', '096 24-51-77', 0, 0],
    ['Կարեն Զաքարյան', '041 90-83-26', 0, 0], ['Անի Մկրտչյան', '094 13-75-40', 0, 0], ['Արամ Վարդանյան', '077 58-20-11', 0, 0],
    ['Սոնա Հովսեփյան', '099 07-66-35', 0, 0], ['Դավիթ Ղազարյան', '093 28-14-59', 0, 0],
  ]
  const employees = `<div class="tb">
      <div class="row-flex" style="gap:8px;align-items:flex-end">
        <div style="width:320px"><label class="label">Նոր աշխատակից</label><div class="input l"><i data-lucide="phone"></i><span class="val mono">+374</span><span class="ph">հեռախոսահամար</span></div></div>
        <button class="btn secondary l"><i data-lucide="link"></i>Կապել</button>
        <span class="faint" style="font:var(--c-small);padding-bottom:10px">Նոր համարը կգրանցվի որպես ուղևոր</span>
      </div>
      <section class="sec"><h3>Աշխատակիցներ<span class="sub num">${EMP.length}</span><span class="end faint" style="font:var(--c-small)">Անջատելիս նախկին ուղևորությունները չեն փոխվում</span></h3>
        <table class="tbl"><colgroup><col style="width:170px"><col><col style="width:184px"><col style="width:190px"><col style="width:150px"></colgroup>
          <thead><tr><th>Հեռախոս</th><th>Անուն</th><th class="c">Ուղևորություններ (ամիս)</th><th class="m">Գումար (ամիս)</th><th aria-label="Անջատել"></th></tr></thead>
          <tbody>${EMP.map(([n, ph, r, s, bl], i) => `<tr class="${i === 1 ? 'on' : ''}"><td class="mono">${ph}</td><td><span class="row-flex">${n}${bl ? '<span class="pill warn"><i data-lucide="octagon-alert"></i>Սև ցուցակում</span>' : ''}</span></td><td class="c">${r || '<span class="dash">0</span>'}</td><td class="m">${s ? amd(s) : '<span class="dash">—</span>'}</td>
            <td style="text-align:right">${i === 1 ? '<button class="btn s armed">Անջատե՞լ</button>' : '<button class="btn ghost s rev-act"><i data-lucide="unlink"></i>Անջատել</button>'}</td></tr>`).join('')}</tbody></table></section></div>`

  /* ── Report (Q11): one tab. Period = a month (September, closed, by default) or chosen days; the optional «Վճարված»
     mark is per period. ?state=send: «Ուղարկել ընկերությանը» open inline · ?state=sent: the neutral result. ── */
  const ST8 = q.get('state') || ''
  const M = CO.MONTHS[0]
  const report = `<div class="tb">
      <div class="row-flex" style="gap:12px;flex-wrap:wrap">
        <div class="seg" role="radiogroup" aria-label="Ժամանակահատված"><button role="radio" aria-checked="false">Օգոստոս</button><button class="on" role="radio" aria-checked="true">Սեպտեմբեր</button><button role="radio" aria-checked="false">Հոկտեմբեր</button><button role="radio" aria-checked="false"><i data-lucide="calendar-range"></i>Ընտրել օրերը</button></div>
        <span class="facts"><span>Ուղևորություններ<b class="mono">${M.rides}</b></span><span>Գումար<b class="mono">${amd(M.amount)}</b></span>
          <span>Վճարում<b style="font:var(--c-body);padding-top:2px">${CO.paidCell(M.paid ? M.paidOn : null)}</b></span></span>
        <span style="flex:1"></span>
        <span class="xp" style="gap:6px">${['Excel', 'CSV', 'PDF'].map((f) => `<button class="btn secondary" aria-label="Ներբեռնել ${f}">${f === 'Excel' ? '<i data-lucide="file-spreadsheet"></i>' : ''}${f}</button>`).join('')}</span>
        <button class="btn ${ST8 === 'send' ? 'secondary' : 'primary'}" aria-expanded="${ST8 === 'send'}"><i data-lucide="send"></i>Ուղարկել ընկերությանը</button>
      </div>
      ${ST8 === 'send' ? CO.sendPanel(M.label) : ST8 === 'sent' ? CO.sentNote()
        : `<span class="faint" style="font:var(--c-small);margin-top:-4px"><i data-lucide="at-sign" style="width:14px;height:14px;vertical-align:-2px"></i> <span class="mono">${CO.EMAIL}</span> · <span class="dot-w"></span>կոդ չկա՝ լրացնել պատվերում</span>`}
      <section class="sec">${CO.table(M)}</section></div>`

  /* ── Settings (company-settings.tsx): one Save, PATCH of what changed; close is armed, reopen is one press ── */
  const settings = `<div class="tb split">
      <section class="sec"><h3>Տվյալներ</h3><div class="pad"><div class="fgrid">
        <div><label class="label">Ընկերության անվանում</label><div class="input"><span class="val">${C.name}</span></div></div>
        <div><label class="label">Իրավաբանական անվանում</label><div class="input"><span class="val">«Արարատ Սոֆթ» ՍՊԸ</span></div></div>
        <div><label class="label">ՀՎՀՀ</label><div class="input"><span class="val mono">${C.tin}</span></div></div>
        <div><label class="label">Իրավաբանական հասցե</label><div class="input"><span class="val">Երևան 0010, Վազգեն Սարգսյանի 26/1</span></div></div>
        <div class="full"><label class="label">Հաշվետվության էլ. հասցեներ</label><div class="input focus"><span class="val mono">${CO.EMAIL}, a.hakobyan@araratsoft.am</span></div><p class="hint">Մինչև 5՝ ստորակետով</p></div>
        <div><label class="label">Կոնտակտային անձ</label><div class="input"><span class="val">${C.rider}</span></div></div>
        <div><label class="label">Հեռախոս</label><div class="input"><span class="val mono">${ECO.RIDE.rider.phone}</span></div></div>
        <div class="full"><label class="label">Նշում</label><div class="input"><span class="val">Ամսական հաշվետվությունը՝ ֆինանսական բաժնին</span></div></div>
      </div>
      <div class="formfoot"><span class="faint" style="font:var(--c-small)">Փոխվել է 1 դաշտ</span><span class="sp"></span><button class="btn primary">Պահել</button></div></div></section>
      <section class="sec"><h3>Ընկերության հաշվին</h3><div class="pad" style="display:flex;flex-direction:column;gap:12px">
        <span class="switch on"><i class="t"></i>Միացված</span>
        <span class="faint" style="font:var(--c-small)">Վերաբերում է միայն նոր պատվերներին</span>
        <div style="border-top:1px solid var(--line-soft);padding-top:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start">
          <span class="faint" style="font:var(--c-small)">Նոր պատվերներն այլևս ընկերության հաշվին չեն լինի․ նախկինները մնում են</span>
          <button class="btn danger"><i data-lucide="archive"></i>Փակել ընկերությունը</button></div>
      </div></section></div>`

  const BODY = { agreement, employees, report, settings }
  document.getElementById('page').innerHTML = head + `<div class="scroll-y grow" role="tabpanel" aria-label="${TABS.find((t) => t[0] === tab)[1]}" data-truncate>${BODY[tab]}</div>`
  icons()
  document.documentElement.dataset.mapReady = 'none'
</script>
</body>
</html>
