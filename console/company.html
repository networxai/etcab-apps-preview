<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company</title>
<link rel="stylesheet" href="console.css">
<link rel="stylesheet" href="corporate.css">
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="../kit.js"></script>
<script src="console.js"></script>
<script src="console-audit.js"></script>
</head>
<body>
<!-- Mirrors apps/operator components/admin/company-detail.tsx and its tabs: company-agreement (+ agreement-form,
     company-fixed-routes), company-employees, company-rides, company-invoices (+ invoice-actions, invoice-payment,
     invoice-credit), company-statement, company-settings. Corporate K2–K6. Every confirmation is an armed button
     or a panel under its row; nothing is a modal (§9.8). -->
<div class="screen" id="screen">
  <div class="main">
    <header class="bar">
      <a class="btn ghost icon s" href="companies.html" aria-label="Վերադառնալ — Ընկերություններ" id="back"><i data-lucide="arrow-left"></i></a>
      <span class="crumb"><a href="companies.html" id="crumb" style="color:inherit;text-decoration:none">Ընկերություններ</a> <i data-lucide="chevron-right"></i></span><h1 id="title"></h1>
      <div class="live"></div>
    </header>
    <div class="content one">
      <section class="card page" id="page"></section>
    </div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search)
  const TABQ = q.get('tab') || 'agreement'
  const tab = TABQ === 'routes' ? 'agreement' : TABQ      /* fixed routes are edited inside the agreement form (real UI) */
  shell('companies')
  const C = ECO.COMPANY, R = ECO.RIDE, amd = ECO.amd
  const T = (s) => `?theme=${THEME}&tab=${s}`
  document.getElementById('title').textContent = C.name
  document.getElementById('back').href = 'companies.html?theme=' + THEME
  document.getElementById('crumb').href = 'companies.html?theme=' + THEME

  /* ── Header: who + credit use (owed against the agreement's limit) ── */
  const pctUsed = Math.round(C.used / C.limit * 100)
  const TABS = [['agreement', 'Պայմանագիր և գներ'], ['employees', 'Աշխատակիցներ'], ['rides', 'Ուղևորություններ'], ['invoices', 'Հաշիվներ'], ['statement', 'Քաղվածք'], ['settings', 'Կարգավորումներ']]
  const head = `
    <div class="cohead">
      <span class="ic" aria-hidden="true"><i data-lucide="building-2"></i></span>
      <div style="min-width:0"><h2>${C.name}</h2>
        <div class="meta"><span>«Արարատ Սոֆթ» ՍՊԸ</span><span class="mono">${C.tin}</span><span class="pill info">Հաշվով</span><span class="pill ok"><i class="d"></i>Բաց</span></div></div>
      <div class="credit" aria-label="Վարկային սահմանաչափ">
        <span>Պարտք / Վարկային սահմանաչափ</span><span class="r"><b>${amd(C.used)}</b> <span class="faint">/ ${amd(C.limit)}</span></span>
        <span class="bar2" role="img" aria-label="${pctUsed}% օգտագործված"><i style="width:${pctUsed}%"></i></span>
      </div>
    </div>
    <div class="tabsl" role="tablist" aria-label="Ընկերության բաժիններ">${TABS.map(([k, l]) => `<a href="${T(k)}" role="tab" aria-selected="${k === tab}" class="${k === tab ? 'on' : ''}">${l}</a>`).join('')}</div>`

  /* ── Agreement & pricing (company-agreement.tsx). Append-only versions; a future one can be withdrawn. ── */
  const ROUTES_FIXED = [
    ['Վազգեն Սարգսյանի 26/1 · 300 մ', 'Զվարթնոց օդանավակայան · 500 մ', 'Ցանկացած դաս', 4500, true],
    ['Վազգեն Սարգսյանի 26/1 · 300 մ', 'Գոտի՝ Կենտրոն', 'Eco City', 1200, false],
    ['Գոտի՝ Դավթաշեն', 'Վազգեն Սարգսյանի 26/1 · 300 մ', 'Eco City', 1600, false],
  ]
  const routesTable = (edit) => `<table class="tbl" aria-label="Ֆիքսված երթուղիներ"><colgroup><col><col><col style="width:${edit ? 172 : 120}px"><col style="width:${edit ? 130 : 110}px"><col style="width:${edit ? 150 : 170}px">${edit ? '<col style="width:64px">' : ''}</colgroup>
      <thead><tr><th>Որտեղից</th><th>Ուր</th><th>Դաս</th><th class="m">Գումար</th><th>Երկու ուղղությամբ</th>${edit ? '<th aria-label="Հեռացնել"></th>' : ''}</tr></thead>
      <tbody>${ROUTES_FIXED.map(([a, b, t, v, both], i) => edit
        ? `<tr><td><div class="input" style="height:28px"><i data-lucide="${a.startsWith('Գոտի') ? 'map' : 'map-pin'}"></i><span class="val">${a}</span></div></td><td><div class="input" style="height:28px"><i data-lucide="${b.startsWith('Գոտի') ? 'map' : 'map-pin'}"></i><span class="val">${b}</span></div></td><td><div class="input" style="height:28px"><span class="val">${t}</span><i data-lucide="chevron-down"></i></div></td><td><div class="input" style="height:28px"><span class="val mono" style="text-align:right">${ECO.num(v)}</span><span class="faint">֏</span></div></td><td><span class="switch${both ? ' on' : ''}"><i class="t"></i>${both ? 'այո' : 'ոչ'}</span></td><td><button class="btn ghost icon s" aria-label="Հեռացնել երթուղին"><i data-lucide="trash-2"></i></button></td></tr>`
        : `<tr><td class="wrap">${a}</td><td class="wrap">${b}</td><td class="wrap">${t}</td><td class="m">${amd(v)}</td><td>${both ? '<span class="pill"><i data-lucide="arrow-left-right"></i>այո</span>' : '<span class="dash">ոչ</span>'}</td></tr>`).join('')}
      ${edit ? `<tr><td colspan="6"><button class="btn ghost s"><i data-lucide="plus"></i>Ավելացնել երթուղի</button></td></tr>` : ''}</tbody></table>`
  const VERS = [
    ['01.11.2026', 'Հետվճար', 15, 400000, '5', 'future', '2027-ի բյուջե'],
    ['01.09.2026', 'Հետվճար', 15, 300000, '5', 'in', 'Ծախսերի կոդը պարտադիր է'],
    ['01.03.2026', 'Հետվճար', 30, 200000, '0', 'past', 'Առաջին պայմանագիր'],
  ]
  const STATE = { future: ['info', 'Առաջիկա'], in: ['ok', 'Գործում է'], past: ['', 'Նախկին'] }
  const history = `<section class="sec"><h3>Բոլոր տարբերակները<span class="sub num">${VERS.length}</span></h3>
      <table class="tbl"><colgroup><col style="width:150px"><col><col style="width:140px"><col style="width:110px"><col style="width:260px"></colgroup>
        <thead><tr><th>Ուժի մեջ է սկսած</th><th>Վարկային սահմանաչափ</th><th class="c">Ժամկետ</th><th class="c">Զեղչ</th><th>Վիճակ</th></tr></thead>
        <tbody>${VERS.map(([d, m, t, l, disc, st, note]) => `<tr><td class="mono">${d}</td><td class="wrap" style="padding-top:6px;padding-bottom:6px"><span class="mono">${amd(l)}</span><br><span class="faint" style="font:var(--c-small)">${note}</span></td><td class="c">${t} օր</td><td class="c">${disc} %</td>
          <td><span class="row-flex" style="gap:6px"><span class="pill ${STATE[st][0]}"><i class="d"></i>${STATE[st][1]}</span>${st === 'future' ? '<button class="btn ghost s">Հետ կանչել</button>' : ''}</span></td></tr>`).join('')}</tbody></table></section>`
  const current = `<section class="sec"><h3>Գործող պայմաններ<span class="sub">սկսած <span class="mono">01.09.2026</span></span><span class="end"><a class="btn secondary s" href="${T('routes')}"><i data-lucide="plus"></i>Նոր տարբերակ</a></span></h3>
      <div class="pad"><dl class="terms" style="grid-template-columns:repeat(6,minmax(0,1fr))">
        <div><dt>Վճարման ձև</dt><dd>Հետվճար</dd></div>
        <div><dt>Վճարման ժամկետ</dt><dd>15 <small>օր</small></dd></div>
        <div><dt>Վարկային սահմանաչափ</dt><dd class="mono">${amd(C.limit)}</dd></div>
        <div><dt>Զեղչ</dt><dd>5 %</dd></div>
        <div><dt>Հղման անվանում</dt><dd style="white-space:normal">${C.refLabel} <span class="pill warn" style="vertical-align:1px">պարտադիր</span></dd></div>
        <div><dt>Նշում</dt><dd style="white-space:normal">Ծախսերի կոդը պարտադիր է</dd></div>
      </dl></div>
      <h3 style="border-top:1px solid var(--line-soft)">Ֆիքսված երթուղիներ<span class="sub num">${ROUTES_FIXED.length}</span></h3>
      <p class="explain" style="padding:10px var(--inset) 4px">Համընկնող երթուղին փոխարինում է սակագինը համաձայնեցված գումարով․ այն երբեք չի զեղչվում։</p>
      ${routesTable(false)}</section>`
  /* ?tab=routes: «Նոր տարբերակ» open inline (agreement-form.tsx), prefilled from the version in force; routes editable. */
  const form = `<section class="sec alt" aria-label="Նոր տարբերակ"><h3>Նոր տարբերակ<span class="sub">լրացված գործող պայմաններից</span></h3>
      <div class="pad"><div class="fgrid" style="grid-template-columns:repeat(4,minmax(0,1fr))">
        <div><label class="label">Ուժի մեջ է սկսած</label><div class="input"><i data-lucide="calendar"></i><span class="val mono">01.11.2026 00:00</span></div></div>
        <div><label class="label">Վճարման ձև</label><div class="seg" role="radiogroup" aria-label="Վճարման ձև"><button class="on" role="radio" aria-checked="true">Հետվճար</button><button role="radio" aria-checked="false">Կանխավճար</button></div></div>
        <div><label class="label">Վճարման ժամկետ</label><div class="input"><span class="val mono">15</span><span class="faint">օր</span></div></div>
        <div><label class="label">Զեղչ</label><div class="input"><span class="val mono">5</span><span class="faint">%</span></div></div>
        <div><label class="label">Վարկային սահմանաչափ</label><div class="input focus"><span class="val mono">400 000</span><span class="faint">֏</span></div><p class="hint">Թողեք դատարկ՝ առանց սահմանաչափի</p></div>
        <div><label class="label">Հղման անվանում</label><div class="input"><span class="val">${C.refLabel}</span></div><p class="hint">Ինչպես է ընկերությունն այն անվանում, օր․ ծախսային կենտրոն</p></div>
        <div style="align-self:center"><span class="check on"><i class="b"></i>Հղումը պարտադիր է</span></div>
        <div><label class="label">Նշում</label><div class="input"><span class="val">2027-ի բյուջե</span></div></div>
      </div></div>
      <h3 style="border-top:1px solid var(--line-soft);background:var(--surface)">Ֆիքսված երթուղիներ<span class="sub">Համընկնող երթուղին փոխարինում է սակագինը համաձայնեցված գումարով․ այն երբեք չի զեղչվում։</span></h3>
      <div style="background:var(--surface)">${routesTable(true)}</div>
      <div class="pad"><div class="notice neutral"><i data-lucide="info"></i><span>Պայմանները երբեք հետին թվով չեն սահմանվում։ Գործող տարբերակը մնում է անփոփոխ, նորն ուժի մեջ կմտնի իր մեկնարկի պահին։</span></div>
      <div class="formfoot"><a class="btn ghost" href="${T('agreement')}">Չեղարկել</a><button class="btn primary"><i data-lucide="check"></i>Պահպանել տարբերակը <span class="kbd">↵</span></button></div></div></section>`
  const agreement = TABQ === 'routes'
    ? `<div class="tb">${form}</div>`
    : `<div class="tb">${current}${history}</div>`

  /* ── Employees (company-employees.tsx): number (mono), name, this month's rides and company spend ── */
  const EMP = [
    [C.rider, ECO.RIDE.rider.phone, 3, 3900], ['Տիգրան Մանուկյան', '094 55-10-20', 2, 6000], ['Լիանա Գրիգորյան', '077 31-44-90', 1, 1400],
    ['Արսեն Սահակյան', '099 82-17-03', 1, 1000], ['Նունե Պետրոսյան', '093 40-62-18', 0, 0], ['Գևորգ Հարությունյան', '098 11-27-65', 0, 0, true],
    ['Մարիամ Ավագյան', '055 70-09-41', 0, 0], ['Վարդան Խաչատրյան', '091 66-38-12', 0, 0], ['Էլեն Սարգսյան', '096 24-51-77', 0, 0],
    ['Կարեն Զաքարյան', '041 90-83-26', 0, 0], ['Անի Մկրտչյան', '094 13-75-40', 0, 0], ['Արամ Վարդանյան', '077 58-20-11', 0, 0],
    ['Սոնա Հովսեփյան', '099 07-66-35', 0, 0], ['Դավիթ Ղազարյան', '093 28-14-59', 0, 0],
  ]
  const employees = `<div class="tb">
      <div class="row-flex" style="gap:8px;align-items:flex-end">
        <div style="width:320px"><label class="label">Կապել ըստ հեռախոսի</label><div class="input l"><i data-lucide="phone"></i><span class="val mono">+374</span><span class="ph">հեռախոսահամար</span></div></div>
        <button class="btn secondary l"><i data-lucide="link"></i>Կապել ըստ հեռախոսի</button>
        <span class="faint" style="font:var(--c-small);padding-bottom:10px">Նոր համարը դառնում է այս պարկի հաճախորդ</span>
      </div>
      <section class="sec"><h3>Աշխատակիցներ<span class="sub num">${EMP.length}</span><span class="end faint" style="font:var(--c-small)">Անջատումը նախկին ուղևորությունները չի փոխում․ յուրաքանչյուրը պահպանում է իր վճարողին։</span></h3>
        <table class="tbl"><colgroup><col style="width:170px"><col><col style="width:184px"><col style="width:190px"><col style="width:150px"></colgroup>
          <thead><tr><th>Հեռախոս</th><th>Անուն</th><th class="c">Ուղևորություններ (ամիս)</th><th class="m">Ընկերության ծախս (ամիս)</th><th aria-label="Անջատել"></th></tr></thead>
          <tbody>${EMP.map(([n, ph, r, s, bl], i) => `<tr class="${i === 1 ? 'on' : ''}"><td class="mono">${ph}</td><td><span class="row-flex">${n}${bl ? '<span class="pill warn"><i data-lucide="ban"></i>Սև ցուցակում</span>' : ''}</span></td><td class="c">${r}</td><td class="m">${s ? amd(s) : '<span class="dash">—</span>'}</td>
            <td style="text-align:right">${i === 1 ? '<button class="btn s armed">Անջատե՞լ</button>' : '<button class="btn ghost s rev-act"><i data-lucide="unlink"></i>Անջատել</button>'}</td></tr>`).join('')}</tbody></table></section></div>`

  /* ── Rides (company-rides.tsx): October 2026 so far; the walkthrough ride is Աննա's own (personal, cash). ── */
  const RIDES = [
    ['09.10 09:45', C.rider, `${R.pickup} → ${R.drop}`, R.tier, '', R.fare, 'personal'],
    ['08.10 18:20', 'Տիգրան Մանուկյան', 'Վազգեն Սարգսյանի 26/1 → Զվարթնոց', 'Eco Comfort', 'SALES-17', 4500, 'fixed'],
    ['08.10 09:05', C.rider, 'Դավթաշեն 3-րդ թղմ. → Վազգեն Սարգսյանի 26/1', 'Eco City', C.ref, 1600, 'fixed'],
    ['07.10 13:40', 'Լիանա Գրիգորյան', 'Վազգեն Սարգսյանի 26/1 → Թումանյան 12', 'Eco City', '', 1400, 'missing'],
    ['06.10 19:10', C.rider, 'Վազգեն Սարգսյանի 26/1 → Կասկադ', 'Eco City', C.ref, 1200, 'fixed'],
    ['05.10 10:15', 'Արսեն Սահակյան', 'Կոմիտասի պող. 5 → Վազգեն Սարգսյանի 26/1', 'Eco City', 'IT-009', 1000, ''],
    ['03.10 08:50', 'Տիգրան Մանուկյան', 'Արաբկիր 31 → Վազգեն Սարգսյանի 26/1', 'Eco City', 'SALES-17', 1500, ''],
    ['02.10 17:30', C.rider, 'Վազգեն Սարգսյանի 26/1 → Արշակունյաց 34', 'Eco City', C.ref, 1100, ''],
    ['01.10 22:05', 'Հովհաննես Բաբայան', 'Վազգեն Սարգսյանի 26/1 → Նոր Նորք 2-րդ զ.', 'Eco City', 'MKT-204', 1900, 'down'],
  ]
  const rides = `<div class="tb">
      <div class="row-flex" style="gap:8px"><span class="month" role="group" aria-label="Ամիս"><button class="btn ghost icon s" aria-label="Նախորդ ամիս"><i data-lucide="chevron-left"></i></button><span class="lbl">Հոկտեմբեր 2026</span><button class="btn ghost icon s" aria-label="Հաջորդ ամիս" disabled style="opacity:.4"><i data-lucide="chevron-right"></i></button></span>
        <span class="faint" style="font:var(--c-small)">7 ընկերության ուղևորություն · ${amd(12300)} · հաշվում դեռ չեն</span></div>
      <section class="sec"><table class="tbl"><colgroup><col style="width:120px"><col style="width:160px"><col><col style="width:112px"><col style="width:120px"><col style="width:100px"><col style="width:240px"></colgroup>
        <thead><tr><th>Ամսաթիվ</th><th>Աշխատակից</th><th>Երթուղի</th><th>Դաս</th><th>Հղում</th><th class="m">Վարձ</th><th>Հաշիվ</th></tr></thead>
        <tbody>${RIDES.map(([d, who, rt, tier, ref, f, k]) => `<tr class="${k === 'personal' ? 'off' : ''}">
