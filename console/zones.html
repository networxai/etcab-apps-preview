<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zones</title>
<link rel="stylesheet" href="console.css">
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="../mapgl.local.js"></script>
<script src="../kit.js"></script>
<script src="console.js"></script>
<script src="console-audit.js"></script>
<style>
  /* Mirrors apps/operator components/admin/zones.tsx + zone-panel.tsx + zone-toolbar.tsx + zone-editor.tsx (§6 zones, the
     polygons a tariff condition names; admin-only). PageHeader with «Նոր գոտի» (N); the work area is the live 2GIS map
     (a zone drawn INTO the canvas, no dimming filter) with the drawing toolbar, and a panel beside it: the zone list, or
     the zone being edited — name, numbered corners with six-decimal coordinates, «Օգտագործում են՝ …», Save / Cancel.
     The mock draws each zone's edge as a closed line with its numbered corners (the real Polygon also fills). */
  .content { grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto minmax(0, 1fr); }
  .ph { grid-column: 1 / 3; display: flex; align-items: center; gap: 12px; padding: 4px 4px 0; }
  .ph p { font: var(--c-body); color: var(--ink-muted); }
  .ph .end { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .mapcard { position: relative; }
  .tools { position: absolute; z-index: 30; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .tools .bar2 { display: flex; gap: 2px; padding: 4px; border-radius: var(--r-ctl); background: var(--surface); box-shadow: var(--e2); }
  .tools .bar2 button { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; color: var(--ink-muted); }
  .tools .bar2 button.on { background: var(--ink); color: var(--surface); }
  .tools .bar2 .sep { width: 1px; background: var(--line-soft); margin: 4px 2px; }
  .tools .hint { max-width: 340px; padding: 6px 10px; border-radius: var(--r-ctl); background: var(--surface); box-shadow: var(--e2); font: var(--c-small); color: var(--ink-muted); }
  .vx { width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 2px var(--zc), var(--e1); display: grid; place-items: center; font: 600 11px/1 var(--mono); color: var(--ink); }
  .zl { width: max-content; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--surface); box-shadow: var(--e1), inset 3px 0 0 var(--zc); font: 500 12px/22px var(--font); color: var(--ink); white-space: nowrap; }
  .zones { list-style: none; }
  .zone { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px var(--inset); border-bottom: 1px solid var(--line-soft); }
  .zone .sw { width: 12px; height: 12px; border-radius: 3px; background: var(--zc); }
  .zone .nm { font: var(--c-strong); }
  .zone .use, .zone .dim { grid-column: 2 / 4; font: var(--c-small); color: var(--ink-muted); }
  .zone .dim { color: var(--ink-faint); }
  .zone .acts { display: flex; gap: 4px; }
  .zone.on { background: var(--surface-alt); box-shadow: inset 3px 0 0 var(--brand-vivid); }
  .ed { padding: 12px var(--inset); display: flex; flex-direction: column; gap: 10px; }
  .pts { display: grid; grid-template-columns: 22px minmax(0, 1fr) minmax(0, 1fr) 28px; gap: 6px 8px; align-items: center; }
  .pts .h { font: var(--c-label); color: var(--ink-faint); }
  .pts .input { height: 28px; } .pts .val { font-family: var(--mono); }
  .pts .vx { box-shadow: 0 0 0 2px var(--zc); }
  .used { font: var(--c-small); color: var(--ink-muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .edf { display: flex; align-items: center; gap: 8px; padding: 12px var(--inset); border-top: 1px solid var(--line-soft); }
  /* ── Change list 2026-10-15: zones are the exception layer on top of the tariff. Each zone carries «Կանոններ» (pickup /
     drop-off charge, price overrides, pre-order limits, payment / tariff / car / order-type restrictions); «Գոտուց գոտի»
     holds A→B rules (fixed fare, crossing surcharge or commission). Order: Սակագին → Գոտու կանոն → Գոտուց գոտի; the
     narrowest zone wins (Կենտրոն → Զվարթնոց beats Երևան → Զվարթնոց). ?rule=1 the rule editor, ?pair=1 zone-to-zone. ── */
  .content.pair { grid-template-columns: minmax(0, 1fr) 520px; }
  @media (max-width: 1400px) { .content { grid-template-columns: minmax(0, 1fr) 340px; } .content.pair { grid-template-columns: minmax(0, 1fr) 470px; } }
  .ph .seg { margin-left: 8px; }
  .prio { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; padding: 10px var(--inset); border-bottom: 1px solid var(--line-soft); font: var(--c-small); color: var(--ink-faint); }
  .prio b { font: var(--c-small); font-weight: 500; color: var(--ink); white-space: nowrap; } .prio svg { width: 14px; height: 14px; }
  .zone .cnt { font: var(--c-small); color: var(--ink-faint); white-space: nowrap; }
  .zone { cursor: pointer; }
  .rh { display: flex; align-items: center; gap: 8px; padding: 14px var(--inset) 6px; }
  .rh h3 { font: var(--c-head); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .rh .end { margin-left: auto; flex: none; }
  .rule { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px var(--inset); border-bottom: 1px solid var(--line-soft); }
  .rule .ic { grid-row: 1 / 3; width: 28px; height: 28px; border-radius: 7px; background: var(--surface-alt); display: grid; place-items: center; color: var(--ink-muted); }
  .rule .ic svg { width: 16px; height: 16px; }
  .rule b { font: var(--c-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rule .v { font: 500 13px/18px var(--mono); white-space: nowrap; text-align: right; }
  .rule .d { grid-column: 2 / 4; font: var(--c-small); color: var(--ink-faint); }
  .rule.on { background: var(--surface-alt); box-shadow: inset 3px 0 0 var(--brand-vivid); }
  .fl { display: flex; flex-direction: column; gap: 6px; padding: 10px var(--inset); border-bottom: 1px solid var(--line-soft); }
  .fl .row-flex { gap: 6px; flex-wrap: wrap; }
  .num-in { display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; height: 30px; padding: 0 8px; border-radius: var(--r-ctl); box-shadow: inset 0 0 0 1px var(--line-control); background: var(--surface); font: 500 13px/18px var(--mono); white-space: nowrap; min-width: 84px; }
  .num-in span { color: var(--ink-faint); font-family: var(--font); }
  .types { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .types button { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 6px 10px; border-radius: var(--r-ctl); box-shadow: inset 0 0 0 1px var(--line-control); font: var(--c-strong); color: var(--ink); text-align: left; }
  .types button.on { box-shadow: inset 0 0 0 2px var(--ink); }
  .types button svg { width: 16px; height: 16px; color: var(--ink-muted); flex: none; }
  .mxz { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .mxz th, .mxz td { border: 1px solid var(--line-soft); padding: 6px 8px; font: var(--c-small); text-align: left; vertical-align: top; }
  .mxz th { color: var(--ink-faint); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mxz td { height: 52px; }
  .mxz td b { display: block; font: 500 13px/18px var(--mono); color: var(--ink); white-space: nowrap; }
  .mxz td span { color: var(--ink-faint); white-space: nowrap; }
  .mxz td.x { background: var(--surface-alt); }
  .mxz td.on { box-shadow: inset 0 0 0 2px var(--ink); }
  .mxz .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--zc); margin-right: 6px; }
  .wk { position: absolute; z-index: 30; left: 12px; bottom: 12px; width: min(420px, calc(100% - 24px)); border-radius: var(--r-card); background: var(--surface); box-shadow: var(--e2); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .wk h4 { font: var(--c-strong); }
  .wk .sub { font: var(--c-small); color: var(--ink-faint); }
  .st { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 2px 8px; align-items: baseline; font: var(--c-body); }
  .st .n { width: 20px; height: 20px; border-radius: 50%; background: var(--surface-alt); display: grid; place-items: center; font: 600 11px/1 var(--mono); color: var(--ink-muted); align-self: center; }
  .st .v { font: 500 13px/20px var(--mono); white-space: nowrap; text-align: right; }
  .st .d { grid-column: 2 / 4; font: var(--c-small); color: var(--ink-faint); }
  .st .d s { color: var(--ink-faint); }
  .st.skip > span:not(.n) { color: var(--ink-faint); }
  .st.tot { border-top: 1px solid var(--line-soft); padding-top: 8px; font-weight: 600; }
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="main">
    <header class="bar">
      <span class="crumb">Ավտոպարկ <i data-lucide="chevron-right"></i></span><h1>Գոտիներ</h1>
      <div class="live"></div>
    </header>
    <div class="content">
      <div class="ph"><p>Սակագների գոտիներ՝ քաղաք, օդանավակայան, կենտրոն</p>
        <span class="end" id="phend"></span></div>
      <section class="card mapcard" aria-label="Գոտիների քարտեզ">
        <div class="maphost"><div id="map"></div><div class="tools" id="tools"></div></div>
      </section>
      <aside class="card" aria-label="Գոտիներ և խմբագրվող գոտին" id="panel"></aside>
    </div>
  </div>
</div>
<script>
  shell('zones')
  const QS = new URLSearchParams(location.search)
  const EDIT = QS.get('edit') === '1', RULE = QS.get('rule') === '1', PAIR = QS.get('pair') === '1'
  const DARK = THEME === 'dark'
  /* MapGL takes plain colours, not CSS variables: the lane hues, per theme. */
  const COL = DARK ? { city: '#6B9BFF', air: '#F2C464', ctr: '#3DD68C' } : { city: '#2563EB', air: '#B45309', ctr: '#15803D' }
  const Z = [
    { id: 'city', name: 'Երևան', used: ['Eco City', 'Eco Comfort', 'Eco Kids', 'Eco Business', 'Eco Van', 'Eco Vip'],
      pts: [[40.2150, 44.4700], [40.2185, 44.5400], [40.1900, 44.5650], [40.1550, 44.5450], [40.1500, 44.4800], [40.1800, 44.4550]] },
    { id: 'air', name: 'Զվարթնոց օդանավակայան', used: ['Eco City', 'Eco Comfort'],
      pts: [[40.158012, 44.380455], [40.160301, 44.409918], [40.149870, 44.416204], [40.138544, 44.410733], [40.137102, 44.383917]] },
    { id: 'ctr', name: 'Կենտրոն', used: ['Eco City'], pts: [[40.1925, 44.5030], [40.1910, 44.5230], [40.1745, 44.5240], [40.1740, 44.5030]] },
  ]
  const sel = Z[1]
  /* Change list 2026-10-15 — the exception layer. Each zone carries rules; ?rule=1 opens one in the editor; ?pair=1 is
     «Գոտուց գոտի», the A→B grid (row = pickup, column = drop-off) with a worked price that shows which layer won. */
  const RULES = {
    city: [],
    air: [['circle-dollar-sign', 'Նստեցման և իջեցման վճար', '+500 ֏', 'Նստեցում և իջեցում · բոլոր սակագները'],
      ['arrow-down-to-line', 'Նվազագույն գին', '3 000 ֏', 'Նստեցում · փոխարինում է սակագնինը · Eco City, Comfort'],
      ['calendar-clock', 'Նախնական պատվեր', '≥ 2 ժ', 'Նստեցում · ամենաշուտը 2 ժամ առաջ · նվազագույնը 60 ր առաջ որոնում'],
      ['credit-card', 'Վճարում', 'Քարտ, հաշիվ', 'Նստեցում · կանխիկ՝ ոչ (օդանավակայանի կանգառ)'],
      ['car', 'Սակագներ', '− Eco Kids', 'Նստեցում · Eco Kids-ը չի սպասարկում']],
    ctr: [['timer', 'Րոպեի գին', '18 ֏/ր', 'Նստեցում · ժ. 17:00–20:00 · Eco City, Comfort'],
      ['phone-off', 'Պատվերի աղբյուր', '− Վարորդ', 'Նստեցում · վարորդը չի ստեղծում պատվեր կենտրոնում'],
      ['calendar-x', 'Նախնական պատվեր', 'Անջ.', 'Նստեցում · ուրբ.–շաբ. 22:00–02:00 · միայն «Հիմա»']],
  }
  const ruleRow = ([ic, b, v, d], on) => `<div class="rule${on ? ' on' : ''}"><span class="ic"><i data-lucide="${ic}"></i></span><b>${b}</b><span class="v">${v}</span><span class="d">${d}</span></div>`
  const prio = '<div class="prio" aria-label="Կիրառման հերթականություն"><b>Սակագին</b><i data-lucide="chevron-right"></i><b>Գոտու կանոն</b><i data-lucide="chevron-right"></i><b>Գոտուց գոտի</b><span style="flex:1"></span>ավելի նեղ գոտին հաղթում է</div>'
  const sw = (on, label) => `<span class="switch${on ? ' on' : ''}" role="switch" aria-checked="${on}" aria-label="${label}"><i class="t"></i>${on ? 'Միաց.' : 'Անջ.'}</span>`
  const seg = (opts, on, label) => `<div class="seg" role="radiogroup" aria-label="${label}">${opts.map((o, i) => `<button role="radio" aria-checked="${i === on}" class="${i === on ? 'on' : ''}">${o}</button>`).join('')}</div>`
  const chk = (label, on) => `<span class="check${on ? ' on' : ''}" role="checkbox" aria-checked="${on}"><i class="b"></i>${label}</span>`
  const num = (v, u) => `<span class="num-in">${v}${u ? `<span>${u}</span>` : ''}</span>`
  const fl = (label, body) => `<div class="fl"><span class="label">${label}</span><div class="row-flex">${body}</div></div>`
  const href = (q) => `zones.html?theme=${THEME}${q}`
  const TABS = `<div class="seg" role="tablist" aria-label="Տեսք"><a role="tab" aria-selected="${!PAIR}" class="${PAIR ? '' : 'on'}" href="${href('')}" style="height:26px;padding:0 10px;border-radius:6px;display:flex;align-items:center;font:var(--c-strong);color:${PAIR ? 'var(--ink-muted)' : 'var(--ink)'};text-decoration:none;${PAIR ? '' : 'background:var(--surface);box-shadow:var(--e1)'}">Գոտիներ</a><a role="tab" aria-selected="${PAIR}" class="${PAIR ? 'on' : ''}" href="${href('&pair=1')}" style="height:26px;padding:0 10px;border-radius:6px;display:flex;align-items:center;font:var(--c-strong);color:${PAIR ? 'var(--ink)' : 'var(--ink-muted)'};text-decoration:none;${PAIR ? 'background:var(--surface);box-shadow:var(--e1)' : ''}">Գոտուց գոտի</a></div>`
  document.querySelector('.ph p').insertAdjacentHTML('afterend', TABS)
  document.querySelector('.ph p').textContent = PAIR ? 'Ֆիքսված գին, անցման հավելավճար կամ միջնորդավճար՝ A-ից B' : 'Սակագինը՝ հիմնականը · գոտին ավելացնում է բացառություններ'
  document.getElementById('phend').innerHTML = EDIT ? '<span class="pill warn"><i data-lucide="pencil"></i>Չպահված</span><button class="btn secondary" aria-keyshortcuts="N" aria-disabled="true" style="opacity:.5"><i data-lucide="plus"></i>Նոր գոտի<span class="kbd">N</span></button>'
    : RULE ? '<span class="pill warn"><i data-lucide="pencil"></i>Չպահված</span>'
    : PAIR ? '<button class="btn primary"><i data-lucide="plus"></i>Նոր կանոն</button>'
    : '<button class="btn secondary"><i data-lucide="plus"></i>Կանոն</button><button class="btn primary" aria-keyshortcuts="N"><i data-lucide="plus"></i>Նոր գոտի<span class="kbd">N</span></button>'
  if (PAIR) document.querySelector('.content').classList.add('pair')
  const T = (icon, label, on) => `<button class="${on ? 'on' : ''}" aria-label="${label}" title="${label}" aria-pressed="${!!on}"><i data-lucide="${icon}"></i></button>`
  document.getElementById('tools').innerHTML = PAIR ? '' : `<div class="bar2" role="toolbar" aria-label="Գծագրման գործիքներ">${T('hand', 'Տեղափոխել և ուղղել', true)}${T('pen-line', 'Գծել ազատ ձեռքով')}${T('square', 'Գծել ուղղանկյուն')}${T('circle', 'Գծել շրջան')}<span class="sep"></span>${T('undo-2', 'Չեղարկել վերջին կետը')}${T('eraser', 'Մաքրել գծագիրը')}</div>`
    + (EDIT ? '<div class="hint">Քաշեք անկյունը՝ տեղափոխելու · սեղմեք՝ նոր կետի համար</div>' : '')
  const panel = document.getElementById('panel')
  if (PAIR) {
    /* Row = pickup, column = drop-off. Կենտրոն sits inside Երևան, so Կենտրոն → Զվարթնոց beats Երևան → Զվարթնոց. */
    const P = { 'city>air': ['5 000 ֏', 'ֆիքսված'], 'ctr>air': ['4 500 ֏', 'ֆիքսված'], 'air>city': ['+1 000 ֏', 'անցում'], 'air>ctr': ['5 000 ֏', 'ֆիքսված'], 'ctr>city': ['+5 %', 'միջնորդ.'] }
    const ids = ['city', 'ctr', 'air'], nm = { city: 'Երևան', ctr: 'Կենտրոն', air: 'Զվարթնոց' }
    panel.innerHTML = `<div class="card-h"><h2>Գոտուց գոտի</h2><span class="sub">տող՝ նստեցում · սյուն՝ իջեցում</span></div><div class="scroll-y grow">
      ${prio}
      <div style="padding:12px var(--inset)"><table class="mxz"><colgroup><col style="width:96px"><col><col><col></colgroup>
        <thead><tr><th>Որտեղից ↓</th>${ids.map((b) => `<th style="--zc:${COL[b]}"><span class="sw"></span>${nm[b]}</th>`).join('')}</tr></thead>
        <tbody>${ids.map((a) => `<tr><th style="--zc:${COL[a]}"><span class="sw"></span>${nm[a]}</th>${ids.map((b) => { const c = P[a + '>' + b]
          return a === b ? '<td class="x"></td>' : `<td class="${a === 'ctr' && b === 'air' ? 'on' : ''}">${c ? `<b>${c[0]}</b><span>${c[1]}</span>` : '<span>—</span>'}</td>` }).join('')}</tr>`).join('')}</tbody></table></div>
      <div class="rh"><h3>Կենտրոն → Զվարթնոց</h3><span class="end">${sw(true, 'Կանոն')}</span></div>
      ${fl('Տեսակ', seg(['Ֆիքսված գին', 'Անցման հավելավճար', 'Միջնորդավճար'], 0, 'Կանոնի տեսակ'))}
      ${fl('Գին ըստ սակագնի', `${num('4 500', '֏ City')}${num('4 500', '֏ Comfort')}${num('6 500', '֏ Business')}${num('8 000', '֏ Vip')}`)}
      ${fl('Ուղղություն', `${seg(['Միայն A → B', 'Երկու կողմ'], 0, 'Ուղղություն')}<span class="faint" style="font:var(--c-small);align-self:center">հակառակը՝ առանձին կանոն</span>`)}
      ${fl('Ներառված է', `${chk('Սպասում 10 ր', true)}${chk('Ուղեբեռ', true)}${chk('Գոտու վճարներ', true)}${chk('Սպասարկման վճար', false)}`)}
      </div>
      <div class="edf"><button class="btn primary">Պահել</button><button class="btn secondary">Չեղարկել</button><span style="flex:1"></span><button class="btn danger s">Ջնջել</button></div>`
    document.querySelector('.maphost').insertAdjacentHTML('beforeend', `
      <div class="wk"><h4>Ինչպես է հաշվվում · Comfort, 14,2 կմ · 22 ր, ժ. 18:10</h4><span class="sub">Կենտրոն (Աբովյան 10) → Զվարթնոց</span>
        <div class="st skip"><span class="n">1</span><span>Սակագին՝ 700 + 14,2 × 110 + 22 × 14</span><span class="v"><s>2 600 ֏</s></span><span class="d">փոխարինվեց ֆիքսված գնով</span></div>
        <div class="st skip"><span class="n">2</span><span>Կենտրոն · րոպե 18 ֏/ր (17–20)</span><span class="v"><s>+88 ֏</s></span><span class="d">գոտու կանոն · ֆիքսվածը ներառում է</span></div>
        <div class="st skip"><span class="n">3</span><span>Զվարթնոց · իջեցում</span><span class="v"><s>+500 ֏</s></span><span class="d">գոտու վճար · ֆիքսվածը ներառում է</span></div>
        <div class="st"><span class="n">4</span><span>Կենտրոն → Զվարթնոց · ֆիքսված</span><span class="v">4 500 ֏</span><span class="d">հաղթում է «Երևան → Զվարթնոց 5 000 ֏»-ին՝ ավելի նեղ գոտի</span></div>
        <div class="st"><span class="n">+</span><span>Սպասարկման վճար · քարտով վճարում 2 %</span><span class="v">+90 ֏</span><span class="d">միայն քարտ, Apple Pay, Google Pay · կանխիկ՝ 0</span></div>
        <div class="st tot"><span class="n">=</span><span>Ուղևորը վճարում է · քարտով</span><span class="v">4 590 ֏</span></div>
      </div>`)
  } else if (RULE) {
    /* ?rule=1: the airport's first rule open — a pickup / drop-off charge. The six kinds a zone rule can be. */
    panel.innerHTML = `<div class="card-h"><h2>Զվարթնոց · կանոն</h2><span class="end">${sw(true, 'Կանոն')}</span></div><div class="scroll-y grow" style="--zc:${COL.air}">
      ${fl('Ինչ է անում', `<div class="types" style="width:100%">${[['circle-dollar-sign', 'Վճար', 1], ['replace', 'Գնի փոխարինում'], ['calendar-clock', 'Նախնական պատվեր'], ['credit-card', 'Վճարում'], ['car', 'Սակագին, մեքենա'], ['list-filter', 'Պատվերի տեսակ']].map(([ic, l, on]) => `<button class="${on ? 'on' : ''}" aria-pressed="${!!on}"><i data-lucide="${ic}"></i>${l}</button>`).join('')}</div>`)}
      ${fl('Երբ', seg(['Նստեցում', 'Իջեցում', 'Երկուսը'], 2, 'Երբ է կիրառվում'))}
      ${fl('Վճար', `${seg(['Ֆիքսված', '%', 'Երկուսը'], 0, 'Վճարի տեսակ')}${num('500', '֏')}`)}
      ${fl('Սակագներ', `${chk('Բոլորը', true)}<span class="faint" style="font:var(--c-small);align-self:center">կամ ընտրել՝ City, Comfort…</span>`)}
      ${fl('Ժամ և օր', `${seg(['Միշտ', 'Ժամերով'], 0, 'Ժամանակ')}`)}
      ${fl('Ում', `${chk('Ուղևոր', true)}${chk('Ընկերության պատվեր', true)}`)}
      ${fl('Վարորդին', `${seg(['Ամբողջը', 'Միջնորդավճարով'], 0, 'Վարորդի բաժին')}<span class="faint" style="font:var(--c-small);align-self:center">կայանատեղի վճարը փոխհատուցում է</span>`)}
      <div style="padding:12px var(--inset)"><div class="notice neutral"><i data-lucide="receipt"></i><span>Կտրոնում՝ առանձին տող «Օդանավակայանի վճար» · ֆիքսված գոտուց գոտի գինը կարող է այն ներառել</span></div></div>
      </div><div class="edf"><button class="btn primary">Պահել կանոնը</button><button class="btn secondary">Չեղարկել</button><span style="flex:1"></span><button class="btn danger s">Ջնջել</button></div>`
  } else if (!EDIT) {
    const R = RULES[sel.id]
    panel.innerHTML = `<div class="card-h"><h2>Գոտիներ</h2><span class="sub mono">${Z.length}</span></div><div class="scroll-y grow">${prio}<ul class="zones">${Z.map((z) => `
      <li class="zone${z === sel ? ' on' : ''}" style="--zc:${COL[z.id]}"><span class="sw"></span><span class="nm">${z.name}</span>
        <span class="cnt">${RULES[z.id].length ? RULES[z.id].length + ' կանոն' : 'կանոն չկա'}</span>
        <span class="use">${z.used.length ? (z.used.length > 2 ? `${z.used.length} սակագին` : z.used.join(', ')) + ' · ջնջել չի լինի' : 'Չի օգտագործվում'}</span></li>`).join('')}</ul>
      <div class="rh"><h3>Զվարթնոց</h3><span class="end"><button class="btn ghost s" aria-label="Խմբագրել ${sel.name}">Սահմաններ</button><button class="btn danger s" aria-disabled="true" title="Սակագինն օգտագործում է" style="opacity:.5">Ջնջել</button></span></div>
      ${R.map((r) => ruleRow(r, false)).join('')}<a class="rule" href="${href('&rule=1')}" style="color:var(--brand-text);text-decoration:none"><span class="ic"><i data-lucide="plus"></i></span><b style="color:inherit">Ավելացնել կանոն</b><span></span></a>
      <div style="padding:12px var(--inset)"><div class="notice neutral"><i data-lucide="info"></i><span>Կանոնը փոխում է միայն նշված դաշտը · մնացածը՝ <a href="tariffs.html?theme=${THEME}&t=comfort&sec=price" style="color:var(--brand-text)">սակագնից</a></span></div></div></div>`
  } else {
    /* ?edit=1: the airport zone open; corner 3 was dragged south-east (unsaved). */
    panel.innerHTML = `<div class="card-h"><h2>Խմբագրել ${sel.name}</h2></div><div class="scroll-y grow"><div class="ed" style="--zc:${COL.air}">
      <label><span class="label">Գոտու անուն</span><span class="input"><span class="val">${sel.name}</span></span></label>
      <div class="pts"><span></span><span class="h">Լայնություն</span><span class="h">Երկայնություն</span><span></span>
        ${sel.pts.map((p, i) => `<span class="vx">${i + 1}</span><span class="input${i === 2 ? ' focus' : ''}"><span class="val">${p[0].toFixed(6)}</span></span><span class="input${i === 2 ? ' focus' : ''}"><span class="val">${p[1].toFixed(6)}</span></span><button class="btn ghost icon s" aria-label="Հեռացնել կետ ${i + 1}"><i data-lucide="x"></i></button>`).join('')}</div>
      <button class="btn secondary s" style="align-self:flex-start"><i data-lucide="plus"></i>Ավելացնել կետ</button>
      <div class="used">Օգտագործում է՝ ${sel.used.map((u) => `<span class="pill">${u}</span>`).join('')}</div>
      <span class="faint" style="font:var(--c-small)">Աստիճաններ՝ մինչև 6 նիշ կետից հետո, օր. 40.177612</span>
    </div></div><div class="edf"><button class="btn primary">Պահել գոտին</button><button class="btn secondary">Չեղարկել</button></div>`
  }
  const fit = EDIT ? sel.pts : Z.flatMap((z) => z.pts)
  const map = makeMap(document.getElementById('map'), { fit, padTL: EDIT ? [96, 96] : [64, 64], padBR: [48, 48], badge: { bottom: '12px', right: '12px' } })
  Z.forEach((z) => {
    const on = !EDIT || z === sel
    drawRoute(map, [...z.pts, z.pts[0]], { color: COL[z.id], weight: on ? 3 : 2, dash: on ? null : true })
    if (EDIT && z === sel) z.pts.forEach((p, i) => htmlMarker(map, p, `<div class="vx" style="--zc:${COL[z.id]}">${i + 1}</div>`, [22, 22]))
    if (!EDIT || z === sel) {
      /* Label at the centre, except the city, whose centre is the Կենտրոն zone: its label sits inside its north edge. */
      const c = z.id === 'city' ? [40.2080, 44.5050] : [z.pts.reduce((a, p) => a + p[0], 0) / z.pts.length, z.pts.reduce((a, p) => a + p[1], 0) / z.pts.length]
      htmlMarker(map, c, `<div class="zl" style="--zc:${COL[z.id]}">${z.name}</div>`, [10, 22])
    }
  })
  if (PAIR) {
    const c = (z) => [z.pts.reduce((a, p) => a + p[0], 0) / z.pts.length, z.pts.reduce((a, p) => a + p[1], 0) / z.pts.length]
    drawRoute(map, [c(Z[2]), [40.170, 44.455], c(Z[1])], { color: DARK ? '#F5F5F5' : '#111111', weight: 4 })
    htmlMarker(map, [40.170, 44.455], '<div class="zl" style="--zc:var(--ink)">4 500 ֏ · ֆիքսված</div>', [10, 22])
  }
  icons()
</script>
</body>
</html>
