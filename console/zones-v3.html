<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zones v3</title>
<link rel="stylesheet" href="console.css">
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="../mapgl.local.js"></script>
<script src="../kit.js"></script>
<script src="console.js"></script>
<script src="console-audit.js"></script>
<style>
  /* ── Zones v3 (owner review 2026-10-21: "the zone is the tool to play with the general tariffs").
     A zone is a polygon. A ZONE RULE is the exception: it names 1..n zones (side Ա, and side Բ for Ա → Բ), a condition
     (pickup · drop-off · either end · both ends inside · Ա → Բ), the tariffs it touches, and EITHER an availability
     list (a) OR a price modifier (c: replace with a fixed fare / with another fare structure, + amount, + %), inside an
     optional validity window (b). Order stays Սակագին → Գոտու կանոն → Գոտուց գոտի. Every rule says in plain Armenian what
     it does (the preview line). Spec: docs/superpowers/specs/2026-10-21-tariff-zone-rules-design.md.
     ?state= ''|rules|avail|fixed|structure|pct ── */
  .content { grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: auto minmax(0, 1fr); }
  .content.wide { grid-template-columns: minmax(0, 1fr) 580px; }
  @media (max-width: 1400px) { .content { grid-template-columns: minmax(0, 1fr) 340px; } .content.wide { grid-template-columns: minmax(0, 1fr) 520px; } }
  .phd { grid-column: 1 / 3; display: flex; align-items: center; gap: 12px; padding: 4px 4px 0; }
  .phd p { font: var(--c-body); color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .phd .end { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
  .tabs2 { display: flex; gap: 2px; padding: 3px; border-radius: var(--r-ctl); background: var(--surface-alt); flex: none; }
  .tabs2 a { height: 26px; padding: 0 10px; border-radius: 6px; display: flex; align-items: center; gap: 6px; font: var(--c-strong); color: var(--ink-muted); text-decoration: none; white-space: nowrap; }
  .tabs2 a.on { background: var(--surface); color: var(--ink); box-shadow: var(--e1); }
  .tabs2 .c { font: var(--c-small); color: var(--ink-faint); }
  .mapcard { position: relative; }
  .zl { width: max-content; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--surface); box-shadow: var(--e1), inset 3px 0 0 var(--zc); font: 500 12px/22px var(--font); color: var(--ink); white-space: nowrap; }
  .zl.side { font-weight: 600; box-shadow: var(--e2), inset 0 0 0 2px var(--zc); }
  .legend { position: absolute; z-index: 30; left: 12px; top: 12px; padding: 8px 10px; border-radius: var(--r-ctl); background: var(--surface); box-shadow: var(--e2); display: flex; flex-direction: column; gap: 4px; font: var(--c-small); color: var(--ink-muted); }
  .legend b { color: var(--ink); font-weight: 600; }
  .zs { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--zc); flex: none; }
  /* Zone list */
  .zone { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 10px var(--inset); border-bottom: 1px solid var(--line-soft); cursor: pointer; }
  .zone .nm { font: var(--c-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zone .cnt { font: var(--c-small); color: var(--ink-faint); white-space: nowrap; }
  .zone .use { grid-column: 2 / 4; font: var(--c-small); color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zone.on { background: var(--surface-alt); box-shadow: inset 3px 0 0 var(--brand-vivid); }
  .rh { display: flex; align-items: center; gap: 8px; padding: 14px var(--inset) 6px; }
  .rh h3 { font: var(--c-head); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .rh .end { margin-left: auto; flex: none; display: flex; gap: 4px; }
  .offer { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 var(--inset) 10px; }
  /* Rule rows (list) */
  .rl { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 10px var(--inset); border-bottom: 1px solid var(--line-soft); text-decoration: none; color: var(--ink); }
  .rl:hover, .rl.on { background: var(--surface-alt); }
  .rl .ic { grid-row: 1 / 4; align-self: start; width: 28px; height: 28px; border-radius: 7px; background: var(--surface-alt); display: grid; place-items: center; color: var(--ink-muted); }
  .rl.on .ic, .rl:hover .ic { background: var(--surface); }
  .rl .ic svg { width: 16px; height: 16px; }
  .rl b { font: var(--c-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rl .v { font: 500 13px/18px var(--mono); white-space: nowrap; text-align: right; }
  .rl .w { grid-column: 2 / 3; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font: var(--c-small); color: var(--ink-muted); }
  .rl .w svg { width: 14px; height: 14px; color: var(--ink-faint); }
  .rl .st { grid-column: 3; grid-row: 2 / 4; justify-self: end; align-self: start; }
  .rl .t { grid-column: 2 / 3; font: var(--c-small); color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zt { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: var(--r-tag); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-soft); font: var(--c-small); color: var(--ink); white-space: nowrap; }
  .zt .zs { width: 8px; height: 8px; }
  .filt { display: flex; align-items: center; gap: 8px; padding: 10px var(--inset); border-bottom: 1px solid var(--line-soft); }
  /* ── Rule builder ── */
  .bs { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 6px 10px; padding: 12px var(--inset); border-bottom: 1px solid var(--line-soft); }
  .bs > .n { width: 22px; height: 22px; border-radius: 50%; background: var(--surface-alt); display: grid; place-items: center; font: 600 12px/1 var(--mono); color: var(--ink-muted); }
  .bs > h4 { font: var(--c-strong); align-self: center; display: flex; align-items: center; gap: 8px; }
  .bs > h4 small { font: var(--c-small); color: var(--ink-faint); font-weight: 400; }
  .bs > .b { grid-column: 2; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .kinds { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .kinds button, .conds button { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 0 8px; align-items: center; text-align: left; padding: 8px 10px; border-radius: var(--r-ctl); box-shadow: inset 0 0 0 1px var(--line-control); background: var(--surface); color: var(--ink); min-height: 44px; }
  .kinds button svg, .conds button svg { width: 18px; height: 18px; color: var(--ink-muted); grid-row: 1 / 3; }
  .kinds button b, .conds button b { font: var(--c-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kinds button small, .conds button small { font: var(--c-small); color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kinds button.on, .conds button.on { box-shadow: inset 0 0 0 2px var(--ink); background: var(--surface-alt); }
  .kinds button.on svg, .conds button.on svg { color: var(--ink); }
  .conds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .side { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; align-items: start; }
  .side .tagab { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 600 13px/1 var(--font); background: var(--ink); color: var(--surface); margin-top: 1px; }
  .side .tagab.b { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .zchip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px 0 10px; border-radius: var(--r-pill); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-control); font: var(--c-strong); white-space: nowrap; }
  .zchip button { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-faint); }
  .zchip button svg { width: 14px; height: 14px; }
  .addz { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--r-pill); box-shadow: inset 0 0 0 1px var(--line-soft); font: var(--c-small); color: var(--ink-muted); }
  .addz svg { width: 14px; height: 14px; }
  .num-in { display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; height: 30px; padding: 0 8px; border-radius: var(--r-ctl); box-shadow: inset 0 0 0 1px var(--line-control); background: var(--surface); font: 500 13px/18px var(--mono); white-space: nowrap; min-width: 84px; }
  .num-in span { color: var(--ink-faint); font-family: var(--font); }
  .num-in.off { color: var(--ink-faint); background: transparent; box-shadow: inset 0 0 0 1px var(--line-soft); }
  .num-in.focus { box-shadow: inset 0 0 0 1px var(--focus-ring), 0 0 0 3px var(--brand-soft); }
  .seg.sm button { height: 24px; padding: 0 8px; }
  .x { font: var(--c-small); color: var(--ink-faint); }
  .dt { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border-radius: var(--r-ctl); box-shadow: inset 0 0 0 1px var(--line-control); background: var(--surface); font: 500 13px/18px var(--mono); white-space: nowrap; }
  .dt svg { width: 14px; height: 14px; color: var(--ink-faint); }
  /* Per-tariff table: default value for all, override per tariff; the result column is the worked example. */
  .pt { width: 100%; border-collapse: collapse; }
  .pt th { font: var(--c-label); color: var(--ink-faint); text-align: left; padding: 4px 6px; white-space: nowrap; }
  .pt td { padding: 4px 6px; border-top: 1px solid var(--line-soft); font: var(--c-body); white-space: nowrap; height: 40px; }
  .pt td.r, .pt th.r { text-align: right; } .pt td.m { font: 500 13px/18px var(--mono); }
  .pt td.m s { color: var(--ink-faint); }
  .pt tr.inh td { color: var(--ink-muted); }
  .pt .num-in { min-width: 92px; }
  .pt tr.no td { color: var(--ink-faint); }
  /* Preview: the rule in one plain-Armenian sentence, plus a worked fare. Sticky above the footer. */
  .say { margin: 8px var(--inset) 0; padding: 10px 12px; border-radius: var(--r-card); background: var(--brand-tint); color: var(--ink); display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 2px 10px; flex: none; }
  .say svg { width: 18px; height: 18px; color: var(--brand-text); margin-top: 1px; }
  .say p { font: 400 13px/19px var(--font); }
  .say p b { font-weight: 600; }
  .say .ex { grid-column: 2; font: var(--c-small); color: var(--ink-muted); }
  .say .ex .mono { color: var(--ink); }
  .edf { display: flex; align-items: center; gap: 8px; padding: 12px var(--inset); border-top: 1px solid var(--line-soft); flex: none; }
  .fl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .select { display: flex; align-items: center; gap: 8px; height: var(--h-m); padding: 0 10px; border-radius: var(--r-ctl); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-control); min-width: 0; font: var(--c-body); }
  .select .val { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .select svg { width: 16px; height: 16px; color: var(--ink-faint); flex: none; }
  .mini { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .mini .num-in { width: 100%; min-width: 0; }
  .mini label { display: flex; flex-direction: column; gap: 4px; font: var(--c-label); color: var(--ink-faint); }
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="main">
    <header class="bar">
      <span class="crumb">Ավտոպարկ <i data-lucide="chevron-right"></i></span><h1>Գոտիներ</h1>
      <div class="live"></div>
    </header>
    <div class="content" id="ct">
      <div class="phd" id="phd"></div>
      <section class="card mapcard" aria-label="Գոտիների քարտեզ">
        <div class="maphost"><div id="map"></div><div id="lg"></div></div>
      </section>
      <aside class="card" aria-label="Գոտիներ և կանոններ" id="panel" data-truncate></aside>
    </div>
  </div>
</div>
<script>
  shell('zones')
  const ST = mockStates([['', 'Գոտիներ · Զվարթնոց'], ['rules', 'Կանոններ · ցանկ'], ['avail', 'Կանոն · (ա) միայն այս սակագները'], ['fixed', 'Կանոն · Ա → Բ ֆիքսված, ժամկետով'],
    ['structure', 'Կանոն · այլ գնային կառուցվածք'], ['pct', 'Կանոն · + %, համընկնում']])
  const href = (s) => `zones-v3.html?theme=${THEME}${s ? '&state=' + s : ''}`
  const DARK = THEME === 'dark'
  const COL = DARK ? { city: '#6B9BFF', air: '#F2C464', ctr: '#3DD68C', arb: '#C79BFF', ejm: '#F472B6' } : { city: '#2563EB', air: '#B45309', ctr: '#15803D', arb: '#7C3AED', ejm: '#BE185D' }
  const Z = [
    { id: 'city', name: 'Երևան', pts: [[40.2150, 44.4700], [40.2185, 44.5400], [40.1900, 44.5650], [40.1550, 44.5450], [40.1500, 44.4800], [40.1800, 44.4550]] },
    { id: 'ctr', name: 'Կենտրոն', pts: [[40.1925, 44.5030], [40.1910, 44.5230], [40.1745, 44.5240], [40.1740, 44.5030]] },
    { id: 'arb', name: 'Արաբկիր', pts: [[40.2120, 44.4920], [40.2130, 44.5150], [40.1975, 44.5175], [40.1960, 44.4935]] },
    { id: 'air', name: 'Զվարթնոց', pts: [[40.158012, 44.380455], [40.160301, 44.409918], [40.149870, 44.416204], [40.138544, 44.410733], [40.137102, 44.383917]] },
    { id: 'ejm', name: 'Էջմիածին', pts: [[40.1760, 44.2700], [40.1770, 44.3050], [40.1500, 44.3080], [40.1480, 44.2720]] },
  ]
  const zb = (id) => Z.find((z) => z.id === id)
  const zt = (id) => `<span class="zt"><span class="zs" style="--zc:${COL[id]}"></span>${zb(id).name}</span>`
  /* The fleet's rules. [id, icon, name, A, B, condition, value, window, status, tiers]. */
  const RULES = [
    ['avail', 'list-checks', 'Օդանավակայանում՝ միայն այս սակագները', ['air'], [], 'pickup', 'հասան.', 'միշտ', 'ok', 'Aero, Business, Van, Vip'],
    ['fixed', 'replace', 'Նոյեմբեր՝ Կենտրոն, Արաբկիր → Զվարթնոց', ['ctr', 'arb'], ['air'], 'from_to', '4 500 ֏', '01.11 – 30.11.2026', 'soon', 'բոլորը · Vip՝ 7 000 ֏'],
    ['air-old', 'replace', 'Զվարթնոց՝ սակագների գներ', ['air'], [], 'either', 'ըստ սակագնի', 'միշտ', 'ok', '6 սակագին · փոխադրված 19.10-ի աղյուսակից'],
    ['structure', 'calculator', 'Էջմիածին ↔ Երևան՝ քաղաքամիջյան', ['ejm'], ['city'], 'from_to2', '600 + 120/կմ', 'միշտ', 'ok', 'City, Comfort'],
    ['pct', 'percent', 'Կենտրոն՝ տոնական սեզոն', ['ctr'], [], 'pickup', '+10 %', '01.11 – 31.12.2026', 'soon', 'բոլորը'],
    ['add', 'circle-plus', 'Էջմիածին՝ իջեցում', ['ejm'], [], 'dropoff', '+500 ֏', '01.09 – 30.09.2026', 'done', 'բոլորը'],
  ]
  const CONDTX = { pickup: 'նստեցում', dropoff: 'իջեցում', either: 'նստեցում կամ իջեցում', within: 'երկու ծայրն էլ ներսում', from_to: 'Ա → Բ', from_to2: 'Ա ↔ Բ' }
  const STP = { ok: ['ok', 'Գործում է', 'circle-check'], soon: ['', 'Սպասվում է', 'clock'], done: ['', 'Ավարտված', 'circle-slash'], off: ['', 'Անջատված', 'pause'] }
  const pill = (k) => `<span class="pill ${STP[k][0]}"><i data-lucide="${STP[k][2]}"></i>${STP[k][1]}</span>`
  const panel = document.getElementById('panel')
  const ct = document.getElementById('ct')
  const BUILD = ['avail', 'fixed', 'structure', 'pct'].includes(ST)
  const LIST = ST === 'rules'
  if (BUILD || LIST) ct.classList.add('wide')
  /* Page head: one tab strip «Գոտիներ · Կանոններ», then the one primary action for the tab. */
  document.getElementById('phd').innerHTML = `<div class="tabs2" role="tablist" aria-label="Տեսք"><a role="tab" aria-selected="${!BUILD && !LIST}" class="${!BUILD && !LIST ? 'on' : ''}" href="${href('')}"><i data-lucide="map" style="width:16px;height:16px"></i>Գոտիներ<span class="c mono">${Z.length}</span></a><a role="tab" aria-selected="${BUILD || LIST}" class="${BUILD || LIST ? 'on' : ''}" href="${href('rules')}"><i data-lucide="sliders-horizontal" style="width:16px;height:16px"></i>Կանոններ<span class="c mono">${RULES.length}</span></a></div>
    <p>${BUILD || LIST ? 'Բացառություններ սակագնի վրա՝ որտեղ, երբ և ինչքան' : 'Գոտին քարտեզի տարածք է · կանոնները՝ «Կանոններ»-ում'}</p>
    <span class="end">${BUILD ? '<span class="pill warn"><i data-lucide="pencil"></i>Չպահված</span>' : LIST ? `<a class="btn primary" href="${href('fixed')}" aria-keyshortcuts="N"><i data-lucide="plus"></i>Նոր կանոն<span class="kbd">N</span></a>` : `<a class="btn secondary" href="${href('fixed')}"><i data-lucide="plus"></i>Կանոն</a><button class="btn primary" aria-keyshortcuts="N"><i data-lucide="plus"></i>Նոր գոտի<span class="kbd">N</span></button>`}</span>`

  /* Map highlight per state: side A (solid, heavy), side B (solid, heavy), the rest dashed. */
  const HL = { avail: [['air'], []], fixed: [['ctr', 'arb'], ['air']], structure: [['ejm'], ['city']], pct: [['ctr'], []], rules: [[], []], '': [['air'], []] }[ST] || [[], []]

  const sw = (on, label, txt) => `<span class="switch${on ? ' on' : ''}" role="switch" aria-checked="${on}" aria-label="${label}"><i class="t"></i>${txt || (on ? 'Միաց.' : 'Անջ.')}</span>`
  const n = (v, u, cls) => `<span class="num-in${cls ? ' ' + cls : ''}">${v}${u ? `<span>${u}</span>` : ''}</span>`
  const seg = (opts, on, label) => `<div class="seg sm" role="radiogroup" aria-label="${label}">${opts.map((o, i) => `<button role="radio" aria-checked="${i === on}" class="${i === on ? 'on' : ''}">${o}</button>`).join('')}</div>`
  const chk = (label, on) => `<span class="check${on ? ' on' : ''}" role="checkbox" aria-checked="${on}"><i class="b">${on ? '<i data-lucide="check" style="width:12px;height:12px;color:var(--brand-fill-ink)"></i>' : ''}</i>${label}</span>`
  const zchips = (ids, label) => ids.map((z) => `<span class="zchip"><span class="zs" style="--zc:${COL[z]}"></span>${zb(z).name}<button aria-label="Հանել ${zb(z).name}"><i data-lucide="x"></i></button></span>`).join('') + `<span class="addz" role="combobox" aria-expanded="false" aria-label="Ավելացնել գոտի · ${label}"><i data-lucide="plus"></i>գոտի</span>`
  const bs = (i, h, b, small) => `<div class="bs"><span class="n">${i}</span><h4>${h}${small ? `<small>${small}</small>` : ''}</h4><div class="b">${b}</div></div>`
  const TIERS7 = ['Eco City', 'Eco Comfort', 'Eco Kids', 'Eco Business', 'Eco Van', 'Eco Vip', 'Eco Aero']

  if (BUILD) {
    const R = RULES.find((r) => r[0] === ST)
    const kind = ST === 'avail' ? 0 : 1
    const cond = { avail: 0, fixed: 4, structure: 4, pct: 0 }[ST]

    const s1 = `<div class="kinds" role="radiogroup" aria-label="Ինչ է անում կանոնը">${[['list-checks', 'Սակագների հասանելիություն', 'որ սակագներն են երևում'], ['banknote', 'Գնի փոփոխություն', 'փոխարինել, + գումար, + %']].map(([ic, b, s], i) => `<button role="radio" aria-checked="${i === kind}" class="${i === kind ? 'on' : ''}"><i data-lucide="${ic}"></i><b>${b}</b><small>${s}</small></button>`).join('')}</div>`
    const s2 = `<div class="conds" role="radiogroup" aria-label="Երբ է կիրառվում">${C.map(([ic, b, s], i) => `<button role="radio" aria-checked="${i === cond}" class="${i === cond ? 'on' : ''}"${kind === 0 && i > 2 ? ' aria-disabled="true" style="opacity:.45" title="Հասանելիությունը որոշվում է նստեցման կամ իջեցման կետով"' : ''}><i data-lucide="${ic}"></i><b>${b}</b><small>${s}</small></button>`).join('')}</div>`
    const A = HL[0], B = HL[1]
    const s3 = `<div class="side"><span class="tagab" aria-label="Ա">Ա</span><div class="chips">${zchips(A, 'Ա')}</div></div>`
      + (cond === 4 ? `<div class="side"><span class="tagab b" aria-label="Բ">Բ</span><div class="chips">${zchips(B, 'Բ')}</div></div>
        <div class="fl">${seg(['Միայն Ա → Բ', 'Երկու ուղղությամբ'], ST === 'structure' ? 1 : 0, 'Ուղղություն')}<span class="x">${ST === 'structure' ? 'Բ → Ա՝ նույն կանոնով' : 'Բ → Ա՝ առանձին կանոն'}</span></div>` : '')
      + `<span class="x">Մեկ, երկու կամ շատ գոտի․ բավական է՝ կետը լինի դրանցից որևէ մեկում</span>`
    let s4 = '', s5 = '', say = '', ex = ''
    if (ST === 'avail') {
      s4 = `<span class="x">Այստեղ նստողը կտեսնի միայն նշվածները</span><div class="chips">${TIERS7.map((t) => chk(t, ['Eco Business', 'Eco Van', 'Eco Vip', 'Eco Aero'].includes(t))).join('')}</div>
        <div class="notice neutral"><i data-lucide="info"></i><span>Eco Aero-ն ինքը սահմանափակված է Զվարթնոցով՝ <a href="tariffs-v3.html?theme=${THEME}&state=detail" style="color:var(--brand-text)">սակագնի «Որտեղից → Որտեղ»</a>-ում · այստեղ որոշում ենք, թե ուրիշ ինչ է երևում օդանավակայանում</span></div>`
      say = `<p><b>«Զվարթնոց»</b> գոտում նստող ուղևորը կտեսնի միայն <b>Eco Business, Eco Van, Eco Vip, Eco Aero</b>։ Eco City, Comfort, Kids-ը այնտեղ չեն երևա հավելվածում, իսկ դիսպետչերը կտեսնի «ոչ այստեղ»։</p>`
      ex = `Գինը չի փոխվում · միշտ · դիսպետչերի պատվերներին ևս`
    } else {
      const mod = { fixed: 0, structure: 0, pct: 2 }[ST]
      s4 = `<div class="fl">${seg(['Փոխարինել գինը', '+ գումար', '+ %'], mod, 'Փոփոխության տեսակ')}${mod === 0 ? seg(['Ֆիքսված գին', 'Այլ գնային կառուցվածք'], ST === 'structure' ? 1 : 0, 'Ինչով փոխարինել') : ''}</div>`
      if (ST === 'fixed') {
        s4 += `<div class="fl"><span class="x" style="min-width:120px">Բոլոր սակագներին</span>${n('4 500', '֏', 'focus')}<span class="x">ամբողջ գինը՝ սպասումը ներառած</span></div>
          <table class="pt"><thead><tr><th>Սակագին</th><th>Արժեք</th><th class="r">Սակագնով</th><th class="r">Կանոնով</th></tr></thead><tbody>
          ${[['Eco City', null, '2 600', '4 500'], ['Eco Comfort', null, '2 800', '4 500'], ['Eco Kids', null, '3 000', '4 500'], ['Eco Business', '5 500', '3 300', '5 500'], ['Eco Van', null, '3 800', '4 500'], ['Eco Vip', '7 000', '4 900', '7 000'], ['Eco Aero', '—', '—', 'չի գործում']].map(([t, o, a, b]) => `<tr class="${o === null ? 'inh' : o === '—' ? 'no' : ''}"><td>${t}</td><td>${o === null ? '<span class="x">բոլորինը</span>' : o === '—' ? '<span class="x">Ա-ում չի երևում</span>' : n(o, '֏')}</td><td class="r m">${a === '—' ? '—' : `<s>${a} ֏</s>`}</td><td class="r m">${b.includes('չի') ? `<span class="x">${b}</span>` : b + ' ֏'}</td></tr>`).join('')}</tbody></table>
          <span class="x">Կանոնով գինը չի կարող լինել ավելի ցածր նույն ուղու ավելի էժան սակագնից · ստուգվում է պահելիս</span>`
        say = `<p><b>01.11.2026-ից 30.11.2026</b> ներառյալ <b>«Կենտրոն»</b> կամ <b>«Արաբկիր»</b> գոտում նստած և <b>«Զվարթնոց»</b> գոտում իջած ուղևորը կվճարի <b>4 500 ֏</b> սակագնի գնի փոխարեն (Eco Business՝ 5 500 ֏, Eco Vip՝ 7 000 ֏)։ Հակառակ ուղղությունը չի փոխվում։</p>`
        ex = `Օրինակ՝ Eco City, Աբովյան 10 → Զվարթնոց, 14,2 կմ · 22 ր՝ <span class="mono">2 600 ֏ → 4 500 ֏</span>`
      } else if (ST === 'structure') {
        s4 += `<div class="mini"><label>Նստելու գին${n('600', '֏')}</label><label>Կիլոմետր${n('120', '֏/կմ')}</label><label>Րոպե${n('10', '֏/ր')}</label><label>Նվազագույն${n('3 000', '֏')}</label></div>
          <div class="fl"><span class="x">Սպասումը, կլորացումը, ժամային գները՝</span>${seg(['սակագնից', 'չկան'], 0, 'Մնացածը')}</div>
          <div class="fl"><span class="x" style="min-width:120px">Սակագներ</span><div class="chips">${TIERS7.map((t) => chk(t, ['Eco City', 'Eco Comfort'].includes(t))).join('')}</div></div>`
        say = `<p>Միշտ, <b>«Էջմիածին»</b> և <b>«Երևան»</b> գոտիների միջև, երկու ուղղությամբ, <b>Eco City</b> և <b>Eco Comfort</b> սակագներով ուղևորությունը կհաշվվի այլ կառուցվածքով՝ <b>600 ֏ + 120 ֏/կմ + 10 ֏/ր</b>, նվազագույնը <b>3 000 ֏</b>, սակագնի գնի փոխարեն։</p>`
        ex = `Օրինակ՝ Eco City, Էջմիածին → Կենտրոն, 21 կմ · 28 ր՝ <span class="mono">3 500 ֏ → 3 400 ֏</span>`
      } else {
        s4 += `<div class="fl"><span class="x" style="min-width:120px">Բոլոր սակագներին</span>${n('+10', '%', 'focus')}<span class="x">հաշվվում է սակագնի գնից, կլորացումից առաջ</span></div>
          <div class="fl"><span class="x" style="min-width:120px">Սակագներ</span>${chk('Բոլորը', true)}<span class="x">ներառյալ ապագա նոր սակագները</span></div>`
        say = `<p><b>01.11.2026-ից 31.12.2026</b> ներառյալ <b>«Կենտրոն»</b> գոտում նստող ուղևորի գինը կբարձրանա <b>10 %</b>-ով՝ բոլոր սակագներով։</p>`
        ex = `Օրինակ՝ Eco City, Աբովյան 10 → Կոմիտաս 22, 3,6 կմ · 9 ր՝ <span class="mono">1 000 ֏ → 1 100 ֏</span>`
      }
    }
    const win = ST === 'fixed' ? ['01.11.2026', '30.11.2026'] : ST === 'pct' ? ['01.11.2026', '31.12.2026'] : null
    s5 = `<div class="fl">${seg(['Միշտ', 'Ժամկետով'], win ? 1 : 0, 'Ժամկետ')}${win ? `<span class="dt"><i data-lucide="calendar"></i>${win[0]}</span><span class="x">–</span><span class="dt"><i data-lucide="calendar"></i>${win[1]}</span><span class="x">ներառյալ</span>` : ''}</div>
      <span class="x">${win ? 'Երևանի ժամանակով, 00:00-ից մինչև վերջին օրվա 24:00 · նախնական պատվերը՝ ըստ նստելու ժամի' : 'Մինչև անջատելը'}</span>`
    const conflict = ST === 'pct' ? `<div style="padding:10px var(--inset) 0"><div class="notice neutral" role="status"><i data-lucide="layers"></i><span>Նոյեմբերին «Կենտրոն» → «Զվարթնոց» ուղևորությանը կիրառվում է «Նոյեմբեր՝ Կենտրոն, Արաբկիր → Զվարթնոց» (գոտուց գոտի, 4 500 ֏) · այս +10 %-ը նրա տակ է և փոխարինվում է</span></div></div>` : ''
    panel.innerHTML = `<div class="card-h"><h2 style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${R[2]}</h2><span class="end">${sw(true, 'Կանոն', 'Միացված')}</span></div>
      <div class="scroll-y grow" data-truncate>
        <div class="bs" style="grid-template-columns:minmax(0,1fr)"><label class="label" for="rn">Անուն</label><span class="input" id="rn"><span class="val">${R[2]}</span></span></div>
        ${bs(1, 'Ինչ է անում', s1)}
        ${bs(2, 'Երբ է կիրառվում', s2, kind === 0 ? 'սակագնի ցուցակը որոշվում է նստեցման կետով' : '')}
        ${bs(3, 'Գոտիներ', s3, cond === 4 ? 'Ա՝ նստեցում · Բ՝ իջեցում' : '')}
        ${bs(4, kind === 0 ? 'Սակագներ' : 'Փոփոխություն', s4)}
        ${bs(5, 'Ժամկետ', s5)}
        ${conflict}
        <div style="height:12px"></div>
      </div>
      <div class="say" aria-live="polite"><i data-lucide="message-square-text"></i><p>${say.replace(/^<p>|<\/p>$/g, '')}</p><span class="ex">${ex}</span></div>
      <div class="edf"><button class="btn primary">Պահել կանոնը</button><a class="btn secondary" href="${href('rules')}">Չեղարկել</a><span style="flex:1"></span><button class="btn ghost s"><i data-lucide="copy"></i>Կրկնօրինակել</button><button class="btn danger s">Ջնջել</button></div>`
  } else if (LIST) {
    panel.innerHTML = `<div class="card-h"><h2>Կանոններ</h2><span class="sub mono">${RULES.length}</span><span class="end"><span class="x">Սակագին → Գոտու կանոն → Գոտուց գոտի</span></span></div>
      <div class="filt">${seg(['Բոլորը', 'Գործում են', 'Սպասվում են', 'Ավարտված'], 0, 'Ֆիլտր')}<span style="flex:1"></span><span class="select" style="width:150px" role="combobox" aria-expanded="false"><span class="val">Բոլոր գոտիները</span><i data-lucide="chevrons-up-down"></i></span></div>
      <div class="scroll-y grow">${RULES.map(([id, ic, nm, A, B, c, v, w, st, t]) => `<a class="rl${st === 'done' ? '' : ''}" href="${href(['avail', 'fixed', 'structure', 'pct'].includes(id) ? id : 'fixed')}"><span class="ic"><i data-lucide="${ic}"></i></span><b>${nm}</b><span class="v">${v}</span>
        <span class="w">${A.map(zt).join('')}${B.length ? `<i data-lucide="${c === 'from_to2' ? 'arrow-left-right' : 'arrow-right'}"></i>${B.map(zt).join('')}` : ''}<span>· ${CONDTX[c]}</span></span>${pill(st)}
        <span class="t">${w} · ${t}</span></a>`).join('')}
        <div style="padding:12px var(--inset)"><div class="notice neutral"><i data-lucide="git-merge"></i><span>Մի քանի կանոն միաժամանակ՝ յուրաքանչյուր շերտից գործում է մեկը. ժամկետովը հաղթում է մշտականին, հետո՝ ավելի նեղ գոտին։ «Զվարթնոց՝ սակագների գներ»-ը 19.10-ի գոտու գներից է, փոխադրված առանց փոփոխության։</span></div></div></div>`
  } else {
    const sel = zb('air')
    panel.innerHTML = `<div class="card-h"><h2>Գոտիներ</h2><span class="sub mono">${Z.length}</span></div><div class="scroll-y grow"><ul style="list-style:none">${Z.map((z) => { const k = RULES.filter((r) => r[3].includes(z.id) || r[4].includes(z.id)).length
      return `<li class="zone${z === sel ? ' on' : ''}" style="--zc:${COL[z.id]}"><span class="zs"></span><span class="nm">${z.name}</span><span class="cnt">${k ? k + ' կանոն' : 'կանոն չկա'}</span>
        <span class="use">${z.id === 'air' ? 'Այստեղ երևում են 4 սակագին' : 'Բոլոր սակագները'}${z.id === 'city' ? ' · ներառում է Կենտրոն, Արաբկիր' : ''}</span></li>` }).join('')}</ul>
      <div class="rh"><h3>Զվարթնոց</h3><span class="end"><button class="btn ghost s">Սահմաններ</button><button class="btn danger s" aria-disabled="true" title="Կանոններն օգտագործում են" style="opacity:.5">Ջնջել</button></span></div>
      <div class="rh" style="padding-top:4px"><h3 style="font:var(--c-label);color:var(--ink-faint)">Այստեղ նստողը տեսնում է</h3></div>
      <div class="offer">${['Eco Business', 'Eco Van', 'Eco Vip', 'Eco Aero'].map((t) => `<span class="chip">${t}</span>`).join('')}</div>
      <div class="rh" style="padding-top:4px"><h3 style="font:var(--c-label);color:var(--ink-faint)">Կանոններ այս գոտում</h3><span class="end"><a class="btn ghost s" href="${href('fixed')}"><i data-lucide="plus"></i>Կանոն</a></span></div>
      ${RULES.filter((r) => r[3].includes('air') || r[4].includes('air')).map(([id, ic, nm, A, B, c, v, w, st]) => `<a class="rl" href="${href(['avail', 'fixed'].includes(id) ? id : 'rules')}"><span class="ic"><i data-lucide="${ic}"></i></span><b>${nm}</b><span class="v">${v}</span><span class="w">${CONDTX[c]} · ${w}</span>${pill(st)}</a>`).join('')}
      <div style="padding:12px var(--inset)"><div class="notice neutral"><i data-lucide="info"></i><span>Գոտին միայն տարածք է · գինը և հասանելիությունը փոխում են կանոնները</span></div></div></div>`
  }

  /* Map */
  const map = makeMap(document.getElementById('map'), { fit: Z.flatMap((z) => z.pts), padTL: [64, 64], padBR: [48, 48], badge: { bottom: '12px', right: '12px' } })
  const cen = (z) => [z.pts.reduce((a, p) => a + p[0], 0) / z.pts.length, z.pts.reduce((a, p) => a + p[1], 0) / z.pts.length]
  const inA = (id) => HL[0].includes(id), inB = (id) => HL[1].includes(id)
  Z.forEach((z) => {
    const on = inA(z.id) || inB(z.id) || (!BUILD && ST !== 'rules')
    drawRoute(map, [...z.pts, z.pts[0]], { color: COL[z.id], weight: inA(z.id) || inB(z.id) ? 4 : 2, dash: on ? null : true })
    const c = z.id === 'city' ? [40.2160, 44.5300] : cen(z)
    const tag = BUILD ? (inA(z.id) ? 'Ա · ' : inB(z.id) ? 'Բ · ' : '') : ''
    htmlMarker(map, c, `<div class="zl${tag ? ' side' : ''}" style="--zc:${COL[z.id]}">${tag}${z.name}</div>`, [10, 22])
  })
  if (BUILD && HL[1].length) {
    const a = HL[0].map((id) => cen(zb(id))), b = cen(zb(HL[1][0]))
    a.forEach((p) => drawRoute(map, [p, b], { color: DARK ? '#F5F5F5' : '#111111', weight: 3, dash: true }))
  }
  if (BUILD) document.getElementById('lg').innerHTML = `<div class="legend"><span><b>Ա</b>՝ ${HL[0].map((id) => zb(id).name).join(', ')}</span>${HL[1].length ? `<span><b>Բ</b>՝ ${HL[1].map((id) => zb(id).name).join(', ')}</span>` : ''}<span>Մնացածը՝ կետագծով</span></div>`
  icons()
</script>
