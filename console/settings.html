<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings</title>
<link rel="stylesheet" href="console.css">
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="../kit.js"></script>
<script src="console.js"></script>
<script src="console-audit.js"></script>
<script src="settings-money.js"></script>
<style>
  /* Mirrors apps/operator components/admin/dispatch-settings.tsx: five groups in one 48rem column, every field a number
     with its unit, no preview band. The Pre-bookings group gains the rider reminder (owner decision 2026-10-12, drawn
     ahead: no rider push type and no config field yet). The «Ցածր գնահատական» group is owner decision 15 (2026-10-14):
     1–3 ★ is low, a follow-up within 24 h, both configurable (ECO.DISPATCH.lowRating; drawn ahead). Money is the existing
     money-settings.tsx. The Invoicing tab is gone (owner decision 11: no invoices); ?tab=invoicing opens Money. */
  .content { grid-template-columns: minmax(0, 1fr); }
  .page { overflow: hidden; }
  .col { width: 768px; max-width: 100%; padding: 4px var(--inset) 24px; display: flex; flex-direction: column; gap: 12px; }
  .grp { border-radius: var(--r-card); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-soft); }
  .grp > h2 { font: var(--c-head); padding: 12px var(--inset) 4px; }
  .grp > .ex { font: var(--c-small); color: var(--ink-muted); padding: 0 var(--inset) 8px; max-width: 680px; }
  .set { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 12px; align-items: center; min-height: 44px; padding: 6px var(--inset); border-top: 1px solid var(--line-soft); }
  .set .l { font: var(--c-body); color: var(--ink); }
  .set .l small { display: block; font: var(--c-small); color: var(--ink-muted); margin-top: 2px; }
  .set .v { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .set .v .input { width: 128px; }
  .set .v .input .val { text-align: right; }
  .set .u { font: var(--c-small); color: var(--ink-muted); width: 48px; white-space: nowrap; }
  .set.new { box-shadow: inset 3px 0 0 var(--brand-vivid); }
  .set.new .l b { font-weight: 600; }
  .newtag { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: var(--r-tag); background: var(--brand-fill); color: var(--brand-fill-ink); font: 500 12px/16px var(--font); margin-left: 6px; vertical-align: 1px; }
  .sum { font: var(--c-small); color: var(--ok-text); }
  .foot { display: flex; align-items: center; gap: 8px; padding-top: 4px; }
  .foot .rev { margin-left: auto; font: var(--c-small); color: var(--ink-faint); }
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="main">
    <header class="bar">
      <span class="crumb">Կառավարում <i data-lucide="chevron-right"></i></span><h1>Կարգավորումներ</h1>
      <div class="live"></div>
    </header>
    <div class="content">
      <section class="card page" aria-label="Կարգավորումներ">
        <nav class="tabsl" style="margin-top:0" aria-label="Կարգավորումների բաժիններ">
          <a href="settings.html" data-tab="dispatch"><i data-lucide="activity"></i>Դիսպետչեր</a>
          <a href="settings.html?tab=money" data-tab="money"><i data-lucide="wallet"></i>Գումար</a>
        </nav>
        <div class="scroll-y grow"><div class="col" id="col"></div></div>
      </section>
    </div>
  </div>
</div>
<script>
  shell('settings')
  /* [label key text, value, unit, hint, kind] — strings from lib/i18n.ts hy (settings.*). Values: the launch config;
     the pre-booking leads are the ones every surface uses (ECO.BOOKINGS: held T−30, activates T−15). */
  const N = (l, v, u, hint, ph) => `<div class="set"><span class="l">${l}${hint ? `<small>${hint}</small>` : ''}</span><span class="v"><span class="input"><span class="val mono${v ? '' : ' ph'}">${v || ph}</span></span><span class="u">${u || ''}</span></span></div>`
  const SW = (l, on) => `<div class="set"><span class="l">${l}</span><span class="v"><span class="switch${on ? ' on' : ''}" role="switch" aria-checked="${on}"><i class="t"></i>${on ? 'Միացված' : 'Անջատված'}</span><span class="u"></span></span></div>`
  const G = (title, rows, ex) => `<section class="grp"><h2>${title}</h2>${ex ? `<p class="ex">${ex}</p>` : ''}${rows.join('')}</section>`
  const R = ECO.DISPATCH.reminderMin
  const LR = ECO.DISPATCH.lowRating || { max: 3, followUpH: 24 }
  const TABQ = new URLSearchParams(location.search).get('tab') || 'dispatch'
  const TAB = TABQ === 'invoicing' ? 'money' : TABQ
  document.querySelectorAll('.tabsl a').forEach((a) => { a.href += (a.href.includes('?') ? '&' : '?') + 'theme=' + THEME; if (a.dataset.tab === TAB) { a.classList.add('on'); a.setAttribute('aria-current', 'page') } })
  const NEW = (l, v, u, hint) => `<div class="set new"><span class="l"><b>${l}</b><span class="newtag">Նոր</span>${hint ? `<small>${hint}</small>` : ''}</span><span class="v"><span class="input"><span class="val mono">${v}</span></span><span class="u">${u}</span></span></div>`
  if (TAB === 'dispatch') document.getElementById('col').innerHTML = `
    ${G('Բաշխում', [SW('Ավտոմատ փնտրել վարորդ', true)])}
    ${G('Ո՞վ է թեկնածու', [N('Որոնման շառավիղներ', '2, 4, 7', 'կմ', 'Ստորակետով՝ օր. 2, 4, 7'), SW('Սակագինը պետք է համընկնի', true), N('Նվազագույն գնահատական', '', '', '', 'օր. 4,5'), N('Միաժամանակ առաջարկներ վարորդին', '1', '')])}
    ${G('Ինչպե՞ս են դասակարգվում', [N('Մոտիկություն', '0,7', ''), N('Սպասման տևողություն', '0,3', ''), N('Ընդունման տոկոս', '0', ''), N('Գնահատական', '0', ''),
      '<div class="set"><span class="l">Կշիռների գումարը</span><span class="v"><span class="sum mono">1,0</span><span class="u"></span></span></div>',
      N('Մոտիկության սահման', '5', 'կմ'), N('Սպասման սահման', '30', 'րոպե')], 'Գումարը՝ 1 · ընդունումն ու գնահատականը՝ 0, քանի դեռ պատմություն չկա')}
    ${G('Ինչպե՞ս են ուղարկվում առաջարկները', [N('Ալիքներ՝ վարորդ ալիքում', '1, 1, 1', ''), SW('Նշանակել առանց ընդունման', false), N('Առաջարկի ժամանակ', '20', 'վրկ'), N('Հաստատման ժամանակ', '30', 'վրկ'), N('Բացակա՝ բաց թողնելուց հետո', '3', 'անգամ')],
      '«1, 1, 1»՝ երեքին հերթով · «3»՝ երեքին միասին')}
    ${G('Նախնական պատվերներ', [NEW('Հիշեցում ուղևորին', R, 'րոպե', 'ժամը, հասցեն և մեքենան · 0՝ անջատված')],
      `Որ սակագինն է ընդունում նախնական պատվեր, որոնման ժամը և նշանակումը՝ <a href="tariffs.html?theme=${THEME}&t=city&sec=preorder" style="color:var(--brand-text)">Սակագներ › Նախնական պատվեր</a>`)}
    ${G('Ցածր գնահատական', [NEW('Ցածր է՝ 1-ից մինչև', LR.max, '★', 'այս ուղևորությունները հայտնվում են Հարցումներում'), NEW('Պատասխանել', LR.followUpH, 'ժամում', 'դիսպետչերը զանգում է ուղևորին')])}
    <div class="foot"><button class="btn primary">Պահել</button><button class="btn secondary">Վերականգնել լռելյայնը</button><span class="pill warn">Չպահված</span><span class="rev">Տարբերակ 14</span></div>`
  if (TAB !== 'dispatch') window.drawMoneyTab(TAB)
  icons()
  /* The page opens on what this state is about: the pre-order reminder and the low-rating group (the real page is one
     scrolling column; the operator has scrolled to them). */
  document.fonts.ready.then(() => {
    const box = document.querySelector('.page .scroll-y'), row = [...document.querySelectorAll('.set.new')].pop()
    if (!row || TAB === 'money') return /* Money opens at the top: its new rows (payment methods) are the first group */
    box.scrollTop += row.getBoundingClientRect().top - box.getBoundingClientRect().top - box.clientHeight / 2 + row.offsetHeight / 2
  })
  document.fonts.ready.then(() => { document.documentElement.dataset.mapReady = 'none' })
</script>
</body>
</html>
