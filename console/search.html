<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search</title>
<link rel="stylesheet" href="console.css">
<link rel="stylesheet" href="corporate.css">
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="../kit.js"></script>
<script src="console.js"></script>
<script src="console-audit.js"></script>
<style>
  /* Mirrors apps/operator components/search/search-screen.tsx + search-results.tsx (§9.5). One query field (autofocused),
     the «Երեկ» window chip, the «Ըստ» override (a select, not a row of seven chips: the server reads the query as a phone,
     a plate, an address, a name or a driver by itself, and the result head says what it read) and «Որոնել ↵». Rides then
     riders, each a lane-style block with a sticky head; ↑↓ walk the results, ↵ opens one. No pagination: the head says how
     many are shown. The Rides list (rides.html) is the day's working list; this page is the lookup beside it (owner, 12 Oct).
     Built like the queue: flat blocks on one card, mono columns, a 3px spine on the focused row — no cards in cards. */
  .qbar { display: flex; align-items: center; gap: 8px; padding: 12px var(--inset); border-bottom: 1px solid var(--line-soft); flex: none; }
  .qbar .input.l { flex: 1; min-width: 0; box-shadow: inset 0 0 0 1px var(--focus-ring), 0 0 0 3px var(--brand-soft); }
  .qbar .input.l .val { font: 500 15px/20px var(--font); }
  .qbar .by { width: 176px; flex: none; }
  .qbar .by .k { color: var(--ink-faint); white-space: nowrap; }
  .readas { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 var(--inset); font: var(--c-body); color: var(--ink-muted); border-bottom: 1px solid var(--line-soft); flex: none; }
  .readas b { color: var(--ink); font-weight: 500; }
  .readas .keys { margin-left: auto; display: flex; gap: 12px; font: var(--c-small); color: var(--ink-faint); }
  .readas .keys span { display: inline-flex; align-items: center; gap: 4px; }
  .hint0 { display: flex; align-items: center; gap: 8px; padding: 20px var(--inset); font: var(--c-body); color: var(--ink-muted); }
  .hint0 svg { width: 16px; height: 16px; color: var(--ink-faint); }
  .blkh { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 var(--inset); background: var(--surface-alt); border-bottom: 1px solid var(--line-soft); font: 600 12px/16px var(--font); color: var(--ink-muted); }
  .blkh svg { width: 14px; height: 14px; }
  .blkh .n { font: 500 12px/16px var(--mono); color: var(--ink-faint); }
  .blkh .end { margin-left: auto; font: var(--c-small); color: var(--ink-faint); font-weight: 400; }
  .msg { padding: 12px var(--inset); font: var(--c-body); color: var(--ink-muted); border-bottom: 1px solid var(--line-soft); }
  .tbl td { height: 40px; }
  .tbl td.when { font-family: var(--mono); }
  .tbl td.when small { font: 400 12px/16px var(--mono); color: var(--ink-faint); margin-left: 6px; }
  mark { background: var(--brand-tint); color: inherit; border-radius: 3px; box-shadow: 0 0 0 1px var(--brand-tint); }
  a.lk { color: var(--ink); text-decoration: none; font: var(--c-strong); }
  a.lk:hover { text-decoration: underline; }
  tr.focusrow td { background: var(--surface-alt); }
  tr.focusrow td:first-child { box-shadow: inset 3px 0 0 var(--brand-vivid); }
  tr.focusrow a.lk { text-decoration: underline; text-decoration-color: var(--focus-ring); text-underline-offset: 3px; }
  .nav .search { box-shadow: inset 0 0 0 1px var(--focus-ring); color: var(--ink-muted); } /* this page is the search box opened */
  .pill.bl { background: var(--warning-surface); color: var(--warning); }
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="main">
    <header class="bar">
      <h1 id="title">Որոնում</h1>
      <span class="crumb" id="crumb"></span>
      <div class="live"></div>
    </header>
    <div class="content one">
      <section class="card page" aria-labelledby="title"><div id="qbar"></div><div id="readas"></div>
        <div class="scroll-y grow" id="sp" data-truncate></div></section>
    </div>
  </div>
</div>
<script>
  /* ?state= (none) a phone «091 23» → Աննա's rides + her record · plate (01 ET 001 → Արամ's car today) · hint (nothing asked)
     · none (no matches) · yesterday (the date window alone) · blacklist (a blacklisted caller's number: the flag shows before
     the dispatcher rings back; amber, owner #13) ; ?scope=customers (the «Ուղևորներ» nav entry). */
  const q = new URLSearchParams(location.search)
  const st = q.get('state') || '', customers = q.get('scope') === 'customers'
  shell(customers ? 'customers' : 'search')
  const R = ECO.RIDE, CU = ECO.CUSTOMER, BL = ECO.BLACKLIST
  document.getElementById('title').textContent = customers ? 'Ուղևորներ' : 'Որոնում'
  document.getElementById('crumb').innerHTML = customers
    ? `<a href="search.html?theme=${THEME}" style="color:inherit">Որոնել պատվերներ</a>`
    : `<a href="dispatch.html?theme=${THEME}" style="color:inherit;display:inline-flex;align-items:center;gap:4px"><i data-lucide="arrow-left"></i>Հերթ</a>`

  const query = { '': '091 23', plate: '01 ET 001', hint: '', none: 'Արշակունյաց 112', yesterday: '', blacklist: '096 70' }[st] ?? ''
  const shownQ = customers ? (st === 'hint' ? '' : 'Աննա') : query
  const mk = (s, part) => (part && s.includes(part) ? s.replace(part, `<mark>${part}</mark>`) : s)
  document.getElementById('qbar').innerHTML = `<form role="search" class="qbar" onsubmit="return false">
      <div class="input l" role="textbox" aria-label="${customers ? 'Հեռախոս կամ անուն' : 'Հեռախոս, անուն, հասցե, համարանիշ կամ վարորդ'}"><i data-lucide="search"></i>
        <span class="val${shownQ ? ' mono' : ' ph'}">${shownQ || (customers ? 'օր. 091 44-40-01 կամ Կարեն' : 'օր. 11 AA 111, 091 44-40-01, Բաղրամյան 24')}</span>
        ${shownQ ? '<button type="button" class="btn ghost icon s" aria-label="Մաքրել որոնումը"><i data-lucide="x"></i></button>' : ''}</div>
      ${customers ? '' : `<span class="chip${st === 'yesterday' ? ' on' : ''}" role="button" aria-pressed="${st === 'yesterday'}">Երեկ</span>`}
      <div class="input l by" role="combobox" aria-label="Որոնել ըստ" aria-expanded="false"><span class="k">Ըստ՝</span><span class="val">Ավտոմատ</span><i data-lucide="chevron-down"></i></div>
      <button class="btn primary l">Որոնել <span class="kbd">↵</span></button></form>`

  /* [clock, day-or-null, pickup, phone, driver, plate, state, fare] — the fleet's clock; the day beside it when not today.
     States: as rides.html (ST) words. */
  const A = [
    [R.requested, null, R.pickup, R.rider.phone, R.driver.name, R.driver.plate, 'assigned', R.fare],
    ['18:22', '8 հոկտ.', 'Կոմիտասի պող. 22', R.rider.phone, 'Լիլիթ Մանուկյան', '18 OL 220', 'done', 1100],
    ['08:47', '8 հոկտ.', 'Կոմիտասի պող. 22', R.rider.phone, 'Սուրեն Մկրտչյան', '22 OU 447', 'done', 1100],
    ['19:05', '6 հոկտ.', 'Կասկադ', R.rider.phone, 'Տիգրան Աբրահամյան', '12 TT 304', 'done', 1000],
    ['08:31', '2 հոկտ.', 'Կոմիտասի պող. 22', R.rider.phone, 'Գագիկ Ավետիսյան', '34 LS 108', 'done', 1100],
    ['21:40', '29 սեպտ.', 'Թումանյան 21', R.rider.phone, null, null, 'cancel', null],
  ]
  const P = [
    ['09:02', null, 'Բաղրամյան պող. 24', '077 41-22-08', R.driver.name, R.driver.plate, 'done', 1300],
    ['08:14', null, 'Արշակունյաց 34', '099 50-71-13', R.driver.name, R.driver.plate, 'done', 900],
    ['21:55', '8 հոկտ.', 'Սայաթ-Նովա 5', '093 18-60-02', R.driver.name, R.driver.plate, 'done', 1200],
    ['17:31', '8 հոկտ.', 'Կոմիտասի պող. 49', '098 51-20-44', R.driver.name, R.driver.plate, 'done', 1000],
  ]
  const Y = [
    ['23:48', '8 հոկտ.', 'Աբովյան 12', '094 22-17-30', 'Արմեն Գրիգորյան', '35 OS 512', 'done', 1400],
    ['23:12', '8 հոկտ.', 'Վազգեն Սարգսյանի 26/1', '091 08-44-71', 'Էդգար Պողոսյան', '27 EP 336', 'done', 1100],
    ['22:40', '8 հոկտ.', 'Կասկադ', '077 63-12-90', 'Դավիթ Կարապետյան', '09 DK 118', 'done', 1900],
    ['22:05', '8 հոկտ.', 'Թումանյան 21', '055 30-41-18', 'Գագիկ Ավետիսյան', '34 LS 108', 'cancel', null],
    ['21:55', '8 հոկտ.', 'Սայաթ-Նովա 5', '093 18-60-02', R.driver.name, R.driver.plate, 'done', 1200],
    ['21:31', '8 հոկտ.', 'Մաշտոցի պող. 37', '098 77-02-44', 'Տիգրան Աբրահամյան', '12 TT 304', 'done', 1000],
    ['20:58', '8 հոկտ.', 'Հալաբյան 41', '041 33-21-90', 'Նարեկ Հովհաննիսյան', '07 AB 913', 'done', 2400],
    ['20:16', '8 հոկտ.', 'Բաղրամյան պող. 24', '077 41-22-08', 'Լիլիթ Մանուկյան', '18 OL 220', 'done', 1300],
  ]
  const BLR = [['18:40', '2 հոկտ.', 'Արշակունյաց 34', BL.phone, 'Վահե Սարգսյան', '55 SM 620', 'noshow', null], ['22:15', '27 սեպտ.', 'Թումանյան 21', BL.phone, 'Հայկ Սահակյան', '61 HS 450', 'noshow', null]]
  const rows = { '': A, plate: P, yesterday: Y, none: [], blacklist: BLR }[st]
  const STW = { assigned: ['l-active', 'Նշանակված'], done: ['', 'Ավարտված'], cancel: ['', 'Չեղարկված'], noshow: ['l-problems', 'Ուղևորը չեկավ'] }
  const hl = { '': ['phone', '091 23'], plate: ['plate', '01 ET 001'], blacklist: ['phone', '096 70'] }[st] || [null, null]
  const ride = (r, i) => { const [lane, w] = STW[r[6]]; return `<tr class="${i === 0 ? 'focusrow' : ''}"><td class="when">${r[0]}${r[1] ? `<small>${r[1]}</small>` : ''}</td>
      <td><a class="lk trunc" href="rides.html?theme=${THEME}" title="${r[2]}">${r[2]}</a></td>
      <td class="mono">${hl[0] === 'phone' ? mk(r[3], hl[1]) : r[3]}</td>
      <td>${r[4] || '<span class="dash">—</span>'}</td>
      <td>${r[5] ? `<span class="plate">${hl[0] === 'plate' ? mk(r[5], hl[1]) : r[5]}</span>` : '<span class="dash">—</span>'}</td>
      <td><span class="pill ${lane}" style="${lane ? 'color:var(--lane)' : ''}"><i class="d"></i>${w}</span></td>
      <td class="r mono">${r[7] ? amd(r[7]) : '<span class="dash">—</span>'}</td></tr>` }
  const rideBlock = (list, more) => `<section aria-label="Պատվերներ"><div class="blkh"><i data-lucide="list"></i>Պատվերներ <span class="n">${list.length}</span>${more ? '<span class="end">ցույց է տրված վերջին 8-ը · նեղացրեք որոնումը</span>' : ''}</div>
      ${list.length ? `<table class="tbl"><colgroup><col style="width:160px"><col><col style="width:148px"><col style="width:200px"><col style="width:120px"><col style="width:160px"><col style="width:96px"></colgroup>
        <thead><tr><th>Ժամը</th><th>Որտեղից</th><th>Հեռախոս</th><th>Վարորդ</th><th>Մեքենա</th><th>Վիճակ</th><th class="r">Գին</th></tr></thead><tbody>${list.map(ride).join('')}</tbody></table>`
        : '<p class="msg">Պատվերներ չգտնվեցին</p>'}</section>`
  /* [name, phone, rides, last, blacklisted, href] */
  const riderBlock = (list, part) => `<section aria-label="Ուղևորներ"><div class="blkh"><i data-lucide="users"></i>Ուղևորներ <span class="n">${list.length}</span></div>
      ${list.length ? `<table class="tbl"><colgroup><col><col style="width:148px"><col style="width:104px"><col style="width:120px"><col style="width:180px"></colgroup>
        <thead><tr><th>Ուղևոր</th><th>Հեռախոս</th><th class="r">Պատվերներ</th><th>Վերջինը</th><th></th></tr></thead><tbody>${list.map(([n, ph, cnt, last, bl, href], i) => `<tr class="${customers && i === 0 ? 'focusrow' : ''}">
          <td><a class="lk" href="${href}">${part && n.includes(part) ? mk(n, part) : n}</a></td><td class="mono">${part && ph.includes(part) ? mk(ph, part) : ph}</td>
          <td class="r mono">${cnt}</td><td class="mono">${last}</td>
          <td>${bl ? '<span class="pill bl"><i data-lucide="octagon-alert"></i>Սև ցուցակ</span>' : ''}</td></tr>`).join('')}</tbody></table>`
        : '<p class="msg">Ուղևորներ չգտնվեցին</p>'}</section>`
  const cHref = `customer.html?theme=${THEME}`, cBl = `customer.html?theme=${THEME}&state=blacklisted`
  const keys = '<span class="keys" aria-hidden="true"><span><span class="kbd">↑</span><span class="kbd">↓</span>ընտրել</span><span><span class="kbd">↵</span>բացել</span></span>'
  const readas = (by, extra = '') => `<p class="readas">Որոնվեց ըստ <b>${by}</b>${extra}${keys}</p>`
  const hint = '<p class="hint0"><i data-lucide="search"></i>Գրեք հեռախոս, համարանիշ, հասցե կամ անուն · <span class="kbd">↵</span></p>'
  let head = '', body = ''
  if (customers) {
    if (st === 'hint') body = hint
    else {
      head = readas('անվան')
      body = riderBlock([[CU.name, CU.phone, CU.rides, 'այսօր', false, cHref], ['Աննա Մելիքյան', '094 61-18-25', 12, '3 հոկտ.', false, cHref], ['Աննա Սարգսյան', '077 12-90-04', 5, '21 սեպտ.', false, cHref], ['Աննա Ղազարյան', '098 33-47-60', 2, '2 օգոստ.', false, cHref]], 'Աննա')
    }
  } else if (st === 'hint') body = hint
  else {
    const by = { '': 'հեռախոսի', blacklist: 'հեռախոսի', plate: 'համարանիշի', none: 'հասցեի', yesterday: 'ամսաթվի' }[st]
    const win = st === 'yesterday' ? ' · <span class="mono">8.10</span>' : ''
    const cs = {
      '': [[CU.name, CU.phone, CU.rides, 'այսօր', false, cHref], ['Արթուր Բ.', '091 23-08-17', 7, '30 սեպտ.', false, cHref]],
      blacklist: [[BL.name, BL.phone, 9, '2 հոկտ.', true, cBl]], plate: [], none: [], yesterday: [] }[st]
    head = readas(by, win)
    body = rideBlock(rows, st === 'yesterday') + (st === 'yesterday' || st === 'plate' ? '' : riderBlock(cs, hl[0] === 'phone' ? hl[1] : null))
  }
  document.getElementById('readas').innerHTML = head
  document.getElementById('sp').innerHTML = body
  icons()
  document.documentElement.dataset.mapReady = 'none'
</script>
</body>
</html>
