<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tariffs v3</title>
<link rel="stylesheet" href="console.css">
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="../kit.js"></script>
<script src="console.js"></script>
<script src="console-audit.js"></script>
<style>
  /* ── Tariffs v3 (owner review 2026-10-21; spec docs/superpowers/specs/2026-10-21-tariff-zone-rules-design.md).
     1. No standalone «Editor / new tariff» section: «Նոր սակագին» (N) in the list head is the only way in, and it opens the
        step-by-step wizard (a modal is allowed here: admin, never dispatch, CLAUDE.md §9.8).
     2. «Գինը գոտիներում» (owner Q1, 21 Oct): From–To is set ONCE per tariff, several zones per end, and means "this tariff's
        fare in these zones" — it never hides the tariff. Outside those zones the general fare applies. Saved as a zone rule
        that targets this tariff only, so the overlap check covers it (spec §5).
     3. «Տարողություն» (owner Q9): max passengers and luggage are capacity INFO shown on the rider's card; they filter nothing.
     5. «Որտեղ է երևում»: everywhere, or only where a zone's availability rule offers it (Eco Aero).
     4. Pre-order is visible without opening a tab: a column in the list, a tile in the tariff's passport, and its own tab.
     ?state= ''|detail|preorder|preorder-off|w1..w6|w1-err ── */
  .content.ls { grid-template-columns: minmax(0, 1fr) 348px; }
  .col { display: flex; flex-direction: column; gap: var(--gap); min-height: 0; overflow-y: auto; scrollbar-width: thin; }
  .col > .card { flex: none; overflow: visible; }
  /* List row: grip · picture · name · where · party · pre-order · example price · go. Two-line content, ~64px. */
  .tr { display: grid; grid-template-columns: 16px 88px minmax(0, 1fr) 200px 96px 150px 88px 16px; gap: 12px; align-items: center; min-height: 64px; padding: 6px var(--inset) 6px 10px; border-bottom: 1px solid var(--line-soft); color: var(--ink); text-decoration: none; }
  .tr:hover, .tr.on { background: var(--surface-alt); }
  .tr.h { min-height: 36px; font: var(--c-label); color: var(--ink-faint); }
  .tr .grip { color: var(--ink-faint); }
  .tr .ph { width: 88px; height: 48px; border-radius: var(--r-ctl); background: var(--surface-alt); display: grid; place-items: center; }
  .tr .ph .car { width: 80px; height: 42px; }
  .nm2 { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .nm2 b { font: var(--c-head); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 1366 and below: the rider preview keeps 300px, the row gives up picture width and the where column first;
     the name column never drops under 120px (Eco Business must read whole). */
  @media (max-width: 1400px) {
    .content.ls { grid-template-columns: minmax(0, 1fr) 300px; }
    .tr { grid-template-columns: 56px minmax(120px, 1fr) 184px 84px 116px 68px 16px; gap: 8px; padding-left: var(--inset); }
    .tr .grip { display: none; } .tr.h > span:first-child { display: none; }
    .tr .ph { width: 56px; height: 36px; } .tr .ph .car { width: 52px; height: 28px; }
  }
  .nm2 span { font: var(--c-small); color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wh { display: flex; flex-direction: column; gap: 2px; font: var(--c-small); color: var(--ink-muted); min-width: 0; }
  .wh span { display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wh svg { width: 14px; height: 14px; flex: none; color: var(--ink-faint); }
  .wh b { font-weight: 500; color: var(--ink); }
  .party { display: flex; gap: 10px; font: 500 13px/18px var(--mono); white-space: nowrap; }
  .party span { display: inline-flex; align-items: center; gap: 4px; } .party svg { width: 14px; height: 14px; color: var(--ink-faint); }
  .tr .px { font: 500 13px/18px var(--mono); text-align: right; white-space: nowrap; }
  .tr .go { color: var(--ink-faint); width: 16px; height: 16px; }
  .zs { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--zc); flex: none; }
  /* Rider preview: what the app lists for a given pickup and party. */
  .rp { padding: 10px var(--inset); display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line-soft); }
  .rp .row-flex { gap: 6px; flex-wrap: wrap; }
  .ri { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 6px var(--inset); }
  .ri .car { width: 56px; height: 30px; }
  .ri b { font: var(--c-strong); white-space: nowrap; }
  .ri .v { font: 500 13px/18px var(--mono); white-space: nowrap; }
  .ri.off { opacity: 1; } .ri.off b, .ri.off .v { color: var(--ink-faint); } .ri.off .car { opacity: .35; }
  .ri .why { grid-column: 2 / 4; font: var(--c-small); color: var(--ink-faint); display: flex; align-items: center; gap: 4px; }
  .ri .why svg { width: 14px; height: 14px; }
  .grp { font: var(--c-label); color: var(--ink-faint); padding: 10px var(--inset) 2px; }
  /* ── Detail ── */
  .content.ed { grid-template-columns: 220px minmax(0, 1fr) 316px; }
  @media (max-width: 1400px) { .content.ed { grid-template-columns: minmax(0, 1fr) 292px; } .content.ed .tl { display: none; } }
  .tl .ti { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 var(--inset) 0 10px; border-bottom: 1px solid var(--line-soft); text-decoration: none; color: var(--ink); }
  .tl .ti .car { width: 40px; height: 22px; flex: none; }
  .tl .ti b { font: var(--c-strong); white-space: nowrap; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .tl .ti.on { background: var(--surface-alt); box-shadow: inset 3px 0 0 var(--brand-vivid); }
  .edc { display: flex; flex-direction: column; min-height: 0; }
  .edc .card-h .car { width: 56px; height: 30px; }
  /* The passport: three tiles, always above the tabs. Pre-order is one of them, with its switch. */
  .pass { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.3fr); gap: 8px; padding: 12px var(--inset) 0; flex: none; }
  .tile { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: var(--r-ctl); background: var(--surface-alt); min-width: 0; }
  .tile .k { display: flex; align-items: center; gap: 6px; font: var(--c-label); color: var(--ink-muted); }
  .tile .k svg { width: 16px; height: 16px; }
  .tile .k .switch { margin-left: auto; }
  .tile .v { font: var(--c-strong); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .s { font: var(--c-small); color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.pre.on { box-shadow: inset 0 0 0 1px var(--line-control); background: var(--surface); }
  .sh { display: flex; align-items: center; gap: 10px; padding: 18px var(--inset) 6px; }
  .sh h3 { font: var(--c-head); white-space: nowrap; }
  .sh .sub { font: var(--c-small); color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .sh .end { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .frow { display: grid; grid-template-columns: minmax(0, 1fr) auto 76px; gap: 12px; align-items: center; min-height: 50px; padding: 6px var(--inset); border-bottom: 1px solid var(--line-soft); }
  .frow .l { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .frow .l b { font: var(--c-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frow .l span { font: var(--c-small); color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frow .c { display: flex; align-items: center; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
  .frow .s { display: flex; justify-content: flex-end; }
  .frow.off .l b { color: var(--ink-muted); } .frow.off .c { opacity: .5; }
  .num-in { display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; height: 30px; padding: 0 8px; border-radius: var(--r-ctl); box-shadow: inset 0 0 0 1px var(--line-control); background: var(--surface); font: 500 13px/18px var(--mono); white-space: nowrap; min-width: 84px; }
  .num-in span { color: var(--ink-faint); font-family: var(--font); }
  .num-in.dflt { color: var(--ink-faint); }                 /* blank = the fleet's own value, shown as a placeholder */
  .num-in.p { min-width: 64px; }
  .x { font: var(--c-small); color: var(--ink-faint); }
  .seg.sm button { height: 24px; padding: 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  /* Multi-zone picker: chosen zones as removable chips + a combobox to add. «Ամենուր» is the empty set. */
  .zp { display: flex; flex-direction: column; gap: 8px; padding: 10px var(--inset); border-bottom: 1px solid var(--line-soft); }
  .zp .hd { display: flex; align-items: center; gap: 10px; }
  .zp .hd b { font: var(--c-strong); width: 92px; flex: none; }
  .zchip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px 0 10px; border-radius: var(--r-pill); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-control); font: var(--c-strong); white-space: nowrap; }
  .zchip button { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-faint); }
  .zchip button svg { width: 14px; height: 14px; }
  .addz { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--r-pill); box-shadow: inset 0 0 0 1px var(--line-soft); font: var(--c-small); color: var(--ink-muted); }
  .addz svg { width: 14px; height: 14px; }
  .zp .say { font: var(--c-small); color: var(--ink-muted); padding-left: 102px; }
  .step { display: inline-flex; align-items: center; height: 30px; border-radius: var(--r-ctl); box-shadow: inset 0 0 0 1px var(--line-control); background: var(--surface); }
  .step button { width: 30px; height: 30px; display: grid; place-items: center; color: var(--ink-muted); } .step button svg { width: 14px; height: 14px; }
  .step b { min-width: 28px; text-align: center; font: 500 13px/18px var(--mono); }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px var(--inset) 12px; font: var(--c-body); }
  .split span:nth-child(even) { text-align: right; font: 500 13px/20px var(--mono); white-space: nowrap; }
  .split .tot { font-weight: 600; border-top: 1px solid var(--line-soft); padding-top: 6px; margin-top: 2px; }
  .split .faint { color: var(--ink-faint); }
  .zr { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px var(--inset); border-bottom: 1px solid var(--line-soft); }
  .zr .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--zc); }
  .zr b { font: var(--c-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zr .v { font: 500 13px/18px var(--mono); white-space: nowrap; }
  .zr .d { grid-column: 2 / 4; font: var(--c-small); color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .edf2 { display: flex; align-items: center; gap: 8px; padding: 10px var(--inset); border-top: 1px solid var(--line-soft); flex: none; font: var(--c-small); color: var(--ink-faint); }
  .hero { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; margin: 12px var(--inset) 4px; padding: 12px; border-radius: var(--r-ctl); background: var(--surface-alt); }
  .hero .ic { grid-row: 1 / 3; width: 40px; height: 40px; border-radius: 10px; background: var(--surface); display: grid; place-items: center; }
  .hero b { font: var(--c-head); } .hero span { font: var(--c-small); color: var(--ink-muted); }
  .hero .switch { grid-row: 1 / 3; grid-column: 3; font: var(--c-strong); }
  /* ── Wizard (admin-only modal). Scrim is dark in both themes, by design; the token is per theme, never a bare literal. ── */
  :root { --scrim: rgba(20, 20, 22, .42); } :root[data-theme="dark"] { --scrim: rgba(0, 0, 0, .62); }
  .scrim { position: fixed; inset: 0; z-index: 100; background: var(--scrim); display: grid; place-items: center; padding: 24px; }
  .wiz { width: min(960px, 100%); height: min(680px, calc(100vh - 48px)); display: grid; grid-template-columns: 232px minmax(0, 1fr); grid-template-rows: 56px minmax(0, 1fr) 60px; border-radius: 16px; background: var(--surface); box-shadow: var(--e2); overflow: hidden; }
  .wiz .wh2 { grid-column: 1 / 3; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 20px; border-bottom: 1px solid var(--line-soft); }
  .wiz .wh2 h2 { font: var(--c-title); white-space: nowrap; }
  .wiz .wh2 .end { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .stp { list-style: none; padding: 12px 8px; background: var(--surface-alt); display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
  .stp li a { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 0 10px; align-items: center; padding: 8px 10px; border-radius: var(--r-ctl); text-decoration: none; color: var(--ink-muted); min-height: 48px; }
  .stp li a .n { grid-row: 1 / 3; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 600 12px/1 var(--mono); box-shadow: inset 0 0 0 1px var(--line-control); background: var(--surface); }
  .stp li a .n svg { width: 14px; height: 14px; }
  .stp li a b { font: var(--c-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stp li a small { font: var(--c-small); color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stp li.done a .n { background: var(--brand-fill); color: var(--brand-fill-ink); box-shadow: none; }
  .stp li.cur a { background: var(--surface); box-shadow: var(--e1); color: var(--ink); }
  .stp li.cur a .n { background: var(--ink); color: var(--surface); box-shadow: none; }
  .stp li.todo a { pointer-events: none; } .stp li.todo a b { color: var(--ink-faint); }
  .wb { overflow-y: auto; padding: 4px 0 16px; }
  .wb .lead { padding: 16px var(--inset) 4px; font: var(--c-body); color: var(--ink-muted); }
  .wb .lead b { display: block; font: var(--c-head); color: var(--ink); margin-bottom: 2px; }
  .wf { grid-column: 1 / 3; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 20px; border-top: 1px solid var(--line-soft); font: var(--c-small); color: var(--ink-faint); }
  .wf .sp { flex: 1; }
  .fld { display: flex; flex-direction: column; gap: 6px; padding: 10px var(--inset); }
  .fld .err { font: var(--c-small); color: var(--danger-c); display: flex; gap: 4px; align-items: center; } .fld .err svg { width: 14px; height: 14px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; }
  .zl2 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 0 var(--inset) 8px; }
  .zl2 .check { min-height: 32px; padding: 0 10px; border-radius: var(--r-ctl); box-shadow: inset 0 0 0 1px var(--line-soft); }
  .zl2 .check.on { box-shadow: inset 0 0 0 1px var(--line-control); background: var(--surface-alt); }
  .rv { display: grid; grid-template-columns: 140px minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; padding: 10px var(--inset); border-bottom: 1px solid var(--line-soft); font: var(--c-body); }
  .rv .k { font: var(--c-label); color: var(--ink-faint); } .rv .v { color: var(--ink); } .rv .v .mono { font-size: 13px; }
  .card2 { margin: 8px var(--inset); padding: 12px; border-radius: var(--r-card); background: var(--surface-alt); display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; }
  .card2 .car { width: 96px; height: 50px; grid-row: 1 / 3; }
  .card2 b { font: 600 17px/24px var(--font); } .card2 span { font: var(--c-small); color: var(--ink-muted); }
  .card2 .p { grid-row: 1 / 3; grid-column: 3; font: 600 17px/24px var(--font); font-variant-numeric: tabular-nums; }
  .select { display: flex; align-items: center; gap: 8px; height: var(--h-m); padding: 0 10px; border-radius: var(--r-ctl); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-control); min-width: 0; font: var(--c-body); }
  .select .val { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .select svg { width: 16px; height: 16px; color: var(--ink-faint); flex: none; }
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="main">
    <header class="bar">
      <span class="crumb">Ավտոպարկ <i data-lucide="chevron-right"></i></span><h1>Սակագներ</h1>
      <div class="live"></div>
    </header>
    <div class="content ls" id="ov">
      <div class="col">
        <section class="card" aria-label="Սակագներ">
          <div class="card-h"><h2>Սակագներ</h2><span class="sub">Հերթականությունը՝ ինչպես հավելվածում · Alt+↑ / Alt+↓</span>
            <span class="end"><a class="btn primary s" id="newb" aria-keyshortcuts="N"><i data-lucide="plus"></i>Նոր սակագին<span class="kbd">N</span></a></span></div>
          <div class="tr h" aria-hidden="true"><span></span><span></span><span>Սակագին</span><span>Գինը գոտիներում</span><span>Տարողություն</span><span>Նախնական պատվեր</span><span style="text-align:right">2,1 կմ · 4 ր</span><span></span></div>
          <div id="rows" data-truncate></div>
          <div class="edf2"><i data-lucide="info"></i>Գին, նախնական պատվեր, միջնորդավճար, գոտիներ՝ սակագնի մեջ · գոտիների բացառությունները՝ <a href="zones-v3.html" id="zl" style="color:var(--brand-text)">Գոտիներ › Կանոններ</a></div>
        </section>
      </div>
      <aside class="card" aria-label="Ինչ է տեսնում ուղևորը" id="rider" data-truncate></aside>
    </div>
    <div class="content ed" id="ed" hidden></div>
  </div>
</div>
<div id="wiz"></div>
<script>
  shell('tariffs')
  const ST = mockStates([['', 'Ցանկ'], ['air', 'Ցանկ · Զվարթնոցում'], ['detail', 'Eco Aero · գոտիներ, տարողություն'], ['preorder', 'Նախնական պատվեր · միաց.'], ['preorder-off', 'Նախնական պատվեր · անջ.'],
    ['w1', 'Նոր · 1 Անուն'], ['w1-err', 'Նոր · 1 անունը զբաղված'], ['w2', 'Նոր · 2 Գոտիներ'], ['w3', 'Նոր · 3 Գին'], ['w4', 'Նոր · 4 Նախնական'], ['w5', 'Նոր · 5 Վճարում'], ['w6', 'Նոր · 6 Ստուգել']])
  const href = (s) => `tariffs-v3.html?theme=${THEME}${s ? '&state=' + s : ''}`
  document.getElementById('newb').href = href('w1')
  document.getElementById('zl').href = `zones-v3.html?theme=${THEME}&state=rules`
  const DARK = THEME === 'dark'
  const ZC = DARK ? { city: '#6B9BFF', air: '#F2C464', ctr: '#3DD68C', arb: '#C79BFF', ejm: '#F472B6' } : { city: '#2563EB', air: '#B45309', ctr: '#15803D', arb: '#7C3AED', ejm: '#BE185D' }
  const ZN = { city: 'Երևան', ctr: 'Կենտրոն', arb: 'Արաբկիր', air: 'Զվարթնոց', ejm: 'Էջմիածին' }
  /* v3 tariff facts. fz: this tariff's fare in zones [from[], to[], value] or null (general fare everywhere). zo: shown only where a
     zone offers it. pax/bags: capacity shown to the rider. pre: [on, min lead, max lead, surcharge]. */
  const AERO = { id: 'aero', img: 'business', name: 'Eco Aero', blurb: 'Օդանավակայանից՝ ֆիքսված գնով', base: 1500, km: 150, min: 20, floor: 4500, seats: 4 }
  const V = {
    city: { pax: 4, bags: 2, fz: [['ejm'], ['city'], '600 + 120/կմ'], pre: [true, 30, 7, 200] },
    partner: { pax: 4, bags: 2, fz: [['ejm'], ['city'], '600 + 120/կմ'], pre: [true, 30, 7, 200] },
    kids: { pax: 3, bags: 2, fz: null, pre: [false] },
    business: { pax: 4, bags: 3, fz: null, pre: [true, 60, 14, 300] },
    van: { pax: 7, bags: 6, fz: null, pre: [false] },
    vip: { pax: 4, bags: 3, fz: null, pre: [true, 60, 30, 500] },
    aero: { pax: 4, bags: 4, fz: [['air'], [], '4 500 ֏'], zo: true, pre: [true, 30, 30, 0] },
  }
