<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer</title>
<link rel="stylesheet" href="console.css">
<link rel="stylesheet" href="corporate.css">
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="../kit.js"></script>
<script src="console.js"></script>
<script src="console-audit.js"></script>
<style>
  /* Mirrors apps/operator components/admin/customer-record.tsx + customer-notes.tsx + note-byline.tsx (§9.6, §4):
     breadcrumb «Ուղևորներ › name» (the list IS search?scope=customers — /admin/customers is not a route), the name and the
     phone in mono, the door to their rides, the blacklist banner with its reason (amber + octagon, owner #13; lifting is an
     admin's: a dispatcher is told who can), the last rides and the notes on the left, company and the blacklist form on the
     right. Blacklisting is not armed: the required reason (≥ 3 characters) is the deliberate second step. The record is
     both roles' — the dispatcher who took the call writes the notes.
     One card, flat blocks with lane-style heads, a vertical rule between the columns: no cards in cards, no bento. */
  .crhead { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px var(--inset); }
  .crhead h2 { font: var(--c-title); white-space: nowrap; }
  .crhead .meta { display: flex; align-items: center; gap: 8px; margin-top: 2px; font: var(--c-body); color: var(--ink-muted); flex-wrap: wrap; }
  .crhead .acts { display: flex; gap: 6px; }
  .crhead .acts a { text-decoration: none; }
  .pill.bl { background: var(--warning-surface); color: var(--warning); }
  .banner { margin: 0 var(--inset) 12px; }
  .banner .notice { align-items: center; }
  .banner .notice .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; color: var(--ink); }
  .banner .notice b { font: var(--c-strong); color: var(--warning); }
  .banner .notice.neutral b { color: var(--ink); }
  .banner .notice .by { font: var(--c-small); color: var(--ink-muted); }
  .banner .notice > svg { width: 20px; height: 20px; }
  .figs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line-soft); }
  .figs .kpi { padding: 8px var(--inset); border-right: 1px solid var(--line-soft); }
  .figs .kpi:last-child { border-right: 0; }
  .figs .kpi .v { font: 600 20px/28px var(--font); }
  .cr { display: grid; grid-template-columns: minmax(0, 1fr) 360px; border-top: 1px solid var(--line-soft); }
  .cr > .side { border-left: 1px solid var(--line-soft); }
  .blkh { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 var(--inset); background: var(--surface-alt); border-bottom: 1px solid var(--line-soft); font: 600 12px/16px var(--font); color: var(--ink-muted); }
  .blkh svg { width: 14px; height: 14px; }
  .blkh .n { font: 500 12px/16px var(--mono); color: var(--ink-faint); }
  .blkh .end { margin-left: auto; font: var(--c-small); font-weight: 400; }
  .blkh .end a { color: var(--brand-text); text-decoration: none; font-weight: 500; }
  .tbl td { height: 40px; }
  .tbl td.when small { font: 400 12px/16px var(--mono); color: var(--ink-faint); margin-left: 6px; }
  .notes { list-style: none; }
  .note { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px var(--inset); border-bottom: 1px solid var(--line-soft); }
  .note .tx { font: var(--c-body); color: var(--ink); }
  .note .by { font: var(--c-small); color: var(--ink-faint); margin-top: 2px; }
  .note.ret .tx { color: var(--ink-muted); text-decoration: line-through; text-decoration-color: var(--line-control); }
  .addn { display: flex; gap: 8px; padding: 12px var(--inset); align-items: center; border-bottom: 1px solid var(--line-soft); }
  .addn .input { flex: 1; }
  .pad { padding: 12px var(--inset); display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line-soft); }
  .line { display: flex; align-items: center; gap: 6px; font: var(--c-body); color: var(--ink-muted); }
  .line svg { width: 16px; height: 16px; flex: none; }
  .line.yes { color: var(--ok-text); } .line.warn svg { color: var(--warning); }
  .select { display: flex; align-items: center; gap: 8px; height: var(--h-m); padding: 0 10px; border-radius: var(--r-ctl); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-control); }
  .select .val { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .facts { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px 12px; font: var(--c-body); }
  .facts dt { color: var(--ink-muted); }
  .anonname { color: var(--ink-muted); }
  @media (max-width: 1400px) { .cr { grid-template-columns: minmax(0, 1fr) 320px; } }
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="main">
    <header class="bar">
      <span class="crumb"><a href="search.html?scope=customers" id="crumb" style="color:inherit">Ուղևորներ</a> <i data-lucide="chevron-right"></i></span><h1 id="title"></h1>
      <div class="live"></div>
    </header>
    <div class="content one">
      <section class="card page" aria-labelledby="title"><div class="scroll-y grow" id="body"></div></section>
    </div>
  </div>
</div>
<script>
  /* ?state= (none) Աննա (ECO.CUSTOMER), a company employee, two notes and one retracted · blacklisted (ECO.BLACKLIST, the
     caller refused in the rider app at 9:12; admin sees «Հանել սև ցուցակից») · blacklisted&as=dispatcher (lift is an
     admin's) · anon (the rider deleted the account: §10.13 anonymises name, number and places; rides, ratings and notes stay). */
  const q = new URLSearchParams(location.search)
  const st = q.get('state') || '', disp = q.get('as') === 'dispatcher'
  shell('customers')
  document.getElementById('crumb').href = 'search.html?theme=' + THEME + '&scope=customers'
  const CU = ECO.CUSTOMER, BL = ECO.BLACKLIST, CO = ECO.COMPANY, R = ECO.RIDE
  const bl = st === 'blacklisted', anon = st === 'anon'
  const P = bl ? { name: BL.name, ini: 'ԳՍ', phone: BL.phone, rides: 9, rating: '3,1', since: 'հունիս 2026', debt: 0, noshow: 3 }
    : anon ? { name: 'Ջնջված հաշիվ', ini: '—', phone: '', rides: 23, rating: '4,6', since: 'հունվ. 2025', debt: 0, noshow: 0 }
    : { ...CU, ini: 'ԱՀ', noshow: 0 }
  document.getElementById('title').textContent = P.name

  const note = (tx, who, when, ret) => `<li class="note${ret ? ' ret' : ''}"><div><div class="tx">${tx}</div><div class="by">${who} · <span class="mono">${when}</span>${ret ? ` · հետ վերցրեց՝ ${ret}` : ''}</div></div>
      ${ret ? '<span class="pill">Հետ վերցված</span>' : `<button class="btn ghost s" aria-label="Հետ վերցնել՝ ${tx}"><i data-lucide="undo-2"></i>Հետ վերցնել</button>`}</li>`
  const notes = bl ? [
      note('Զանգում է նույն համարից՝ տարբեր անուններով · երկու անգամ սպառնացել է վարորդին', 'Անի Դավթյան', '2.10 18:52'),
      note('Երեք անգամ չեկավ · ամեն անգամ խնդրում էր սպասել «2 րոպե»', 'Մարիամ Հովսեփյան', '27.09 22:31'),
    ] : anon ? [
      note('Սիրում է, որ զանգեն հասնելուց 5 րոպե առաջ', 'Նախկին դիսպետչեր', '14.03 10:02'),
    ] : [
      note('Սիրում է, որ զանգեն հասնելուց 5 րոպե առաջ', 'Անի Դավթյան', '6.10 19:07'),
      note('Օդանավակայան՝ մեծ ճամպրուկով · Eco Comfort կամ Eco Van', 'Սոնա Աբգարյան', '22.09 08:40'),
    ]
  const retracted = bl || anon ? '' : note('Ուշանում է կանխիկ վճարել', 'Սոնա Աբգարյան', '3.09 12:15', 'Անի Դավթյան, 4.09')

  /* Last rides: the same rows search.html shows for this phone. [clock, day, pickup → drop, driver, plate, state, fare] */
  const RIDES = bl ? [['18:40', '2 հոկտ.', 'Արշակունյաց 34', 'Վահե Ս.', '55 SM 620', 'noshow', null], ['22:15', '27 սեպտ.', 'Թումանյան 21', 'Հայկ Ս.', '61 HS 450', 'noshow', null], ['19:02', '14 սեպտ.', 'Թումանյան 21', 'Գագիկ Ա.', '34 LS 108', 'noshow', null]]
    : anon ? [['20:14', '1 հոկտ.', 'Կասկադ', 'Լիլիթ Մ.', '18 OL 220', 'done', 1000], ['09:05', '28 սեպտ.', 'Աբովյան 12', 'Սուրեն Մ.', '22 OU 447', 'done', 900]]
    : [[R.requested, null, R.pickup, 'Արամ Պ.', R.driver.plate, 'assigned', R.fare], ['18:22', '8 հոկտ.', 'Կոմիտասի պող. 22', 'Լիլիթ Մ.', '18 OL 220', 'done', 1100],
       ['08:47', '8 հոկտ.', 'Կոմիտասի պող. 22', 'Սուրեն Մ.', '22 OU 447', 'done', 1100], ['19:05', '6 հոկտ.', 'Կասկադ', 'Տիգրան Ա.', '12 TT 304', 'done', 1000], ['08:31', '2 հոկտ.', 'Կոմիտասի պող. 22', 'Գագիկ Ա.', '34 LS 108', 'done', 1100]]
  const STW = { assigned: ['l-active', 'Նշանակված'], done: ['', 'Ավարտված'], noshow: ['l-problems', 'Ուղևորը չեկավ'] }
  const rides = `<div class="blkh"><i data-lucide="list"></i>Վերջին պատվերները <span class="n">${P.rides}</span>${anon ? '' : `<span class="end"><a href="search.html?theme=${THEME}${bl ? '&state=blacklist' : ''}">Բոլորը →</a></span>`}</div>
    <table class="tbl"><colgroup><col style="width:128px"><col><col style="width:200px"><col style="width:140px"><col style="width:92px"></colgroup>
      <tbody>${RIDES.map(([t, d, a, drv, pl, s, f]) => { const [lane, w] = STW[s]; return `<tr><td class="when mono">${t}${d ? `<small>${d}</small>` : ''}</td><td>${a}</td>
        <td><span class="row-flex" style="gap:8px">${drv}<span class="plate">${pl}</span></span></td><td><span class="pill ${lane}" style="${lane ? 'color:var(--lane)' : ''}"><i class="d"></i>${w}</span></td>
        <td class="r mono">${f ? amd(f) : '<span class="dash">—</span>'}</td></tr>` }).join('')}</tbody></table>`

  const banner = bl ? `<div class="banner"><div class="notice amber" role="note"><i data-lucide="octagon-alert"></i><div class="t"><b>Սև ցուցակ · պատվերը չի ընդունվի</b><span>${BL.reason}</span>
        <span class="by">${BL.by} · <span class="mono">${BL.since}</span> · հավելվածը մերժեց այսօր՝ <span class="mono">${BL.refusedAt}</span></span></div>
        ${disp ? '<span class="faint" style="font:var(--c-small)">Հանել կարող է ադմինը</span>' : '<button class="btn secondary s">Հանել սև ցուցակից</button>'}</div></div>`
    : anon ? `<div class="banner"><div class="notice neutral" role="note"><i data-lucide="user-x"></i><div class="t"><b>Ուղևորը ջնջել է հաշիվը · 3 հոկտ.</b><span class="by">Անունը, հեռախոսը և հասցեները ջնջված են · պատվերներն ու նշումները մնում են</span></div></div></div>` : ''

  const kpi = (k, v, s) => `<div class="kpi"><span class="k">${k}</span><span class="v num">${v}</span>${s ? `<span class="s">${s}</span>` : ''}</div>`
  const figs = `<div class="figs">${kpi('Պատվերներ', P.rides, 'սկսած ' + P.since)}${kpi('Գնահատական', P.rating, 'վարորդներից')}${kpi('Պարտք', ECO.amd(P.debt), P.debt ? '' : 'պարտք չկա')}${kpi('Ուղևորը չեկավ', P.noshow, '90 օրում')}</div>`

  const company = anon ? '' : `<div class="blkh"><i data-lucide="building-2"></i>Ընկերություն</div><div class="pad">
      <div class="select" data-truncate role="combobox" aria-label="Ընկերություն" aria-expanded="false"><span class="val${bl ? ' faint' : ''}">${bl ? 'Ընկերություն չկա' : CO.name}</span><i data-lucide="chevrons-up-down"></i></div>
      ${bl ? '' : `<p class="line yes" role="status"><i data-lucide="check"></i>Նոր պատվերը՝ ընկերության հաշվին</p>
      <a href="company.html?theme=${THEME}&tab=employees" style="font:var(--c-strong);color:var(--brand-text);text-decoration:none">${CO.short} · աշխատակիցներ →</a>`}</div>`
  const blBlock = anon ? '' : bl ? `<div class="blkh"><i data-lucide="octagon-alert"></i>Սև ցուցակ</div><div class="pad">
      <dl class="facts"><dt>Ավելացրել է</dt><dd>${BL.by}</dd><dt>Երբ</dt><dd class="mono">${BL.since}</dd><dt>Մերժված</dt><dd>1 պատվեր այսօր</dd></dl>
      ${disp ? '<p class="line"><i data-lucide="lock"></i>Հանել կարող է միայն ադմինը</p>' : ''}</div>`
    : `<div class="blkh"><i data-lucide="octagon-alert"></i>Սև ցուցակ</div><div class="pad">
      <p class="line warn"><i data-lucide="octagon-alert"></i>Հաջորդ պատվերը կմերժվի · ընթացիկին չի դիպչի</p>
      <div><span class="label">Պատճառ</span><div class="input"><span class="val ph">օր. 3 անգամ չեկավ</span></div><p class="hint">Առնվազն 3 նիշ · ուղևորը չի տեսնի</p></div>
      <div><button class="btn secondary" disabled aria-disabled="true" style="opacity:.5"><i data-lucide="octagon-alert"></i>Ավելացնել սև ցուցակում</button></div></div>`

  document.getElementById('body').innerHTML = `
    <div class="crhead"><span class="av l">${P.ini}</span><div style="min-width:0"><h2 class="${anon ? 'anonname' : ''}">${P.name}</h2>
      <div class="meta">${anon ? '<span>Հեռախոս չկա</span>' : `<span class="mono" style="color:var(--ink)">${P.phone}</span>`}
        ${bl ? '<span class="pill bl"><i data-lucide="octagon-alert"></i>Սև ցուցակ</span>' : anon ? '' : `<span class="pill brand"><i data-lucide="building-2"></i>${CO.short}</span>`}</div></div>
      <div class="acts">${anon ? '' : `<a class="btn secondary s" href="tel:"><i data-lucide="phone"></i>Զանգել</a><a class="btn ghost s" href="search.html?theme=${THEME}${bl ? '&state=blacklist' : ''}"><i data-lucide="list"></i>Պատվերները</a>`}</div></div>
    ${banner}${figs}
    <div class="cr">
      <div>${rides}
        <div class="blkh"><i data-lucide="sticky-note"></i>Նշումներ <span class="n">${notes.length}</span></div><ul class="notes">${notes.join('')}${retracted}</ul>
        <form class="addn" onsubmit="return false"><div class="input${st ? '' : ' focus'}" role="textbox" aria-label="Նոր նշում"><span class="val${st ? ' ph' : ''}">${st ? 'օր. Սիրում է, որ զանգեն հասնելուց 5 րոպե առաջ' : 'Ուղևորը կրկին խնդրեց մանկական նստոց'}</span></div>
          <button class="btn secondary">Պահել նշումը</button></form></div>
      <div class="side">${company}${blBlock}</div>
    </div>`
  icons()
  document.documentElement.dataset.mapReady = 'none'
</script>
</body>
</html>
