<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drivers</title>
<link rel="stylesheet" href="console.css">
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="../kit.js"></script>
<script src="console.js"></script>
<script src="console-audit.js"></script>
<style>
  .content { grid-template-columns: minmax(0, 1fr) 420px; }
  @media (max-width: 1400px) { .content { grid-template-columns: minmax(0, 1fr) 384px; } .carcell .car { display: none; } col.c-car { width: 100px !important; } col.c-doc { width: 120px !important; } col.c-typ { width: 116px !important; } .tabsl { gap: 10px; } .shift { grid-template-columns: 128px minmax(0, 1fr) !important; } }
  .dt td { height: 52px; }
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="main">
    <header class="bar">
      <h1>Վարորդներ</h1>
      <span class="crumb num">Պարկի վարորդներ · 30 · հերթափոխում 7 · գործընկերները՝ <a href="partners.html" style="color:var(--brand-text)">առանձին բաժնում</a></span>
      <div class="live"></div>
    </header>
    <div class="content">
      <section class="card" aria-label="Վարորդների ցանկ">
        <div class="filters">
          <div class="seg" role="tablist" aria-label="Հերթապահություն"><button class="on">Բոլորը <span class="c num">30</span></button><button>Հերթափոխում <span class="c num">7</span></button><button>Անջատված <span class="c num">23</span></button></div>
          <div class="input" style="width:236px"><i data-lucide="search"></i><span class="val ph">օր. 11 AA 111</span><span class="kbd">/</span></div>
          <span style="flex:1"></span>
          <button class="btn secondary s"><i data-lucide="plus"></i>Նոր վարորդ</button>
        </div>
        <div class="filters" style="padding-top:6px;padding-bottom:6px">
          <span class="chip">Փաստաթուղթը լրանում է <span class="c num">3</span></span>
          <span class="chip">Արգելափակված <span class="c num">1</span></span>
          <span class="chip">Ջնջման հայտ <span class="c num">1</span></span>
          <span class="chip">Առանց մեքենայի <span class="c num">2</span></span>

        </div>
        <div class="scroll-y grow">
          <table class="tbl dt">
            <colgroup><col><col class="c-car" style="width:150px"><col style="width:132px"><col class="c-doc" style="width:124px"><col style="width:112px"></colgroup>
            <thead><tr><th>Վարորդ</th><th>Պարկի մեքենա</th><th>Հերթապահություն</th><th>Փաստաթղթեր</th><th class="r">Այսօր պարկին</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
      <aside class="card dp" aria-label="Վարորդ" id="dp"></aside>
    </div>
  </div>
</div>
<script>
  shell('drivers')
  /* Fleet drivers only (owner 2026-10-11): partners have their own section. Fleet drivers drive our cars, so
     the car column is the shift car, and money is settlement by billing plan, not a wallet. */
  const EXTRA = [['Մհեր Աբգարյան', 'ՄԱ', '093 15-77-02', '19 MA 190', 'city', 'off'], ['Սոնա Խաչատրյան', 'ՍԽ', '077 62-11-48', '20 SK 202', 'kids', 'off'],
    ['Վարդան Մանուկյան', 'ՎՄ', '094 30-25-66', '05 VM 050', 'business', 'off'], ['Հովիկ Զաքարյան', 'ՀԶ', '098 41-09-37', '64 HZ 640', 'van', 'off'], ['Աշոտ Բաղդասարյան', 'ԱԲ', '055 76-48-21', '38 AB 381', 'city', 'off']]
  const FLEET = DRIVERS.filter((d) => d.type === 'fleet').concat(EXTRA.map(([name, ini, phone, plate, tier, state]) => ({ name, ini, phone, plate, tier, state, type: 'fleet' })))
  const sel = +(new URLSearchParams(location.search).get('d') ?? 0)
  const docState = ['ok', 'ok', 'warn', 'bad', 'ok', 'ok', 'ok', 'ok', 'ok', 'warn', 'ok', 'ok']
  const today = [2964, 3420, 1860, 0, 2280, 3110, 0, 0, 0, 0, 0, 0]
  document.getElementById('rows').innerHTML = FLEET.map((d, i) => {
    const [tone, word] = DSTATE[d.state]
    const ds = docState[i]
    const doc = ds === 'ok' ? '<span class="pill ok"><i data-lucide="circle-check"></i>Կարգին</span>' : ds === 'warn' ? '<span class="pill warn"><i data-lucide="clock"></i>9 օր</span>' : '<span class="pill bad"><i data-lucide="circle-alert"></i>Ժամկետանց</span>'
    return `<tr class="${i === sel ? 'on' : ''}"><td><span class="who"><span class="av">${d.ini}</span><span class="nm"><b>${d.name}</b><span>${d.phone}</span></span></span></td>
      <td>${d.state === 'off' ? '<span class="faint">—</span>' : `<span class="carcell"><span class="car xs">${carImg(d.tier)}</span><span class="plate">${d.plate}</span></span>`}</td>
      <td><span class="pill ${tone}"><i class="d"></i>${word}</span></td><td>${doc}</td><td class="r mono">${today[i] ? amd(today[i]) : '<span class="faint">—</span>'}</td></tr>`
  }).join('')

  const d = FLEET[sel], T = tierById(d.tier), partner = false
  const [tone, word] = DSTATE[d.state]
  const [, tw, ti] = DTYPE[d.type]
  const wallet = `
    <div class="blk"><h3><i data-lucide="receipt"></i>Հաշվարկ<span class="end faint" style="font-weight:400">«Պարկի ստանդարտ 20%»</span></h3>
      <div style="font:var(--c-body);color:var(--ink-muted);margin-top:6px">Վարորդը հանձնում է կանխիկը հերթափոխի վերջում։ Այսօր պարկին՝ <b class="num" style="color:var(--ink)">2 964 ֏</b> · մնացորդ՝ <b class="num" style="color:var(--ink)">0 ֏</b></div></div>`
  document.getElementById('dp').innerHTML = `
    <div class="scroll-y grow">
      <div class="head"><span class="av l">${d.ini}</span>
        <div style="min-width:0"><h2>${d.name}</h2>
          <div class="meta"><span class="mono muted" style="font-size:12px">+374 ${d.phone.slice(1)}</span><span class="pill ${tone}"><i class="d"></i>${word}</span></div></div>
        <button class="btn ghost icon s" aria-label="Փակել (Esc)"><i data-lucide="x"></i></button></div>
      <div class="acts"><button class="btn secondary s"><i data-lucide="key-round"></i>Մուտքի կոդ</button><button class="btn secondary s icon" aria-label="Զանգել"><i data-lucide="phone"></i></button><span style="flex:1"></span><button class="btn danger s"><i data-lucide="power"></i>Ավարտել հերթապահությունը</button></div>
      <div class="tabsl" role="tablist"><button class="on">Ընդհանուր</button><button>Պատվերներ</button><button>Գումար</button><button>Փաստաթղթեր <span class="c num">4</span></button><button aria-label="Գնահատական 4,9"><i data-lucide="star"></i><span class="num">4,9</span></button></div>
      ${wallet}
      <div class="blk">
        <h3><i data-lucide="car"></i>Ընթացիկ հերթափոխ<span class="end faint num" style="font-weight:400">08:12-ից · 6 ժ 14 ր</span></h3>
        <div class="shift"><span class="car" style="width:100%;height:80px">${carImg(d.tier, T.name)}</span>
          <dl class="facts"><dt>Մեքենա</dt><dd><span class="plate">${d.plate}</span></dd><dt>Փաթեթ</dt><dd>${T.name}</dd><dt>Մոդել</dt><dd>${partner ? 'Model 3 · սեփական' : 'ID.3 · պարկի'}</dd><dt>Այսօր</dt><dd>9 · 14 820 ֏</dd></dl></div>
      </div>
      <div class="blk" style="margin-bottom:12px">
        <h3><i data-lucide="file-text"></i>Փաստաթղթեր<span class="end pill warn" style="height:20px"><i data-lucide="clock"></i>1 լրանում է</span></h3>
        <div class="docs" data-truncate>
          <div class="doc"><span class="ic"><i data-lucide="file-text"></i></span><span class="t"><b>Վկայական</b><span>licence-2024.pdf</span></span><span class="pill ok">Վավեր է մինչև <span class="num">14.04.2027</span></span><button class="btn ghost icon s" aria-label="Ներբեռնել"><i data-lucide="download"></i></button></div>
          <div class="doc"><span class="ic"><i data-lucide="file-text"></i></span><span class="t"><b>Ապահովագրություն (ԱՊՊԱ)</b><span>osago-2025.pdf</span></span><span class="pill warn">Մինչև <span class="num">20.10.2026</span></span><button class="btn ghost icon s" aria-label="Ներբեռնել"><i data-lucide="download"></i></button></div>
          <div class="doc"><span class="ic"><i data-lucide="file-text"></i></span><span class="t"><b>Թույլտվություն</b><span>taxi-permit.pdf</span></span><span class="pill ok">Մինչև <span class="num">01.02.2027</span></span><button class="btn ghost icon s" aria-label="Ներբեռնել"><i data-lucide="download"></i></button></div>
          <div class="doc"><span class="ic"><i data-lucide="file-text"></i></span><span class="t"><b>Հաշվառման վկայական</b><span>${partner ? 'Սեփական մեքենա' : 'Պարկի մեքենա'} · reg.pdf</span></span><span class="pill">ժամկետը նշված չէ</span><button class="btn ghost icon s" aria-label="Ներբեռնել"><i data-lucide="download"></i></button></div>
        </div>
        <div class="dropz"><i data-lucide="upload"></i>Քաշեք ֆայլն այստեղ կամ <u>ընտրեք</u></div>
      </div>
    </div>`
  icons()
  document.documentElement.dataset.mapReady = 'none'
</script>
</body>
</html>
