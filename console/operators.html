<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operators</title>
<link rel="stylesheet" href="console.css">
<link rel="stylesheet" href="corporate.css">
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="../kit.js"></script>
<script src="console.js"></script>
<script src="console-audit.js"></script>
<style>
  /* Mirrors apps/operator components/admin/operators.tsx + operator-row.tsx + operator-panels.tsx + operator-create.tsx (§11).
     An operator is an email, a role and a state. Row actions, in fixed slots so rows line up: Disable/Enable (visible —
     reversible, ends their console at the next request), then the reveal actions (opacity on :hover/:focus-within, so the
     keyboard reaches them): reset password (an inline panel: it ends every open session), reset authenticator (two-press
     ArmButton; they enrol again at next login), delete (an inline confirm; final, the email stays taken). Your own row cannot
     be disabled or deleted. No modals. Admin only; a dispatcher is redirected (?as=dispatcher draws the alternative). */
  .ops td { height: 44px; }
  .ops .em { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .ops .em .mono { font-size: 13px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
  .ops .em .self { font: var(--c-small); color: var(--ink-faint); }
  .ops .nm { font: var(--c-small); color: var(--ink-faint); display: block; }
  .ops .acts { display: grid; grid-template-columns: 96px 172px 236px 96px; gap: 6px; justify-content: end; align-items: center; }
  .ops .acts > span { display: flex; justify-content: flex-start; }
  .ops tr.panel td { background: var(--surface-alt); height: auto; padding-top: 10px; padding-bottom: 12px; white-space: normal; }
  .pnl { display: flex; flex-direction: column; gap: 10px; max-width: 900px; }
  .pnl .r { display: flex; align-items: flex-start; gap: 8px; }
  .pnl .hint { margin-top: 4px; }
  .rowmsg td { height: auto !important; padding-top: 6px; padding-bottom: 8px; white-space: normal; background: var(--surface); }
  .warns { display: flex; flex-direction: column; gap: 6px; padding: 0 var(--inset) 10px; }
  .addrow td { height: 56px; }
  .addrow .input { flex: none; } .addrow .inl { overflow: hidden; }
  .denied { display: grid; place-items: center; height: 100%; }
  .denied .box { width: 520px; text-align: left; display: flex; flex-direction: column; gap: 12px; }
  .denied h2 { font: var(--c-title); }
  .denied p { font: var(--c-body); color: var(--ink-muted); }
  .ahead { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: var(--r-tag); background: var(--info-soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--info); font: 500 12px/16px var(--font); }
  @media (max-width: 1400px) { .ops .acts { grid-template-columns: 96px 40px 236px 40px; } .ops .lbl-s { display: none; } .ops col.c-acts { width: 460px !important; } .hide-s { display: none; } }
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="main">
    <header class="bar">
      <span class="crumb">Կառավարում <i data-lucide="chevron-right"></i></span><h1>Օպերատորներ</h1><span class="crumb num" id="count"></span>
      <div class="live"></div>
    </header>
    <div class="content one">
      <section class="card page" aria-label="Օպերատորներ" id="list"></section>
    </div>
  </div>
</div>
<script>
  /* ?state= (none) the list, you are Գոհար Մ. (admin) · add (the create row: email, role, password ≥ 12) · reset (the
     password panel under Մարիամ Հ.'s row) · totp (Սոնա Ա.'s «Վերակայել նույնականացումը» armed) · totp-done (the neutral
     row message after) · delete (the confirm panel under a disabled account) ; ?as=dispatcher (C51: a dispatcher who
     follows a link to an admin-only page). */
  const q = new URLSearchParams(location.search)
  const st = q.get('state') || '', disp = q.get('as') === 'dispatcher'
  shell('operators')
  const OPS = [...ECO.OPERATORS.map((o) => ({ ...o, disabled: false })), { name: 'Արսեն Վարդանյան', ini: 'ԱՎ', role: 'dispatcher', email: 'arsen@ecotaxi.am', disabled: true }]
  const SELF = 'gohar@ecotaxi.am'
  OPS.sort((a, b) => (a.email === SELF ? -1 : b.email === SELF ? 1 : 0))

  if (disp) {
    /* What a dispatcher's rail shows (console-sidebar.tsx DISPATCHER_SECTIONS): the admin-only entries are not offered. */
    const allow = ['dispatch', 'rides', 'drivers', 'vehicles', 'partners', 'topups', 'customer', 'companies']
    document.querySelectorAll('.nav .scroll a').forEach((a) => { const id = (a.getAttribute('href') || '').split('.html')[0]; if (!allow.includes(id)) a.remove() })
    document.querySelectorAll('.nav .scroll .group').forEach((g) => { let n = g.nextElementSibling; if (!n || !n.matches('a')) g.remove() })
    document.querySelector('.bar h1').textContent = 'Օպերատորներ'
    document.getElementById('list').innerHTML = `<div class="denied"><div class="box">
      <span class="ahead">նախագիծ · այսօր՝ անձայն վերահղում դեպի Դիսպետչեր</span>
      <div class="notice neutral"><i data-lucide="lock"></i><span>Այս էջը ադմինի համար է։ Դուք մուտք եք գործել որպես դիսպետչեր (${ECO.OPERATORS[0].email})։</span></div>
      <p>Օպերատորներին ավելացնում, անջատում և վերակայում է ադմինը։ Եթե ձեզ մուտք է պետք, դիմեք ադմինին։</p>
      <div style="display:flex;gap:8px"><a class="btn primary" href="dispatch.html?theme=${THEME}" style="text-decoration:none"><i data-lucide="arrow-left"></i>Վերադառնալ հերթ</a></div></div></div>`
    icons(); document.documentElement.dataset.mapReady = 'none'
  } else {
    document.getElementById('count').textContent = OPS.length
    const pick = { reset: 'mariam@ecotaxi.am', totp: 'sona@ecotaxi.am', 'totp-done': 'sona@ecotaxi.am', delete: 'arsen@ecotaxi.am' }[st]
    const n = (f) => OPS.filter(f).length
    const row = (o) => {
      const self = o.email === SELF, on = o.email === pick
      const role = o.role === 'admin' ? 'Ադմին' : 'Դիսպետչեր'
      const totpArmed = st === 'totp' && on
      let h = `<tr class="${o.disabled ? 'off ' : ''}${on ? 'on' : ''}"><td><span class="em"><span class="av">${o.ini}</span><span style="min-width:0"><span class="mono">${o.email}</span>${self ? ' <span class="self">(դուք)</span>' : ''}<span class="nm">${o.name}</span></span></span></td>
        <td>${role}</td><td><span class="pill ${o.disabled ? '' : 'ok'}"><i class="d"></i>${o.disabled ? 'Անջատված' : 'Ակտիվ'}</span></td>
        <td><span class="acts">
          <span>${self ? '' : `<button class="btn secondary s" aria-label="${o.disabled ? 'Միացնել' : 'Անջատել'} — ${o.email}">${o.disabled ? 'Միացնել' : 'Անջատել'}</button>`}</span>
          <span><button class="btn ghost s${self || on ? '' : ' rev-act'}" aria-expanded="${st === 'reset' && on}" aria-label="Փոխել գաղտնաբառը — ${o.email}" title="Փոխել գաղտնաբառը — ${o.email}"><i data-lucide="key-round"></i><span class="lbl-s">Փոխել գաղտնաբառը</span></button></span>
          <span>${self ? '' : `<button class="btn s ${totpArmed ? 'armed' : 'ghost' + (on ? '' : ' rev-act')}" aria-label="${totpArmed ? 'Հաստատե՞լ ' : ''}Վերակայել նույնականացումը — ${o.email}"><i data-lucide="shield-off"></i>${totpArmed ? 'Հաստատե՞լ' : 'Վերակայել նույնականացումը'}</button>`}</span>
          <span>${self ? '' : `<button class="btn danger s${on && st === 'delete' ? '' : ' rev-act'}" aria-expanded="${st === 'delete' && on}" aria-label="Ջնջել — ${o.email}" title="Ջնջել — ${o.email}"><i data-lucide="trash-2"></i><span class="lbl-s">Ջնջել</span></button>`}</span>
        </span></td></tr>`
      if (on && st === 'reset') h += `<tr class="panel"><td colspan="4"><div class="pnl"><div class="notice amber"><i data-lucide="triangle-alert"></i><span><b>${o.email}</b> — Փոփոխությունը փակում է այդ հաշվի բոլոր բաց նստաշրջանները, ներառյալ հենց հիմա օգտագործվողը: Նա նորից մուտք է գործում նոր գաղտնաբառով:</span></div>
          <div class="r"><div><span class="label">Նոր գաղտնաբառ</span><div class="input focus" style="width:300px"><span class="val">••••••••••</span></div><p class="hint">Առնվազն 12 նիշ · 10 / 12</p></div>
            <div style="padding-top:20px;display:flex;gap:6px"><button class="btn primary s" disabled style="opacity:.5">Պահպանել գաղտնաբառը</button><button class="btn ghost s">Չեղարկել</button></div></div></div></td></tr>`
      if (on && st === 'delete') h += `<tr class="panel"><td colspan="4"><div class="pnl"><div class="notice red"><i data-lucide="triangle-alert"></i><span><b>${o.email}</b> — Ջնջումը վերջնական է — հաշիվը հետ չի վերականգնվում, իսկ նրա էլ. հասցեն մնում է զբաղված, այնպես որ նույն մարդուն նույն հասցեով նորից ավելացնել չի լինի:</span></div>
          <div style="display:flex;gap:6px"><button class="btn danger-fill s"><i data-lucide="trash-2"></i>Հաստատել ջնջումը</button><button class="btn ghost s">Չեղարկել</button></div></div></td></tr>`
      if (on && st === 'totp-done') h += `<tr class="rowmsg"><td colspan="4"><div class="notice neutral" role="status"><i data-lucide="check"></i><span>Նույնականացումը վերակայվեց, նստաշրջանները փակվեցին։ Հաջորդ մուտքին այն նորից կկարգավորի։</span></div></td></tr>`
      return h
    }
    const add = st === 'add' ? `<tr class="addrow"><td colspan="4"><div class="inl" style="flex-wrap:wrap">
        <div class="input focus" style="width:280px" role="textbox" aria-label="Էլ. փոստ"><span class="val mono">nare@ecotaxi.am</span></div>
        <div class="input" style="width:172px" role="combobox" aria-label="Դեր"><span class="val">Դիսպետչեր</span><i data-lucide="chevrons-up-down"></i></div>
        <div style="position:relative"><div class="input" style="width:220px" role="textbox" aria-label="Գաղտնաբառ"><span class="val">••••••••••••••</span></div></div>
        <button class="btn primary s"><i data-lucide="check"></i>Ավելացնել օպերատոր <span class="kbd">↵</span></button><button class="btn ghost s">Չեղարկել</button>
        <span class="faint" style="font:var(--c-small);flex-basis:100%">Առաջին մուտքին կկարգավորի նույնականացումը</span></div></td></tr>` : ''
    document.getElementById('list').innerHTML = `
      <div class="toolrow">
        <div class="input" style="width:260px"><i data-lucide="search"></i><span class="val ph">օր. anna@eco.am</span><span class="kbd">/</span></div>
        <div role="group" aria-label="Զտիչներ" class="row-flex" style="gap:6px">
          <span class="chip" role="button" aria-pressed="false">Ադմին <span class="c num">${n((o) => o.role === 'admin' && !o.disabled)}</span></span>
          <span class="chip" role="button" aria-pressed="false">Դիսպետչեր <span class="c num">${n((o) => o.role === 'dispatcher' && !o.disabled)}</span></span>
          <span class="chip" role="button" aria-pressed="false">Անջատված <span class="c num">${n((o) => o.disabled)}</span></span></div>
        <span class="sp"></span>
        <button class="btn secondary" aria-expanded="${st === 'add'}" aria-keyshortcuts="N"><i data-lucide="plus"></i>Նոր օպերատոր <span class="kbd">N</span></button>
      </div>
      <div class="warns"><div class="notice neutral"><i data-lucide="info"></i><span>Անջատումը միանգամից դուրս է բերում օպերատորին — նրա կոնսոլը դադարում է աշխատել հենց հաջորդ հարցումին, նույնիսկ զանգի ընթացքում: Սա հետ շրջելի է:</span></div></div>
      <div class="scroll-y grow" data-truncate>
        <table class="tbl ops" aria-label="Օպերատորներ"><colgroup><col><col style="width:140px"><col style="width:132px"><col style="width:640px" class="c-acts"></colgroup>
          <thead><tr><th>Էլ. փոստ</th><th>Դեր</th><th>Կարգավիճակ</th><th></th></tr></thead><tbody>${add}${OPS.map(row).join('')}</tbody></table>
        <p class="explain" style="padding-bottom:12px">Չեք կարող անջատել կամ ջնջել ձեր սեփական հաշիվը: Այդպես վարվող ադմինը ֆլոտին կթողնի առանց իր իսկ կոնսոլ մտնելու ճանապարհի:</p></div>`
    /* The signed-in operator on this page is the admin. */
    const me = document.querySelector('.nav .me .who')
    if (me) me.innerHTML = '<b>Գոհար Մինասյան</b><span>Ադմին</span>'
    const av = document.querySelector('.nav .me .av'); if (av) av.textContent = 'ԳՄ'
    icons(); document.documentElement.dataset.mapReady = 'none'
  }
</script>
</body>
</html>
