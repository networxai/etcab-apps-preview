<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integrations</title>
<link rel="stylesheet" href="console.css">
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="../kit.js"></script>
<script src="console.js"></script>
<script src="console-audit.js"></script>
<style>
  /* Mirrors apps/operator components/admin/integrations.tsx (§9.6, Config screen §10.D.3): two cards, maps then sms, 6 + 6.
     A credential is NEVER displayed, because GET /integrations answers only `configured` and `updatedAt`: every field
     renders empty even when set, and there is no preview column. Field names and hints stay English on purpose (2GIS's and
     the SMS broker's own names — the one recorded exception to Armenian-first); title, status, save and errors are hy. */
  .content { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .head2 { grid-column: 1 / 3; padding: 4px 4px 0; display: flex; flex-direction: column; gap: 8px; }
  .head2 p { font: var(--c-body); color: var(--ink-muted); max-width: 900px; }
  .fl { padding: 8px var(--inset) 0; display: flex; flex-direction: column; gap: 10px; }
  .fd .label { display: flex; align-items: center; gap: 6px; }
  .fd .label .mono { font-size: 12px; color: var(--ink); }
  .fd .req { font: var(--c-small); color: var(--ink-muted); }
  .fd .hint { font: var(--c-small); color: var(--ink-muted); margin-top: 4px; }
  .fd .why { font: var(--c-small); color: var(--danger-c); margin-top: 4px; display: flex; gap: 4px; align-items: center; }
  .fd .input .val { font-family: var(--mono); }
  .ft { display: flex; align-items: center; gap: 8px; padding: 12px var(--inset); margin-top: auto; border-top: 1px solid var(--line-soft); }
  .ft .notice { flex: 1; }
  /* ?tab=pay (owner 2026-10-15): four payment cards in a 2×2 grid, the same card pattern, denser. */
  .pay .content { grid-template-rows: auto minmax(0, 1fr) minmax(0, 1fr); }
  .pay .fl { gap: 8px; padding-bottom: 8px; }
  .pay .fd .hint { margin-top: 2px; }
  .pay .ft { padding: 8px var(--inset); }
  .head2 .seg { align-self: flex-start; }
  .seg a { height: 26px; padding: 0 10px; border-radius: 6px; font: var(--c-strong); color: var(--ink-muted); white-space: nowrap; display: flex; align-items: center; gap: 6px; text-decoration: none; }
  .seg a.on { background: var(--surface); color: var(--ink); box-shadow: var(--e1); }
  .facts1 { display: flex; flex-wrap: wrap; gap: 4px 12px; font: var(--c-small); color: var(--ink-muted); padding: 8px var(--inset) 0; }
  .facts1 b { color: var(--ink); font-weight: 500; }
  .fd .seg { display: inline-flex; }
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="main">
    <header class="bar">
      <span class="crumb">Կառավարում <i data-lucide="chevron-right"></i></span><h1>Ինտեգրումներ</h1>
      <div class="live"></div>
    </header>
    <div class="content">
      <div class="head2"><nav class="seg" id="itabs" aria-label="Ինտեգրումներ"></nav><p id="lead">Քարտեզի և SMS-ի բանալիներ · պահվածը չի ցուցադրվում</p></div>
      <section class="card" aria-labelledby="k-maps" id="maps"></section>
      <section class="card" aria-labelledby="k-sms" id="sms"></section>
    </div>
  </div>
</div>
<script>
  shell('integrations')
  const REFUSED = new URLSearchParams(location.search).get('state') === 'refused'
  const F = {
    maps: [['apiKey', 1, 1, 'Server key. Used for address search, geocoding and route estimates. Must be a server-side key — an SDK-tagged key is bound to a mobile application and is refused with 403.'],
      ['browserKey', 0, 1, 'Sent to browsers and handsets to draw the map. Scope it to MapGL and Map Tiles only, restricted by origin — a search-capable key here spends the fleet’s monthly quota from anyone’s devtools.'],
      ['routingKey', 0, 1, 'Only if route estimates live on a different key from search. Left empty, routing uses the server key.'],
      ['locale', 0, 0, 'The language 2GIS answers in, e.g. hy_AM.'],
      ['location', 0, 0, 'Where address suggestions are biased towards, as "lon,lat", e.g. 44.4991,40.1792. Without it a street name may be answered from another city.'],
      ['baseUrl', 0, 0, 'Only for a sandbox. Leave empty for the live API.']],
    sms: [['login', 1, 0, 'The broker account.'], ['password', 1, 1, 'The broker password.'], ['sender', 1, 0, 'The name a customer sees the message from.'],
      ['baseUrl', 1, 0, 'The broker’s address, as an absolute URL. Messages are sent to <baseUrl>/broker-api/send.']],
  }
  /* What the owner has typed in the refused state (a re-save of the maps card): secrets stay dots, the bad value is shown. */
  const TYPED = REFUSED ? { apiKey: '••••••••••••••••••••', browserKey: '••••••••••••••••••••', locale: 'hy_AM', location: '40.1792,44.4991' } : {}
  const card = (kind, title, sub, when) => {
    const fields = F[kind].map(([n, req, secret, hint]) => {
      const bad = REFUSED && kind === 'maps' && n === 'location'
      const v = kind === 'maps' ? TYPED[n] : null
      return `<div class="fd"><label class="label"><span class="mono">${n}</span>${req ? '<span class="req">· պարտադիր</span>' : ''}</label>
        <span class="input${bad ? ' err' : ''}">${secret ? '<i data-lucide="key-round"></i>' : ''}<span class="val${v ? '' : ' ph'}">${v || ''}</span></span>
        ${bad ? '<div class="why" id="why-loc"><i data-lucide="circle-alert"></i>Մերժվեց․ ստուգեք արժեքը</div>' : ''}<div class="hint">${hint.replace('<', '&lt;').replace('>', '&gt;')}</div></div>`
    }).join('')
    const status = when ? `<span class="pill ok"><i class="d"></i>Կարգավորված է · <span class="num">${when}</span></span>` : '<span class="pill"><i class="d"></i>Կարգավորված չէ</span>'
    const foot = REFUSED && kind === 'maps'
      ? `<div class="notice red" role="alert"><i data-lucide="circle-alert"></i><span>Չպահվեց․ ստուգեք նշված դաշտը</span></div>`
      : `<div class="notice neutral"><i data-lucide="info"></i><span>Պահելը փոխարինում է բոլոր դաշտերը․ լրացրեք բոլորը</span></div>`
    return `<div class="card-h"><h2 id="k-${kind}">${title}</h2><span class="sub">${sub}</span><span class="end">${status}</span></div>
      <div class="scroll-y grow"><div class="fl">${fields}</div></div>
      <div class="ft">${foot}<button class="btn ${kind === 'maps' ? 'primary' : 'secondary'}">Պահել</button></div>`
  }
  const PAYTAB = new URLSearchParams(location.search).get('tab') === 'pay'
  document.getElementById('itabs').innerHTML = `<a href="?theme=${THEME}" class="${PAYTAB ? '' : 'on'}"${PAYTAB ? '' : ' aria-current="page"'}><i data-lucide="map"></i>Քարտեզ և SMS</a><a href="?theme=${THEME}&tab=pay" class="${PAYTAB ? 'on' : ''}"${PAYTAB ? ' aria-current="page"' : ''}><i data-lucide="credit-card"></i>Վճարումներ և ETAPI</a>`
  if (!PAYTAB) {
  document.getElementById('maps').innerHTML = card('maps', 'Քարտեզ', '2GIS', '02.10.2026, 14:20')
  document.getElementById('sms').innerHTML = card('sms', 'SMS', 'մատակարար', '28.09.2026, 11:05')
  } else {
    /* ── ?tab=pay (owner 2026-10-15, drawn ahead: no payment or ETAPI integration in the API). Same rules as above:
       secrets are write-only and render empty even when set; vendor field names stay English. Two things are read back
       because they are not secrets and an operator must see them: ETAPI's mode (sandbox / live) and its last success,
       and Apple Pay's domain verification. ETAPI = Eco Taxi's Tax Service + Idram service: one token files the ՊԵԿ
       receipt and pays the driver's Idram. ── */
    document.querySelector('.screen').classList.add('pay')
    document.getElementById('lead').textContent = 'Վճարային դարպասներ և ETAPI · գաղտնի դաշտերը չեն ցուցադրվում'
    const content = document.querySelector('.content')
    content.querySelectorAll('section.card').forEach((c) => c.remove())
    const fld = (n, req, secret, hint, ctl) => `<div class="fd"><label class="label"><span class="mono">${n}</span>${req ? '<span class="req">· պարտադիր</span>' : ''}</label>
      ${ctl || `<span class="input">${secret ? '<i data-lucide="key-round"></i>' : ''}<span class="val ph"></span></span>`}<div class="hint">${hint}</div></div>`
    const mode = (live) => `<div class="seg" role="radiogroup" aria-label="mode"><button role="radio" aria-checked="${!live}" class="${live ? '' : 'on'}">sandbox</button><button role="radio" aria-checked="${live}" class="${live ? 'on' : ''}">live</button></div>`
    const ok = (when) => `<span class="pill ok"><i class="d"></i>Կարգավորված է · <span class="num">${when}</span></span>`
    const pcard = (id, title, sub, status, facts, fields, primary) => `<section class="card" aria-labelledby="k-${id}"><div class="card-h"><h2 id="k-${id}">${title}</h2><span class="sub">${sub}</span><span class="end">${status}</span></div>
      <div class="scroll-y grow">${facts ? `<div class="facts1">${facts}</div>` : ''}<div class="fl">${fields}</div></div>
      <div class="ft"><div class="notice neutral"><i data-lucide="info"></i><span>Պահելը փոխարինում է բոլոր դաշտերը</span></div><button class="btn ${primary ? 'primary' : 'secondary'}">Պահել</button></div></section>`
    content.insertAdjacentHTML('beforeend',
      pcard('etapi', 'ETAPI', 'ՊԵԿ կտրոն + Idram', ok('14.10.2026, 10:02'),
        '<span><i data-lucide="circle-check" style="width:12px;height:12px;color:var(--ok-text);vertical-align:-2px"></i> Վերջին հաջողը՝ <b class="mono">14:19</b> · <b class="mono">#R-20352</b></span><span>Ռեժիմ՝ <b>live</b></span><span>Այսօր՝ <b class="num">55</b> անկանխիկ · <b class="num">51</b> կանխիկ պահված</span>',
        fld('apiToken', 1, 1, 'Bearer token issued by ETAPI. One token files the Tax Service receipt and sends the Idram payout.')
        + fld('platformTin', 1, 0, 'The platform’s ՀՎՀՀ (8 digits). Each receipt is the driver’s income filed through this platform.')
        + fld('mode', 1, 0, 'sandbox files nothing real. Switch to live only after a test ride shows a receipt.', mode(true)), 1)
      + pcard('ipay', 'iPay · ArCa', 'IDBank · քարտ', ok('12.10.2026, 16:40'), '',
        fld('merchantId', 1, 0, 'The ArCa merchant id from the iPay contract.') + fld('apiUser', 1, 0, 'The API user iPay issued for this merchant.')
        + fld('apiPassword', 1, 1, 'The API user’s password.') + fld('mode', 1, 0, 'test charges no real card.', mode(true)))
      + pcard('applepay', 'Apple Pay', 'iOS · IDBank', ok('12.10.2026, 17:05'),
        '<span class="pill ok" style="height:20px"><i data-lucide="badge-check"></i>Դոմենը հաստատված է · <span class="mono">pay.ecotaxi.am</span></span><span>վավեր՝ մինչև <b class="num">12.10.2027</b></span>',
        fld('merchantIdentifier', 1, 0, 'From the Apple developer account, e.g. merchant.am.&lt;fleet&gt;.')
        + fld('paymentProcessingCertificate', 1, 1, 'The .p12 the card gateway decrypts Apple Pay tokens with.')
        + fld('domainVerification', 0, 0, 'Served at /.well-known/apple-developer-merchantid-domain-association.', '<button class="btn secondary s"><i data-lucide="download"></i>Ներբեռնել ֆայլը</button>'))
      + pcard('googlepay', 'Google Pay', 'Android · IDBank', ok('12.10.2026, 17:12'), '',
        fld('merchantId', 1, 0, 'From the Google Pay & Wallet console.') + fld('merchantName', 1, 0, 'Shown to the rider on the Google Pay sheet.')
        + fld('gatewayMerchantId', 1, 0, 'The ArCa merchant id the Google Pay token is issued for (same as iPay’s).'))
      + `<section class="card" aria-labelledby="k-acba"><div class="card-h"><h2 id="k-acba">ACBA · NFC</h2><span class="sub">քաղվածքի ներմուծում</span><span class="end"><span class="pill ok"><i class="d"></i>Ներմուծված է · <span class="num">15.10.2026, 23:59</span></span></span></div>
      <div class="scroll-y grow"><div class="facts1"><span>API չկա · NFC-ն վարորդը ստանում է ACBA-ի հավելվածով</span><span>Համեմատվում է՝ <b class="num">10</b> NFC պատվեր · <b class="num">1</b> չկա քաղվածքում</span></div>
        <div class="fl">${fld('statement', 1, 0, 'The ACBA account statement (CSV or XLSX). Each driver-confirmed NFC ride is matched by amount and time; a driver’s ETAPI payout is sent only after its match.', '<button class="btn secondary s"><i data-lucide="upload"></i>Ներմուծել քաղվածքը</button>')}</div></div>
      <div class="ft"><div class="notice neutral"><i data-lucide="info"></i><span>Բանալիներ չեն պահանջվում</span></div></div></section>`)
  }
  icons()
  document.documentElement.dataset.mapReady = 'none'
</script>
</body>
</html>
