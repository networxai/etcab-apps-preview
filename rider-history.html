<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Rider history</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="rider.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="mapgl.local.js"></script>
<script src="kit.js"></script>
<script src="routes.js"></script>
<script src="audit.js"></script>
<script src="rider.js"></script>
<style>
  /* History: destination is the row title, when + tier under it, fare in a tabular column on the right. */
  .hrow { display: flex; align-items: center; gap: var(--s2); min-height: 72px; width: 100%; }
  .hrow .hmain { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--s3); min-height: 72px; text-align: left; }
  .hrow .l1 { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); }
  .hrow .rcpt { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); color: var(--ink); display: grid; place-items: center; margin-right: -4px; }
  .hrow .rcpt svg { width: 20px; height: 20px; }
  .hrow .rcpt.none { background: none; }
  /* The receipt document (change list 2026-10-14): a paper card — seller, ride, lines, discount, total, payment, fiscal ref. */
  .doc { margin: var(--s2) var(--margin) 0; background: var(--surface); border-radius: var(--r-card); box-shadow: var(--e1); padding: var(--s4); display: flex; flex-direction: column; }
  .doc .dh { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s3); }
  .doc .dh img { height: 16px; width: auto; margin-top: 4px; }
  .doc .dh .no { text-align: right; font: var(--t-secondary); color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .doc .dh .no b { display: block; font: var(--t-body-strong); color: var(--ink); }
  .doc .cut { border-top: 1.5px dashed var(--ink-3); margin: var(--s3) 0; opacity: .7; }
  .doc .m { display: flex; justify-content: space-between; gap: var(--s3); min-height: 26px; align-items: center; font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; }
  .doc .m b { font: var(--t-secondary-strong); color: var(--ink); font-variant-numeric: tabular-nums; }
  .doc .m.disc span, .doc .m.disc b { color: var(--brand-ink); }
  .doc .m.disc span { display: inline-flex; align-items: center; gap: 6px; }
  .doc .m.disc svg { width: 15px; height: 15px; }
  .doc .tot { display: flex; justify-content: space-between; font: var(--t-headline); color: var(--ink); font-variant-numeric: tabular-nums; }
  .doc .rt { font: var(--t-secondary); color: var(--ink); line-height: 22px; }
  .doc .rt span { color: var(--ink-2); }
  .page .foot.two { display: flex; flex-direction: column; gap: var(--s2); }
  .hrow .trace { flex: none; border-radius: 10px; }
  .hrow .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .hrow .t1 { font: var(--t-body-strong); color: var(--ink); white-space: nowrap; }
  .hrow .t2 { font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .hrow .fare { flex: none; font: var(--t-body-strong); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  .hrow .st { flex: none; display: inline-flex; align-items: center; gap: 4px; font: var(--t-secondary-strong); color: var(--ink-2); white-space: nowrap; }
  .hrow .st svg { width: 14px; height: 14px; }
  .group .divider.h { margin-left: 60px; }
  .hrow .t2 .co { display: inline-flex; align-items: center; gap: 4px; }
  .hrow .t2 .co svg { width: 13px; height: 13px; }

  /* Upcoming pre-orders: history/index.tsx geometry — a surface card per booking: calendar-clock + when (brand), the route,
     a warn tag when the booking has a problem. Owner 2026-10-12: no inline «Չեղարկել»; the card opens the booking. */
  .bk { display: flex; flex-direction: column; gap: var(--s2); }
  .ubk { width: calc(100% - 2 * var(--margin)); margin: 0 var(--margin); text-align: left; background: var(--surface); border-radius: var(--r-card);
    padding: var(--s3); display: flex; flex-direction: column; gap: var(--s2); }
  .ubk .hd { display: flex; align-items: center; gap: var(--s2); min-height: 24px; }
  .ubk .hd > svg:first-child { width: 20px; height: 20px; color: var(--brand-ink); }
  .ubk .hd .w { flex: 1; font: var(--t-body-strong); color: var(--brand-ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ubk .hd .chev { width: 20px; height: 20px; color: var(--ink-3); }
  .ubk .rt { font: var(--t-body); color: var(--ink); }
  .ubk .ft { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
  .ubk .tg { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 6px; font: var(--t-caption); line-height: 24px; white-space: nowrap; }
  .ubk .tg svg { width: 14px; height: 14px; }
  .ubk .tg.warn { background: var(--warn-soft); color: #94430A; } /* --warn measured 4.25:1 on --warn-soft at 12px; this is 5.9:1 */
  :root[data-theme="dark"] .ubk .tg.warn, :root[data-theme="dark"] .tg.warn { color: var(--warn); }
  .ubk .tg.co { background: var(--surface-2); color: var(--ink-2); }
  /* Owner Q1: no driver on a booking is normal, not a problem: the system searches that tariff automatically at the time. Neutral tag. */
  .ubk .tg.auto { background: var(--surface-2); color: var(--ink-2); }

  .skrow { display: flex; align-items: center; gap: var(--s3); min-height: 72px; }
  .skrow .sk.th { width: 48px; height: 48px; border-radius: 10px; flex: none; }
  .skrow .lines { flex: 1; display: flex; flex-direction: column; gap: 8px; }

  .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s4); padding: 0 var(--s8) 80px; text-align: center; }
  .empty .halo { width: 220px; height: 220px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; box-shadow: var(--e1); }
  .empty .carart { width: 184px; height: 88px; }
  .empty p { font: var(--t-body); color: var(--ink-2); }
  .page .foot { flex: none; padding: 0 var(--margin) 42px; }

  /* Receipt: the map on top, the receipt as a sheet. */
  #sheet { padding: var(--s5) var(--margin) 34px; }
  .rhead { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s3); }
  .rhead .when { font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .rhead .tier { font: var(--t-headline); color: var(--ink); white-space: nowrap; }
  .hero { font: var(--t-hero); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.5px; }
  .stops { margin-top: var(--s4); position: relative; }
  .stop { display: flex; align-items: center; gap: var(--s3); min-height: 36px; }
  .stop .g { width: 18px; display: grid; place-items: center; flex: none; }
  .stop .g i { display: block; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 3px var(--surface-3); }
  .stop.b .g i { border-radius: 2px; }
  .stop .a { flex: 1; font: var(--t-body); color: var(--ink); white-space: nowrap; }
  .stop .tm { font: var(--t-secondary); color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stops::before { content: ''; position: absolute; left: 8.5px; top: 22px; bottom: 22px; width: 1px; background: var(--ink-3); opacity: .5; }
  .hr { height: 1px; background: var(--hairline); margin: var(--s3) 0; }
  .drv { display: flex; align-items: center; gap: var(--s3); }
  .drv .avatar { width: 40px; height: 40px; }
  .drv .avatar svg { width: 20px; height: 20px; }
  .drv .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .drv .t1 { font: var(--t-body-strong); color: var(--ink); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .drv .t1 span { font: var(--t-secondary); color: var(--ink-2); display: inline-flex; align-items: center; gap: 2px; }
  .drv .t1 svg { width: 13px; height: 13px; fill: currentColor; }
  .drv .t2 { font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; }
  .lines { display: flex; flex-direction: column; }
  .ln { display: flex; justify-content: space-between; align-items: center; min-height: 26px; font: var(--t-secondary); color: var(--ink-2); }
  .ln span { white-space: nowrap; }
  .ln b { font: var(--t-secondary-strong); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ln.tot { margin-top: var(--s1); min-height: 30px; font: var(--t-body-strong); color: var(--ink); }
  .ln.tot b { font: var(--t-body-strong); }
  .ln .pay { display: inline-flex; align-items: center; gap: 6px; }
  .ln .pay svg { width: 16px; height: 16px; color: var(--ok); }
  .ln.paid { min-height: 32px; font: var(--t-body); color: var(--ink); }
  .ln .pay.co svg { color: var(--ink-2); }
  .notice { display: flex; gap: var(--s2); align-items: flex-start; margin-top: var(--s3); padding: var(--s3); border-radius: var(--r-card); background: var(--surface-2);
    font: var(--t-secondary); color: var(--ink); }
  .notice svg { width: 16px; height: 16px; flex: none; margin-top: 1px; color: var(--ink-2); }
  .notice b { display: block; font: var(--t-secondary-strong); }
  #sheet .btns { margin-top: var(--s4); }
  .cx { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--r-pill); background: var(--surface-2);
    font: var(--t-secondary-strong); color: var(--ink); white-space: nowrap; }
  .cx svg { width: 14px; height: 14px; }
  .why { margin-top: var(--s3); background: var(--surface-2); border-radius: var(--r-card); padding: var(--s3) var(--s4); display: flex; flex-direction: column; gap: 2px; }
  .why .k { font: var(--t-caption); color: var(--ink-2); }
  .why .v { font: var(--t-body); color: var(--ink); white-space: nowrap; }
  /* Receipt could not load: the blank-state pattern (icon disc + one word + one line), Retry pinned at the foot (2026-10-14). */
  .errbox { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s2); padding: 0 var(--s8) 80px; text-align: center; }
  .errbox .eo { width: 64px; height: 64px; border-radius: 50%; background: var(--surface); box-shadow: var(--e1); display: grid; place-items: center; color: var(--ink-2); margin-bottom: var(--s2); }
  .errbox .eo svg { width: 28px; height: 28px; }
  .errbox .et { font: var(--t-headline); color: var(--ink); }
  .errbox .es { font: var(--t-secondary); color: var(--ink-2); }
</style>
</head>
<body>
<script>
  const A = R.amd
  /* Eco tariffs, fixed_upfront, rounded to 100 ֏ (NOTES.md):
     City   600 + 90/km + 12/min  · Partner 700 + 110/km + 14/min
     Mashtots 37 → Komitas 22  City    4,3 km 6 min: 600 + 387 + 72 = 1 059 → 1 100  (the one ride, ECO.RIDE: 9:45 → 9:51)
     Republic Sq → Cascade, company ride (billed to ECO.COMPANY) 800
     Republic Sq → Cascade     City    2.1 km 4 min: 600 + 189 + 48 =   837 →   800
     Komitas 22 → Mashtots 37  Partner 4.3 km 7 min: 700 + 473 + 98 = 1 271 → 1 300
     Tumanyan → Opera          City    1.4 km 3 min: 600 + 126 + 36 =   762 →   800
     Komitas 22 → Zvartnots    City   12.6 km 17 min: 600 + 1 134 + 204 = 1 938 → ≈ 1 900 (estimate, scheduled) */
  const rides = [
    ['pickupToDrop', ECO.RIDE.drop, 'Այսօր, ' + ECO.RIDE.pickupAt.padStart(5, '0'), 'Eco City', A(ECO.RIDE.fare)],
    ['republicToCascade', 'Կասկադ', 'Երեկ, 08:50', 'Eco City', A(800), true],
    ['pickupToDrop', 'Մաշտոցի պող. 37', '7 հոկտ., 18:20', 'Eco Comfort', A(1300)],
    ['driverToPickup', 'Օպերա', '5 հոկտ., 13:05', 'Eco City', null],
    ['driverToPickup', 'Օպերա', '2 հոկտ., 10:15', 'Eco City', A(800)],
  ]
  /* co: billed to the rider's company — said in words on the row, the receipt names the company.
     Change list 2026-10-14: every charged ride carries its own receipt button at the row's end (a sibling of the row's
     main tap target, never nested); a cancelled ride has nothing to receipt, so the slot stays empty for column alignment. */
  const row = ([k, to, when, tier, fare, co]) => `<div class="hrow"><button class="hmain">${R.trace(k, 48, 48, { pad: 8, r: 3, sw: 2.5, grid: false })}
      <span class="txt"><span class="l1"><span class="t1">${to}</span>${fare ? `<span class="fare">${fare}</span>` : `<span class="st">${R.i('circle-slash')}Չեղարկված</span>`}</span><span class="t2">${when} · ${co ? `<span class="co">${R.i('building-2')}${ECO.PAY.company.short}</span>` : tier}</span></span></button>
      ${fare ? `<button class="rcpt" aria-label="Ստացական · ${to}, ${when}">${R.i('receipt-text')}</button>` : '<span class="rcpt none" aria-hidden="true"></span>'}</div>`
  const group = (list) => `<div class="group">${list.map((r, i) => (i ? '<div class="divider h"></div>' : '') + row(r)).join('')}</div>`
  const head = () => `<nav class="nav"><button class="navbtn" aria-label="Հետ">${R.i('arrow-left')}</button><span class="navttl"></span><span class="navend"></span></nav><h1 class="large">Ուղևորություններ</h1>`
  /* ECO.BOOKINGS: Աննա's three pre-orders, soonest first (upcomingBooking order). sun has problemReason → history.pending (warn);
     co is billed to the company («Ընկերություն» marker: drawn ahead — customerScheduledRideSchema carries no billing yet). */
  const BK = ECO.BOOKINGS
  const booking = (b) => `<button class="ubk" aria-label="${b.when}, ${b.pickup} → ${b.drop}${b.problem ? ', Մեքենան՝ ավտոմատ որոնմամբ' : ''}">
      <span class="hd">${R.i('calendar-clock')}<span class="w">${b.when}</span>${R.i('chevron-right', 'class="chev"')}</span>
      <span class="rt">${b.pickup} → ${b.drop}</span>
      ${b.problem || b.pay === 'company' ? `<span class="ft">${b.problem ? `<span class="tg auto">${R.i('search')}Մեքենան՝ ավտոմատ որոնմամբ</span>` : ''}${b.pay === 'company' ? `<span class="tg co">${R.i('building-2')}${ECO.PAY.company.short}</span>` : ''}</span>` : ''}</button>`
  const upcoming = () => `<div class="sect">Նախնական պատվերներ</div><div class="bk">${[BK.air, BK.sun, BK.co].map(booking).join('')}</div>`

  /* Receipt sheet (pickup → Komitas, the same ride the driver was offered: 1 100 ֏). */
  const stops = (a, ta, b, tb) => `<div class="stops"><div class="stop"><span class="g"><i></i></span><span class="a">${a}</span><span class="tm">${ta}</span></div>
      <div class="stop b"><span class="g"><i></i></span><span class="a">${b}</span><span class="tm">${tb}</span></div></div>`
  const nav = () => `<button class="fab" style="top:62px;left:16px" aria-label="Հետ">${R.i('arrow-left')}</button>`
  const mapFor = (key, o = {}) => (s) => {
    const pts = ROUTES[key].pts
    const sheetH = s.querySelector('#sheet').offsetHeight
    const m = R.map(s, { fit: pts, padTL: [56, 96], padBR: [56, sheetH + 40] })
    drawRoute(m, pts, o.dash ? { dash: true, color: cssVar('--ink-3'), weight: 4 } : { weight: 5 })
    htmlMarker(m, pts[0], '<div class="pin-a"></div>', [18, 18])
    htmlMarker(m, pts[pts.length - 1], '<div class="pin-b"></div>', [18, 18])
  }

  const RD = ECO.RIDE, DV = RD.driver, C = ECO.COMPANY
  const receipt = (pay) => `<div class="map" id="map" aria-label="Երթուղի"></div>${nav()}
          <section class="sheet" id="sheet">
            <div class="rhead"><div><div class="when">Այսօր, ${RD.pickupAt} · ${ECO.km(RD.km)} · ${RD.min} րոպե</div><div class="tier">${RD.tier}</div></div><div class="hero">${A(RD.fare)}</div></div>
            ${stops(RD.pickup, RD.pickupAt, RD.drop, RD.dropAt)}
            <div class="hr"></div>
            <div class="drv">${R.avatar()}<span class="txt"><span class="t1">${DV.first} <span>${R.i('star')}${DV.rating}</span></span><span class="t2">${DV.carHy}</span></span>${R.plate(DV.plate)}</div>
            <div class="hr"></div>
            <div class="lines">
              <div class="ln"><span>Նստեցում</span><b>${A(600)}</b></div>
              <div class="ln"><span>Ըստ կիլոմետրի · ${ECO.km(RD.km)}</span><b>${A(387)}</b></div>
              <div class="ln"><span>Ըստ րոպեի · ${RD.min} րոպե</span><b>${A(72)}</b></div>
              <div class="ln"><span>Կլորացում</span><b>+${A(41)}</b></div>
              <div class="ln tot"><span>Ընդամենը</span><b>${A(RD.fare)}</b></div>
              <div class="ln paid"><span class="pay ${pay === 'company' ? 'co' : ''}">${pay === 'company' ? R.i('building-2') + 'Վճարում է՝ ' + C.name : R.i('banknote') + ECO.PAY.cash.label}</span></div>
            </div>
            ${pay === 'downgraded' ? `<div class="notice">${R.i('info')}<span><b>Վճարել եք դուք · կանխիկ</b>Ընկերության սահմանաչափը սպառված էր</span></div>` : ''}
            <div class="btns"><button class="btn btn-brand">${R.i('rotate-ccw')}Կրկին պատվիրել</button><button class="btn btn-quiet">${R.i('receipt-text')}Ստացական</button></div>
          </section>`

  Rider.page({
    title: 'Rider · Ride history',
    sub: 'A list with the real route of each ride as its thumbnail, and a receipt built from the tariff components',
    states: [
      { id: 'list', label: 'List', note: 'Pre-orders lead («Նախնական պատվերներ», history/index.tsx geometry): the time in brand, the route, a warn tag when no car is on it yet. No inline cancel (owner 2026-10-12): a card opens the booking (rider-preorders#detail), where changes go through the dispatcher. Then past rides by month; cancelled says so in words',
        html: () => `<div class="page">${head()}<div class="scroll">${upcoming()}<div class="sect">Հոկտեմբեր</div>${group(rides.slice(0, 5))}</div></div>` },
      { id: 'loading', label: 'Loading', note: 'Skeleton rows in the real row geometry, so nothing jumps when data lands',
        html: () => `<div class="page">${head()}<div class="scroll"><div class="sect">Հոկտեմբեր</div><div class="group" aria-busy="true">${[0, 1, 2, 3, 4].map((i) =>
          `${i ? '<div class="divider h"></div>' : ''}<div class="skrow"><span class="sk th"></span><span class="lines"><span class="sk" style="width:${[62, 44, 70, 52, 58][i]}%;height:14px"></span><span class="sk" style="width:${[46, 38, 50, 42, 40][i]}%;height:12px"></span></span><span class="sk" style="width:56px;height:14px"></span></div>`).join('')}</div></div></div>` },
      { id: 'empty', label: 'Empty', note: 'One line (hub.noRecent) and the way out',
        html: () => `<div class="page">${head()}<div class="empty"><div class="halo">${R.car('city', 184, 88, '')}</div><p>Ձեր ուղևորությունները կերևան այստեղ</p></div>
          <div class="foot"><button class="btn btn-brand">Պատվիրել</button></div></div>` },
      { id: 'detail', label: 'Receipt', note: 'The one ride: 9:45 → 9:51, 4,3 km, 6 min. Lines are the tariff\'s own (receipt.tsx fare.* strings), rounded to 100 ֏; book again is the one primary',
        html: () => receipt('cash'), map: mapFor('pickupToDrop') },
      { id: 'detail-company', label: 'Receipt · company', note: 'A company ride: «Վճարում է՝ {company}» stands where the payment method would (receipt.tsx). No balance, no limit — those are the company\'s, not the employee\'s',
        html: () => receipt('company'), map: mapFor('pickupToDrop') },
      { id: 'detail-downgraded', label: 'Receipt · paid by you', note: 'A company pre-booking downgraded at activation (corporate R2): one neutral notice says why, and the payment is cash',
        html: () => receipt('downgraded'), map: mapFor('pickupToDrop') },
      { id: 'receipt-error', label: 'Receipt offline', time: '9:58', note: 'R61, real (history/[id].tsx): the receipt could not load. The blank-state pattern (icon, «Կապ չկա», one line) with «Կրկնել» (app.retry) at the foot; never red, back is still one tap. No map: it could not load either',
        html: () => `<div class="page">${head().replace('<h1 class="large">Ուղևորություններ</h1>', '<h1 class="large">Ուղևորություն</h1>')}
          <div class="errbox" role="status"><span class="eo">${R.i('wifi-off')}</span><span class="et">Կապ չկա</span><span class="es">Ստացականը կբացվի կապի հետ</span></div>
