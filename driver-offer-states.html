<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Driver offer states</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="driver.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="mapgl.local.js"></script>
<script src="kit.js"></script>
<script src="routes.js"></script>
<script src="driver.js"></script>
<style>
  /* Decline with a reason: the offer keeps ringing underneath and its seconds stay on screen. One tap on a reason
     IS the decline (no preselected reason, no confirm button, no two-button footer: §10.2's mis-tap rule).
     «Ետ» is the only other control, a text button top-left. */
  .dhead { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin: 0 calc(-1 * var(--s2)) var(--s2); }
  .dhead .btn-text { width: auto; padding: 0 var(--s3); justify-content: flex-start; text-decoration: none; }
  .stitle { font: var(--t-title); color: var(--ink); white-space: nowrap; }
  .shint { font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; margin: 2px 0 var(--s3); }
  .reason { display: flex; align-items: center; gap: var(--s3); min-height: 60px; width: 100%; text-align: left; font: var(--t-body-strong); color: var(--ink); }
  .reason + .reason { border-top: 1px solid var(--hairline); }
  .reason span { flex: 1; white-space: nowrap; }
  .reason svg { width: 20px; height: 20px; color: var(--ink-3); }
  .sheet.top { padding-top: 8px; }
  /* Resolved: one way out, the 2 s auto-return drawn as a draining underline */
  .offer .go.quiet { overflow: hidden; background: var(--surface); box-shadow: var(--e1); }
  .go .drain { position: absolute; left: 0; bottom: 0; height: 4px; width: 66%; background: var(--ink-3); }
  .offer .ot { font: 600 20px/26px var(--font); }
</style>
</head>
<body>
<main class="screen" id="s"></main>
<script src="audit.js"></script>
<script>
  const s = document.getElementById('s')
  const st = new URLSearchParams(location.search).get('state') || 'taken'
  const res = {
    taken: { glyph: 'user-check', title: 'Պատվերն արդեն վերցրել են', sub: 'Վերադառնում ենք գլխավոր էջ' },
    expired: { glyph: 'timer-off', title: 'Ժամանակը սպառվեց', sub: 'Եվս մեկը՝ և կնշվեք բացակա' },
    declined: { glyph: 'check', title: 'Դուք հրաժարվեցիք', sub: 'Դուք գծում եք · «Հեռու է»' },
  }[st]
  const home = `<a class="go quiet" href="driver-home.html?theme=${THEME}"><span class="drain" aria-hidden="true"></span><i data-lucide="house"></i>Գլխավոր</a>`
  s.innerHTML = D.offer(res ? { result: res, foot: home } : { secs: 6 }) + (st === 'decline' ? `
  <div class="scrim" data-s="decline"></div>
  <section class="sheet top" data-s="decline" role="dialog" aria-label="Ինչո՞ւ եք հրաժարվում">
    <div class="grabber"></div>
    <div class="dhead"><a class="btn-text" href="driver-offer.html?theme=${THEME}"><i data-lucide="chevron-left"></i>Ետ</a><span id="ring3" role="timer" aria-label="Մնաց 6 վայրկյան"></span></div>
    <div class="stitle">Ինչո՞ւ եք հրաժարվում</div>
    <div class="shint">Հպեք պատճառին՝ պատվերը կփոխանցվի</div>
    <div role="list">
      <button class="reason" role="listitem"><span>Հեռու է</span><i data-lucide="chevron-right"></i></button>
      <button class="reason" role="listitem"><span>Ուղղությունը չի համապատասխանում</span><i data-lucide="chevron-right"></i></button>
      <button class="reason" role="listitem"><span>Ընդմիջում եմ անում</span><i data-lucide="chevron-right"></i></button>
      <button class="reason" role="listitem"><span>Այլ պատճառ</span><i data-lucide="chevron-right"></i></button>
    </div>
  </section>` : '')
  statusBar(s)
  D.init([
    ['taken', 'Taken by another driver'], ['expired', 'Expired (no answer)'], ['decline', 'Decline: one tap on a reason (ticking)'], ['declined', 'Declined, back on the line'],
  ])
  const r3 = document.getElementById('ring3')
  if (r3) r3.outerHTML = D.ring(48, 4, .5, '<span class="v">6</span>', 'var(--warn)')
  icons()
  if (st === 'decline') for (const el of [s.querySelector('.offer')]) { el.dataset.overlay = ''; el.setAttribute('aria-hidden', 'true'); el.inert = true }
  D.offerMap(!!res)
</script>
</body>
</html>
