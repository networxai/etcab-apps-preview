<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Driver offer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/lucide@1.54.0/dist/umd/lucide.min.js"></script>
<script src="mapgl.local.js"></script>
<script src="kit.js"></script>
<script src="routes.js"></script>
<style>
  .sheet { padding: var(--s6) var(--margin) 34px; }
  .decline { position: absolute; z-index: 20; top: 60px; right: 16px; height: 48px; padding: 0 18px 0 14px; border-radius: var(--r-pill);
    background: var(--surface); box-shadow: var(--e2); display: inline-flex; align-items: center; gap: 8px; font: var(--t-body-strong); color: var(--ink); white-space: nowrap; }
  .decline svg { width: 20px; height: 20px; }

  .head { display: flex; align-items: center; gap: var(--s5); }
  .ring { position: relative; width: 104px; height: 104px; flex: none; }
  .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring .in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .ring .hero { font: var(--t-hero); color: var(--ink); font-variant-numeric: tabular-nums; }
  .ring .unit { font: var(--t-caption); color: var(--ink-2); }
  .facts { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .fare { font: var(--t-title); color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .trip { display: flex; align-items: center; gap: 6px; font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .trip svg { width: 16px; height: 16px; }
  .chips { display: flex; gap: 6px; margin-top: 2px; }
  .chip.cash svg { color: var(--ok); }

  .stops { position: relative; margin: var(--s6) 0 var(--s6); display: flex; flex-direction: column; gap: var(--s4); }
  .stops::before { content: ''; position: absolute; left: 7px; top: 22px; bottom: 22px; width: 2px; border-radius: 1px; background: var(--surface-3); }
  .stop { display: flex; gap: var(--s4); align-items: flex-start; }
  .stop .m { width: 16px; height: 16px; margin-top: 4px; flex: none; position: relative; z-index: 1; background: var(--ink); box-shadow: 0 0 0 4px var(--surface); }
  .stop .m.a { border-radius: 50%; } .stop .m.b { border-radius: 4px; }
  .stop .m::after { content: ''; position: absolute; inset: 5px; background: var(--surface); border-radius: inherit; }
  .stop .t1 { font: var(--t-headline); color: var(--ink); white-space: nowrap; }
  .stop .t2 { font: var(--t-secondary); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .slide { position: relative; height: var(--h-slide); border-radius: var(--r-pill); background: var(--brand); color: var(--on-brand);
    display: flex; align-items: center; justify-content: center; font: var(--t-headline); font-size: 18px; width: 100%; }
  .slide .knob { position: absolute; left: 6px; top: 6px; width: 60px; height: 60px; border-radius: 50%; background: #fff; color: var(--brand);
    display: grid; place-items: center; box-shadow: 0 2px 8px rgb(0 0 0 / .2); }
  .slide .knob svg { width: 26px; height: 26px; stroke-width: 2; }
  .slide .hint { position: absolute; right: 22px; display: flex; opacity: .55; }
  .slide .hint svg { width: 20px; height: 20px; margin-left: -10px; }

  .me svg { scale: 1.3; }
  .pin { width: 18px; height: 18px; background: var(--approach); box-shadow: 0 0 0 4px var(--surface), 0 2px 6px rgb(0 0 0 / .3); display: grid; place-items: center; }
  .pin::after { content: ''; width: 6px; height: 6px; background: var(--surface); border-radius: inherit; }
  .pin.a { border-radius: 50%; } .pin.b { border-radius: 4px; }
</style>
</head>
<body>
<main class="screen" id="s">
  <div class="map" id="map" aria-label="Քարտեզ"></div>
  <button class="decline" aria-label="Հրաժարվել" onclick="location.href='driver-offer-states.html?state=decline&theme='+THEME"><i data-lucide="x"></i>Հրաժարվել</button>

  <section class="sheet" id="sheet" role="alertdialog" aria-label="Նոր պատվեր">
    <div class="head">
      <!-- §10.1: the ring is the accept window draining (seconds left, 9 of 12); pickup ETA is the first fact line. -->
      <div class="ring" role="timer" aria-label="Մնաց 9 վայրկյան">
        <svg viewBox="0 0 104 104" width="104" height="104" aria-hidden="true">
          <circle cx="52" cy="52" r="47" fill="none" stroke="var(--surface-3)" stroke-width="6"/>
          <circle cx="52" cy="52" r="47" fill="none" stroke="var(--ring)" stroke-width="6" stroke-linecap="round" stroke-dasharray="295.3" stroke-dashoffset="73.8"/>
        </svg>
        <div class="in"><span class="hero">9</span><span class="unit">վ</span></div>
      </div>
      <div class="facts">
        <div class="fare">1 100 ֏</div>
        <div class="trip"><i data-lucide="car-front"></i>4 րոպե · 1,4 կմ</div>
        <div class="trip"><i data-lucide="route"></i>4,3 կմ · 6 րոպե</div>
        <div class="chips"><span class="chip">Eco City</span><span class="chip cash"><i data-lucide="banknote"></i>Կանխիկ</span></div>
      </div>
    </div>

    <div class="stops">
      <div class="stop"><span class="m a"></span><div><div class="t1">Մաշտոցի պող. 40</div><div class="t2">Կենտրոն</div></div></div>
      <div class="stop"><span class="m b"></span><div><div class="t1">Կոմիտասի պող. 49</div><div class="t2">Արաբկիր</div></div></div>
    </div>

    <div class="slide" role="slider" aria-label="Ընդունել" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
      <span class="knob"><i data-lucide="arrow-right"></i></span>Ընդունել
      <span class="hint" aria-hidden="true"><i data-lucide="chevron-right"></i><i data-lucide="chevron-right"></i></span>
    </div>
  </section>
</main>
<script src="audit.js"></script>
<script>
  statusBar(document.getElementById('s'))
  icons()
  const sheetH = document.getElementById('sheet').offsetHeight
  const A = ROUTES.driverToPickup.pts, B = ROUTES.pickupToDrop.pts
  const map = makeMap(document.getElementById('map'), { sheetH, fit: [...A, ...B], padTL: [40, 120], padBR: [40, sheetH + 36] })
  drawRoute(map, A, { color: cssVar('--approach'), weight: 4, dash: '1 8' })
  drawRoute(map, B, { weight: 5 })
  htmlMarker(map, B[B.length - 1], '<div class="pin b"></div>', [18, 18])
  htmlMarker(map, B[0], '<div class="pin a"></div>', [18, 18])
  htmlMarker(map, A[0], `<div class="me">${carTop(-60, 'var(--brand)', 'rgb(255 255 255 / .75)')}</div>`, [24, 40])
</script>
</body>
</html>
